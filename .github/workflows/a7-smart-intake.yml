name: A7 Smart Intake UX Patch

on:
  push:
    branches: ["test/marketplace-a7"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/marketplace-a7
          fetch-depth: 0

      - name: Patch smart intake UX
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* A7_SMART_INTAKE_V1 */'
          if marker in s:
              print('Smart intake already present; nothing to do.')
              raise SystemExit(0)
          css=r'''<style>
          /* A7_SMART_INTAKE_V1 */
          .a7SmartLauncher{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 14px;padding:15px 16px;border:1px solid rgba(20,184,122,.35);border-radius:18px;background:linear-gradient(135deg,rgba(20,184,122,.12),rgba(56,189,248,.07));color:var(--text);text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.12)}
          .a7SmartLauncher:hover{border-color:rgba(20,184,122,.65);transform:translateY(-1px)}
          .a7SmartIcon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,var(--primary),var(--primary-2));font-size:21px;box-shadow:0 5px 14px rgba(20,184,122,.22)}
          .a7SmartLauncher strong{display:block;font-size:14px;margin-bottom:3px}.a7SmartLauncher span{display:block;color:var(--muted);font-size:12px;line-height:1.4}
          .a7SmartModal{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.78);display:flex;align-items:flex-end;justify-content:center;padding:10px}
          .a7SmartCard{width:min(620px,100%);max-height:94vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:24px 24px 18px 18px;padding:18px;box-shadow:0 24px 70px rgba(0,0,0,.38)}
          .a7SmartHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.a7SmartHead h2{margin:0;font-size:20px}.a7Close{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:20px}
          .a7SmartHint{padding:12px;border-radius:14px;background:rgba(56,189,248,.07);border:1px solid rgba(56,189,248,.18);color:var(--muted);font-size:12px;line-height:1.5;margin:12px 0}
          .a7SmartTextarea{min-height:120px!important;background:#081523!important}.a7SmartRow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.a7SmartChip{padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--muted);font-size:12px;cursor:pointer;text-align:left}.a7SmartChip:hover{border-color:rgba(20,184,122,.5);color:var(--text)}
          .a7SmartResult{margin-top:12px;padding:14px;border-radius:16px;background:rgba(20,184,122,.07);border:1px solid rgba(20,184,122,.25)}.a7SmartResult b{font-size:13px}.a7SmartLine{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid rgba(148,168,189,.12);font-size:12px}.a7SmartLine:last-child{border-bottom:0}.a7SmartLabel{color:var(--muted)}
          .a7SmartActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.a7SmartActions .btn{min-height:48px}.a7SmartHidden{display:none!important}
          @media(max-width:430px){.a7SmartCard{padding:15px}.a7SmartRow{grid-template-columns:1fr}.a7SmartActions{grid-template-columns:1fr}}
          </style>'''
          js=r'''<script>
          /* A7_SMART_INTAKE_V1 */
          (function(){
            const marker='A7_SMART_INTAKE_V1';
            function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
            function infer(text){
              const t=(text||'').toLocaleLowerCase('tr-TR');
              const groups=[
                ['Tesisat',['musluk','lavabo','klozet','tuvalet','gider','kanalizasyon','su kaça','kaçak su','tesisat','batarya','duş','sifon','tıkan']],
                ['Elektrik',['elektrik','sigorta','priz','anahtar','kablo','şalter','kaçak akım','avize','lamba']],
                ['Boya & Dekorasyon',['boya','duvar','tavan','alçı','badana','duvar kağıdı']],
                ['Klima & Isıtma',['klima','kombi','petek','kalorifer','ısıtma','soğutm','termostat']],
                ['Mobilya & Montaj',['mobilya','dolap','masa','sandalye','montaj','kurulum','raf']],
                ['Beyaz Eşya',['çamaşır makinesi','bulaşık makinesi','buzdolabı','fırın','ocak','kurutma makinesi']],
                ['Cam & Pencere',['cam','pencere','panjur','kırık cam','sineklik']],
                ['Temizlik',['temizlik','temizleme','koltuk yıkama','halı yıkama']]
              ];
              for(const [name,words] of groups) if(words.some(w=>t.includes(w))) return name;
              return 'Genel hizmet';
            }
            function urgency(text){const t=(text||'').toLocaleLowerCase('tr-TR');if(/acil|hemen|şimdi|su bas|kıvılcım|duman|yangın|gaz kok/.test(t))return 'Acil';return 'Normal';}
            function mount(){
              if(document.querySelector('[data-a7-smart-launcher]')) return;
              const main=document.querySelector('main'); if(!main) return;
              const launcher=document.createElement('button');
              launcher.type='button'; launcher.className='a7SmartLauncher'; launcher.setAttribute('data-a7-smart-launcher','1');
              launcher.innerHTML='<div class="a7SmartIcon">✨</div><div><strong>Akıllı Talep Oluştur</strong><span>Ne yapılması gerektiğini kendi cümlelerinle anlat. İşimi Çöz talebini düzenlemene yardım etsin.</span></div>';
              const first=main.firstElementChild; main.insertBefore(launcher,first||null);
              launcher.addEventListener('click',open);
            }
            function open(){
              if(document.querySelector('[data-a7-smart-modal]')) return;
              const modal=document.createElement('div'); modal.className='a7SmartModal'; modal.setAttribute('data-a7-smart-modal','1');
              modal.innerHTML=`<div class="a7SmartCard" role="dialog" aria-modal="true" aria-label="Akıllı talep oluşturma">
                <div class="a7SmartHead"><h2>✨ Akıllı Talep Oluştur</h2><button type="button" class="a7Close" data-a7-close>×</button></div>
                <div class="a7SmartHint">Sorunu nasıl biliyorsan öyle yaz. Teknik terim kullanmana gerek yok. Önce talebini anlaşılır bir taslağa dönüştürelim.</div>
                <label for="a7SmartText">Ne yapılmasını istiyorsun?</label>
                <textarea id="a7SmartText" class="a7SmartTextarea" maxlength="1200" placeholder="Örn: Mutfaktaki musluk damlatıyor, altından da biraz su geliyor. Mümkünse bu hafta içinde bakılsın."></textarea>
                <div class="a7SmartRow">
                  <button type="button" class="a7SmartChip" data-a7-example="Mutfak musluğu su kaçırıyor, kontrol edilip gerekirse değiştirilsin.">🚰 Tesisat örneği</button>
                  <button type="button" class="a7SmartChip" data-a7-example="Salondaki priz çalışmıyor, güvenli şekilde kontrol edilmesini istiyorum.">⚡ Elektrik örneği</button>
                </div>
                <div id="a7SmartResult" class="a7SmartResult a7SmartHidden"></div>
                <div class="a7SmartActions"><button type="button" class="btn secondary" data-a7-close>Vazgeç</button><button type="button" class="btn primary" data-a7-build>Talebimi Hazırla</button></div>
              </div>`;
              document.body.appendChild(modal);
              const ta=modal.querySelector('#a7SmartText'), result=modal.querySelector('#a7SmartResult');
              modal.querySelectorAll('[data-a7-close]').forEach(b=>b.addEventListener('click',()=>modal.remove()));
              modal.addEventListener('click',e=>{if(e.target===modal)modal.remove()});
              modal.querySelectorAll('[data-a7-example]').forEach(b=>b.addEventListener('click',()=>{ta.value=b.dataset.a7Example;ta.focus()}));
              modal.querySelector('[data-a7-build]').addEventListener('click',()=>{
                const text=ta.value.trim(); if(!text){ta.focus();return;}
                const cat=infer(text), urg=urgency(text);
                const draft=`İş: ${cat}\nÖncelik: ${urg}\n\n${text}`;
                localStorage.setItem('a7_smart_request_draft',draft);
                result.classList.remove('a7SmartHidden');
                result.innerHTML='<b>Talep taslağın hazır</b><div class="a7SmartLine"><span class="a7SmartLabel">Kategori</span><strong>'+esc(cat)+'</strong></div><div class="a7SmartLine"><span class="a7SmartLabel">Öncelik</span><strong>'+esc(urg)+'</strong></div><div style="margin-top:10px;font-size:12px;line-height:1.5">'+esc(text)+'</div><div class="small muted" style="margin-top:9px">Bu ilk sürüm taslağı hazırlar; sonraki adımda bunu mevcut talep akışına doğrudan bağlayacağız.</div>';
                modal.querySelector('[data-a7-build]').textContent='Taslağı Güncelle';
              });
              ta.focus();
            }
            function boot(){mount();}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
            const mo=new MutationObserver(()=>mount()); mo.observe(document.documentElement,{childList:true,subtree:true});
          })();
          </script>'''
          block=css+js
          s=s.replace('</head>',block+'</head>',1)
          p.write_text(s,encoding='utf-8')
          print('Smart intake UX injected.')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "A7: add smart intake request assistant"
          git push origin test/marketplace-a7
