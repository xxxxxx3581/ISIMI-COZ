name: One-time document viewer repair

on:
  push:
    paths:
      - '.github/workflows/one-time-viewer-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final isolated viewer fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('async function openDocument(docKey,index=0){')
          end=s.index('\nfunction result(fromSaved=false){', start)
          old=s[start:end]
          new=old
          new=new.replace("const rootEl=document.getElementById('hallet-root');const oldPointer=rootEl?.style.pointerEvents||'';const oldOverflow=document.body.style.overflow||'';\n  if(rootEl)rootEl.style.pointerEvents='none';document.body.style.overflow='hidden';", "const rootEl=document.getElementById('hallet-root');const oldPointer=rootEl?.style.pointerEvents||'';const oldZ=rootEl?.style.zIndex||'';const oldOverflow=document.body.style.overflow||'';\n  if(rootEl){rootEl.style.setProperty('pointer-events','none','important');rootEl.style.setProperty('z-index','1','important');}document.body.style.overflow='hidden';")
          new=new.replace("z-index:2147483647;background:rgba(0,0,0,.97)", "z-index:2147483647!important;background:rgba(0,0,0,.97)")
          new=new.replace("viewer.remove();if(rootEl)rootEl.style.pointerEvents=oldPointer;document.body.style.overflow=oldOverflow;", "viewer.remove();if(rootEl){rootEl.style.setProperty('pointer-events',oldPointer,'important');rootEl.style.setProperty('z-index',oldZ,'important');}document.body.style.overflow=oldOverflow;")
          if new==old: raise SystemExit('Expected viewer patterns not found')
          p.write_text(s[:start]+new+s[end:],encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix document viewer root layering' || exit 0
          git push