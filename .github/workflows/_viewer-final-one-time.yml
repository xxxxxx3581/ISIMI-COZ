name: Final one-time viewer repair

on:
  push:
    paths:
      - '.github/workflows/_viewer-final-one-time.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch viewer and self-delete
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('async function openDocument(docKey,index=0){')
          end=s.index('\nfunction result(fromSaved=false){', start)
          old=s[start:end]
          new=old
          anchor="  document.getElementById('halletDocViewer')?.remove();\n\n  const viewer=document.createElement('div');"
          replacement="""  document.getElementById('halletDocViewer')?.remove();

  const rootEl=document.getElementById('hallet-root');
  const oldRootPointer=rootEl?.style.pointerEvents||'';
  const oldRootZ=rootEl?.style.zIndex||'';
  if(rootEl){
    rootEl.style.setProperty('pointer-events','none','important');
    rootEl.style.setProperty('z-index','1','important');
  }

  const viewer=document.createElement('div');"""
          if anchor not in new: raise SystemExit('viewer anchor not found')
          new=new.replace(anchor,replacement,1)
          if 'z-index:2147483647;' not in new: raise SystemExit('viewer z-index not found')
          new=new.replace('z-index:2147483647;','z-index:2147483647!important;',1)
          cleanup="""  const closeFn=function(){
    try{if(objectUrl)URL.revokeObjectURL(objectUrl);}catch(e){}
    viewer.remove();
  };"""
          cleanup2="""  const closeFn=function(){
    try{if(objectUrl)URL.revokeObjectURL(objectUrl);}catch(e){}
    viewer.remove();
    if(rootEl){
      rootEl.style.setProperty('pointer-events',oldRootPointer,'important');
      rootEl.style.setProperty('z-index',oldRootZ,'important');
    }
  };"""
          if cleanup not in new: raise SystemExit('cleanup block not found')
          new=new.replace(cleanup,cleanup2,1)
          if new==old: raise SystemExit('no changes made')
          p.write_text(s[:start]+new+s[end:],encoding='utf-8')
          PY
          rm -f .github/workflows/_viewer-final-one-time.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/_viewer-final-one-time.yml
          git commit -m 'Fix document viewer layering and remove repair workflow'
          git push