name: Temporary Platform V1 Integration Runner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate-platform-v1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform-v1
        uses: actions/checkout@v4
        with:
          ref: platform-v1
          fetch-depth: 0

      - name: Run controlled integration
        run: python3 tools/platform-v1-integrate.py

      - name: Commit platform-v1 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: platform-v1 integration complete"
          git push origin HEAD:platform-v1
