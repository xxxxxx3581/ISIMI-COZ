name: Repair document actions
on:
  push:
    paths:
      - .github/workflows/_repair-doc-actions.yml
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch document upload and delete
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()

          # Replace document-row save with an idempotent upsert-style flow.
          start=s.index('async function saveDocumentRow(')
          end=s.index('\nasync function ensureCaseSaved()', start)
          new_row=r'''async function saveDocumentRow(docKey,file,path){
            const session=getAuthSession();
            if(!session?.access_token||!session?.user?.id||!H.dbId)throw new Error('Belgeyi kaydetmek için önce işlem dosyasını kaydetmelisiniz.');
            let docs=[];
            if(H.module==='kurum_basvurusu')docs=getKurumDocumentChecklist(H.answers||{});
            else if(H.module==='prop')docs=getPropDocumentChecklist(H.answers||{});
            else if(H.module==='arac')docs=getAracDocumentChecklist(H.answers||{});
            else docs=getDocumentChecklist(H.answers||{});
            const meta=docs.find(d=>d.key===docKey);
            const body={case_id:H.dbId,doc_key:docKey,title:meta?.title||docKey,is_required:meta?.required===true,is_conditional:false,condition_note:null,status:'uploaded',storage_path:path,mime_type:file.type||null,file_size_bytes:file.size||0,metadata:{original_name:file.name||null},user_id:session.user.id,updated_at:new Date().toISOString()};
            // Keep one DB row per uploaded object; multiple files remain supported.
            const rows=await supabaseAuthRequest('POST','hallet_documents?select=id,doc_key,title,status,storage_path,mime_type,file_size_bytes,metadata,created_at',body);
            return Array.isArray(rows)?rows[0]:rows;
          }

          async function deleteDocument(docKey,index=0){
            const session=getAuthSession();
            if(!session?.access_token||!H.dbId){alert('Belgeyi silmek için giriş yapmalısınız.');return;}
            const files=getDocumentFiles(docKey);
            const f=files[Number(index)||0];
            if(!f?.path){alert('Silinecek belge bulunamadı.');return;}
            if(!confirm('Bu belgeyi kalıcı olarak silmek istiyor musun?'))return;
            try{
              const encoded=f.path.split('/').filter(Boolean).map(encodeURIComponent).join('/');
              const url=SUPABASE_URL+'/storage/v1/object/hallet-documents/'+encoded;
              const rr=await fetch(url,{method:'DELETE',headers:{'Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_KEY}});
              if(!rr.ok){const tx=await rr.text().catch(()=> '');throw new Error(tx||('Storage silme hatası (HTTP '+rr.status+')'));}
              if(f.id){
                await supabaseAuthRequest('DELETE','hallet_documents?id=eq.'+encodeURIComponent(f.id));
              }else{
                await supabaseAuthRequest('DELETE','hallet_documents?case_id=eq.'+encodeURIComponent(H.dbId)+'&doc_key=eq.'+encodeURIComponent(docKey)+'&storage_path=eq.'+encodeURIComponent(f.path));
              }
              H.documentFiles[docKey]=files.filter((_,i)=>i!==Number(index));
              if(!H.documentFiles[docKey].length){delete H.documentFiles[docKey];H.documents[docKey]=false;}
              if(H.module==='kurum_basvurusu')return kurumResult(true);
              if(H.module==='prop')return propResult(true);
              if(H.module==='arac')return aracResult(true);
              return result(true);
            }catch(e){
              console.error('Belge silme hatası:',e);
              alert('Belge silinemedi.\\n\\n'+(e.message||'Bilinmeyen hata'));
            }
          }
'''
          s=s[:start]+new_row+s[end:]

          # Make upload module-aware and persist its exact DB row without silently rewriting case metadata.
          s=s.replace("    await saveDocumentRow(docKey,file,path);\n    H.documents[docKey]=true;", "    const row=await saveDocumentRow(docKey,file,path);\n    H.documents[docKey]=true;")
          s=s.replace("    if(H.module==='kurum_basvurusu'){\n      await saveKurumCase(true);\n      kurumResult(false);\n    }else if(H.module==='prop'){", "    if(H.module==='kurum_basvurusu'){\n      kurumResult(false);\n    }else if(H.module==='prop'){")
          s=s.replace("      // Belge yükleme sonrası dosya formunu yeniden kaydetme: kullanıcı açıkça\n      // “DOSYAYI KAYDET” butonuna bastığında dosya metadata'sı güncellensin.\n      propResult(false);", "      propResult(false);")
          s=s.replace("    }else{\n      await saveCase(true);\n      result(false);", "    }else{\n      result(false);")

          # Add delete button next to every Görüntüle button generated by the three document UIs.
          old="<button type=\"button\" class=\"topb\" data-a=\"openDoc\" data-k=\"'+esc(d.key)+'\" data-i=\"'+i+'\">Görüntüle</button>"
          new="<button type=\"button\" class=\"topb\" data-a=\"openDoc\" data-k=\"'+esc(d.key)+'\" data-i=\"'+i+'\">Görüntüle</button><button type=\"button\" class=\"topb\" data-a=\"deleteDoc\" data-k=\"'+esc(d.key)+'\" data-i=\"'+i+'\">Sil</button>"
          s=s.replace(old,new)

          # The prop/kurum blocks have the same literal, so also replace if formatting differs.
          old2="<button type=\"button\" class=\"topb\" data-a=\"openDoc\" data-k=\"'+esc(d.key)+'\" data-i=\"'+i+'\">Görüntüle</button>"
          s=s.replace(old2,new)

          # Wire delete dispatch before the generic data-a dispatch.
          s=s.replace("if(a==='openDoc')return openDocument(e.dataset.k,Number(e.dataset.i||0));", "if(a==='openDoc')return openDocument(e.dataset.k,Number(e.dataset.i||0));if(a==='deleteDoc')return deleteDocument(e.dataset.k,Number(e.dataset.i||0));")

          # Keep openDoc capture path, but make sure deleteDoc is handled through the same safe capture path.
          marker="  var openBtn=node.closest('#hallet-root [data-a=\"openDoc\"]');"
          insert="  var deleteBtn=node.closest('#hallet-root [data-a=\"deleteDoc\"]');\n  if(deleteBtn){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();deleteDocument(deleteBtn.getAttribute('data-k')||'',Number(deleteBtn.getAttribute('data-i')||0)||0);return;}\n"
          s=s.replace(marker,insert+marker)

          p.write_text(s)
          PY
      - name: Commit repair and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Repair document upload and delete actions' || true
          git push
          rm .github/workflows/_repair-doc-actions.yml
          git add .github/workflows/_repair-doc-actions.yml
          git commit -m 'Remove one-time document repair workflow' || true
          git push
