name: Platform V1 safe integration

on:
  push:
    branches: [platform-v1]

permissions:
  contents: write

jobs:
  integrate:
    if: "!contains(github.event.head_commit.message, 'platform-v1 integration complete')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply controlled home integration
        run: python3 tools/platform-v1-integrate.py

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: platform-v1 integration complete"
          git push
