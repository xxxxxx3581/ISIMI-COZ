name: V1.1 surgical fix
on:
  push:
    branches: [v1.1-surgical-fix]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'V1.1 surgical fix patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply surgical fixes
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='data-a="complete">Tamamlandı işaretle'
          new='data-a="completecase">Tamamlandı işaretle'
          if s.count(old)!=1: raise SystemExit(f'complete anchor count={s.count(old)}')
          s=s.replace(old,new)
          phrase='Olası neden: hallet_cases case_type constraint (arac_satisi eklenmemiş olabilir).'
          if phrase not in s: raise SystemExit('stale constraint phrase not found')
          s=s.replace(phrase,'')
          old_open="""   if(m.module==='arac'||row.case_type==='arac_satisi'){\n    H.module='arac'; H.kurumFlowId=null; H.dbId=row.id; H.caseId=m.case_no||null; H.createdAt=row.created_at||null; H.status=row.status||'draft'; H.answers=(m.answers&&typeof m.answers==='object')?m.answers:{}; H.documents=(m.documents&&typeof m.documents==='object')?m.documents:{}; H.documentStatuses={}; H.documentFiles={}; H.caseSteps=[];\n    await loadCaseSteps();\n    await ensureCaseSteps();\n    return aracResult(true);\n   }"""
          new_open="""   if(m.module==='arac'||row.case_type==='arac_satisi'){\n    H.module='arac'; H.kurumFlowId=null; H.dbId=row.id; H.caseId=m.case_no||null; H.createdAt=row.created_at||null; H.status=row.status||'draft'; H.answers=(m.answers&&typeof m.answers==='object')?m.answers:{}; H.documents=(m.documents&&typeof m.documents==='object')?m.documents:{}; H.documentStatuses={}; H.documentFiles={}; H.caseSteps=[];\n    try{\n     const docs=await supabaseAuthRequest('GET','hallet_documents?select=id,doc_key,title,status,storage_path,mime_type,file_size_bytes,metadata,created_at&case_id=eq.'+encodeURIComponent(H.dbId)+'&order=created_at.asc&limit=200');\n     (Array.isArray(docs)?docs:[]).forEach(d=>{\n       if(d.doc_key&&d.status==='uploaded'&&d.storage_path){\n         H.documents[d.doc_key]=true;\n         if(!Array.isArray(H.documentFiles[d.doc_key]))H.documentFiles[d.doc_key]=[];\n         H.documentFiles[d.doc_key].push({id:d.id,path:d.storage_path,name:d.metadata?.original_name||d.title||d.doc_key,type:d.mime_type||null,size:d.file_size_bytes||0,created_at:d.created_at||null});\n       }\n     });\n    }catch(docErr){console.warn('Araç belgeleri yüklenemedi:',docErr)}\n    await loadCaseSteps();\n    await ensureCaseSteps();\n    return aracResult(true);\n   }"""
          if s.count(old_open)!=1: raise SystemExit(f'openCase anchor count={s.count(old_open)}')
          s=s.replace(old_open,new_open)
          if old in s or phrase in s: raise SystemExit('surgical replacement incomplete')
          p.write_text(s,encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class P(HTMLParser):
            def __init__(self): super().__init__(); self.ids=[]; self.scripts=[]; self.in_script=False; self.buf=[]
            def handle_starttag(self,t,a):
              d=dict(a)
              if 'id' in d:self.ids.append(d['id'])
              if t.lower()=='script':self.in_script=True;self.buf=[]
            def handle_endtag(self,t):
              if t.lower()=='script':self.scripts.append(''.join(self.buf));self.in_script=False
            def handle_data(self,d):
              if self.in_script:self.buf.append(d)
          s=Path('index.html').read_text(encoding='utf-8'); p=P(); p.feed(s)
          assert s.lower().count('<!doctype html>')==1
          assert len(p.ids)==len(set(p.ids)), sorted({x for x in p.ids if p.ids.count(x)>1})
          assert len(p.scripts)==2, len(p.scripts)
          for i,sc in enumerate(p.scripts):Path(f'/tmp/script{i}.js').write_text(sc,encoding='utf-8')
          PY
          node --check /tmp/script0.js
          node --check /tmp/script1.js
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'V1.1 surgical fix patch'
          git push
