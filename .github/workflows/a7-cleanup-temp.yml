name: A7 Temp Cleanup

on:
  push:
    branches: ["test/marketplace-a7"]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/marketplace-a7
          fetch-depth: 0
      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/a7-smart-intake-v2.yml .github/workflows/a7-cleanup-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "A7: remove temporary patch workflows"
          git push origin test/marketplace-a7
