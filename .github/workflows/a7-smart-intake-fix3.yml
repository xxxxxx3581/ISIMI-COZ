name: A7 Smart Intake Fix 3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/marketplace-a7
      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='A7_SMART_INTAKE_FIX3'
          if marker in s:
              print('already patched')
              raise SystemExit(0)
          patch=r'''\n<style id="A7_SMART_INTAKE_FIX3_CSS">
          /* Small, unobtrusive Smart Intake launcher on the home screen */
          .a7SmartCompact{display:flex!important;flex-direction:row!important;align-items:center!important;gap:10px!important;min-height:64px!important;height:auto!important;padding:11px 13px!important;border-radius:15px!important;text-align:left!important}
          .a7SmartCompact .emoji{font-size:22px!important;flex:none!important}
          .a7SmartCompact strong{font-size:13px!important;margin:0!important}
          .a7SmartCompact span{font-size:11px!important;line-height:1.3!important;margin:2px 0 0!important}
          .a7SmartCompact .a7SmartMiniArrow{margin-left:auto;font-size:16px;color:var(--primary);font-weight:900}
          @media(min-width:720px){.a7SmartCompact{min-height:60px!important;padding:10px 12px!important}.a7SmartCompact .emoji{font-size:21px!important}}
          .a7SmartBusy{opacity:.7!important;pointer-events:none!important}
          </style>
          <script id="A7_SMART_INTAKE_FIX3_SCRIPT">
          (function(){
            'use strict';
            if(window.__A7_SMART_INTAKE_FIX3)return;
            window.__A7_SMART_INTAKE_FIX3=true;
            var D=document;
            function visible(el){if(!el)return false;var r=el.getBoundingClientRect();var cs=getComputedStyle(el);return r.width>0&&r.height>0&&cs.display!=='none'&&cs.visibility!=='hidden'&&cs.opacity!=='0'}
            function text(el){return (el&&((el.innerText||el.textContent||'').trim()))||''}
            function setNative(el,value){
              if(!el)return;
              var proto=el.tagName==='TEXTAREA'?HTMLTextAreaElement.prototype:HTMLInputElement.prototype;
              var setter=Object.getOwnPropertyDescriptor(proto,'value')&&Object.getOwnPropertyDescriptor(proto,'value').set;
              if(setter)setter.call(el,value);else el.value=value;
              el.dispatchEvent(new Event('input',{bubbles:true}));
              el.dispatchEvent(new Event('change',{bubbles:true}));
            }
            function clickCandidate(patterns){
              var all=Array.from(D.querySelectorAll('button,a,[role="button"],input[type="button"],input[type="submit"]'));
              var scored=[];
              all.forEach(function(el){
                if(!visible(el))return;
                var t=(text(el)+' '+(el.getAttribute('aria-label')||'')+' '+(el.getAttribute('title')||'')+' '+(el.getAttribute('onclick')||'')+' '+(el.id||'')+' '+(el.className||'')).toLowerCase();
                var score=0;
                patterns.forEach(function(p){if(t.indexOf(p)>=0)score+=p.length+10});
                if(score)scored.push({el:el,score:score});
              });
              scored.sort(function(a,b){return b.score-a.score});
              if(scored[0]){scored[0].el.click();return scored[0].el}
              return null;
            }
            function fillRequestForm(draft){
              var fields=Array.from(D.querySelectorAll('textarea,input,select')).filter(visible);
              var ta=fields.filter(function(el){
                if(el.tagName!=='TEXTAREA')return false;
                var meta=(el.placeholder+' '+el.getAttribute('aria-label')+' '+el.name+' '+el.id).toLowerCase();
                return /talep|ne yapıl|ihtiyaç|açıkla|açıklama|sorun|istek|detay/.test(meta);
              })[0] || fields.find(function(el){return el.tagName==='TEXTAREA'}) || null;
              if(ta)setNative(ta,draft.text||'');
              var selects=fields.filter(function(el){return el.tagName==='SELECT'});
              selects.forEach(function(sel){
                var wanted=(draft.category||'').toLowerCase();
                var opt=Array.from(sel.options).find(function(o){return (o.textContent||'').toLowerCase().indexOf(wanted)>=0});
                if(opt){sel.value=opt.value;sel.dispatchEvent(new Event('change',{bubbles:true}));}
              });
              if(ta){
                var old=D.getElementById('a7SmartImportedNotice');
                if(old)old.remove();
                var n=D.createElement('div');n.id='a7SmartImportedNotice';n.className='success';n.textContent='✨ Akıllı Talep taslağın Usta Bul bölümüne aktarıldı. Bilgilerini kontrol edip talebini oluşturabilirsin.';
                ta.parentNode.insertBefore(n,ta);
                ta.scrollIntoView({behavior:'smooth',block:'center'});
                return true;
              }
              return false;
            }
            function goToUstaAndImport(){
              var raw=localStorage.getItem('a7_smart_request_draft');
              var draft;try{draft=JSON.parse(raw||'null')}catch(e){draft=null}
              if(!draft||!draft.text){alert('Taslak bulunamadı. Lütfen talebi yeniden hazırlayın.');return}
              var modal=D.querySelector('[data-a7-smart-modal]');
              if(modal)modal.remove();
              var directFns=['showMarketplace','openMarketplace','showServices','openServices','goMarketplace','openUsta'];
              for(var i=0;i<directFns.length;i++){
                try{if(typeof window[directFns[i]]==='function'){window[directFns[i]]();break}}catch(e){}
              }
              /* Prefer the real Usta navigation/action over the previous generic text match. */
              var clicked=clickCandidate(['usta bul']);
              if(!clicked)clicked=clickCandidate(['usta']);
              if(!clicked)clicked=clickCandidate(['hizmet bul','hizmet al','servis bul','marketplace','market']);
              var tries=0;
              function poll(){
                tries++;
                if(fillRequestForm(draft))return;
                if(tries<25)setTimeout(poll,200);
              }
              setTimeout(poll,120);
            }
            function compactSmartLauncher(){
              var nodes=Array.from(D.querySelectorAll('button,a,[role="button"],.actionCard,.card')).filter(visible);
              nodes.forEach(function(el){
                var t=text(el).toLowerCase();
                if(t.indexOf('akıllı talep oluştur')<0)return;
                if(!el.classList.contains('actionCard')){
                  var card=el.closest('.actionCard');
                  if(card)el=card;
                }
                el.classList.add('a7SmartCompact');
                if(!el.querySelector('.a7SmartMiniArrow')){var a=D.createElement('span');a.className='a7SmartMiniArrow';a.textContent='›';el.appendChild(a)}
              });
            }
            D.addEventListener('click',function(ev){
              var btn=ev.target.closest('[data-a7-smart-modal] button,[data-a7-smart-modal] a');
              if(!btn)return;
              var t=text(btn).replace(/\\s+/g,' ').trim().toLowerCase();
              if(t.indexOf('taslağı güncelle')===0){
                ev.preventDefault();ev.stopPropagation();
                btn.classList.add('a7SmartBusy');
                goToUstaAndImport();
              }
            },true);
            compactSmartLauncher();
            new MutationObserver(function(){compactSmartLauncher()}).observe(D.body,{childList:true,subtree:true});
          })();
          </script>\n'''
          s=s.replace('</body>',patch+'</body>') if '</body>' in s else s+patch
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "A7: fix smart intake navigation and compact launcher"
          git push origin HEAD:test/marketplace-a7
