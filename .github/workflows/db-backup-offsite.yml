# İşimi Çöz · Veritabanının DIŞ (offsite) yedeği
# Supabase içindeki günlük şifreli yedek (pf-backup) zaten çalışıyor; bu iş, proje tamamen erişilemez olursa
# diye her gece bir pg_dump alır, şifreler ve GitHub'da 30 gün saklar.
#
# ÇALIŞMASI İÇİN: GitHub Actions repository secrets: SUPABASE_DB_URL, BACKUP_PASSPHRASE
name: db-backup-offsite
on:
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Yapılandırma kontrolü
        id: cfg
        env:
          DBURL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DBURL" ] || [ -z "$PASS" ]; then echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "Secrets tanımlı değil; atlandı."; else echo "enabled=true" >> "$GITHUB_OUTPUT"; fi
      - name: PostgreSQL istemcisi
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Yedek al ve şifrele
        if: steps.cfg.outputs.enabled == 'true'
        env:
          DBURL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/pg_dump "$DBURL" -Fc --no-owner --no-privileges -n public -n auth -n storage -n pf_restore_drill -f db.dump
          /usr/lib/postgresql/17/bin/pg_restore -l db.dump > /dev/null
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o db.dump.gpg db.dump
          rm -f db.dump
          sha256sum db.dump.gpg > db.dump.gpg.sha256
          ls -l db.dump.gpg
      - name: Sakla (30 gün)
        if: steps.cfg.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: |
            db.dump.gpg
            db.dump.gpg.sha256
          retention-days: 30
