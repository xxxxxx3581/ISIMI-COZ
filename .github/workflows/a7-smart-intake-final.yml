name: A7 Smart Intake Final Patch
on:
  push:
    branches:
      - test/marketplace-a7
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Smart Intake under brand text
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="top.insertAdjacentElement('afterend',existing);"
          new="var brandText=top.querySelector('.brandText'); if(brandText) brandText.appendChild(existing); else top.insertAdjacentElement('afterend',existing);"
          if old not in s:
              raise SystemExit('header insertion target not found')
          s=s.replace(old,new,1)
          s=s.replace("<span class=\"a7SmartSub\"></span>","",1)
          css='''\n/* A7 FINAL: compact Smart Intake under İşimi Çöz brand text */\n.a7SmartHeaderSlot{display:none!important;margin-top:4px!important;padding:0!important;background:transparent!important;border:0!important;width:auto!important}\n.a7SmartHeaderSlot.isVisible{display:block!important}\n.a7SmartHeaderBtn{display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:5px!important;width:auto!important;min-height:27px!important;height:27px!important;padding:5px 9px!important;border:1px solid rgba(20,184,122,.42)!important;border-radius:9px!important;background:linear-gradient(145deg,rgba(20,184,122,.13),rgba(56,189,248,.06))!important;color:var(--text)!important;font-size:10.5px!important;font-weight:850!important;line-height:1!important;white-space:nowrap!important;box-shadow:none!important}\n.a7SmartHeaderBtn:hover{border-color:rgba(20,184,122,.68)!important;background:linear-gradient(145deg,rgba(20,184,122,.18),rgba(56,189,248,.09))!important}\n.a7SmartHeaderBtn .a7SmartSpark{font-size:12px!important;line-height:1!important}\n@media(max-width:430px){.a7SmartHeaderSlot{margin-top:3px!important}.a7SmartHeaderBtn{min-height:26px!important;height:26px!important;padding:5px 8px!important;font-size:10px!important}}\n'''
          if '/* A7 FINAL: compact Smart Intake under İşimi Çöz brand text */' not in s:
              s=s.replace('</style>',css+'</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q "brandText.*appendChild(existing)" index.html
          grep -q 'A7 FINAL: compact Smart Intake' index.html
          grep -q 'Akıllı Talep Oluştur' index.html
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'A7: compact Smart Intake directly under logo text'
          git push
