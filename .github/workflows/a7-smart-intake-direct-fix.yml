name: A7 Smart Intake Direct Fix
on:
  push:
    branches:
      - test/marketplace-a7
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index safely
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "localStorage.setItem('a7_smart_request_draft',draft);"
          new = "localStorage.setItem('a7_smart_request_draft',JSON.stringify({text:text,category:cat,urgency:urg}));"
          assert s.count(old) == 1, f'expected one draft storage line, found {s.count(old)}'
          s = s.replace(old, new)

          old = "function urgency(text){const t=(text||'').toLocaleLowerCase('tr-TR');if(/acil|hemen|şimdi|su bas|kıvılcım|duman|yangın|gaz kok/.test(t))return 'Acil';return 'Normal';}"
          new = "function urgency(text){const t=(text||'').toLocaleLowerCase('tr-TR');if(/acil\\s+değil|acil\\s+olm/.test(t))return 'Normal';if(/acil|hemen|şimdi|su bas|kıvılcım|duman|yangın|gaz kok/.test(t))return 'Acil';return 'Normal';}"
          assert s.count(old) == 1, f'expected one urgency function, found {s.count(old)}'
          s = s.replace(old, new)

          old = "var directFns=['showMarketplace','openMarketplace','showServices','openServices','goMarketplace','openUsta'];"
          new = "var directFns=['showRequest','showMarketplace','openMarketplace','showServices','openServices','goMarketplace','openUsta'];"
          assert s.count(old) == 1, f'expected one directFns list, found {s.count(old)}'
          s = s.replace(old, new)

          anchor = "    if(ta)setNative(ta,draft.text||'');\n    var selects=fields.filter(function(el){return el.tagName==='SELECT'});"
          insert = "    if(ta)setNative(ta,draft.text||'');\n    var urgencySelect=D.getElementById('reqUrgency');\n    if(urgencySelect && draft.urgency){\n      var urgencyMap={'Acil':'Acil','Bugün':'Bugün','Normal':'Uygun zamanda','Uygun zamanda':'Uygun zamanda'};\n      var urgencyValue=urgencyMap[draft.urgency]||'Bugün';\n      var urgencyOpt=Array.from(urgencySelect.options).find(function(o){return o.value===urgencyValue || (o.textContent||'').toLowerCase().indexOf(urgencyValue.toLowerCase())>=0});\n      if(urgencyOpt){urgencySelect.value=urgencyOpt.value;urgencySelect.dispatchEvent(new Event('change',{bubbles:true}));}\n    }\n    var selects=fields.filter(function(el){return el.tagName==='SELECT'});"
          assert s.count(anchor) == 1, f'expected one fill anchor, found {s.count(anchor)}'
          s = s.replace(anchor, insert)

          p.write_text(s, encoding='utf-8')
      - name: Remove temporary workflow and commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/a7-smart-intake-direct-fix.yml
          git add index.html .github/workflows/a7-smart-intake-direct-fix.yml
          git commit -m "A7: fix smart intake handoff and urgency"
          git push origin HEAD:test/marketplace-a7
