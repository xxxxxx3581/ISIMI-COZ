name: A7 review fix

on:
  push:
    branches:
      - test/marketplace-a7

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'A7 review fix applied')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A7
        uses: actions/checkout@v4
        with:
          ref: test/marketplace-a7
          fetch-depth: 1

      - name: Patch review UI and click handling
        run: |
          python <<'PY'
          from pathlib import Path
          import sys

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = '''.svcReviewCard{margin-top:12px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--card)}
          .svcStars{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
          .svcStarBtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2,#102238);font-size:22px;cursor:pointer;line-height:1}
          .svcStarBtn.on{border-color:var(--warning,#f5b942);background:rgba(245,185,66,.15)}
          .svcReviewCard textarea{width:100%;min-height:72px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:10px;font:inherit;resize:vertical}
          .svcRatingBadge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--warning,#f5b942)}'''

          new_css = '''.svcReviewCard{margin-top:12px;padding:16px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(20,184,122,.07),var(--card));position:relative;z-index:2}
          .svcStars{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0;position:relative;z-index:3}
          .svcStarBtn{width:46px;height:46px;border-radius:13px;border:1px solid var(--line);background:var(--card2,#102238);color:#71859a;font-size:24px;cursor:pointer;line-height:1;display:grid;place-items:center;transition:.15s transform,.15s border-color,.15s background,.15s color;touch-action:manipulation;position:relative;z-index:4}
          .svcStarBtn:hover,.svcStarBtn:focus-visible{border-color:rgba(251,191,36,.75);color:#fbbf24;outline:none;transform:translateY(-1px)}
          .svcStarBtn.on{border-color:#fbbf24;background:rgba(251,191,36,.16);color:#fbbf24;box-shadow:0 4px 14px rgba(251,191,36,.12)}
          .svcReviewCard textarea{width:100%;min-height:72px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:10px;font:inherit;resize:vertical;position:relative;z-index:3}
          .svcReviewSubmit{position:relative;z-index:5;touch-action:manipulation;cursor:pointer}
          .svcRatingBadge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--warning,#f5b942)}'''

          if old_css not in s:
              print('ERROR: review CSS block not found')
              sys.exit(1)
          s = s.replace(old_css, new_css, 1)

          old_btn = '''<button type="button" class="btn primary" style="width:100%;margin-top:10px" onclick="submitServiceReview('+JSON.stringify(String(talepNo))+')">Değerlendirmeyi gönder</button>'''
          new_btn = '''<button type="button" class="btn primary svcReviewSubmit" data-svc-review-submit="1" data-talep-no="'+escapeHTML(String(talepNo))+'" style="width:100%;margin-top:10px">Değerlendirmeyi Gönder</button>'''
          if old_btn not in s:
              print('ERROR: review submit button block not found')
              sys.exit(1)
          s = s.replace(old_btn, new_btn, 1)

          marker = 'window.__svcReviewStar=__svcReviewStar;'
          listener = '''window.__svcReviewStar=__svcReviewStar;
          if(!window.__svcReviewSubmitBound){
            window.__svcReviewSubmitBound=true;
            document.addEventListener('click',function(e){
              const btn=e.target&&e.target.closest?e.target.closest('[data-svc-review-submit="1"]'):null;
              if(!btn)return;
              e.preventDefault();
              e.stopPropagation();
              const no=btn.getAttribute('data-talep-no');
              if(no)submitServiceReview(no);
            },true);
          }'''
          if marker not in s:
              print('ERROR: review export marker not found')
              sys.exit(1)
          s = s.replace(marker, listener, 1)

          p.write_text(s, encoding='utf-8')
          print('A7 review patch applied successfully')
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/a7-review-fix.yml
          git add index.html
          git commit -m "A7 review fix applied"
          git push origin HEAD:test/marketplace-a7
