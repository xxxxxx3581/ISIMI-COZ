name: Apply common document viewer fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply common viewer implementation
        run: |
          if ! grep -q 'async function openDocument' index.html; then
            echo 'openDocument function not found.'
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('async function openDocument')
          end = s.index('\nfunction markCaseCompleted', start)
          new = r'''async function openDocument(docKey,index=0){
            const files=getDocumentFiles(docKey);
            const f=files[index];
            const session=getAuthSession();
            if(!f?.path||!session?.access_token){alert('Belge bağlantısı bulunamadı.');return;}
            try{
              const objectPath=f.path.split('/').map(encodeURIComponent).join('/');
              let res=await fetch(SUPABASE_URL+'/storage/v1/object/authenticated/hallet-documents/'+objectPath,{headers:{'Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_KEY}});
              if(!res.ok){
                const signRes=await fetch(SUPABASE_URL+'/storage/v1/object/sign/hallet-documents/'+objectPath,{method:'POST',headers:{'Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:600})});
                const text=await signRes.text();let d=null;try{d=text?JSON.parse(text):null}catch(e){}
                if(!signRes.ok)throw new Error(d?.message||d?.error||text||'Belge bağlantısı oluşturulamadı.');
                const signed=d?.signedURL||d?.signedUrl||d?.signed_url;
                if(!signed)throw new Error('Belge bağlantısı oluşturulamadı.');
                const full=signed.startsWith('http')?signed:(SUPABASE_URL+'/storage/v1'+signed);
                res=await fetch(full);
                if(!res.ok)throw new Error('Belge indirilemedi.');
              }
              const blob=await res.blob();
              const localUrl=URL.createObjectURL(blob);
              const isImage=(f.type||blob.type||'').startsWith('image/') || /\.(jpe?g|png|gif|webp|bmp|heic)$/i.test(f.name||'');
              const old=document.getElementById('halletDocViewer');if(old)old.remove();
              const viewer=document.createElement('div');
              viewer.id='halletDocViewer';
              viewer.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;box-sizing:border-box';
              const head=document.createElement('div');
              head.style.cssText='width:100%;max-width:900px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;color:#fff;font:700 14px Arial,sans-serif';
              const title=document.createElement('div');title.textContent=f.name||'Belge';title.style.cssText='min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
              const close=document.createElement('button');close.type='button';close.textContent='✕ Kapat';close.style.cssText='border:1px solid #52717a;background:#10252b;color:#fff;border-radius:10px;padding:9px 12px;font:700 13px Arial,sans-serif';close.onclick=()=>{URL.revokeObjectURL(localUrl);viewer.remove()};
              head.append(title,close);viewer.appendChild(head);
              const box=document.createElement('div');box.style.cssText='width:100%;max-width:900px;height:calc(100vh - 75px);display:flex;align-items:center;justify-content:center;overflow:auto;background:#111;border-radius:12px';
              if(isImage){const img=document.createElement('img');img.src=localUrl;img.alt=f.name||'Belge';img.style.cssText='max-width:100%;max-height:100%;object-fit:contain';box.appendChild(img);}
              else{const frame=document.createElement('iframe');frame.src=localUrl;frame.title=f.name||'Belge';frame.style.cssText='width:100%;height:100%;border:0;background:#fff';box.appendChild(frame);}
              viewer.appendChild(box);viewer.addEventListener('click',e=>{if(e.target===viewer){URL.revokeObjectURL(localUrl);viewer.remove()}});document.body.appendChild(viewer);
            }catch(e){console.error('Hallet belge görüntüleme hatası:',e);alert('Belge açılamadı.\n\n'+(e.message||'Bilinmeyen hata'));}
          }
          '''
          # Normalize the inserted block's indentation because it lives inside a heredoc.
          new = '\n'.join(line[12:] if line.startswith('            ') else line for line in new.split('\n'))
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')
          PY
          rm -f patch-document-viewer.diff
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html patch-document-viewer.diff
          git diff --cached --quiet && echo 'No changes needed.' && exit 0
          git commit -m 'fix: common document viewer for all transaction flows'
          git push
