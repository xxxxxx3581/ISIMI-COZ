name: Surgical document fix

on:
  push:
    paths:
      - '.github/workflows/surgical-document-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply surgical document fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker=s.find('\n<script>\n/* DOCUMENT-ACTIONS-REPAIR')
          if marker!=-1:
              tail=s.find('\n</body>',marker)
              if tail==-1: raise SystemExit('repair layer found but </body> missing')
              s=s[:marker]+s[tail:]
          start=s.find('async function openDocument(docKey,index=0){')
          end=s.find('\nfunction result(fromSaved=false){',start)
          if start<0 or end<0: raise SystemExit('openDocument boundaries not found')
          viewer=r'''async function openDocument(docKey,index=0){
  const files=getDocumentFiles(docKey),f=files[Number(index)||0],session=getAuthSession();
  if(!session?.access_token){alert('Oturum süresi dolmuş olabilir. Lütfen tekrar giriş yap.');if(typeof openAuthModal==='function')openAuthModal('login');return;}
  if(!f?.path){alert('Belge bulunamadı.');return;}
  let viewer=document.getElementById('halletDocumentViewer');if(viewer)viewer.remove();
  if(!document.getElementById('halletDocumentViewerStyle')){const style=document.createElement('style');style.id='halletDocumentViewerStyle';style.textContent='#halletDocumentViewer{position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box}#halletDocumentViewer .hdvCard{width:min(96vw,900px);height:min(94vh,900px);background:#07111f;border:1px solid #35535a;border-radius:16px;display:flex;flex-direction:column;overflow:hidden}#halletDocumentViewer .hdvHead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;color:#fff;background:#10252b}#halletDocumentViewer .hdvBody{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto}#halletDocumentViewer img{max-width:100%;max-height:100%;object-fit:contain}#halletDocumentViewer iframe{width:100%;height:100%;border:0;background:#fff}#halletDocumentViewer .hdvClose{border:1px solid #45616a;background:#17313a;color:#fff;border-radius:9px;padding:8px 12px;font-weight:700}';document.head.appendChild(style);}
  viewer=document.createElement('div');viewer.id='halletDocumentViewer';const card=document.createElement('div');card.className='hdvCard';const head=document.createElement('div');head.className='hdvHead';const title=document.createElement('span');title.textContent=f.name||'Belge';const closeBtn=document.createElement('button');closeBtn.type='button';closeBtn.className='hdvClose';closeBtn.textContent='Kapat';const body=document.createElement('div');body.className='hdvBody';body.textContent='Belge açılıyor…';body.style.color='#fff';closeBtn.onclick=()=>viewer.remove();head.appendChild(title);head.appendChild(closeBtn);card.appendChild(head);card.appendChild(body);viewer.appendChild(card);document.body.appendChild(viewer);viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.remove()});
  try{const objectPath=String(f.path).split('/').filter(Boolean).map(p=>{try{return encodeURIComponent(decodeURIComponent(p))}catch(e){return encodeURIComponent(p)}}).join('/');const r=await fetch(SUPABASE_URL+'/storage/v1/object/authenticated/hallet-documents/'+objectPath,{headers:{Authorization:'Bearer '+session.access_token,apikey:SUPABASE_KEY},cache:'no-store'});if(!r.ok)throw new Error((await r.text().catch(()=>''))||('Dosya okunamadı (HTTP '+r.status+').'));const blob=await r.blob();if(!blob.size)throw new Error('Dosya boş geldi veya okunamadı.');const u=URL.createObjectURL(blob);body.innerHTML='';if((f.type||blob.type||'').toLowerCase().includes('pdf')){const fr=document.createElement('iframe');fr.src=u;fr.title=f.name||'PDF';body.appendChild(fr)}else{const img=document.createElement('img');img.src=u;img.alt=f.name||'Belge';body.appendChild(img)}closeBtn.onclick=()=>{try{URL.revokeObjectURL(u)}catch(e){};viewer.remove()};}catch(e){body.textContent='Belge açılamadı: '+String(e.message||e);body.style.color='#ffb6b8';body.style.padding='20px';}
}

async function deleteDocument(docKey,index=0){const session=getAuthSession(),files=getDocumentFiles(docKey),i=Number(index)||0,f=files[i];if(!session?.access_token){alert('Oturum süresi dolmuş olabilir. Lütfen tekrar giriş yap.');return}if(!f?.path){alert('Silinecek belge bulunamadı.');return}if(!confirm('Bu belgeyi silmek istiyor musun?'))return;try{const path=String(f.path).split('/').filter(Boolean).map(p=>{try{return encodeURIComponent(decodeURIComponent(p))}catch(e){return encodeURIComponent(p)}}).join('/');let r=await fetch(SUPABASE_URL+'/storage/v1/object/hallet-documents/'+path,{method:'DELETE',headers:{Authorization:'Bearer '+session.access_token,apikey:SUPABASE_KEY}});if(!r.ok)throw new Error((await r.text().catch(()=>''))||('Storage silinemedi (HTTP '+r.status+').'));const filter=f.id?'id=eq.'+encodeURIComponent(f.id):'case_id=eq.'+encodeURIComponent(H.dbId)+'&doc_key=eq.'+encodeURIComponent(docKey)+'&storage_path=eq.'+encodeURIComponent(f.path);r=await fetch(SUPABASE_URL+'/rest/v1/hallet_documents?'+filter,{method:'DELETE',headers:{Authorization:'Bearer '+session.access_token,apikey:SUPABASE_KEY,Prefer:'return=minimal'}});if(!r.ok)throw new Error((await r.text().catch(()=>''))||('Belge kaydı silinemedi (HTTP '+r.status+').'));const next=files.slice();next.splice(i,1);H.documentFiles[docKey]=next;H.documents[docKey]=next.length>0;showActiveResult(!!H.dbId);}catch(e){console.error('Hallet belge silme hatası:',e);alert('Belge silinemedi.\n\n'+(e.message||'Bilinmeyen hata'));}}
'''
          s=s[:start]+viewer+s[end:]
          old='<button type="button" class="topb" data-a="openDoc" data-k="\'+esc(d.key)+'\" data-i="\'+i+'\">Görüntüle</button>'
          new=old+'<button type="button" class="topb" data-a="deleteDoc" data-k="\'+esc(d.key)+'\" data-i="\'+i+'\">Sil</button>'
          if old not in s: raise SystemExit('preview button pattern not found')
          s=s.replace(old,new)
          needle="if(a==='openDoc')return openDocument(e.dataset.k,Number(e.dataset.i||0));"
          if needle not in s: raise SystemExit('dispatcher pattern not found')
          s=s.replace(needle,needle+"if(a==='deleteDoc')return deleteDocument(e.dataset.k,Number(e.dataset.i||0));",1)
          s=s.replace('style="display:inline-flex;align-items:center;gap:7px;margin:0;padding:8px 10px;border:1px solid #35535a;border-radius:10px;background:#10252b;color:#fff;font:700 12px Arial,sans-serif;cursor:pointer">📎 Belge ekle','style="display:inline-flex;position:relative;overflow:hidden;align-items:center;gap:7px;margin:0;padding:8px 10px;border:1px solid #35535a;border-radius:10px;background:#10252b;color:#fff;font:700 12px Arial,sans-serif;cursor:pointer">📎 Belge ekle')
          s=s.replace('<input type="file" data-upload-doc="\'+esc(d.key)+'\" accept="application/pdf,image/*" style="display:none">','<input type="file" data-upload-doc="\'+esc(d.key)+'\" accept="application/pdf,image/*" style="display:block;position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0;padding:0">')
          if 'DOCUMENT-ACTIONS-REPAIR' in s: raise SystemExit('stale repair layer remains')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and commit
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/check.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert 'DOCUMENT-ACTIONS-REPAIR' not in s
          assert 'function deleteDocument' in s
          assert "data-a=\"deleteDoc\"" in s
          assert '/storage/v1/object/hallet-documents/' in s
          PY
          node --check /tmp/check.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix document upload preview and delete flow'
          git push origin HEAD:main
      - name: Remove one-time workflow
        shell: bash
        run: |
          git rm .github/workflows/surgical-document-fix.yml
          git commit -m 'Remove one-time document fix workflow'
          git push origin HEAD:main
