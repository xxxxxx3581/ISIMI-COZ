name: A7 Smart Intake Header Fix
on:
  push:
    branches:
      - test/marketplace-a7
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate Smart Intake source
        run: |
          echo '--- exact Akıllı matches ---'
          grep -n -i -E 'akıllı|smart' index.html | head -100 || true
          echo '--- relevant source context ---'
          grep -n -i -E 'talep|header|brand|home' index.html | head -140 || true
