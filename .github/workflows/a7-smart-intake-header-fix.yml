name: A7 Smart Intake Header Fix
on:
  push:
    branches:
      - test/marketplace-a7
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Smart Intake under brand text
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old_css='''.a7SmartHeaderSlot{display:none;padding:0 12px 7px;background:var(--top-bg);border-bottom:1px solid var(--line)}
.a7SmartHeaderSlot.isVisible{display:block}
.a7SmartHeaderBtn{display:flex;align-items:center;justify-content:flex-start;gap:8px;width:min(100%,420px);min-height:40px;padding:9px 13px;border:1px solid rgba(25,195,125,.34);border-radius:12px;background:linear-gradient(145deg,rgba(20,184,122,.13),rgba(13,148,136,.10));color:var(--text);font-size:12px;font-weight:850;line-height:1.2;box-shadow:0 4px 14px rgba(0,0,0,.12);transition:.15s transform,.15s border-color,.15s background)}
.a7SmartHeaderBtn:hover{border-color:rgba(25,195,125,.55);background:linear-gradient(145deg,rgba(20,184,122,.18),rgba(13,148,136,.14))}
.a7SmartHeaderBtn:active{transform:scale(.99)}
.a7SmartHeaderBtn .a7SmartSpark{font-size:16px;line-height:1}
.a7SmartHeaderBtn .a7SmartSub{color:var(--muted);font-size:10px;font-weight:650;margin-left:2px}
.a7SmartOriginalHidden{display:none!important}
@media(max-width:430px){.a7SmartHeaderSlot{padding-left:12px;padding-right:12px;padding-bottom:6px}.a7SmartHeaderBtn{width:100%;min-height:38px;padding:8px 11px}.a7SmartHeaderBtn .a7SmartSub{font-size:9px}}'''
          new_css='''.a7SmartHeaderSlot{display:none;margin-top:4px;padding:0;background:transparent;border:0}
.a7SmartHeaderSlot.isVisible{display:block}
.a7SmartHeaderBtn{display:inline-flex;align-items:center;justify-content:center;gap:5px;width:auto;min-height:27px;padding:5px 8px;border:1px solid rgba(20,184,122,.42);border-radius:9px;background:linear-gradient(145deg,rgba(20,184,122,.13),rgba(56,189,248,.06));color:var(--text);font-size:10.5px;font-weight:850;line-height:1;white-space:nowrap;box-shadow:none;transition:.15s border-color,.15s background,.15s transform}
.a7SmartHeaderBtn:hover{border-color:rgba(20,184,122,.68);background:linear-gradient(145deg,rgba(20,184,122,.18),rgba(56,189,248,.09))}
.a7SmartHeaderBtn:active{transform:scale(.98)}
.a7SmartHeaderBtn .a7SmartSpark{font-size:12px;line-height:1}
.a7SmartOriginalHidden{display:none!important}
@media(max-width:430px){.a7SmartHeaderSlot{margin-top:3px}.a7SmartHeaderBtn{min-height:26px;padding:5px 8px;font-size:10px}}'''
          if old_css not in s: raise SystemExit('Expected header CSS not found')
          s=s.replace(old_css,new_css,1)
          old_js="""      existing.innerHTML='<button type=\"button\" class=\"a7SmartHeaderBtn\"><span class=\"a7SmartSpark\">✨</span><span>Akıllı Talep Oluştur</span><span class=\"a7SmartSub\"></span></button>';\n      top.insertAdjacentElement('afterend',existing);"""
          new_js="""      existing.innerHTML='<button type=\"button\" class=\"a7SmartHeaderBtn\"><span class=\"a7SmartSpark\">✨</span><span>Akıllı Talep Oluştur</span></button>';\n      var brandText=top.querySelector('.brandText');\n      if(brandText) brandText.appendChild(existing); else top.insertAdjacentElement('afterend',existing);"""
          if old_js not in s: raise SystemExit('Expected header insertion code not found')
          s=s.replace(old_js,new_js,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'a7SmartHeaderSlot{display:none;margin-top:4px' index.html
          grep -q 'brandText=top.querySelector' index.html
          grep -q 'Akıllı Talep Oluştur' index.html
          grep -q 'a7SmartHeaderBtn' index.html
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'A7: compact Smart Intake directly under logo text'
          git push
