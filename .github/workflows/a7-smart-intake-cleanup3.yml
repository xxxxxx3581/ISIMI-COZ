name: A7 Smart Intake Cleanup 3

on:
  push:
    branches:
      - test/marketplace-a7

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/marketplace-a7
      - name: Wait for patch workflow
        run: sleep 20
      - name: Remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/a7-smart-intake-fix3.yml .github/workflows/a7-smart-intake-cleanup3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/a7-smart-intake-fix3.yml .github/workflows/a7-smart-intake-cleanup3.yml
          git diff --cached --quiet && exit 0
          git commit -m "A7: remove temporary smart intake workflows"
          git push origin HEAD:test/marketplace-a7
