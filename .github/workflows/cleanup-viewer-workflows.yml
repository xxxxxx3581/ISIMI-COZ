name: Cleanup viewer repair workflows

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary repair workflows
        run: |
          rm -f .github/workflows/fix-document-viewer.yml
          rm -f .github/workflows/fix-document-viewer-2.yml
          rm -f .github/workflows/fix-document-viewer-3.yml
          rm -f .github/workflows/cleanup-viewer-workflows.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          git commit -m "Remove temporary viewer repair workflows" || exit 0
          git push
