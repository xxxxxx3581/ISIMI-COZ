name: Fix document viewer interaction
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-doc-viewer.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch document viewer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('async function openDocument(docKey,index=0){')
          end=s.find('async function markCaseCompleted()', start)
          if start < 0 or end < 0:
              raise SystemExit('openDocument boundaries not found')

          bridge='window.__halletOpenDocument=openDocument;\n'
          if 'window.__halletOpenDocument=openDocument;' not in s:
              s=s[:end]+bridge+s[end:]

          # The document button is handled directly by the global bridge.
          old='>Görüntüle</button>'
          new=' onclick="window.__halletOpenDocument(this.dataset.k,Number(this.dataset.i||0));return false;">Görüntüle</button>'
          count=s.count(old)
          if count:
              s=s.replace(old,new)
          print('preview buttons patched:',count)

          # IMPORTANT: the app has a document-level CAPTURE click handler.
          # It was stopping the event before the button's inline onclick could run.
          capture_old="if(!el)return;e.preventDefault();e.stopPropagation();dispatch(el.dataset.a,el)"
          capture_new="if(!el)return;if(el.dataset.a==='openDoc')return;e.preventDefault();e.stopPropagation();dispatch(el.dataset.a,el)"
          if capture_old in s:
              s=s.replace(capture_old,capture_new,1)
              print('capture handler patched: yes')
          else:
              print('capture handler patched: pattern not found')

          # Remove any obsolete fallback appended after </html>.
          marker='\n/* Hard fallback for document preview buttons. */'
          if marker in s:
              s=s.split(marker,1)[0].rstrip()+"\n"

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix document viewer capture handler'
          git push
