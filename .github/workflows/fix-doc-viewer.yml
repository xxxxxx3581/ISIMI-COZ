name: Fix document viewer overlay
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-doc-viewer.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch viewer z-index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="viewer.style.cssText='position:fixed;inset:0;z-index:2147483000;"
          new="viewer.style.cssText='position:fixed;inset:0;z-index:2147483647;"
          if old not in s:
              raise SystemExit('viewer z-index target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          print('patched')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix document viewer overlay z-index'
          git push