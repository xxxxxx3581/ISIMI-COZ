name: Fix document viewer overlay
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-doc-viewer.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch viewer z-index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          targets=[
              "viewer.style.cssText='position:fixed;inset:0;z-index:2147483000;",
              "modal.style.cssText='position:fixed;inset:0;z-index:99999;",
          ]
          changed=False
          for old in targets:
              if old in s:
                  s=s.replace(old,old.rsplit('z-index:',1)[0]+'z-index:2147483647;',1)
                  changed=True
          if not changed:
              raise SystemExit('document viewer z-index target not found')
          p.write_text(s,encoding='utf-8')
          print('patched')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix document viewer overlay z-index'
          git push