name: Fix document viewer interaction
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-doc-viewer.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch document viewer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('async function openDocument(docKey,index=0){')
          end=s.find('async function markCaseCompleted()', start)
          if start < 0 or end < 0:
              raise SystemExit('openDocument boundaries not found')

          # Expose the LOCAL openDocument function on window. The inline
          # button handler cannot see functions declared inside the app IIFE.
          bridge='window.__halletOpenDocument=openDocument;\n'
          if bridge not in s[start:end]:
              s=s[:end]+bridge+s[end:]

          # Replace any previous duplicate viewer handlers with exactly one.
          import re
          pattern=r' onclick="window\.__halletOpenDocument\(this\.dataset\.k,Number\(this\.dataset\.i\|\|0\)\);return false;"'
          s=re.sub(pattern,'',s)
          s=s.replace('>Görüntüle</button>', ' onclick="window.__halletOpenDocument(this.dataset.k,Number(this.dataset.i||0));return false;">Görüntüle</button>')

          # Do not let the capture handler swallow document clicks.
          capture_old="if(!el)return;e.preventDefault();e.stopPropagation();dispatch(el.dataset.a,el)"
          capture_new="if(!el)return;if(el.dataset.a==='openDoc')return;e.preventDefault();e.stopPropagation();dispatch(el.dataset.a,el)"
          if capture_old in s:
              s=s.replace(capture_old,capture_new,1)

          # Remove obsolete post-HTML fallback code if present.
          marker='\n/* Hard fallback for document preview buttons. */'
          if marker in s:
              s=s.split(marker,1)[0].rstrip()+"\n"

          p.write_text(s,encoding='utf-8')
          print('GLOBAL BRIDGE:', bridge in s[start:end])
          print('VIEWER BUTTONS:', s.count('window.__halletOpenDocument(this.dataset.k'))
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix document viewer global bridge'
          git push
