name: Finalize Hallet document viewer
on:
  push:
    paths:
      - '.github/workflows/fix-doc-viewer.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final Hallet fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # 1) The viewer must live inside the Hallet root. The root is the
          # visible fixed layer; appending the viewer to body creates a
          # competing stacking context and can make taps appear dead.
          s2=s.replace("  document.body.appendChild(modal);", "  root().appendChild(modal);", 1)
          if s2==s:
              raise SystemExit('viewer append point not found')
          s=s2

          # Keep the viewer below the Hallet root itself but above its content.
          s=s.replace("z-index:2147483647;background:rgba(0,0,0,.88)", "z-index:2147483646;background:rgba(0,0,0,.88)", 1)

          # 2) After a document upload, do not auto-save/re-render the property
          # case as a saved result. The user must still see DOSYAYI KAYDET and
          # explicitly save the updated case metadata.
          old="""    }else if(H.module==='prop'){
      await savePropCase(true);
      propResult(!!H.dbId);
    }else if(H.module==='arac'||H.module==='arac_satisi'){
      await saveAracCase(true);
      aracResult(!!H.dbId);
    }else{
      await saveCase(true);
      result(!!H.dbId);
    }"""
          new="""    }else if(H.module==='prop'){
      propResult(false);
    }else if(H.module==='arac'||H.module==='arac_satisi'){
      aracResult(false);
    }else{
      result(false);
    }"""
          if old not in s:
              raise SystemExit('upload post-save block not found')
          s=s.replace(old,new,1)

          # 3) The direct openDoc capture handler remains the single click path.
          # Do not add another automated patch layer here.
          print('viewer-inside-root:', 'root().appendChild(modal);' in s)
          print('prop-upload-keeps-save:', "propResult(false);" in s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove automatic patch workflows
        shell: bash
        run: |
          git rm -f .github/workflows/fix-doc-viewer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Hallet viewer layering and preserve save action'
          git push
