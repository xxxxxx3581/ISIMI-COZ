name: Finalize Hallet
on:
  push:
    paths:
      - '.github/workflows/fix-doc-viewer.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('  document.body.appendChild(modal);','  root().appendChild(modal);',1)
          s=s.replace('z-index:2147483647;background:rgba(0,0,0,.88)','z-index:2147483646;background:rgba(0,0,0,.88)',1)
          old="""    }else if(H.module==='prop'){
      await savePropCase(true);
      propResult(!!H.dbId);
    }else if(H.module==='arac'||H.module==='arac_satisi'){
      await saveAracCase(true);
      aracResult(!!H.dbId);
    }else{
      await saveCase(true);
      result(!!H.dbId);
    }"""
          new="""    }else if(H.module==='prop'){
      propResult(false);
    }else if(H.module==='arac'||H.module==='arac_satisi'){
      aracResult(false);
    }else{
      result(false);
    }"""
          if old not in s: raise SystemExit('upload block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Hallet viewer and preserve save action' || exit 0
          git push
