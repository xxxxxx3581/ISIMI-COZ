name: One-time document viewer fix

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-document-viewer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch document viewer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=re.search(r"    const rawPath=String\(f\.path\).*?\n    const mime=\(f\.type\|\|''\)\.toLowerCase\(\);",s,re.S)
          if not old:
              raise SystemExit('viewer block not found')
          new="""    const rawPath=String(f.path).split('/').filter(Boolean).map(function(p){try{return decodeURIComponent(p);}catch(e){return p;}}).join('/');
              const objectPath=rawPath.split('/').map(encodeURIComponent).join('/');
              // Mobil tarayıcıda signed URL yerine authenticated object GET + blob kullan.
              const objectEndpoint=SUPABASE_URL+'/storage/v1/object/hallet-documents/'+objectPath;
              const fileRes=await fetch(objectEndpoint,{
                method:'GET',
                headers:{'Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_KEY}
              });
              if(!fileRes.ok){
                const errText=await fileRes.text().catch(()=> '');
                let errData=null; try{errData=errText?JSON.parse(errText):null;}catch(e){}
                const msg=errData?.message||errData?.error||errText||('Dosya okunamadı (HTTP '+fileRes.status+').');
                if(fileRes.status===401||fileRes.status===403||/jwt|token|auth|expired|oturum/i.test(String(msg))) throw new Error('Oturum süresi dolmuş olabilir. Lütfen tekrar giriş yapıp belgeyi açın.');
                throw new Error(msg);
              }
              const blob=await fileRes.blob();
              if(!blob||!blob.size)throw new Error('Dosya boş geldi veya okunamadı.');
              const viewUrl=URL.createObjectURL(blob);
              viewer.dataset.objectUrl=viewUrl;
              const mime=(f.type||blob.type||'').toLowerCase();"""
          s=s[:old.start()]+new+s[old.end():]
          s=s.replace("const closeFn=function(){viewer.remove();};", "const closeFn=function(){viewer.remove();if(viewer.dataset.objectUrl)URL.revokeObjectURL(viewer.dataset.objectUrl);};", 1)
          s=s.replace("img.onerror=function(){alert('Görsel görüntülenemedi. Bağlantı geçersiz veya dosya okunamadı.');};", "img.onerror=function(){URL.revokeObjectURL(viewUrl);alert('Görsel görüntülenemedi. Dosya okunamadı.');};", 1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix document image preview with authenticated blob fetch'
          git push
