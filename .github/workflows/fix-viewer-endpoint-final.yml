name: Final document viewer endpoint fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix authenticated storage endpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="SUPABASE_URL+'/storage/v1/object/hallet-documents/'"
          new="SUPABASE_URL+'/storage/v1/object/authenticated/hallet-documents/'"
          n=s.count(old)
          print('matches=', n)
          if n != 1:
              raise SystemExit(f'Expected exactly 1 endpoint, found {n}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix private document preview authenticated endpoint"
          git push
