<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>İŞİMİ ÇÖZ — İzmir Pilot</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#07111f;color:#eef4fb;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

:root{
--bg:#07111f;
--card:#0d1a2b;
--line:#20344d;
--text:#eef4fb;
--muted:#9eb0c5;
--primary:#19c37d;
--danger:#ef5350;
--warning:#f5b942;
}

.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:88px}

.top{
padding:18px 16px 14px;
border-bottom:1px solid var(--line);
background:rgba(7,17,31,.97);
position:sticky;
top:0;
z-index:20
}

.brand{display:flex;align-items:center;gap:10px}
.logo{
width:38px;height:38px;border-radius:12px;
background:linear-gradient(135deg,#19c37d,#36a3ff);
display:grid;place-items:center;
font-size:21px;font-weight:900;color:#03120d
}
.brand strong{font-size:18px}
.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}

main{padding:16px}

.hero{
background:linear-gradient(145deg,#10243a,#0b1727);
border:1px solid var(--line);
border-radius:24px;
padding:24px 20px;
margin-bottom:16px
}

.badge{
display:inline-flex;align-items:center;gap:6px;
padding:7px 10px;border-radius:99px;
background:rgba(25,195,125,.12);
border:1px solid rgba(25,195,125,.28);
color:#6df0b5;font-size:12px;font-weight:700
}

h1{font-size:31px;line-height:1.08;margin:16px 0 10px}
h2{font-size:22px;margin:0 0 8px}
h3{font-size:16px;margin:0 0 6px}
p{line-height:1.55}
.muted{color:var(--muted)}
.small{font-size:12px}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px
}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:18px;
padding:16px
}

.service{
min-height:130px;
transition:.15s transform
}

.service:active{transform:scale(.98)}
.service .emoji{font-size:28px}
.service strong{display:block;margin-top:9px;font-size:16px}
.service span{
display:block;
color:var(--muted);
font-size:12px;
line-height:1.4;
margin-top:5px
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin:16px 0
}

.btn{
width:100%;
border:0;
border-radius:14px;
padding:14px 15px;
font-weight:800
}

.btn.primary{background:var(--primary);color:#03130d}
.btn.secondary{
background:#14263b;
color:var(--text);
border:1px solid var(--line)
}
.btn.danger{
background:#4a1f25;
color:#ffb5b3;
border:1px solid #6a2b32
}
.btn.smallBtn{padding:10px 12px;font-size:13px}

.section{margin-top:18px}
.sectionTitle{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px
}

.formCard{
background:var(--card);
border:1px solid var(--line);
border-radius:20px;
padding:18px;
margin-bottom:14px
}

label{
display:block;
font-size:13px;
font-weight:700;
margin:14px 0 7px
}

input,select,textarea{
width:100%;
background:#081523;
color:var(--text);
border:1px solid #29415d;
border-radius:12px;
padding:13px;
outline:none
}

input:focus,select:focus,textarea:focus{
border-color:var(--primary)
}

textarea{
min-height:120px;
resize:vertical
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.checks{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.check{
display:flex;
align-items:center;
gap:8px;
background:#091827;
border:1px solid var(--line);
padding:10px;
border-radius:12px;
font-size:13px
}

.check input{width:auto}

.notice{
background:#0b2030;
border:1px solid #1e4c66;
color:#b9ddf2;
padding:12px;
border-radius:13px;
font-size:12px;
line-height:1.5;
margin:12px 0
}

.success{
background:#0b2b20;
border:1px solid #185d43;
color:#8bf1c4;
padding:12px;
border-radius:13px;
font-size:13px
}

.warning{
background:#30260e;
border:1px solid #65501a;
color:#f5d77c;
padding:12px;
border-radius:13px;
font-size:13px
}

.error{
background:#35171b;
border:1px solid #743038;
color:#ffb8b8;
padding:12px;
border-radius:13px;
font-size:13px;
margin:12px 0
}

.request{
background:var(--card);
border:1px solid var(--line);
border-radius:18px;
padding:16px;
margin-bottom:11px
}

.requestTop{
display:flex;
justify-content:space-between;
gap:10px
}

.status{
padding:5px 9px;
border-radius:99px;
background:rgba(245,185,66,.12);
color:#ffd76b;
font-size:11px;
font-weight:800;
height:max-content
}

.meta{
display:flex;
flex-wrap:wrap;
gap:8px;
color:var(--muted);
font-size:12px;
margin:10px 0
}

.meta span{
background:#091827;
padding:6px 8px;
border-radius:8px
}

.description{
background:#091827;
border-radius:12px;
padding:11px;
font-size:13px;
line-height:1.5;
margin:10px 0
}

.profileHeader{
display:flex;
align-items:center;
gap:13px;
padding:16px;
background:var(--card);
border:1px solid var(--line);
border-radius:18px
}

.avatar{
width:52px;
height:52px;
border-radius:50%;
display:grid;
place-items:center;
background:#17334d;
font-weight:900;
font-size:18px
}

.empty{
text-align:center;
padding:28px 15px;
color:var(--muted)
}

.loading{
text-align:center;
padding:35px;
color:var(--muted)
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
background:rgba(7,17,31,.97);
border-top:1px solid var(--line);
z-index:30
}

.bottomInner{
max-width:760px;
margin:auto;
display:grid;
grid-template-columns:repeat(4,1fr)
}

.navBtn{
border:0;
background:transparent;
color:#8fa3b9;
padding:11px 4px 10px;
font-size:10px
}

.navBtn b{
display:block;
font-size:19px;
margin-bottom:3px
}

.navBtn.active{color:var(--primary)}

.back{margin-bottom:12px}

@media(max-width:430px){
main{padding:12px}
.hero{padding:20px 16px}
h1{font-size:27px}
.grid{gap:8px}
.service{padding:13px;min-height:122px}
.row{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="app">

<header class="top">
<div class="brand">
<div class="logo">✓</div>
<div>
<strong>İŞİMİ ÇÖZ</strong>
<small>İzmir Pilot Bölgesi</small>
</div>
</div>
</header>

<main id="app"></main>

</div>

<nav class="bottom">
<div class="bottomInner">
<button class="navBtn" id="navHome" onclick="showHome()">
<b>⌂</b>ANA
</button>

<button class="navBtn" id="navRequest" onclick="showRequest()">
<b>＋</b>TALEP
</button>

<button class="navBtn" id="navRequests" onclick="showRequests()">
<b>▣</b>TALEPLER
</button>

<button class="navBtn" id="navProvider" onclick="showProviderEntry()">
<b>🛠️</b>HİZMET VER
</button>
</div>
</nav>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE AYARLARI
   ========================================================= */

const SUPABASE_URL = "https://zvffspbowdzvrrzefhkr.supabase.co";

/*
  BURAYA SENİN SUPABASE PUBLISHABLE KEY'İNİ YAPIŞTIR.
  sb_publishable_ ile başlayan anahtar.
*/
const SUPABASE_KEY = "BURAYA_SB_PUBLISHABLE_KEY_YAPISTIR";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   HİZMETLER
   ========================================================= */

const SERVICES = {

klima:{
name:"Klima",
emoji:"❄️",
desc:"Bakım, montaj, arıza ve temizlik"
},

elektrik:{
name:"Elektrik",
emoji:"⚡",
desc:"Arıza, priz, tesisat ve aydınlatma"
},

tesisat:{
name:"Tesisat",
emoji:"🔧",
desc:"Su, gider, musluk ve kaçak sorunları"
},

beyaz:{
name:"Beyaz Eşya",
emoji:"🧊",
desc:"Çamaşır, bulaşık, buzdolabı ve fırın"
},

temizlik:{
name:"Temizlik",
emoji:"🧹",
desc:"Ev, ofis ve detaylı temizlik"
},

nakliye:{
name:"Nakliye",
emoji:"🚚",
desc:"Ev, ofis ve parça eşya taşıma"
},

cilingir:{
name:"Çilingir",
emoji:"🔐",
desc:"Kilit, anahtar ve acil giriş"
},

oto:{
name:"Oto",
emoji:"🚗",
desc:"Arıza, bakım, lastik ve yol yardımı"
}

};


/* =========================================================
   İLÇELER
   ========================================================= */

const DISTRICTS=[
"Aliağa",
"Balçova",
"Bayındır",
"Bayraklı",
"Bergama",
"Beydağ",
"Bornova",
"Buca",
"Çeşme",
"Çiğli",
"Dikili",
"Foça",
"Gaziemir",
"Güzelbahçe",
"Karabağlar",
"Karaburun",
"Karşıyaka",
"Kemalpaşa",
"Kınık",
"Kiraz",
"Konak",
"Menderes",
"Menemen",
"Narlıdere",
"Ödemiş",
"Seferihisar",
"Selçuk",
"Tire",
"Torbalı",
"Urla"
];


/* =========================================================
   YARDIMCI FONKSİYONLAR
   ========================================================= */

function escapeHTML(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function setNav(active){

[
"navHome",
"navRequest",
"navRequests",
"navProvider"
].forEach(id=>{
document.getElementById(id).classList.remove("active");
});

if(active){
document.getElementById(active).classList.add("active");
}

}


function app(html){

document.getElementById("app").innerHTML=html;

window.scrollTo({
top:0,
behavior:"instant"
});

}


function districtOptions(selected=""){

return `<option value="">İlçe seç</option>`+

DISTRICTS.map(d=>

`<option value="${escapeHTML(d)}"
${d===selected?"selected":""}>
${escapeHTML(d)}
</option>`

).join("");

}


function serviceOptions(selected=""){

return `<option value="">Kategori seç</option>`+

Object.entries(SERVICES).map(([key,s])=>

`<option value="${key}"
${key===selected?"selected":""}>
${s.emoji} ${s.name}
</option>`

).join("");

}


function formatDate(date){

try{

return new Intl.DateTimeFormat("tr-TR",{
day:"2-digit",
month:"2-digit",
year:"numeric",
hour:"2-digit",
minute:"2-digit"
}).format(new Date(date));

}catch(e){

return date;

}

}


/* =========================================================
   ANA SAYFA
   ========================================================= */

function showHome(){

setNav("navHome");

app(`

<section class="hero">

<span class="badge">
📍 İZMİR PİLOT BÖLGESİ
</span>

<h1>
İhtiyacın varsa,<br>
çözümü var.
</h1>

<p class="muted">
Ev, iş yeri, araç ve günlük yaşam hizmetlerini
tek yerden bul.
İhtiyacını anlat, talebini oluştur.
</p>

<div class="actions">

<button class="btn primary"
onclick="showRequest()">
📢 İşimi Çözdür
</button>

<button class="btn secondary"
onclick="showProviderEntry()">
🛠️ Hizmet Ver
</button>

</div>

</section>


<div class="section">

<div class="sectionTitle">

<h2>
Hizmet kategorileri
</h2>

<span class="small muted">
İzmir
</span>

</div>


<div class="grid">

${Object.entries(SERVICES).map(([key,s])=>`

<button class="card service"
onclick="showRequest('${key}')">

<div class="emoji">
${s.emoji}
</div>

<strong>
${s.name}
</strong>

<span>
${s.desc}
</span>

</button>

`).join("")}

</div>

</div>


<div class="section card">

<h2>
💡 Nasıl çalışıyor?
</h2>

<p class="muted small">

İhtiyacını oluştur.
Kategori ve konum bilgilerini gir.
Talebin doğrudan İŞİMİ ÇÖZ sistemindeki
Supabase veritabanına kaydedilir.

</p>

</div>

`);

}


/* =========================================================
   TALEP FORMU
   ========================================================= */

function showRequest(preselected=""){

setNav("navRequest");

app(`

<div class="back">

<button class="btn secondary smallBtn"
onclick="showHome()">

← Ana sayfaya dön

</button>

</div>


<div class="formCard">

<span class="badge">
📋 YENİ HİZMET TALEBİ
</span>

<h1>
İhtiyacını anlat.
</h1>

<p class="muted small">

İhtiyacını mümkün olduğunca açık anlat.
Böylece doğru hizmet kategorisine
daha kolay yönlendirebiliriz.

</p>


<label>
Hizmet kategorisi *
</label>

<select id="reqService">
${serviceOptions(preselected)}
</select>


<label>
Sorunun / ihtiyacın *
</label>

<textarea
id="reqDescription"
maxlength="1000"
placeholder="Örneğin: Klima çalışıyor fakat yeterince soğutmuyor.">
</textarea>

<div class="small muted"
id="charCount">
0/1000
</div>


<div class="row">

<div>

<label>
İl *
</label>

<input
id="reqCity"
value="İzmir"
readonly>

</div>


<div>

<label>
İlçe *
</label>

<select id="reqDistrict">
${districtOptions()}
</select>

</div>

</div>


<label>
Mahalle
</label>

<input
id="reqNeighborhood"
placeholder="Mahalle adı">


<label>
Ne zaman gerekli?
</label>

<select id="reqUrgency">

<option value="Acil">
🔴 Acil
</option>

<option value="Bugün" selected>
🟡 Bugün
</option>

<option value="Uygun zamanda">
🟢 Uygun zamanda
</option>

</select>


<label>
Ad Soyad *
</label>

<input
id="reqName"
placeholder="Adınız Soyadınız">


<label>
Telefon *
</label>

<input
id="reqPhone"
type="tel"
placeholder="05xxxxxxxxx">


<div id="requestMessage"></div>


<div class="notice">

🔒 Bilgileriniz hizmet talebinin
oluşturulması amacıyla sisteme kaydedilir.

</div>


<button
id="createButton"
class="btn primary"
onclick="createRequest()">

TALEBİ OLUŞTUR

</button>

</div>

`);


const ta=document.getElementById("reqDescription");

ta.addEventListener("input",()=>{

document.getElementById("charCount")
.textContent=ta.value.length+"/1000";

});

}


/* =========================================================
   TALEP OLUŞTUR
   ========================================================= */

async function createRequest(){

const button=document.getElementById("createButton");

const service=document.getElementById("reqService").value;

const description=
document.getElementById("reqDescription").value.trim();

const city=
document.getElementById("reqCity").value.trim();

const district=
document.getElementById("reqDistrict").value;

const neighborhood=
document.getElementById("reqNeighborhood").value.trim();

const urgency=
document.getElementById("reqUrgency").value;

const name=
document.getElementById("reqName").value.trim();

const phone=
document.getElementById("reqPhone").value.trim();

const message=
document.getElementById("requestMessage");


message.innerHTML="";


if(!service){

message.innerHTML=
`<div class="error">Lütfen hizmet kategorisini seç.</div>`;

return;

}


if(description.length<5){

message.innerHTML=
`<div class="error">Lütfen ihtiyacınızı biraz daha açık anlat.</div>`;

return;

}


if(!district){

message.innerHTML=
`<div class="error">Lütfen ilçe seç.</div>`;

return;

}


if(!name){

message.innerHTML=
`<div class="error">Lütfen adınızı ve soyadınızı yaz.</div>`;

return;

}


if(!phone){

message.innerHTML=
`<div class="error">Lütfen telefon numaranızı yaz.</div>`;

return;

}


button.disabled=true;
button.textContent="KAYDEDİLİYOR...";


try{


/*
  talep_no'yu BOŞ bırakıyoruz.
  Supabase trigger otomatik oluşturuyor.
*/

const {data,error}=await db

.from("talepler")

.insert({

kategori:SERVICES[service]?.name || service,

aciklama:description,

il:city || "İzmir",

ilce:district,

mahalle:neighborhood || null,

aciliyet:urgency,

ad_soyad:name,

telefon:phone,

durum:"beklemede",

kaynak:"uygulama"

})

.select("id,talep_no,created_at")
.single();


if(error){

console.error(error);

throw error;

}


message.innerHTML=`

<div class="success">

<strong>✅ Talebiniz başarıyla oluşturuldu.</strong>

<br><br>

Talep numaranız:

<strong>
${escapeHTML(data.talep_no)}
</strong>

<br><br>

Talebiniz artık Supabase veritabanında kayıtlıdır.

</div>

`;


button.textContent="TALEP OLUŞTURULDU";

button.disabled=true;


setTimeout(()=>{

showRequests();

},1800);


}catch(error){

console.error("SUPABASE HATASI:",error);

button.disabled=false;
button.textContent="TALEBİ OLUŞTUR";


message.innerHTML=`

<div class="error">

<strong>❌ Supabase bağlantısı / kayıt hatası</strong>

<br><br>

${escapeHTML(error.message || error)}

<br><br>

Supabase SQL Editor'deki
<talepler> tablosunun ve izinlerinin
doğru kurulduğundan emin olun.

</div>

`;

}

}


/* =========================================================
   TALEPLERİ SUPABASE'DEN GETİR
   ========================================================= */

async function showRequests(){

setNav("navRequests");

app(`

<div class="back">

<button class="btn secondary smallBtn"
onclick="showHome()">

← Ana sayfaya dön

</button>

</div>

<div class="sectionTitle">

<div>

<span class="badge">
▣ TALEPLER
</span>

<h1>
Oluşturulan talepler.
</h1>

</div>

</div>

<div id="requestsContainer">

<div class="loading">
⏳ Talepler yükleniyor...
</div>

</div>

`);

try{


const {data,error}=await db

.from("talepler")

.select(`
id,
talep_no,
kategori,
aciklama,
il,
ilce,
mahalle,
aciliyet,
ad_soyad,
telefon,
durum,
created_at
`)

.order("created_at",{ascending:false});


if(error){

throw error;

}


const container=
document.getElementById("requestsContainer");


if(!data || data.length===0){

container.innerHTML=`

<div class="card empty">

<div style="font-size:35px">
📋
</div>

<h3>
Henüz talep yok
</h3>

<p>
İlk hizmet talebini oluştur.
</p>

<button
class="btn primary"
onclick="showRequest()">

＋ Talep oluştur

</button>

</div>

`;

return;

}


container.innerHTML=
data.map(renderRequest).join("");


}catch(error){

console.error(error);

document.getElementById("requestsContainer").innerHTML=`

<div class="error">

<strong>
❌ Talepler yüklenemedi.
</strong>

<br><br>

${escapeHTML(error.message || error)}

</div>

`;

}

}


/* =========================================================
   TALEP KARTI
   ========================================================= */

function renderRequest(r){

const serviceName=
r.kategori || "Hizmet";

const emoji=
Object.values(SERVICES)
.find(x=>x.name===serviceName)?.emoji || "🛠️";


return `

<article class="request">

<div class="requestTop">

<div>

<h3>
${emoji}
${escapeHTML(serviceName)}
</h3>

<div class="small muted">

${formatDate(r.created_at)}

</div>

</div>

<span class="status">

${escapeHTML(r.durum || "beklemede")}

</span>

</div>


<div class="description">

“${escapeHTML(r.aciklama)}”

</div>


<div class="meta">

<span>
📍 ${escapeHTML(r.il || "İzmir")}
</span>

<span>
🏙️ ${escapeHTML(r.ilce)}
</span>

${r.mahalle ? `

<span>
🏘️ ${escapeHTML(r.mahalle)}
</span>

` : ""}

<span>
⏱️ ${escapeHTML(r.aciliyet)}
</span>

</div>


<div class="small muted">

Talep No:

<strong>
${escapeHTML(r.talep_no)}
</strong>

</div>

</article>

`;

}


/* =========================================================
   HİZMET VER
   ========================================================= */

function showProviderEntry(){

setNav("navProvider");

app(`

<div class="back">

<button class="btn secondary smallBtn"
onclick="showHome()">

← Ana sayfaya dön

</button>

</div>


<div class="formCard">

<span class="badge">
🛠️ HİZMET VER
</span>

<h1>
Hizmet sağlayıcı olarak katıl.
</h1>

<p class="muted">

Pilot sürümde hizmet sağlayıcı
bilgileri şimdilik cihaz üzerinde tutulur.
Talep sistemi ise Supabase'e bağlıdır.

</p>


<label>
Ad / İşletme *
</label>

<input
id="providerName"
placeholder="Adınız veya işletme adınız">


<label>
Telefon *
</label>

<input
id="providerPhone"
type="tel"
placeholder="05xxxxxxxxx">


<label>
Hizmet verdiğin ilçe *
</label>

<select id="providerDistrict">

${districtOptions()}

</select>


<label>
Verdiğin hizmet *</label>

<div class="checks">

${Object.entries(SERVICES).map(([key,s])=>`

<label class="check">

<input
type="checkbox"
name="providerService"
value="${key}">

${s.emoji}
${s.name}

</label>

`).join("")}

</div>


<label>
Açıklama
</label>

<textarea
id="providerDescription"
maxlength="500"
placeholder="Hizmetlerin hakkında kısa bilgi.">
</textarea>


<button
class="btn primary"
onclick="saveProvider()">

HİZMET SAĞLAYICI OL

</button>

</div>

`);

}


/* =========================================================
   SAĞLAYICI KAYDET
   ========================================================= */

function saveProvider(){

const name=
document.getElementById("providerName").value.trim();

const phone=
document.getElementById("providerPhone").value.trim();

const district=
document.getElementById("providerDistrict").value;

const description=
document.getElementById("providerDescription").value.trim();

const services=
[...document.querySelectorAll(
'input[name="providerService"]:checked'
)].map(x=>x.value);


if(!name){

alert("Ad / işletme adı gerekli.");
return;

}

if(!phone){

alert("Telefon numarası gerekli.");
return;

}

if(!district){

alert("Hizmet verdiğin ilçeyi seç.");
return;

}

if(!services.length){

alert("En az bir hizmet seç.");
return;

}


localStorage.setItem(
"isimi_coz_provider",
JSON.stringify({

name,
phone,
district,
services,
description,
active:true

})
);


alert(
"Hizmet sağlayıcı profilin kaydedildi."
);

showHome();

}


/* =========================================================
   BAŞLANGIÇ
   ========================================================= */

showHome();

</script>

</body>
</html>
