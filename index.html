/* =========================================================
   LOCAL STORAGE
   ========================================================= */

const KEYS={

 requests:"isimi_coz_requests_v5",

 provider:"isimi_coz_provider_v5",

 providerLogged:"isimi_coz_provider_logged_v5"

};


/* =========================================================
   LOCAL STORAGE
   ========================================================= */

function read(key,fallback){

 try{

  const raw=
   localStorage.getItem(key);

  return raw
   ? JSON.parse(raw)
   : fallback;

 }catch(e){

  return fallback;

 }

}


function write(key,value){

 try{

  localStorage.setItem(
   key,
   JSON.stringify(value)
  );

 }catch(e){

  console.warn(
   "LocalStorage yazma hatası",
   e
  );

 }

}


function getRequests(){

 return read(
  KEYS.requests,
  []
 );

}


function getProvider(){

 return read(
  KEYS.provider,
  null
 );

}


function providerLogged(){

 return read(
  KEYS.providerLogged,
  false
 );

}


/* =========================================================
   YARDIMCI
   ========================================================= */

function escapeHTML(value){

 return String(value ?? "")

  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


function normalize(value){

 return String(value ?? "")
  .trim()
  .toLocaleLowerCase("tr-TR")
  .normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"");

}


function uid(prefix){

 return prefix+"-"+

 Date.now().toString(36).toUpperCase()+"-"+

 Math.random()
  .toString(36)
  .slice(2,7)
  .toUpperCase();

}

 [

 ].forEach(id=>{

  const el=
   document.getElementById(id);

  if(el){

   el.classList.remove(
    "active"
   );

  }

 });

 if(active){

  const el=
   document.getElementById(active);

  if(el){

   el.classList.add(
    "active"
   );

  }

 }

}

/* =========================================================

   ========================================================= */

function setConnection(
 online,
 text
){

  document.getElementById(
   "connectionStatus"

 if(!el)return;

 el.className=
  "connection "+
  (
   online
   ?

  text ||
  (
   online
   ?
   "Supabase bağlı ✓"
   :
   "Yerel mod"
  );

}


/* =========================================================
   SUPABASE REST
   ========================================================= */

async function supabaseRequest(
 method,
 path,
 body=null
){

 const options={

  method,

  headers:{
   "apikey":SUPABASE_KEY,
   "Authorization":
    "Bearer "+SUPABASE_KEY,
   "Content-Type":
    "application/json",
   "Accept":
    "application/json",
   "Prefer":
    "return=representation"
  }

 };

 if(body!==null){

  options.body=
   JSON.stringify(body);

 }

 const response=
  await fetch(
   SUPABASE_URL+
   "/rest/v1/"+
   path,
   options
  );

 const text=
  await response.text();

 let data=null;

 try{

  data=
   text
   ?
   JSON.parse(text)
   :
   null;

 }catch(e){

  data=text;

 }

 if(!response.ok){

  throw new Error(
   data?.message ||
   data?.details ||
   data?.hint ||
   "Supabase işlemi başarısız."
  );

 }

 return data;

}

/* =========================================================

   ========================================================= */

function serviceOptions(
 selected=""
){

  `<option value="">

  Object.entries(
   SERVICES
  )

  .map(
   ([key,s])=>`

      :
      ""
     }
    >
     ${s.emoji} ${s.name}
    </option>

   `
  )

  .join("")

 );

}


function districtOptions(
 selected=""
){

 const unique=
  [...new Set(DISTRICTS)];

 return (

  `<option value="">
    İlçe seç
   </option>`

  +

  unique

  .map(
   d=>`

    <option
     value="${escapeHTML(d)}"
     ${
      normalize(d)===
      normalize(selected)
      ?
      "selected"
      :
      ""
     }
    >
     ${escapeHTML(d)}
    </option>

   `
  )

  .join("")

 );

}


/* =========================================================
   TALEP NUMARASI
   ========================================================= */

function makeRequestNumber(){

 const date=
  new Date();

 const y=
  date.getFullYear();

 const m=
  String(
   date.getMonth()+1
  ).padStart(2,"0");

 const d=
  String(
   date.getDate()
  ).padStart(2,"0");

 const random=
  Math.floor(
   1000+
   Math.random()*9000
  );

 return (
  `IC-${y}${m}${d}-${random}`
 );

}


/* =========================================================
   KATEGORİYİ ÇÖZ
   ========================================================= */

function resolveServiceKey(r){

 let raw=
  r?.kategori ??
  r?.category ??
  r?.service ??
  "";

 raw=
  String(raw).trim();

 if(
  SERVICES[raw]
 ){

  return raw;

 }

 const normalized=
  normalize(raw);

 for(
  const [key,s]
  of Object.entries(SERVICES)
 ){

  if(
   normalize(key)===
   normalized
  ){

   return key;

  }

  if(
   normalize(s.name)===
   normalized
  ){

   return key;

  }

 }

 return raw;

}


/* =========================================================
   TALEP MAPPING
   ========================================================= */

}


/* =========================================================
   TALEPLERİ SUPABASE'DEN ÇEK
   ========================================================= */

async function loadRequestsFromSupabase(){

 try{

  const data=
   await supabaseRequest(
    "GET",
    "talepler?select=*&limit=100"
   );

  if(
   Array.isArray(data)
  ){

   const mapped=
    data.map(
     mapSupabaseRequest
    );

   /*
    En önemli nokta:
    Supabase'teki gerçek kayıtları
    yerel listeye aktar.
   */

   write(
    KEYS.requests,
    mapped
   );

   setConnection(
    true,
    "Supabase bağlı ✓"
   );

   return mapped;

  }

 }catch(error){

  console.warn(
   "Supabase talepleri alınamadı:",
   error
  );

 }

 return getRequests();

}

/* =========================================================
   TELEFON NORMALİZE
   ========================================================= */

function normalizePhone(
 phone
){

 let value=
  String(phone ?? "")
  .trim();

 value=
  value.replace(
   /[^0-9+]/g,
   ""
  );

 if(
  value.startsWith("0")
 ){

  return value;

 }

 if(
  value.startsWith("90")
 ){

  return "0"+
   value.slice(2);

 }

 if(
  value.startsWith("+90")
 ){

  return "0"+
   value.slice(3);

 }

 return value;

}

/* =========================================================
   SAĞLAYICI TALEP EŞLEŞTİRME
   ========================================================= */

function requestMatchesProvider(
 request,
 provider
){

 if(
  !provider ||
  !provider.active
 ){

  return false;

 }


 const requestService=
  resolveServiceKey(
   request
  );


 const providerServices=
  provider.services ||
  [];


 const serviceMatch=
  providerServices.some(
   service=>{

    const providerKey=
     resolveServiceKey({
      service
     });

    return (
     normalize(providerKey)===
     normalize(requestService)
    );

   }
  );


 if(!serviceMatch){

  return false;

 }


 const requestDistrict=
  request.ilce ||
  request.district ||
  "";


 const providerDistrict=
  provider.district ||
  "";


 const districtMatch=
  normalize(
   requestDistrict
  )===
  normalize(
   providerDistrict
  );


 return districtMatch;

}

    ⚙️ Hizmet Durumu
   </h2>


   <div class="${
    p.active
    ?
    "success"
    :
    "warning"
   }">

    ${
     p.active
     ?
     "Aktifsin. Bölgen ve hizmet kategorilerinle eşleşen talepleri görebilirsin."
     :
     "Şu anda pasifsin. Talepleri görmek için aktif ol."
    }

   </div>

   <br>

   <button
    class="btn ${
     p.active
     ?
     "danger"
     :
     "primary"
    }"
    onclick="toggleProviderStatus()"
   >

    ${
     p.active
     ?
     "🔴 PASİF YAP"
     :
     "🟢 AKTİF YAP"
    }

   </button>

  </div>


  <div class="section">

   <div class="sectionTitle">

    <h2>
     📋 Sana Uygun Talepler
    </h2>

    <span class="small muted">
     ${suitable.length} kayıt
    </span>

   </div>


   ${
    p.active

    ?

    (
     suitable.length

     ?

     suitable
      .map(
       renderProviderRequest
      )
      .join("")

     :

     `
      <div class="card empty">

       <div style="font-size:34px">
        🔎
       </div>

       <h3>
        Şimdilik uygun talep yok.
       </h3>

       <p>
        Bölgen ve kategorilerinle
        eşleşen yeni talepler
        burada görünecek.
       </p>

      </div>
     `
    )

    :

    `
     <div class="card empty">

      Hizmet durumunu aktif yaptığında
      uygun talepler burada görünecek.

     </div>
    `
   }

  </div>


  <div class="section">

   <button
    class="btn danger"
    onclick="providerLogout()"
   >
    HİZMET SAĞLAYICI PANELİNDEN ÇIK
   </button>

  </div>

 `);

}


/* =========================================================
   SAĞLAYICI TALEP KARTI
   ========================================================= */

function renderProviderRequest(r){

 const serviceKey=
  resolveServiceKey(r);

 const s=
  SERVICES[serviceKey] ||
  {
   name:
    r.kategori ||
    "Hizmet",
   emoji:"🛠️"
  };


 const phone=
  normalizePhone(
   r.telefon ||
   r.phone ||
   ""
  );


 return `

  <article class="request">

   <div class="requestTop">

    <div>

     <h3>
      ${s.emoji}
      ${escapeHTML(
       s.name
      )}
     </h3>

     <div class="small muted">
      ${escapeHTML(
       r.talep_no ||
       r.id ||
       ""
      )}
     </div>

    </div>

    <span class="status">
     ${escapeHTML(
      r.aciliyet ||
      r.urgency ||
      "Beklemede"
     )}
    </span>

   </div>


   <div class="description">

    ${escapeHTML(
     r.aciklama ||
     r.description ||
     ""
    )}

   </div>


   <div class="meta">

    <span>
     📍 ${escapeHTML(
      r.il ||
      "İzmir"
     )}
    </span>

    <span>
     🏘️ ${escapeHTML(
      r.ilce ||
      r.district ||
      ""
     )}
    </span>

    ${
     r.mahalle ||
     r.neighborhood
     ?
     `
      <span>
       🏠 ${escapeHTML(
        r.mahalle ||
        r.neighborhood
       )}
      </span>
     `
     :
     ""
    }

   </div>


   <div class="contactBox">

    <div class="small muted">
     Müşteri
    </div>

    <strong>
     ${escapeHTML(
      r.ad_soyad ||
      r.name ||
      ""
     )}
    </strong>

    <br><br>

    <div class="small muted">
     Telefon
    </div>

    <div class="phoneNumber">

     ${escapeHTML(
      phone ||
      "Telefon bulunamadı"
     )}

    </div>

   </div>


   <div class="small muted"
        style="margin-top:12px">

    Talep No:
    <strong>
     ${escapeHTML(
      r.talep_no ||
      r.id ||
      ""
     )}
    </strong>

   </div>


   <br>


   ${
    phone

    ?

    `
     <button
      class="btn primary"
      onclick="
       callCustomer('${escapeHTML(
        phone
       )}')
      "
     >
      📞 MÜŞTERİYLE İLETİŞİME GEÇ
     </button>
    `

    :

    `
     <button
      class="btn secondary"
      disabled
     >
      📞 TELEFON NUMARASI YOK
     </button>
    `
   }

  </article>

 `;

}


/* =========================================================
   SAĞLAYICI DURUMU
   ========================================================= */

function toggleProviderStatus(){

 const p=
  getProvider();

 if(!p)return;

 p.active=
  !p.active;

 p.updatedAt=
  new Date().toISOString();

 write(
  KEYS.provider,
  p
 );

 showProviderPanel();

}


/* =========================================================
   BAŞLAT
   ========================================================= */

async function startApp(){

 setConnection(
  false,
  "Supabase bağlanıyor..."
 );

 showHome();

 await testSupabase();

}


startApp();

</script>

</body>
</html>
