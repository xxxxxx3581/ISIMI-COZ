async function supabaseRequest(method,path,body=null){
 const o={method,headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Accept":"application/json","Prefer":"return=representation"}};
 if(body!==null)o.body=JSON.stringify(body);
 const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,o);
 const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){d=t}
 if(!r.ok)throw new Error(d?.message||d?.details||d?.hint||"Supabase işlemi başarısız.");
 return d;
}

async function supabaseAuthRequest(method,path,body=null){
 const session=getAuthSession();
 const token=session?.access_token;
 if(!token)throw new Error("Bu işlem dosyasını kaydetmek için önce giriş yapmalısınız.");
 const o={method,headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+token,"Content-Type":"application/json","Accept":"application/json","Prefer":"return=representation"}};
 if(body!==null)o.body=JSON.stringify(body);
 const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,o);
 const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){d=t}
 if(!r.ok)throw new Error(d?.message||d?.details||d?.hint||"Yetkili Supabase işlemi başarısız.");
 return d;
}
async function supabaseWrite(method,path,body,opts){
  opts=opts||{};
  const session=getAuthSession();
  const requireAuth=opts.requireAuth!==false; // default true for writes
  const token=(session&&session.access_token)?session.access_token:null;
  if(requireAuth&&!token){
    throw new Error('Bu işlem için giriş yapmalısınız. Çıkış yapıp tekrar giriş deneyin.');
  }
  const authToken=token||SUPABASE_KEY;
  const o={
    method:method,
    headers:{
      "apikey":SUPABASE_KEY,
      "Authorization":"Bearer "+authToken,
      "Content-Type":"application/json",
      "Accept":"application/json",
      "Prefer":"return=representation"
    }
  };
  if(body!==null&&body!==undefined)o.body=JSON.stringify(body);
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,o);
  const txt=await r.text();
  let d=null;try{d=txt?JSON.parse(txt):null;}catch(e){d=txt;}
  if(!r.ok){
    const msg=(d&&(d.message||d.details||d.hint))||("Supabase "+method+" başarısız ("+r.status+")");
    throw new Error(msg);
  }
  // Critical: HTTP 200 + [] means RLS blocked or no matching row — NOT success
  if((method==="PATCH"||method==="DELETE"||method==="POST")&&Array.isArray(d)&&d.length===0){
    throw new Error("Kayıt yazılamadı (0 satır). Oturum eşleşmiyor veya RLS UPDATE engelliyor. Talebin user_id alanının sizin hesabınıza ait olduğundan emin olun.");
  }
  return d;
}



function normalize(v){
 return String(v??"").trim().toLowerCase()
 .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
 .replace(/ı/g,"i").replace(/İ/g,"i");
}
function pick(o,names,def=""){for(const n of names){if(o&&o[n]!==undefined&&o[n]!==null)return o[n]}return def}
function serviceKeyFromValue(v){
 const x=normalize(v);
 for(const [k,s] of Object.entries(SERVICES)){
  if(x===normalize(k)||x===normalize(s.name))return k;
 }
 return String(v??"").trim();
}

async function loadRequestsFromSupabase(opts={}){
 const mineOnly=!!opts.mineOnly;
 try{
  let path="requests?select=*&order=created_at.desc&limit=200";
  if(mineOnly){
   const session=getAuthSession();
   const uid=session?.user?.id;
   if(!uid){
    // Giriş yok: sunucudan kişisel talep çekme; yalnızca cihazdaki kendi yedekleri (user_id yok/local)
    return getRequests().filter(r=>!r.user_id);
   }
   // Kendi kayıtları: user_id (tercih) — kolon yoksa sorgu hata verir, catch local fallback
   path="requests?select=*&user_id=eq."+encodeURIComponent(uid)+"&order=created_at.desc&limit=200";
  }
  const data=await supabaseRequest("GET",path);
  if(Array.isArray(data)){
   let mapped=data.map(function(row){return applyLocalJobState(mapRequest(row));});
   if(mineOnly){
    const session=getAuthSession();
    const uid=session?.user?.id;
    if(uid)mapped=mapped.filter(r=>!r.user_id||r.user_id===uid);
    write(KEYS.requests,mapped);
   }else{
    // Sağlayıcı eşleştirme için gelen liste — RLS asıl koruma; istemci yine de saklar
    write(KEYS.requests,mapped);
   }
   setConnection(true,"SB");
   return mapped;
  }
 }catch(e){
  console.warn("Talepler alınamadı:",e);
  if(mineOnly){
   const session=getAuthSession();
   const uid=session?.user?.id;
   if(!uid)return getRequests().filter(r=>!r.user_id);
   return getRequests().filter(r=>!r.user_id||r.user_id===uid);
  }
 }
 return mineOnly?[]:getRequests();
}


function getLocalJobState(){
  try{return JSON.parse(localStorage.getItem('isimi_coz_job_state')||'{}')||{};}catch(e){return {};}
}
function setLocalJobState(requestId,talepNo,patch){
  if(!requestId&&!talepNo)return;
  const all=getLocalJobState();
  const key=String(requestId||talepNo);
  const prev=all[key]||{};
  all[key]=Object.assign({},prev,patch||{},{requestId:requestId||prev.requestId||null,talepNo:talepNo||prev.talepNo||null,updatedAt:Date.now()});
  // also index by talep_no
  if(talepNo)all[String(talepNo)]=all[key];
  if(requestId)all[String(requestId)]=all[key];
  try{localStorage.setItem('isimi_coz_job_state',JSON.stringify(all));}catch(e){}
}
function readLocalJobState(requestId,talepNo){
  const all=getLocalJobState();
  return all[String(requestId||'') ]||all[String(talepNo||'') ]||null;
}
function applyLocalJobState(r){
  if(!r)return r;
  const loc=readLocalJobState(r.id,r.talep_no);
  if(!loc||!loc.status)return r;
  // Local wins for pilot when server still pending but user already accepted/completed in UI
  const server=String(r.status||r.durum||'').toLowerCase();
  const local=String(loc.status||'').toLowerCase();
  if(local==='completed'||local==='tamamlandı'||local.indexOf('tamam')>=0){
    r.status='Tamamlandı';r.durum='Tamamlandı';r._localJob=true;
  }else if(local==='accepted'||local==='devam ediyor'||local.indexOf('devam')>=0){
    if(server.indexOf('tamam')<0&&server!=='completed'){
      r.status='Devam ediyor';r.durum='Devam ediyor';r._localJob=true;
    }
  }
  if(loc.acceptedOfferId)r._acceptedOfferId=loc.acceptedOfferId;
  return r;
}

function statusToUI(st){
  const s=String(st||'pending').toLowerCase();
  if(s==='pending')return 'Beklemede';
  if(s==='accepted')return 'Devam ediyor';
  if(s==='completed')return 'Tamamlandı';
  if(s==='cancelled'||s==='canceled')return 'İptal';
  return st||'Beklemede';
}
function statusToDB(st){
  const s=String(st||'').toLowerCase();
  if(s.indexOf('bekle')>=0||s==='pending')return 'pending';
  if(s.indexOf('devam')>=0||s==='accepted')return 'accepted';
  if(s.indexOf('tamam')>=0||s==='completed')return 'completed';
  if(s.indexOf('iptal')>=0)return 'cancelled';
  return 'pending';
}
function encodeRequestDescription(talepNo,name,phone,city,text){
  return '§'+String(talepNo||'')+'§'+String(name||'')+'§'+String(phone||'')+'§'+String(city||'İzmir')+'§\n'+String(text||'');
}
function parseRequestDescription(raw){
  const s=String(raw||'');
  if(s.charAt(0)==='§'){
    const parts=s.split('§');
    if(parts.length>=6){
      return {talep_no:parts[1],ad_soyad:parts[2],telefon:parts[3],il:parts[4],aciklama:parts.slice(5).join('§').replace(/^\n/,'').trim()};
    }
  }
  return {talep_no:'',ad_soyad:'',telefon:'',il:'İzmir',aciklama:s};
}

function mapRequest(r){
 if(r&&(r.category_id!=null||(r.district!=null&&r.description!=null&&r.kategori==null))){
  const meta=parseRequestDescription(r.description);
  const kategori=r.category_id||'';
  const ui=statusToUI(r.status);
  return {
   id:r.id||'',
   talep_no:meta.talep_no||String(r.id||'').slice(0,8),
   service:serviceKeyFromValue(kategori),kategori:kategori,
   description:meta.aciklama||'',aciklama:meta.aciklama||'',
   il:meta.il||'İzmir',district:r.district||'',ilce:r.district||'',
   neighborhood:r.neighborhood||'',mahalle:r.neighborhood||'',
   urgency:r.urgency||'',aciliyet:r.urgency||'',
   name:meta.ad_soyad||'',ad_soyad:meta.ad_soyad||'',
   phone:meta.telefon||'',telefon:meta.telefon||'',
   status:ui,durum:ui,createdAt:r.created_at||'',user_id:r.user_id||null,_table:'requests'
  };
 }
 const kategori=pick(r,["kategori","category","service"],"");
 return {
  id:pick(r,["id"],""),
  talep_no:pick(r,["talep_no","request_no"],""),
  service:serviceKeyFromValue(kategori),kategori:kategori,
  description:pick(r,["aciklama","description"],""),aciklama:pick(r,["aciklama","description"],""),
  il:pick(r,["il","city"],"İzmir"),district:pick(r,["ilce","district"],""),ilce:pick(r,["ilce","district"],""),
  neighborhood:pick(r,["mahalle","neighborhood"],""),mahalle:pick(r,["mahalle","neighborhood"],""),
  urgency:pick(r,["aciliyet","urgency"],""),aciliyet:pick(r,["aciliyet","urgency"],""),
  name:pick(r,["ad_soyad","name"],""),ad_soyad:pick(r,["ad_soyad","name"],""),
  phone:pick(r,["telefon","phone"],""),telefon:pick(r,["telefon","phone"],""),
  status:pick(r,["durum","status"],"Beklemede"),durum:pick(r,["durum","status"],"Beklemede"),
  createdAt:pick(r,["olusturulma_tarihi","tarih","created_at","createdAt"],""),
  user_id:pick(r,["user_id","owner_id"],null),_table:'talepler'
 };
}

function mapProvider(r){

 };

function categoryValueFromRow(row,categories){
 const raw=pick(row,["category_id","kategori_id","category","kategori"],"");
 if(!raw)return "";
 const c=categories.find(x=>String(x.id)===String(raw));
 if(c)return pick(c,["name","name_tr","ad","kategori"],raw);
 return raw;
}

async function enrichProviders(providers){
 const [cats,links]=await Promise.all([loadCategories(),loadProviderCategories()]);
 const byId={};
 providers.forEach(p=>byId[String(p.id)]=p);

 links.forEach(link=>{
  const pid=pick(link,["provider_id","providers_id","provider"],"");
  const val=categoryValueFromRow(link,cats);
  if(byId[String(pid)]&&val)byId[String(pid)].services.push(serviceKeyFromValue(val));
 });

 providers.forEach(p=>{
  const direct=p.category;
  if(direct&&!p.services.length)p.services=[serviceKeyFromValue(direct)];
  p.services=[...new Set(p.services.filter(Boolean))];
 });
 return providers;
}

function providerMatchesRequest(p,r){
 if(!p.active)return false;
 const ps=(p.services||[]).map(serviceKeyFromValue);
 const rk=serviceKeyFromValue(r.kategori||r.service);
 const district=normalize(p.district),rd=normalize(r.ilce||r.district);
 const city=normalize(p.city),rc=normalize(r.il||"İzmir");
 const categoryOK=ps.length?ps.includes(rk):true;
 const districtOK=district?district===rd:true;
 const cityOK=!city||!rc||city===rc||city==="izmir";
 return categoryOK&&districtOK&&cityOK;
}

      if(g&&g.data&&(g.data.gmTitle||g.data.gmDistrict||g.data.gmCategory)){
        var glabel=g.data.gmTitle||g.data.gmDistrict||'Gayrimenkul ilanı';
        bits.push('<button type="button" class="homeContinue" onclick="resumeGmListingDraft()"><span><b>🏠 '+String(glabel).replace(/[<>]/g,'')+'</b><small>Yarım kalan ilana devam et</small></span><span class="chev">›</span></button>');
      }
    }
  }catch(e){}
  return bits.join('');
}
function clearGmListingFormDraft(){
  try{ localStorage.removeItem('gm_listing_form_draft'); }catch(e){}
  try{ window.__gmFormDraft=null; }catch(e){}
}
function resumeGmListingDraft(){
  try{
    var raw=localStorage.getItem('gm_listing_form_draft');
    if(!raw){ return showGayrimenkulCreateForm(); }
    var g=JSON.parse(raw);
    window.__gmFormDraft=Object.assign({}, g.data||{}, {_files:[]});
    window.__gmRestoreForm=true;
    showGayrimenkulCreateForm();
  }catch(e){ showGayrimenkulCreateForm(); }
}
function resumeOtoListingDraft(){
  try{
    var raw=localStorage.getItem('oto_listing_draft');
    if(!raw){ return startOtomobilWizard(); }
    var d=JSON.parse(raw);
    __otoW={step:Math.min(7, Number(d.step)||0), data:Object.assign({currency:'TRY',city:'İzmir',seller_type:'individual',vehicle_type:'Otomobil'}, d.data||{}), files:[]};
    renderOtomobilWizard();
  }catch(e){ startOtomobilWizard(); }
}
function otoBuildAiDescription(){
  otoSaveStepFields();
  const d=__otoW.data||{};
  const parts=[];
  if(d.year||d.brand||d.model) parts.push([d.year,d.brand,d.model,d.version].filter(Boolean).join(' '));
  if(d.km!==''&&d.km!=null) parts.push(Number(d.km).toLocaleString('tr-TR')+' km');
  if(d.fuel) parts.push(d.fuel);
  if(d.gear) parts.push(d.gear);
  if(d.body) parts.push(d.body);
  if(d.color) parts.push(d.color);
  if(d.engine_cc) parts.push(d.engine_cc+(String(d.engine_cc).match(/\d/)? ' cc':''));
  if(d.power_hp) parts.push(d.power_hp+(String(d.power_hp).match(/\d/)? ' HP':''));
  if(d.condition) parts.push(d.condition);
  if(d.city||d.district) parts.push([d.city,d.district].filter(Boolean).join(' / '));
  const facts=parts.filter(Boolean);
  if(!facts.length){ alert('Önce araç bilgilerini doldur.'); return; }
  const title=((d.brand||'')+' '+(d.model||'')+' '+(d.year||'')).trim();
  const desc='Satılık '+facts.join(' · ')+'. İlanda belirtilen bilgiler satıcı beyanına aittir. Detay ve ekspertiz için iletişime geçebilirsiniz.';
  const ti=document.getElementById('otoTitle');
  const te=document.getElementById('otoDesc');
  if(ti&&!ti.value.trim()) ti.value=title;
  if(te) te.value=desc;
  d.title=ti?ti.value:title;
  d.description=te?te.value:desc;
}
function otoPreviewChecklistHtml(d){
  d=d||{};
  const items=[
    ['Marka', !!d.brand],
    ['Model', !!d.model],
    ['Yıl', !!d.year],
    ['Kilometre', d.km!==''&&d.km!=null],
    ['Fiyat', d.price!==''&&d.price!=null],
    ['Fotoğraf', !!(__otoW.files&&__otoW.files.length)],
    ['Başlık', !!d.title],
    ['Açıklama', !!d.description]
  ];
  const miss=items.filter(function(x){return !x[1];}).map(function(x){return x[0];});
  let h='<ul class="otoCheckList">';
  items.forEach(function(x){ h+='<li class="'+(x[1]?'ok':'')+'">'+(x[1]?'✓ ':'○ ')+x[0]+'</li>'; });
  h+='</ul>';
  if(miss.length) h+='<p class="small muted">⚠️ Eksik: '+miss.join(', ')+'. Zorunlu olanları tamamlamadan kayıt sınırlı kalabilir.</p>';
  return h;
}

}

function openHallet(){
  try{
    if(window.Hallet && typeof window.Hallet.showGate === "function"){
      window.Hallet.showGate();
      return;
    }
    console.error("İşini Hallet modülü yüklenemedi.");
    alert("İşini Hallet modülü şu anda yüklenemedi. Lütfen sayfayı yenileyin.");
  }catch(error){
    console.error("İşini Hallet açılış hatası:",error);
    alert("İşini Hallet açılırken bir hata oluştu. Lütfen sayfayı yenileyin.");
  }
}
function openHalletAction(fnName){
  try{
    if(window.Hallet && typeof window.Hallet[fnName] === "function"){
      window.Hallet[fnName]();
      return;
    }
    openHallet();
  }catch(error){
    console.error("İşini Hallet aksiyon hatası:",error);
    openHallet();
  }

async function kesfetEnsureCache(kind, force){
  if(kind==='gayrimenkul'){
    if(force||!__listingCache.gayrimenkul.length){
      const path="listings?listing_type=eq.gayrimenkul&status=eq.published&order=created_at.desc&select=id,title,price,currency,city,district,neighborhood,category,description,status,created_at,metadata";
      const rows=await supabaseRequest('GET', path);
      __listingCache.gayrimenkul=Array.isArray(rows)?rows:[];
    }
  } else if(kind==='otomobil'){
    if(force||!__listingCache.otomobil.length){
      const path="listings?listing_type=eq.otomobil&status=eq.published&order=created_at.desc&select=id,title,price,currency,city,district,category,description,metadata,created_at";
      const rows=await supabaseRequest('GET', path);
      __listingCache.otomobil=Array.isArray(rows)?rows:[];
    }
  }
}

function kesfetBuildList(keepCache){
  // returns Promise of {list:[{row,type}], typeForFilter}
  const cat=window.__kesfetCat||'all';
  return (async function(){
    if(cat==='konut'||cat==='arsa'||cat==='isyeri'||cat==='gayrimenkul'){
      await kesfetEnsureCache('gayrimenkul', !keepCache);
      const st=getListingFilterState('gayrimenkul')||{};
      if(cat==='konut') st.category='Konut';
      else if(cat==='arsa') st.category='Arsa';
      else if(cat==='isyeri') st.category='İş Yeri';
      const list=applyListingFiltersLocal('gayrimenkul', __listingCache.gayrimenkul).map(function(r){ return {row:r, type:'gayrimenkul'}; });
      return {list:list, filterType:'gayrimenkul'};
    }
    if(cat==='otomobil'){
      await kesfetEnsureCache('otomobil', !keepCache);
      const list=applyListingFiltersLocal('otomobil', __listingCache.otomobil).map(function(r){ return {row:r, type:'otomobil'}; });
      return {list:list, filterType:'otomobil'};
    }
    // Tümü: her iki cache, kendi filtreleriyle, birleşik sort
    await kesfetEnsureCache('gayrimenkul', !keepCache);
    await kesfetEnsureCache('otomobil', !keepCache);
    const gm=applyListingFiltersLocal('gayrimenkul', __listingCache.gayrimenkul).map(function(r){ return {row:r, type:'gayrimenkul'}; });
    const ot=applyListingFiltersLocal('otomobil', __listingCache.otomobil).map(function(r){ return {row:r, type:'otomobil'}; });
    let list=gm.concat(ot);
    const sort=(getListingFilterState('gayrimenkul').sort)||(getListingFilterState('otomobil').sort)||'new';
    list.sort(function(a,b){
      const pa=a.row, pb=b.row;
      if(sort==='price_asc') return (Number(pa.price)||0)-(Number(pb.price)||0);
      if(sort==='price_desc') return (Number(pb.price)||0)-(Number(pa.price)||0);
      if(sort==='km_asc'){
        const ka=Number((pa.metadata||{}).km); const kb=Number((pb.metadata||{}).km);
        return (isFinite(ka)?ka:1e15)-(isFinite(kb)?kb:1e15);
      }
      return String(pb.created_at||'').localeCompare(String(pa.created_at||''));
    });
    return {list:list, filterType:'gayrimenkul'};
  })();
}

function kesfetAppliedChipDefs(type){
  const f=getListingFilterState(type)||{};
  const chips=[];
  function add(key, label){
    if(label==null||label===''||label===false) return;
    chips.push({key:key, label:String(label)});
  }
  if(f.q) add('q', '🔎 '+f.q);
  if(f.city) add('city', f.city);
  if(f.district) add('district', f.district);
  if(f.neighborhood) add('neighborhood', f.neighborhood);
  if(f.brand) add('brand', f.brand);
  if(f.model) add('model', f.model);
  if(f.body) add('body', f.body);
  if(f.fuel) add('fuel', f.fuel);
  if(f.gear) add('gear', f.gear);
  if(f.drive) add('drive', f.drive);
  if(f.seller_type==='professional') add('seller_type', 'Profesyonel');
  if(f.seller_type==='individual') add('seller_type', 'Bireysel');
  if(f.category) add('category', f.category);
  if(f.rooms) add('rooms', f.rooms);
  if(f.zoning) add('zoning', f.zoning);
  if(f.minPrice||f.maxPrice){
    const a=f.minPrice?Number(f.minPrice).toLocaleString('tr-TR'):'…';
    const b=f.maxPrice?Number(f.maxPrice).toLocaleString('tr-TR'):'…';
    add('price', a+' – '+b+' TL');
  }
  if(f.minKm||f.maxKm){
    const a=f.minKm?Number(f.minKm).toLocaleString('tr-TR'):'…';
    const b=f.maxKm?Number(f.maxKm).toLocaleString('tr-TR'):'…';
    add('km', a+' – '+b+' km');
  }
  if(f.minYear||f.maxYear) add('year', (f.minYear||'…')+' – '+(f.maxYear||'…'));
  if(f.minSqm||f.maxSqm) add('sqm', (f.minSqm||'…')+' – '+(f.maxSqm||'…')+' m²');
  return chips;
}
function kesfetAppliedChipsHtml(type){
  const chips=kesfetAppliedChipDefs(type);
  if(!chips.length) return '';
  let h='<div class="kesfetApplied" id="kesfetApplied">';
  chips.forEach(function(c){
    h+='<button type="button" class="kesfetChipX" data-fk="'+escapeHTML(c.key)+'">'+escapeHTML(c.label)+' ×</button>';
  });
  h+='<button type="button" class="kesfetChipClear" data-clear="1">Temizle</button>';
  h+='</div>';
  return h;
}
function kesfetBindAppliedChips(type){
  const root=document.getElementById('kesfetApplied');
  if(!root) return;
  root.querySelectorAll('.kesfetChipX').forEach(function(btn){
    btn.onclick=function(){ kesfetRemoveFilterKey(type, btn.getAttribute('data-fk')||''); };
  });
  const clr=root.querySelector('[data-clear]');

function kesfetRemoveFilterKey(type, key){
  const st=getListingFilterState(type);
  if(!st) return;
  if(key==='price'){ st.minPrice=''; st.maxPrice=''; }
  else if(key==='km'){ st.minKm=''; st.maxKm=''; }
  else if(key==='year'){ st.minYear=''; st.maxYear=''; }
  else if(key==='sqm'){ st.minSqm=''; st.maxSqm=''; }
  else st[key]='';
  if(window.__kesfetUnified && typeof showKesfet==='function') showKesfet(true);
  else if(type==='otomobil'&&typeof showOtomobilBrowse==='function') showOtomobilBrowse(true);

function myListingStatusMeta(status){
  const s=String(status||'draft').toLowerCase();
  if(s==='published') return {label:'Yayında', emoji:'🟢', key:'published'};
  if(s==='passive'||s==='paused') return {label:'Pasif', emoji:'⏸️', key:'passive'};
  if(s==='sold') return {label:'Satıldı', emoji:'🏷️', key:'sold'};
  if(s==='rented') return {label:'Kiralandı', emoji:'🏷️', key:'rented'};
  if(s==='archived') return {label:'Arşiv', emoji:'🗄️', key:'archived'};
  return {label:'Taslak', emoji:'📝', key:'draft'};
}
function myListingMissingHints(row){
  const miss=[];
  if(!row) return miss;
  if(!(row.title||'').trim()) miss.push('Başlık');
  const photos=typeof listingPhotosFromRow==='function'?listingPhotosFromRow(row):[];
  if(!photos.length) miss.push('Fotoğraf');
  if(row.listing_type==='otomobil'){
    const m=row.metadata||{};
    if(!(m.brand||'').toString().trim()) miss.push('Marka');
    if(!(m.model||'').toString().trim()) miss.push('Model');
  }else{
    if(!(row.city||'').trim()) miss.push('İl');
    if(!(row.district||'').trim()) miss.push('İlçe');
  }
  return miss;
}
function myListingTxnHint(row){
  /* İşlem durumu — ilan statusünden ayrı; V0'da metadata/cases yoksa varsayılan metin */
  const st=myListingStatusMeta(row&&row.status);
  if(st.key==='draft') return {emoji:'📋', label:'İlan tamamlanmadı'};
  if(st.key==='passive') return {emoji:'📋', label:'İşlem beklemede'};
  if(st.key==='published') return {emoji:'📋', label:'Satış hazırlığı başlamadı'};
  return {emoji:'📋', label:'İşlem başlamadı'};
}
function myListingNextStep(row){
  const st=myListingStatusMeta(row.status);
  const id=String(row.id||'').replace(/[^a-zA-Z0-9-]/g,'');
  const type=row.listing_type==='otomobil'?'otomobil':'gayrimenkul';
  const miss=myListingMissingHints(row);
  const viewOn=type==='otomobil'
    ? "typeof showOtomobilDetail==='function'&&showOtomobilDetail('"+id+"')"
    : "typeof showGayrimenkulDetail==='function'&&showGayrimenkulDetail('"+id+"')";
  const prepOn="typeof openOfficialPrepGate==='function'&&openOfficialPrepGate('"+id+"','"+(type==='otomobil'?'arac_satisi':'konut_satisi')+"')";
  const draftOn="typeof openMyListingDraft==='function'&&openMyListingDraft('"+id+"','"+type+"')";
  const repubOn="typeof republishMyListing==='function'&&republishMyListing('"+id+"','"+type+"')";
  let more=[];
  if(st.key==='published'){
    const primary=type==='otomobil'
      ? {hint:'Satış / devir hazırlığına geçebilirsin.', label:'Satış / devir hazırlığı', onclick:prepOn}
      : {hint:'Tapu ve evrak hazırlığına geçebilirsin.', label:'Satışa hazırlan', onclick:prepOn};
    more=[
      {label:'İlanı görüntüle', onclick:viewOn},
      {label:'Resmî evrak kapısı', onclick:prepOn}
    ];
    return Object.assign({more:more}, primary);
  }
  if(st.key==='passive'){
    return {
      hint:'İlan yayında değil. Tekrar yayınlayabilirsin.',
      label:'Tekrar yayınla',
      onclick:repubOn,
      more:[{label:'İlan özeti', onclick:draftOn}]
    };
  }
  /* draft */
  return {
    hint: miss.length?(miss.length+' bilgi eksik — tamamla ve yayınla.'):'Taslak hazır görünüyor; yayınlayabilirsin.',
    label: miss.length?'Eksikleri tamamla':'Taslağı gör / yayınla',
    onclick:draftOn,
    more:[]
  };
}
function myListingPrimaryAction(row){
  /* Geriye uyumluluk */
  const n=myListingNextStep(row);
  return {label:n.label, onclick:n.onclick};
}

function formatListingPrice(price, currency){
  if(price===null||price===undefined||price==='') return 'Fiyat belirtilmedi';
  const n=Number(price);
  if(!isFinite(n)) return 'Fiyat belirtilmedi';
  try{
    return new Intl.NumberFormat('tr-TR').format(n)+' '+(currency||'TRY');
  }catch(e){
    return n+' '+(currency||'TRY');
  }
}

async function uploadListingPhoto(ownerId, listingId, file, token){
  if(!file||!token)throw new Error('Fotoğraf yükleme için giriş gerekli.');
  if(!(file.type&&file.type.indexOf('image/')===0))throw new Error('Sadece görsel dosyaları yüklenebilir.');
  if(file.size>5*1024*1024)throw new Error('Her fotoğraf en fazla 5 MB olabilir.');
  const safeName=String(file.name||'photo.jpg').replace(/[^a-zA-Z0-9._-]/g,'_').slice(0,80)||'photo.jpg';
  const path=ownerId+'/'+listingId+'/'+Date.now()+'-'+safeName;
  const safePath=path.split('/').filter(Boolean).map(encodeURIComponent).join('/');
  const url=SUPABASE_URL+'/storage/v1/object/listing-photos/'+safePath;
  const res=await fetch(url,{
    method:'POST',
    headers:{
      'Authorization':'Bearer '+token,
      'apikey':SUPABASE_KEY,
      'Content-Type':file.type||'image/jpeg',
      'x-upsert':'false'
    },
    body:file
  });
  const text=await res.text();
  if(!res.ok){
    let d=null;try{d=text?JSON.parse(text):null;}catch(e){}
    throw new Error((d&&(d.message||d.error))||('Fotoğraf yüklenemedi (HTTP '+res.status+')'));
  }
  return {path:path, name:safeName, size:file.size, type:file.type||'image/jpeg'};
}

function normalizeListingText(v){
  try{
    return String(v==null?'':v)
      .toLocaleLowerCase('tr-TR')
      .replace(/\s+/g,' ')
      .trim();
  }catch(e){
    return String(v==null?'':v).toLowerCase().replace(/\s+/g,' ').trim();
  }
}
function listingMatchesSearch(row,q){
  const s=normalizeListingText(q);
  if(!s) return true;
  const md=(row&&row.metadata)||{};
  const bag=normalizeListingText([
    row&&row.title,
    row&&row.description,
    row&&row.category,
    row&&row.city,
    row&&row.district,
    row&&row.neighborhood,
    md.brand, md.model, md.version, md.fuel, md.gear, md.body, md.color,
    md.vehicle_type, md.property_kind, md.drive, md.condition
  ].join(' '));
  return bag.indexOf(s)>=0;
}
function applyListingFiltersLocal(type, rows){
  const f=getListingFilterState(type)||{};

    if(!listingMatchesSearch(row, f.q)) return false;
    const md=(row&&row.metadata)||{};
    const price=row.price!=null&&row.price!==''?Number(row.price):null;
    const minP=f.minPrice!==''&&f.minPrice!=null?Number(f.minPrice):null;
    const maxP=f.maxPrice!==''&&f.maxPrice!=null?Number(f.maxPrice):null;
    if(minP!=null&&!isNaN(minP)){
      if(price==null||isNaN(price)||price<minP) return false;
    }
    if(maxP!=null&&!isNaN(maxP)){
      if(price==null||isNaN(price)||price>maxP) return false;
    }
    if(f.city){
      if(normalizeListingText(row.city)!==normalizeListingText(f.city)) return false;
    }
    if(f.district){
      if(normalizeListingText(row.district)!==normalizeListingText(f.district)) return false;
    }
    if(type==='gayrimenkul'){
      if(f.category){
        if(normalizeListingText(row.category)!==normalizeListingText(f.category)) return false;
      }
      if(f.neighborhood){
        if(normalizeListingText(row.neighborhood)!==normalizeListingText(f.neighborhood)) return false;
      }
      if(f.rooms){
        if(normalizeListingText((md.rooms||''))!==normalizeListingText(f.rooms)) return false;
      }
      if(f.zoning){
        const z=md.zoning||md.imar||'';
        if(normalizeListingText(z)!==normalizeListingText(f.zoning)) return false;
      }
      const sqm=Number(md.sqm||md.m2||md.area);
      const minS=f.minSqm!==''&&f.minSqm!=null?Number(f.minSqm):null;
      const maxS=f.maxSqm!==''&&f.maxSqm!=null?Number(f.maxSqm):null;
      if(minS!=null&&!isNaN(minS)){
        if(!isFinite(sqm)||sqm<minS) return false;
      }
      if(maxS!=null&&!isNaN(maxS)&&maxS!==''){
        if(!isFinite(sqm)||sqm>maxS) return false;
      }
    }
    if(type==='otomobil'){
      if(f.brand){
        if(normalizeListingText(md.brand).indexOf(normalizeListingText(f.brand))<0) return false;
      }
      if(f.model){
        if(normalizeListingText(md.model).indexOf(normalizeListingText(f.model))<0) return false;
      }
      const year=md.year!=null&&md.year!==''?Number(md.year):null;
      const km=md.km!=null&&md.km!==''?Number(md.km):null;
      const minY=f.minYear!==''&&f.minYear!=null?Number(f.minYear):null;
      const maxY=f.maxYear!==''&&f.maxYear!=null?Number(f.maxYear):null;
      const minK=f.minKm!==''&&f.minKm!=null?Number(f.minKm):null;
      const maxK=f.maxKm!==''&&f.maxKm!=null?Number(f.maxKm):null;
      if(minY!=null&&!isNaN(minY)){
        if(year==null||isNaN(year)||year<minY) return false;
      }
      if(maxY!=null&&!isNaN(maxY)){
        if(year==null||isNaN(year)||year>maxY) return false;
      }
      if(minK!=null&&!isNaN(minK)){
        if(km==null||isNaN(km)||km<minK) return false;
      }
      if(maxK!=null&&!isNaN(maxK)){
        if(km==null||isNaN(km)||km>maxK) return false;
      }
      if(f.fuel){
        if(normalizeListingText(md.fuel)!==normalizeListingText(f.fuel)) return false;
      }
      if(f.gear){
        if(normalizeListingText(md.gear)!==normalizeListingText(f.gear)) return false;
      }
      if(f.body){
        const bodyBag=normalizeListingText([md.body, md.vehicle_type, row.category].filter(Boolean).join(' '));
        if(bodyBag.indexOf(normalizeListingText(f.body))<0) return false;

      if(f.drive){

      }
      if(f.seller_type){
        if(normalizeListingText(md.seller_type)!==normalizeListingText(f.seller_type)) return false;
      }
    }
    return true;
  });
  const sort=f.sort||'new';
  list.sort(function(a,b){

        return;

      const parts=v.split('|');
      const a=document.getElementById(minId); const b=document.getElementById(maxId);
      if(a) a.value=parts[0]||'';
      if(b) b.value=(parts[1]!==undefined?parts[1]:'');
    };
    sel.onchange=apply;
    apply();

    const pBucket=val('lfPriceBucket');
    if(pBucket && pBucket!=='__custom__'){

function kesfetSetSort(type, sort){
  const st=getListingFilterState(type);
  if(!st) return;
  st.sort=sort||'new';
  // keep sorts loosely in sync for "all"
  try{
    const g=getListingFilterState('gayrimenkul'); const o=getListingFilterState('otomobil');
    if(g) g.sort=st.sort; if(o) o.sort=st.sort;
  }catch(e){}
  if(window.__kesfetUnified && typeof showKesfet==='function') return showKesfet(true);
  if(type==='otomobil') return showOtomobilBrowse(true);
  return showGayrimenkulBrowse(true);
}
function kesfetChipClick(type, chip){
  const st=getListingFilterState(type);
  if(!st) return;
  if(type==='gayrimenkul'){
    if(chip==='all'){ st.category=''; }
    else { st.category=chip; }
  } else if(type==='otomobil'){
    if(chip==='all'){ st.fuel=''; st.gear=''; }
    else if(chip==='Benzin'||chip==='Dizel'||chip==='Elektrik'){ st.fuel=chip; st.gear=''; }
    else if(chip==='Otomatik'||chip==='Manuel'){ st.gear=chip; st.fuel=''; }
  }
  if(window.__kesfetUnified && typeof showKesfet==='function') return showKesfet(true);
  if(type==='otomobil') return showOtomobilBrowse(true);
  return showGayrimenkulBrowse(true);
}
function kesfetChipsHtml(type){
  const f=getListingFilterState(type)||{};
  let chips;
  if(type==='otomobil'){
    chips=[['all','Tümü'],['Benzin','Benzin'],['Dizel','Dizel'],['Elektrik','Elektrik'],['Otomatik','Otomatik']];
  } else {
    chips=[['all','Tümü'],['Konut','Konut'],['İş Yeri','İş Yeri'],['Arsa','Arsa']];
  }
  return chips.map(function(c){
    var on=false;
    if(type==='gayrimenkul'){
      on=(c[0]==='all'&&!f.category)||(f.category===c[0]);
    } else {
      on=(c[0]==='all'&&!f.fuel&&!f.gear)||(f.fuel===c[0])||(f.gear===c[0]);
    }
    return '<button type="button" class="kesfetChip'+(on?' on':'')+'" onclick="kesfetChipClick(\''+type+'\',\''+c[0].replace(/'/g,"\\'")+'\')">'+c[1]+'</button>';
  }).join('');
}
function kesfetCardHtml(row, type){
  const id=String(row.id||'').replace(/[^a-zA-Z0-9-]/g,'');
  const title=escapeHTML(row.title||'İlan');
  const price=escapeHTML(formatListingPrice(row.price, row.currency));
  const loc=[row.city,row.district,row.neighborhood].filter(Boolean).map(escapeHTML).join(' · ')||'Konum belirtilmedi';
  const md=row.metadata||{};
  let feats=[];
  let signals=[];
  if(type==='gayrimenkul'){
    if(row.category) feats.push(String(row.category));
    if(md.rooms) feats.push(String(md.rooms));
    if(md.sqm||md.m2||md.area) feats.push(String(md.sqm||md.m2||md.area)+' m²');
    if(md.floor!=null&&md.floor!=='') feats.push(String(md.floor)+'. kat');
  } else {
    if(md.year) feats.push(String(md.year));
    if(md.km!=null&&md.km!=='') feats.push(Number(md.km).toLocaleString('tr-TR')+' km');
    if(md.fuel) feats.push(String(md.fuel));
    if(md.gear) feats.push(String(md.gear));
    if(md.damage||md.paint||md.changed_parts) signals.push('✓ Hasar/boya bilgisi mevcut');
    if(md.condition) signals.push(String(md.condition));
  }
  if(md.seller_type==='professional') signals.push('⭐ Profesyonel satıcı');
  feats=feats.filter(Boolean).slice(0,4).map(escapeHTML);
  signals=signals.filter(Boolean).slice(0,2).map(escapeHTML);
  const photos=listingPhotosFromRow(row);
  let cover='<div class="kesfetCover"><div class="kesfetCoverEmpty">📷</div></div>';
  if(photos.length){
    const p0=photos[0];
    const pth=typeof p0==='string'?p0:(p0.path||'');
    if(pth){
      const src=escapeHTML(listingPhotoPublicUrl(pth));
      cover='<div class="kesfetCover"><img src="'+src+'" alt="" loading="lazy"></div>';
    }
  }
  const click=type==='otomobil'?"showOtomobilDetail('"+id+"')":"showGayrimenkulDetail('"+id+"')";
  return '<button type="button" class="kesfetCard" onclick="'+click+'">'+cover+
    '<div class="kesfetBody"><div class="kesfetPrice">'+price+'</div>'+
    '<div class="kesfetTitle">'+title+'</div>'+
    '<p class="kesfetLoc">📍 '+loc+'</p>'+
    (feats.length?'<p class="kesfetFeat">'+feats.join(' · ')+'</p>':'')+
    (signals.length?'<p class="kesfetSignal">'+signals.join(' · ')+'</p>':'')+
    '<div class="kesfetCtaLine">İlanı incele →</div>'+
    '</div></button>';

function closeGmPhotoViewer(){
  const el=document.getElementById('gmPhotoViewer');
  if(el) el.remove();
  try{ document.body.style.overflow=''; }catch(e){}
  __gmViewer.open=false;
  __gmViewer.scale=1; __gmViewer.tx=0; __gmViewer.ty=0;
}

function gmViewerApplyTransform(){
  const img=document.getElementById('gmViewerImg');
  if(!img) return;
  img.style.transform='translate('+__gmViewer.tx+'px,'+__gmViewer.ty+'px) scale('+__gmViewer.scale+')';
}

function gmViewerShowIndex(i){
  const urls=__gmViewer.urls||[];
  if(!urls.length) return;
  __gmViewer.index=((i%urls.length)+urls.length)%urls.length;
  __gmViewer.scale=1; __gmViewer.tx=0; __gmViewer.ty=0;
  const img=document.getElementById('gmViewerImg');
  const counter=document.getElementById('gmViewerCounter');
  if(img){
    img.src=urls[__gmViewer.index];
    img.style.transform='translate(0px,0px) scale(1)';
  }
  if(counter) counter.textContent=(__gmViewer.index+1)+' / '+urls.length;
}

function gmViewerNav(delta){
  gmViewerShowIndex(__gmViewer.index+delta);
}

function openGmPhotoViewer(urls, startIndex){
  const list=(urls||[]).filter(Boolean).map(String);
  if(!list.length) return;
  closeGmPhotoViewer();
  __gmViewer.urls=list;
  __gmViewer.index=Math.max(0, Math.min(Number(startIndex)||0, list.length-1));
  __gmViewer.open=true;
  __gmViewer.scale=1; __gmViewer.tx=0; __gmViewer.ty=0;
  try{ document.body.style.overflow='hidden'; }catch(e){}
  const wrap=document.createElement('div');
  wrap.id='gmPhotoViewer';
  wrap.setAttribute('role','dialog');
  wrap.setAttribute('aria-modal','true');
  wrap.style.cssText='position:fixed;inset:0;z-index:2147483000;background:rgba(0,0,0,.94);display:flex;flex-direction:column;touch-action:none;';
  wrap.innerHTML=
    '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;color:#fff;flex-shrink:0">'+
      '<span id="gmViewerCounter" style="font-size:14px;opacity:.9"></span>'+
      '<button type="button" id="gmViewerClose" style="border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:999px;width:40px;height:40px;font-size:20px;cursor:pointer">×</button>'+
    '</div>'+
    '<div id="gmViewerStage" style="flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none">'+
      '<img id="gmViewerImg" alt="" draggable="false" style="max-width:100%;max-height:100%;object-fit:cover;transform-origin:center center;will-change:transform;user-select:none;-webkit-user-drag:none;"/>'+
    '</div>'+
    '<div style="display:flex;gap:10px;justify-content:center;padding:12px;flex-shrink:0">'+
      '<button type="button" id="gmViewerPrev" class="btn secondary smallBtn" style="min-width:44px">‹</button>'+
      '<button type="button" id="gmViewerNext" class="btn secondary smallBtn" style="min-width:44px">›</button>'+
    '</div>';
  document.body.appendChild(wrap);
  document.getElementById('gmViewerClose').onclick=function(e){ e.preventDefault(); e.stopPropagation(); closeGmPhotoViewer(); };
  document.getElementById('gmViewerPrev').onclick=function(e){ e.preventDefault(); e.stopPropagation(); gmViewerNav(-1); };
  document.getElementById('gmViewerNext').onclick=function(e){ e.preventDefault(); e.stopPropagation(); gmViewerNav(1); };
  wrap.addEventListener('click', function(e){ if(e.target===wrap||e.target.id==='gmViewerStage') closeGmPhotoViewer(); });
  gmViewerShowIndex(__gmViewer.index);

  const stage=document.getElementById('gmViewerStage');
  let pointers=new Map();
  let lastDist=0;
  let panX=0, panY=0, startTx=0, startTy=0, startScale=1;
  let mode='none';

  function dist(a,b){
    const dx=a.clientX-b.clientX, dy=a.clientY-b.clientY;
    return Math.sqrt(dx*dx+dy*dy);
  }

  stage.addEventListener('pointerdown', function(e){
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, e);
    if(pointers.size===1){
      mode='pan';
      panX=e.clientX; panY=e.clientY;
      startTx=__gmViewer.tx; startTy=__gmViewer.ty; startScale=__gmViewer.scale;
    }else if(pointers.size===2){
      mode='pinch';
      const pts=Array.from(pointers.values());
      lastDist=dist(pts[0], pts[1]);
      startScale=__gmViewer.scale;
    }
  });
  stage.addEventListener('pointermove', function(e){
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, e);
    if(mode==='pinch' && pointers.size>=2){
      const pts=Array.from(pointers.values());
      const d=dist(pts[0], pts[1]);
      if(lastDist>0){
        let s=startScale*(d/lastDist);
        s=Math.max(1, Math.min(4, s));
        __gmViewer.scale=s;
        if(s===1){ __gmViewer.tx=0; __gmViewer.ty=0; }
        gmViewerApplyTransform();
      }
    }else if(mode==='pan' && pointers.size===1 && __gmViewer.scale>1){
      const dx=e.clientX-panX, dy=e.clientY-panY;
      __gmViewer.tx=startTx+dx;
      __gmViewer.ty=startTy+dy;
      gmViewerApplyTransform();
    }
  });
  function endPtr(e){
    pointers.delete(e.pointerId);
    if(pointers.size<2) lastDist=0;
    if(pointers.size===0){
      mode='none';
      if(__gmViewer.scale<=1.05){ __gmViewer.scale=1; __gmViewer.tx=0; __gmViewer.ty=0; gmViewerApplyTransform(); }
    }else if(pointers.size===1){
      mode='pan';
      const p=Array.from(pointers.values())[0];
      panX=p.clientX; panY=p.clientY;
      startTx=__gmViewer.tx; startTy=__gmViewer.ty; startScale=__gmViewer.scale;
    }
  }
  stage.addEventListener('pointerup', endPtr);
  stage.addEventListener('pointercancel', endPtr);
  stage.addEventListener('wheel', function(e){
    e.preventDefault();
    const delta=e.deltaY>0?-0.15:0.15;
    __gmViewer.scale=Math.max(1, Math.min(4, __gmViewer.scale+delta));
    if(__gmViewer.scale===1){ __gmViewer.tx=0; __gmViewer.ty=0; }
    gmViewerApplyTransform();
  }, {passive:false});
}

function listingDetailCarouselHtml(urls){
  const list=(urls||[]).filter(Boolean);
  if(!list.length) return '';
  const first=escapeHTML(list[0]);
  const n=list.length;
  const arrows=n>1?('<button type="button" class="ldCarouselNav prev" data-ld-nav="-1" aria-label="Önceki">‹</button><button type="button" class="ldCarouselNav next" data-ld-nav="1" aria-label="Sonraki">›</button>'):'';
  const dots=n>1?('<div class="ldCarouselDots">'+list.map(function(_,i){return '<span data-ld-dot="'+i+'" class="'+(i===0?'on':'')+'"></span>';}).join('')+'</div>'):'';
  const count=n>1?('<span class="small muted" data-ld-count>1 / '+n+'</span>'):'';
  return '<div class="ldCarousel" data-ld-carousel data-ld-index="0">'+
    '<div class="ldCarouselStage">'+
    '<button type="button" data-gm-photo-idx="0" style="border:0;padding:0;width:100%;height:100%;display:block;cursor:zoom-in;background:transparent">'+
    '<img data-ld-img src="'+first+'" alt="">'+
    '</button>'+arrows+'</div>'+
    '<div class="ldCarouselMeta">'+count+dots+'</div>'+
    '<p class="small muted" style="text-align:center;margin:4px 0 0">Fotoğrafa dokunarak büyüt</p>'+
    '</div>';
}
function bindListingDetailCarousel(root, urls){
  const el=root&&root.querySelector('[data-ld-carousel]');
  const list=(urls||[]).filter(Boolean);
  if(!el||!list.length) return;
  function show(i){
    const n=list.length;
    const idx=((Number(i)||0)%n+n)%n;
    el.setAttribute('data-ld-index', String(idx));
    const img=el.querySelector('[data-ld-img]');
    const openBtn=el.querySelector('[data-gm-photo-idx]');
    if(img) img.src=list[idx];
    if(openBtn) openBtn.setAttribute('data-gm-photo-idx', String(idx));
    const c=el.querySelector('[data-ld-count]');
    if(c) c.textContent=(idx+1)+' / '+n;
    const dots=el.querySelectorAll('[data-ld-dot]');
    for(let d=0;d<dots.length;d++) dots[d].className=d===idx?'on':'';
  }
  el.querySelectorAll('[data-ld-nav]').forEach(function(btn){
    btn.addEventListener('click', function(ev){
      ev.preventDefault(); ev.stopPropagation();
      const cur=Number(el.getAttribute('data-ld-index')||0);
      show(cur+Number(btn.getAttribute('data-ld-nav')||0));
    });
  });
  el.querySelectorAll('[data-ld-dot]').forEach(function(dot){
    dot.addEventListener('click', function(ev){
      ev.preventDefault();
      show(Number(dot.getAttribute('data-ld-dot')||0));
    });
  });
  let x0=null;
  const stage=el.querySelector('.ldCarouselStage');
  if(stage&&list.length>1){
    stage.addEventListener('touchstart', function(e){ if(e.touches&&e.touches[0]) x0=e.touches[0].clientX; }, {passive:true});
    stage.addEventListener('touchend', function(e){
      if(x0==null||!e.changedTouches||!e.changedTouches[0]) return;
      const dx=e.changedTouches[0].clientX-x0; x0=null;
      if(Math.abs(dx)<40) return;
      const cur=Number(el.getAttribute('data-ld-index')||0);
      show(cur+(dx<0?1:-1));
    }, {passive:true});
  }
}

// A3.1-only write helper (does not modify global supabaseWrite)
async function listingsAuthWrite(method, path, body){
  const session=typeof getAuthSession==='function'?getAuthSession():null;
  const token=session&&(session.access_token||session.accessToken);
  const uid=session&&session.user&&(session.user.id||session.user.user_id);
  if(!token){
    throw new Error('Oturum token bulunamadı. Çıkış yapıp tekrar giriş yapın.');
  }
  if(!uid){
    throw new Error('Kullanıcı kimliği bulunamadı. Çıkış yapıp tekrar giriş yapın.');
  }
  const headers={
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+token,
    "Content-Type":"application/json",
    "Accept":"application/json",
    "Prefer":"return=representation"
  };
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{
    method:method,
    headers:headers,
    body:(body!==null&&body!==undefined)?JSON.stringify(body):undefined
  });
  const txt=await r.text();
  let d=null; try{d=txt?JSON.parse(txt):null;}catch(e){d=txt;}
  if(!r.ok){
    const msg=(d&&(d.message||d.error_description||d.details||d.hint))||("Supabase "+method+" başarısız ("+r.status+")");
    throw new Error(msg);
  }
  if((method==="POST"||method==="PATCH")&&Array.isArray(d)&&d.length===0){
    throw new Error("Kayıt yazılamadı (0 satır döndü). JWT ile owner_id eşleşmesini kontrol edin.");
  }
  return {data:d, uid:uid, token:token};
}

async function createGayrimenkulListing(){
  const session=typeof getAuthSession==='function'?getAuthSession():null;
  const uid=session&&session.user&&(session.user.id||session.user.user_id);
  const token=session&&(session.access_token||session.accessToken);
  if(!session||!uid||!token){
    alert('Giriş gerekli. Oturum veya token eksik; çıkış yapıp tekrar giriş yapın.');
    return showGayrimenkulCreateForm();
  }
  const title=(document.getElementById('gmTitle')?.value||'').trim();
  const description=(document.getElementById('gmDesc')?.value||'').trim();
  const category=(document.getElementById('gmCategory')?.value||'').trim();
  const priceRaw=(document.getElementById('gmPrice')?.value||'').trim();
  const currency=(document.getElementById('gmCurrency')?.value||'TRY').trim()||'TRY';
  const city=(document.getElementById('gmCity')?.value||'').trim();
  const district=(document.getElementById('gmDistrict')?.value||'').trim();
  const neighborhood=(document.getElementById('gmNeighborhood')?.value||'').trim();
  const fileInput=document.getElementById('gmPhotos');
  const files=fileInput&&fileInput.files?Array.from(fileInput.files):[];
  if(!title){ alert('Başlık zorunlu.'); return; }
  if(!category){ alert('Tür seçin.'); return; }
  if(!city){ alert('İl seçin.'); return; }
  if(!district){ alert('İlçe seçin.'); return; }
  if(files.length>8){ alert('En fazla 8 fotoğraf yükleyebilirsin.'); return; }
  let price=null;
  if(priceRaw!==''){
    price=Number(priceRaw);
    if(!isFinite(price)||price<0){ alert('Geçerli bir fiyat girin.'); return; }
  }
  const btn=document.getElementById('gmSaveBtn');
  if(btn){ btn.disabled=true; btn.textContent='Kaydediliyor…'; }
  try{
    const catRaw=(document.getElementById('gmCategory')?.value||category||'').trim();
    const catParts=catRaw.split('|');
    const categoryMain=catParts[0]||'Konut';
    const subtype=catParts[1]||'';
    const deal=(document.getElementById('gmDealType')?.value||'').trim();
    const metaExtra={
      source: 'a3.1',
      property_kind: categoryMain,
      property_subtype: subtype||null,
      deal_type: deal||null,
      rooms: (document.getElementById('gmRooms')?.value||'').trim()||null,
      building_age: (document.getElementById('gmBuildingAge')?.value||'').trim()||null,
      floor: (document.getElementById('gmFloor')?.value||'').trim()||null,
      heating: (document.getElementById('gmHeating')?.value||'').trim()||null,
      baths: (document.getElementById('gmBaths')?.value||'').trim()||null,
      balcony: (document.getElementById('gmBalcony')?.value||'').trim()||null,
      elevator: (document.getElementById('gmElevator')?.value||'').trim()||null,
      parking: (document.getElementById('gmParking')?.value||'').trim()||null,
      furnished: (document.getElementById('gmFurnished')?.value||'').trim()||null,
      in_site: (document.getElementById('gmSite')?.value||'').trim()||null,
      usage_status: (document.getElementById('gmUsage')?.value||'').trim()||null,
      sqm: (document.getElementById('gmSqm')?.value||document.getElementById('gmArsaSqm')?.value||'').trim()||null,
      zoning: (document.getElementById('gmZoning')?.value||'').trim()||null,
      photos: []
    };
    const body={
      owner_id: uid,
      listing_type: 'gayrimenkul',
      category: categoryMain,
      title: title,
      description: description||null,
      price: price,
      currency: currency,
      city: city,
      district: district,
      neighborhood: neighborhood||null,
      status: 'draft',
      metadata: metaExtra
    };
    const out=await listingsAuthWrite('POST','listings',body);
    const res=out.data;
    const row=Array.isArray(res)?res[0]:res;
    if(!row||!row.id) throw new Error('Kayıt oluşturulamadı.');

    // Photos after listing exists (path isolated by owner_id/listing_id)
    const uploaded=[];
    const failed=[];
    if(files.length){
      if(btn) btn.textContent='Fotoğraflar yükleniyor…';
      for(let i=0;i<files.length;i++){
        try{
          const meta=await uploadListingPhoto(uid, row.id, files[i], token);
          uploaded.push(meta);
        }catch(pe){
          failed.push((files[i]&&files[i].name?files[i].name:'foto')+': '+(pe&&pe.message?pe.message:String(pe)));
        }
      }
      if(uploaded.length){
        try{
          const md=Object.assign({}, row.metadata||{}, {
            source: 'a3.1',
            property_kind: category,
            photos: uploaded
          });
          const patch=await listingsAuthWrite(
            'PATCH',
            'listings?id=eq.'+encodeURIComponent(row.id),
            { metadata: md }
          );
          const patched=Array.isArray(patch.data)?patch.data[0]:patch.data;
          if(patched) Object.assign(row, patched);
          else row.metadata=md;
        }catch(me){
          failed.push('Fotoğraf kaydı güncellenemedi: '+(me&&me.message?me.message:String(me)));
        }
      }
    }
    clearGmListingFormDraft();
    showGayrimenkulDraftResult(row, {uploaded:uploaded.length, failed:failed});
  }catch(err){
    alert(err&&err.message?err.message:String(err));
    if(btn){ btn.disabled=false; btn.textContent='Taslak olarak kaydet'; }
  }
}

/* === V1 ANLAMA PAKETİ (araç ilanı, izole) === */
function parseOtoFreeText(str){
  const raw=String(str||'').trim();
  const partial={};
  const notes=[];
  if(!raw) return {partial:partial, notes:notes, raw:raw};
  const lower=raw.toLocaleLowerCase('tr-TR');

  // Yıl
  let ym=raw.match(/\b(19[5-9]\d|20[0-3]\d)\b/);
  if(ym) partial.year=ym[1];

  // KM: 45 bin, 45000, 45.000, 45bin
  let km=null;
  let m=lower.match(/(\d{1,3}(?:[.\s]\d{3})+|\d+)\s*(bin)?\s*km\b/);
  if(m){
    let n=m[1].replace(/[.\s]/g,'');
    km=parseInt(n,10);
    if(m[2]) km=km*1000;
  }else{
    m=lower.match(/(\d{1,3})\s*bin(?:\s*km)?\b/);
    if(m) km=parseInt(m[1],10)*1000;
  }
  if(km!=null&&isFinite(km)&&km>=0) partial.km=String(km);

  // Marka — katalogdan en uzun eşleşme
  try{
    const brands=typeof otoCatalogBrands==='function'?otoCatalogBrands():Object.keys(OTO_CATALOG||{});
    let best='';
    brands.forEach(function(b){
      if(!b||b==='Diğer') return;
      const bl=b.toLocaleLowerCase('tr-TR');
      if(lower.indexOf(bl)>=0 && bl.length>best.length) best=b;
    });
    // sık kısaltmalar
    if(!best){
      if(/\bbmw\b/i.test(raw)) best='BMW';
      else if(/\bvw\b|\bvolkswagen\b/i.test(raw)) best='Volkswagen';
      else if(/\bmercedes\b|\bbenz\b/i.test(raw)) best='Mercedes-Benz';
    }
    if(best) partial.brand=best;
  }catch(e){}

  // Model + version — yalnızca katalog kesin eşleşmesi
  try{
    if(partial.brand&&OTO_CATALOG[partial.brand]){
      const models=OTO_CATALOG[partial.brand];
      let foundModel='', foundVer='';
      Object.keys(models).forEach(function(mod){
        const ml=mod.toLocaleLowerCase('tr-TR');
        if(ml.length>=2 && lower.indexOf(ml)>=0){
          if(mod.length>=foundModel.length){ foundModel=mod; }
        }
        const vers=models[mod]||[];
        vers.forEach(function(v){
          if(!v) return;
          const vl=String(v).toLocaleLowerCase('tr-TR');
          // kelime sınırı benzeri: 320i, 1.5 tsi
          const re=new RegExp('(?:^|[^a-z0-9])'+vl.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?:[^a-z0-9]|$)','i');
          if(re.test(lower) || lower.indexOf(vl)>=0){
            if(String(v).length>=String(foundVer).length){
              foundVer=v;
              if(!foundModel) foundModel=mod;
            }
          }
        });
      });
      if(foundModel) partial.model=foundModel;
      if(foundVer) partial.version=foundVer;
    }
  }catch(e){}

  // 320i vb. version eşleşti ama model yoksa not
  if(!partial.model && partial.version){
    notes.push('Versiyon: '+partial.version+' (model seçimini formdan kontrol et)');
  }

  // Renk
  try{
    const colors=(typeof OTO_COLORS!=='undefined'?OTO_COLORS:[]).filter(Boolean);
    colors.forEach(function(c){
      if(c==='Diğer') return;
      if(lower.indexOf(c.toLocaleLowerCase('tr-TR'))>=0) partial.color=c;
    });
  }catch(e){}

  // Vites
  if(/\botomatik\b/.test(lower)) partial.gear='Otomatik';
  else if(/\bmanuel\b/.test(lower)) partial.gear='Manuel';
  else if(/yar[iı]\s*otomatik/.test(lower)) partial.gear='Yarı otomatik';

  // Yakıt
  if(/\bbenzin\b/.test(lower)) partial.fuel='Benzin';
  else if(/\bdizel\b|\bdiesel\b/.test(lower)) partial.fuel='Dizel';
  else if(/\blpg\b/.test(lower)) partial.fuel='LPG';
  else if(/\bhibrit\b|\bhybrid\b/.test(lower)) partial.fuel='Hibrit';
  else if(/\belektrik/.test(lower)) partial.fuel='Elektrik';

  // Çekiş
  if(/\b4x4\b/.test(lower)) partial.drive='4x4';
  else if(/\bawd\b/.test(lower)) partial.drive='AWD';
  else if(/önden|onden/.test(lower)) partial.drive='Önden';
  else if(/arkadan/.test(lower)) partial.drive='Arkadan';

  // Kasa
  try{
    const bodies=(typeof OTO_BODY_TYPES!=='undefined'?OTO_BODY_TYPES:[]).filter(Boolean);
    bodies.forEach(function(b){
      if(b==='Diğer') return;
      if(lower.indexOf(b.toLocaleLowerCase('tr-TR'))>=0) partial.body=b;
    });
  }catch(e){}

  // Kondisyon
  if(/\bs[iı]f[iı]r\b/.test(lower)) partial.condition='Sıfır';
  else if(/ikinci\s*el|2\.\s*el/.test(lower)) partial.condition='İkinci el';

  // Hasar — çelişkide sessizce birini silme
  const hasHasarsiz=/hasars[iı]z/.test(lower);
  const hasHasarKaydi=/hasar\s*kayd[iı]/.test(lower)||(/hasarl[iı]/.test(lower)&&!hasHasarsiz);
  if(hasHasarsiz&&hasHasarKaydi){
    notes.push('Çelişki: hem hasarsız hem hasar ifadesi var — formdan netleştir');
    partial.damage='Hasarsız';
    notes.push('Hasar (alternatif): Hasar kaydı var');
  }else if(hasHasarsiz) partial.damage='Hasarsız';
  else if(hasHasarKaydi) partial.damage='Hasar kaydı var';

  // Boya — katalog değerleri
  if(/boyas[iı]z/.test(lower)) partial.paint='Boyasız';
  else if(/tamamen\s*boyal[iı]/.test(lower)) partial.paint='Tamamen boyalı';
  else if(/k[iı]smi\s*boyal[iı]|lokal\s*boyal[iı]/.test(lower)) partial.paint='Kısmi boyalı';
  // serbest boya ifadesi (kapı vs.) — katalog dışı, not olarak
  const paintFree=raw.match(/(sa[gğ]\s*ön\s*kap[iı][^\n,]{0,40}boya[^\n,]{0,20}|sol\s*ön\s*kap[iı][^\n,]{0,40}boya[^\n,]{0,20}|kap[iı]da\s*boya[^\n,]{0,20}|boya\s*var[^\n,]{0,30})/i);
  if(paintFree){
    notes.push('Boya notu: '+paintFree[0].trim());
    if(!partial.paint) partial.paint='Kısmi boyalı'; // yumuşak eşleme: kapıda boya ≈ kısmi; kullanıcı onaylar
  }

  // Değişen parça
  if(/de[gğ]i[sş]en\s*par[cç]a\s*yok|par[cç]a\s*de[gğ]i[sş]memi[sş]/.test(lower)) partial.changed_parts='Yok';
  else if(/de[gğ]i[sş]en\s*par[cç]a/.test(lower)) partial.changed_parts='Var';

  // Servis / muayene / garanti
  if(/yetkili\s*servis/.test(lower)) partial.service_history='Yetkili servis';
  else if(/[oö]zel\s*servis/.test(lower)) partial.service_history='Özel servis';
  if(/muayene\s*ge[cç]erli|ge[cç]erli\s*muayene/.test(lower)) partial.inspection='Geçerli';
  else if(/muayene\s*ge[cç]mi[sş]/.test(lower)) partial.inspection='Geçmiş';
  if(/\bgaranti\s*var\b/.test(lower)) partial.warranty='Var';
  else if(/\bgaranti\s*yok\b/.test(lower)) partial.warranty='Yok';

  // Motor cc / hp kaba
  m=lower.match(/\b(\d(?:[.,]\d)?)\s*(?:litre|l)\b/);
  if(m){
    const lit=parseFloat(m[1].replace(',','.'));
    if(lit>=0.6&&lit<=8) partial.engine_cc=String(Math.round(lit*1000));
  }
  m=lower.match(/\b(\d{3,4})\s*cc\b/);
  if(m) partial.engine_cc=m[1];
  m=lower.match(/\b(\d{2,3})\s*hp\b/);
  if(m) partial.power_hp=m[1];

  return {partial:partial, notes:notes, raw:raw};
}

function showOtoParseConfirm(partial, rawText, notes){
  partial=partial||{};
  notes=notes||[];
  const rows=[];
  const labels={
    brand:'Marka', model:'Model', version:'Versiyon', year:'Yıl', km:'Kilometre',
    color:'Renk', gear:'Vites', fuel:'Yakıt', body:'Kasa', drive:'Çekiş',
    engine_cc:'Motor (cc)', power_hp:'Güç (HP)', condition:'Kondisyon',
    damage:'Hasar', paint:'Boya', changed_parts:'Değişen parça',
    service_history:'Servis', inspection:'Muayene', warranty:'Garanti'
  };
  Object.keys(labels).forEach(function(k){
    if(partial[k]!=null&&String(partial[k]).trim()!==''){
      let val=String(partial[k]);
      if(k==='km'){ try{ val=Number(val).toLocaleString('tr-TR')+' km'; }catch(e){} }
      rows.push('<div class="small" style="margin:4px 0"><b>'+labels[k]+':</b> '+escapeHTML(val)+'</div>');
    }
  });
  notes.forEach(function(n){
    rows.push('<div class="small muted" style="margin:4px 0">• '+escapeHTML(n)+'</div>');
  });
  if(!rows.length){
    app(`<div class="back"><button class="btn secondary smallBtn" type="button" onclick="renderOtomobilWizard()">← Geri</button></div>
    <div class="formCard"><span class="badge">🤖 Anla</span><h1>Anlaşılamadı</h1>
    <p class="muted">Cümleden güvenli alan çıkarılamadı. Bilgi uydurulmadı — formu elle doldurabilir veya cümleyi netleştirip tekrar deneyebilirsin.</p>
    <button class="btn primary" type="button" onclick="renderOtomobilWizard()">Forma dön</button></div>`);
    return;
  }
  window.__otoParsePending={partial:partial, raw:rawText||'', notes:notes};
  app(`<div class="back"><button class="btn secondary smallBtn" type="button" onclick="otoParseEdit()">← Düzenle</button></div>
  <div class="formCard">
    <span class="badge">🤖 Anla</span>
    <h1>Bunları doğru anladım mı?</h1>
    <p class="muted small">Yalnızca cümleden çıkarılan bilgiler. Onaylamadan ilan alanları değişmez.</p>
    <div class="card" style="text-align:left;margin:12px 0">${rows.join('')}</div>
    <div class="splitActions">
      <button class="btn primary" type="button" onclick="otoParseConfirmYes()">✓ Evet, devam et</button>
      <button class="btn secondary" type="button" onclick="otoParseEdit()">✎ Düzenle</button>
    </div>
  </div>`);
}

function otoParseFromWizard(){
  const el=document.getElementById('otoFreeText');
  const text=el?el.value:'';
  const res=parseOtoFreeText(text);
  showOtoParseConfirm(res.partial, res.raw, res.notes);
}

function otoParseConfirmYes(){
  const pend=window.__otoParsePending;
  if(!pend||!pend.partial){ renderOtomobilWizard(); return; }
  __otoW=__otoW||{step:0,data:{},files:[]};
  __otoW.data=Object.assign({}, __otoW.data||{}, pend.partial);
  // Onaylandıktan sonra uygun adıma geç (kalıcı step numarası eklemeden)
  if(__otoW.data.brand||__otoW.data.model||__otoW.data.year) __otoW.step=Math.max(__otoW.step|0, 1);
  window.__otoParsePending=null;
  try{
    const draft={step:__otoW.step, data:Object.assign({}, __otoW.data), hasFiles:false};
    localStorage.setItem('oto_listing_draft', JSON.stringify(draft));
  }catch(e){}
  renderOtomobilWizard();
}

function otoParseEdit(){
  const raw=(window.__otoParsePending&&window.__otoParsePending.raw)||'';
  window.__otoParsePending=null;
  __otoW=__otoW||{step:0,data:{},files:[]};
  __otoW._freeTextKeep=raw;
  __otoW.step=0;
  renderOtomobilWizard();
}

      <div class="small muted">Fotoğraf: ${(__otoW.files&&__otoW.files.length)||0} · Kasa: ${escapeHTML(d.body||'—')}</div>

    ${otoPreviewChecklistHtml(d)}
    <p class="muted small">Kaydetmeden önce özeti kontrol et. Taslak olarak kaydedilir; yayın senin onayınla olur.</p>`;

    'En az bir fotoğraf ekle; açı çeşitliliği önerilir.',

  ];
  const nextLabel=step<total-1?('Sonraki: '+labels[step+1]):'Sonraki: Kayıt';
  const draftNote=(__otoW&&__otoW._draftSaved)?'<p class="small" style="color:var(--ok,#19c37d);margin:8px 0 0">✓ Taslak kaydedildi. Kaldığın yerden devam edebilirsin.</p>':'';
  app(`<div class="back"><button class="btn secondary smallBtn" type="button" onclick="showOtomobilHub()">← Otomobil</button></div>
  <div class="formCard">
    <span class="badge">🚗 İlan Ver · Adım ${step+1}/${total}</span>
    <h1>${labels[step]||'İlan'}</h1>
    <p class="small muted">${labels.map(function(l,i){return i===step?'<b>'+l+'</b>':l;}).join(' → ')}</p>
    <p class="small muted" style="margin:6px 0 10px">${stepHints[step]||''} <span style="opacity:.85">· ${nextLabel}</span></p>
    ${body}
    ${draftNote}
    <div class="splitActions" style="margin-top:14px">

      ${step<total-1?'<button class="btn primary" type="button" onclick="otoWizardNext()">Devam</button>':

function otoWizardBack(){
  otoSaveStepFields();
  __otoW.step=Math.max(0,(__otoW.step|0)-1);
  renderOtomobilWizard();
}
function otoWizardNext(){
  otoSaveStepFields();
  const d=__otoW.data;
  const step=__otoW.step|0;
  if(step===1){
    if(!d.brand||!d.model||!d.year||d.km===''){ alert('Marka, model, yıl ve kilometre zorunlu.'); return; }
  }
  if(step===4){
    if(d.price===''||d.price===undefined||!d.city||!d.district){ alert('Fiyat, il ve ilçe zorunlu.'); return; }
  }
  if(step===5){
    if(!d.title||!d.description){ alert('Başlık ve açıklama zorunlu.'); return; }
  }
  if(step===6){
    if(!(__otoW.files&&__otoW.files.length)){ alert('En az bir fotoğraf seçmelisin.'); return; }
  }
  __otoW.step=Math.min(7,step+1);
  renderOtomobilWizard();
}

async function createOtomobilListing(){
  otoSaveStepFields();
  const session=typeof getAuthSession==='function'?getAuthSession():null;
  const uid=session&&session.user&&(session.user.id||session.user.user_id);
  const token=session&&(session.access_token||session.accessToken);
  if(!uid||!token){ alert('Giriş gerekli.'); return startOtomobilWizard(); }
  const d=__otoW.data||{};
  if(!d.brand||!d.model||!d.year||d.km===''||!d.price||!d.city||!d.district||!d.title||!d.description){
    alert('Zorunlu alanlar eksik. Adımları kontrol et.');
    return;
  }
  if(!(__otoW.files&&__otoW.files.length)){ alert('En az bir fotoğraf gerekli.'); return; }
  const btn=document.getElementById('otoSaveBtn');

  try{
    try{ localStorage.removeItem('oto_listing_draft'); }catch(e){}
    const year=Number(d.year); const km=Number(d.km); const price=Number(d.price);

    }
    if(uploaded.length){
      metadata.photos=uploaded;
      try{
        const patch=await listingsAuthWrite('PATCH','listings?id=eq.'+encodeURIComponent(row.id),{metadata:metadata});

function parseServiceFreeText(str){
  const raw=String(str||'').trim();
  const lower=raw.toLocaleLowerCase('tr-TR');
  const out={category:'', urgency:'', note:raw};
  if(!raw) return out;
  // Kategori — SERVICES anahtarları / isimleri
  try{
    const map=[
      ['tesisat',/musluk|su ka[cç]|tesisat|tuvalet|lavabo|gid[e]?r|bor[u]/],
      ['klima',/klima|so[gğ]utm|kombi/],
      ['elektrik',/elektrik|priz|sigorta|aydınlat/],
      ['beyaz',/[cç]ama[sş][iı]r|bula[sş][iı]k|buzdolab[iı]|f[iı]r[iı]n|beyaz\s*e[sş]ya/],
      ['temizlik',/temizlik|s[uü]p[uü]r/],
      ['nakliye',/nakliye|ta[sş][iı]ma|evden eve/],
      ['cilingir',/[cç]ilingir|kilit|anahtar/],
      ['oto',/\boto\b|lastik|ak[uü]|yol yard[iı]m/],
      ['boya',/badana|boya\s*ustas[iı]/],
      ['montaj',/montaj|mobilya kur/]
    ];
    for(let i=0;i<map.length;i++){
      if(map[i][1].test(lower)){ out.category=map[i][0]; break; }
    }
  }catch(e){}
  // Zaman — uydurma yok; yalnızca açık ifadeler
  if(/\byar[iı]n\b/.test(lower)) out.urgency='Yarın';
  else if(/\bacil\b|\bacil\b/.test(lower)||/hemen/.test(lower)) out.urgency='Acil';
  else if(/\bbug[uü]n\b/.test(lower)) out.urgency='Bugün';
  return out;
}

function normalizeWhatsAppPhone(phone){
  let d=String(phone||'').replace(/\D+/g,'');
  if(!d)return '';
  if(d.indexOf('00')===0)d=d.slice(2);
  if(d.length===10&&d.charAt(0)==='5')d='90'+d;
  if(d.length===11&&d.charAt(0)==='0')d='90'+d.slice(1);
  if(d.indexOf('90')===0&&d.length>=12)return d;
  if(d.length>=10)return d;
  return '';
}
function whatsappHref(phone){
  const n=normalizeWhatsAppPhone(phone);
  return n?('https://wa.me/'+n):'';
}
function telHref(phone){
  const n=normalizeWhatsAppPhone(phone);
  if(!n)return '';
  return 'tel:+'+n;
}

async function loadOffersForRequest(talepNo){
  if(!talepNo)return [];
  try{
    // Resolve real requests.id (offers.request_id FK)
    let requestId=null;
    let local=(getRequests()||[]).find(function(x){
      return String(x.talep_no||'')===String(talepNo)||String(x.id)===String(talepNo);
    });
    if(local&&local.id&&String(local.id).length>30)requestId=local.id;
    if(!requestId){
      try{
        const found=await findRequestByNo(talepNo);
        if(found&&found.id&&String(found.id).length>30)requestId=found.id;
      }catch(e){}
    }
    if(!requestId){
      // Search requests by encoded talep_no in description
      try{
        const rows=await supabaseRequest('GET','requests?select=id,description&order=created_at.desc&limit=100');
        if(Array.isArray(rows)){
          for(let i=0;i<rows.length;i++){
            const meta=parseRequestDescription(rows[i].description||'');
            if(String(meta.talep_no)===String(talepNo)||String(rows[i].id)===String(talepNo)){
              requestId=rows[i].id;break;
            }
          }
        }
      }catch(e){console.warn('requests lookup',e);}
    }
    if(!requestId){
      console.warn('[OFFER] request id bulunamadı', talepNo);
      return [];
    }
    // offers uses created_at (NOT olusturulma_tarihi)
    let rows;
    try{
      rows=await supabaseRequest('GET','offers?select=*&request_id=eq.'+encodeURIComponent(String(requestId))+'&order=created_at.desc&limit=50');
    }catch(e1){
      console.warn('[OFFER] ordered select failed, retry plain', e1);
      rows=await supabaseRequest('GET','offers?select=*&request_id=eq.'+encodeURIComponent(String(requestId))+'&limit=50');
    }
    const list=Array.isArray(rows)?rows:[];
    console.log('[OFFER] loaded', list.length, 'for request', requestId);
    const out=[];
    for(let i=0;i<list.length;i++){
      const o=list[i];
      let pname='',pphone='';
      if(o.provider_id){
        try{
          const pr=await supabaseRequest('GET','providers?select=id,name,phone&id=eq.'+encodeURIComponent(String(o.provider_id))+'&limit=1');
          if(Array.isArray(pr)&&pr[0]){pname=pr[0].name||'';pphone=pr[0].phone||'';}
        }catch(e){}
      }
      const st=o.status||'pending';
      out.push({
        id:o.id,
        request_id:o.request_id,
        provider_id:o.provider_id,
        provider_name:pname||'Hizmet Sağlayıcı',
        provider_phone:pphone||'',
        fiyat:o.price,
        price:o.price,
        aciklama:o.note||'',
        note:o.note||'',
        available_time:o.available_time||'',
        durum:st==='accepted'?'Kabul edildi':(st==='rejected'?'Reddedildi':'Teklif bekliyor'),
        status:st,
        created_at:o.created_at||''
      });
    }
    return out;
  }catch(e){
    console.error('[OFFER] load failed', e);
    return [];
  }
}

async function acceptOffer(talepNo,offerId,providerName,price){
  try{
    if(!offerId)throw new Error('Teklif id yok');
    const session=getAuthSession();
    if(!session||!session.access_token)throw new Error('Kabul için giriş yapmalısınız.');
    const r=await findRequestByNo(talepNo);
    if(!r||!r.id)throw new Error('Talep bulunamadı: '+talepNo);
    // Owner check (client-side hint; RLS is source of truth)
    if(r.user_id&&session.user&&session.user.id&&String(r.user_id)!==String(session.user.id)){
      throw new Error('Bu talep sizin hesabınıza ait değil. Kabul edilemez.');
    }
    if(!r.user_id){
      throw new Error('Bu talep sahipsiz (user_id boş). Eski kayıtlar kabul edilemez. Lütfen giriş yapıp YENİ talep oluşturun.');
    }
    // 1) accept offer — must return row
    const off=await supabaseWrite('PATCH','offers?id=eq.'+encodeURIComponent(String(offerId)),{status:'accepted'});
    if(!off||(Array.isArray(off)&&(!off[0]||off[0].status!=='accepted'))){
      throw new Error('Teklif durumu accepted olarak yazılamadı.');
    }
    // 2) reject other pending
    try{
      const others=await supabaseRequest('GET','offers?select=id&request_id=eq.'+encodeURIComponent(String(r.id))+'&status=eq.pending');
      if(Array.isArray(others)){
        for(let i=0;i<others.length;i++){
          if(String(others[i].id)!==String(offerId)){
            try{await supabaseWrite('PATCH','offers?id=eq.'+encodeURIComponent(String(others[i].id)),{status:'rejected'});}catch(e){}
          }
        }
      }
    }catch(e){console.warn(e);}
    // 3) request accepted — must return row
    const req=await supabaseWrite('PATCH','requests?id=eq.'+encodeURIComponent(String(r.id)),{status:'accepted'});
    if(!req||(Array.isArray(req)&&(!req[0]||req[0].status!=='accepted'))){
      throw new Error('Talep durumu accepted olarak yazılamadı.');
    }
    // Cache only AFTER verified DB write
    try{
      const list=(getRequests()||[]).map(function(x){
        if(String(x.talep_no||'')===String(talepNo)||String(x.id)===String(r.id)){
          x.status='Devam ediyor';x.durum='Devam ediyor';
        }
        return x;
      });
      write(KEYS.requests,list);
    }catch(e){}
    alert('Teklif kabul edildi.\nDurum: Devam ediyor');
    await showRequestDetail(talepNo);
  }catch(e){
    console.error(e);
    alert('Teklif kabul edilemedi.\n\n'+(e.message||e));
  }
}

async function findRequestByNo(talepNo){
  if(!talepNo)return null;
  const key=String(talepNo);
  let list=getRequests()||[];
  let r=list.find(function(x){return String(x.talep_no||'')===key||String(x.id)===key;});
  try{
    const rows=await supabaseRequest('GET','requests?select=*&order=created_at.desc&limit=150');
    if(Array.isArray(rows)){
      for(let i=0;i<rows.length;i++){
        const mapped=mapRequest(rows[i]);
        if(String(mapped.talep_no||'')===key||String(mapped.id)===key||String(rows[i].id)===key){
          r=applyLocalJobState(mapped);
          try{
            const others=(getRequests()||[]).filter(function(x){return String(x.id)!==String(r.id)&&String(x.talep_no||'')!==String(r.talep_no||'');});
            write(KEYS.requests,[r].concat(others));
          }catch(e){}
          return r;
        }
      }
    }
  }catch(e){console.warn('findRequestByNo refresh',e);}
  return r?applyLocalJobState(r):null;
}

async function startVoiceInput(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const ta=document.getElementById('reqDescription');
  if(!ta)return;
  if(!SR){
    alert('Bu tarayıcı sesli girişi desteklemiyor. Lütfen metni elle yazın.');
    return;
  }
  const btn=document.getElementById('voiceBtn');
  const resetBtn=function(){if(btn){btn.disabled=false;btn.textContent='🎤 Sesli anlat';}};
  try{
    if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
      try{
        const stream=await navigator.mediaDevices.getUserMedia({audio:true});
        try{stream.getTracks().forEach(function(tr){tr.stop();});}catch(e){}
      }catch(permErr){
        resetBtn();
        alert('Mikrofon izni gerekli. Tarayıcı ayarlarından mikrofona izin verip tekrar deneyin.');
        return;
      }
    }
    const rec=new SR();
    rec.lang='tr-TR';
    rec.interimResults=false;
    rec.continuous=false;
    rec.maxAlternatives=1;
    if(btn){btn.disabled=true;btn.textContent='Dinleniyor…';}
    rec.onresult=function(ev){
      let text='';
      try{
        if(ev.results){
          for(let i=0;i<ev.results.length;i++){
            if(ev.results[i]&&ev.results[i][0]&&ev.results[i][0].transcript){
              text+=(text?' ':'')+ev.results[i][0].transcript;
            }
          }
        }
      }catch(e){}
      text=(text||'').trim();
      if(text){
        ta.value=(ta.value?ta.value+' ':'')+text;
        const cc=document.getElementById('charCount');
        if(cc)cc.textContent=ta.value.length+'/1000';
        try{ta.dispatchEvent(new Event('input',{bubbles:true}));}catch(e){}
      }
    };
    rec.onerror=function(ev){
      const code=(ev&&ev.error)?String(ev.error):'';
      if(code==='aborted')return;
      if(code==='not-allowed'||code==='service-not-allowed'){
        alert('Mikrofon izni reddedildi. Tarayıcı adres çubuğundan mikrofona izin verin.');
      }else if(code==='no-speech'){
        alert('Ses algılanamadı. Lütfen tekrar deneyin veya metni yazın.');
      }else if(code==='network'){
        alert('Ses tanıma ağına ulaşılamadı. Bağlantınızı kontrol edip tekrar deneyin.');
      }else if(code==='audio-capture'){
        alert('Mikrofona erişilemedi. Cihaz mikrofonunu kontrol edin.');
      }else{
        alert('Sesli giriş hatası ('+code+'). Lütfen metni yazın veya tekrar deneyin.');
      }
    };
    rec.onend=function(){
      resetBtn();
    };
    rec.start();
  }catch(e){
    resetBtn();
    alert('Sesli giriş başlatılamadı. Lütfen metni yazın.');
  }
}

  var t=e.target;
  if(!t||!t.closest)return;
  var btn=t.closest('[data-open-talep]');
  if(btn){
    e.preventDefault();
    e.stopPropagation();
    var no=btn.getAttribute('data-open-talep');
    if(no&&typeof showRequestDetail==='function')showRequestDetail(no);
    return;
  }
  var card=t.closest('article.requestClickable[data-talep-no]');
  if(card&&!t.closest('a,button,input,textarea,select')){
    var no2=card.getAttribute('data-talep-no');
    if(no2&&typeof showRequestDetail==='function')showRequestDetail(no2);
  }
},false);

function authHeaders(token){return {"apikey":SUPABASE_KEY,"Authorization":"Bearer "+(token||SUPABASE_KEY),"Content-Type":"application/json"}}

function getAppTheme(){try{return localStorage.getItem('isimi-theme')||'dark';}catch(e){return 'dark';}}
function applyAppTheme(theme){const t=(theme==='light')?'light':'dark';document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('isimi-theme',t);}catch(e){}const btn=document.getElementById('themeToggleBtn');if(btn)btn.textContent=(t==='light')?'🌙 Koyu':'☀️ Açık';}

function updateAuthArea(){
 const el=document.getElementById("authArea"); if(!el)return;
 const session=getAuthSession();
 if(session?.user){
  currentAuthUser=session.user;
  el.innerHTML='<div class="authBar"><a class="a7ProfileChip" href="./marketplace-profile.html" title="Profil" aria-label="Profil"><span class="a7ProfileIcon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="7.5" r="4.2" fill="#ffffff"/><path fill="#ffffff" d="M4.5 19.2c.9-3.8 3.9-6 7.5-6s6.6 2.2 7.5 6c.12.5-.25.9-.75.9H5.25c-.5 0-.87-.4-.75-.9z"/></svg></span><span class="a7ProfileText">Profil</span></a><button class="authBtn" type="button" onclick="logoutUser()">Çıkış</button></div>';
 } else {
  currentAuthUser=null;
  el.innerHTML='<div class="authBar"><button class="authBtn" type="button" onclick="openAuthModal(\'login\')">Giriş</button><button class="authBtn primary" type="button" onclick="openAuthModal(\'signup\')">Kayıt Ol</button></div>';
 }
}
function openAuthModal(mode){
 document.getElementById("authModal")?.remove();
 const title=mode==='signup'?'Hesap oluştur':'Giriş yap';
 const button=mode==='signup'?'KAYIT OL':'GİRİŞ YAP';
 const switchText=mode==='signup'?'Zaten hesabın var mı?':'Hesabın yok mu?';
 const switchMode=mode==='signup'?'login':'signup';
 const switchLabel=mode==='signup'?'Giriş yap':'Kayıt ol';
 const html=`<div class="modal" id="authModal"><div class="modalCard"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2>${title}</h2><button class="authBtn" type="button" onclick="closeAuthModal()">Kapat</button></div><label>E-posta</label><input id="authEmail" type="email" autocomplete="email" placeholder="ornek@email.com"><label>Şifre</label><input id="authPassword" type="password" autocomplete="${mode==='signup'?'new-password':'current-password'}" placeholder="En az 6 karakter"><div id="authError"></div><button class="btn primary" id="authSubmit" type="button" onclick="submitAuth('${mode}')">${button}</button><p class="muted small" style="text-align:center;margin-bottom:0">${switchText} <button class="authBtn" type="button" onclick="openAuthModal('${switchMode}')">${switchLabel}</button></p></div></div>`;
 document.body.insertAdjacentHTML('beforeend',html);
 setTimeout(()=>document.getElementById('authEmail')?.focus(),50);
}
function closeAuthModal(){document.getElementById("authModal")?.remove()}
async function submitAuth(mode){
 const email=document.getElementById('authEmail')?.value.trim(); const password=document.getElementById('authPassword')?.value; const err=document.getElementById('authError'); const btn=document.getElementById('authSubmit');
 if(!email||!password){if(err)err.innerHTML='<div class="authError">E-posta ve şifre gerekli.</div>';return}
 if(password.length<6){if(err)err.innerHTML='<div class="authError">Şifre en az 6 karakter olmalı.</div>';return}
 btn.disabled=true;btn.textContent='BEKLEYİN...';
 try{
   let url=SUPABASE_URL+'/auth/v1/'+(mode==='signup'?'signup':'token?grant_type=password');
   const r=await fetch(url,{method:'POST',headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});
   const data=await r.json().catch(()=>({}));
   if(!r.ok)throw new Error(data.error_description||data.msg||data.message||'Kimlik doğrulama başarısız.');
   if(mode==='signup' && !data.access_token){
      closeAuthModal(); alert('Kayıt tamamlandı. E-posta doğrulaması açıksa gelen kutunu kontrol et, ardından giriş yap.'); return;
   }
   saveAuthSession(data); closeAuthModal(); alert(mode==='signup'?'Hesap oluşturuldu. ✓':'Giriş başarılı. ✓');
 }catch(e){if(err)err.innerHTML='<div class="authError">'+escapeHTML(e.message||String(e))+'</div>';}finally{if(btn){btn.disabled=false;btn.textContent=buttonText(mode)}}
}
function buttonText(mode){return mode==='signup'?'KAYIT OL':'GİRİŞ YAP'}
function logoutUser(){saveAuthSession(null);alert('Çıkış yapıldı.')}
updateAuthArea();

function normalizeCaseSteps(rows){const byKey={};(Array.isArray(rows)?rows:[]).forEach(r=>{if(r&&r.step_key)byKey[r.step_key]=r;});return activeStepTemplate().map(t=>byKey[t.key]||({...t,key:t.key,step_key:t.key,title:t.title,description:t.description,sort_order:t.sort_order,institution:t.institution,status:'pending',id:null,is_optional:false,metadata:{},completed_at:null}));}
