const SUPABASE_KEY =

/*
 IMPORTANT:
 Bu anahtar frontend'de kullanılabilen publishable/anon anahtardır.
 Service-role key ASLA buraya konulmamalıdır.
*/

const DISTRICTS=[

 "Foça","Gaziemir","Güzelbahçe","Karabağlar","Karaburun",
 "Karşıyaka","Kemalpaşa","Kınık","Kiraz","Konak",
 "Menemen","Menderes","Narlıdere","Ödemiş","Seferihisar",

/* ============================================================
   TEMEL YARDIMCILAR
   ============================================================ */

function esc(v){
 return String(v??"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function jsonAttr(obj){
 return JSON.stringify(obj).replaceAll("'","&#039;");
}

function app(html){
 document.getElementById("app").innerHTML=html;
 window.scrollTo(0,0);
}

function nav(id){
 [
  "navHome",
  "navRequest",
  "navRequests",
  "navProvider"
 ].forEach(x=>{
  document.getElementById(x)?.classList.remove("active");
 });

 document.getElementById(id)?.classList.add("active");
}

function connection(ok,text){
 const e=document.getElementById("connectionStatus");

 e.className="connection "+(ok?"online":"offline");

 e.textContent=
  text||
  (ok?"Supabase bağlı ✓":"Supabase bağlantısı yok");
}

function norm(v){
 return String(v??"")
  .trim()
  .toLocaleLowerCase("tr-TR")
  .normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"");
}

function isUUID(v){
 return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
  .test(String(v||"").trim());
}

function serviceKey(v){
 const n=norm(v);

 for(const [k,s] of Object.entries(SERVICES)){
  if(n===norm(k)||n===norm(s.name)) return k;
 }

 return String(v??"").trim();
}

function serviceOptions(sel=""){
 return `

  Object.entries(SERVICES).map(([k,s])=>
   `<option value="${esc(k)}" ${k===sel?"selected":""}>
    ${s.emoji} ${esc(s.name)}
   </option>`
  ).join("")
 }
 `;
}

function districtOptions(sel=""){
 return `
 <option value="">İlçe seç</option>
 ${
  DISTRICTS.map(d=>

    ${esc(d)}
   </option>`
  ).join("")
 }
 `;
}


/* ============================================================
   SUPABASE REST
   ============================================================ */

async function sb(method,path,body=null){

 const headers={
  apikey:SUPABASE_KEY,
  Authorization:"Bearer "+SUPABASE_KEY,
  Accept:"application/json"
 };

 const options={
  method,
  headers
 };

 if(body!==null){
  headers["Content-Type"]="application/json";
  headers["Prefer"]="return=representation";
  options.body=JSON.stringify(body);
 }

 const response=
  await fetch(
   SUPABASE_URL+"/rest/v1/"+path,
   options
  );

 const text=await response.text();

 let data=null;

 try{
  data=text?JSON.parse(text):null;
 }catch(_){
  data=text;
 }

 if(!response.ok){
  throw new Error(
   data?.message||
   data?.details||
   data?.hint||
   ("Supabase HTTP "+response.status)
  );
 }

 return data;
}


/* ============================================================
   SUPABASE AUTH REST
   ============================================================ */

function authHeaders(accessToken=null){

 const h={
  apikey:SUPABASE_KEY,
  "Content-Type":"application/json"
 };

 if(accessToken){
  h.Authorization="Bearer "+accessToken;
 }

 return h;
}

async function authRequest(path,method="GET",body=null,token=null){

 const options={
  method,
  headers:authHeaders(token)
 };

 if(body!==null){
  options.body=JSON.stringify(body);
 }

 const response=
  await fetch(
   SUPABASE_URL+"/auth/v1/"+path,
   options
  );

 const text=await response.text();

 let data=null;

 try{
  data=text?JSON.parse(text):null;
 }catch(_){
  data=text;
 }

 if(!response.ok){
  throw new Error(
   data?.msg||
   data?.message||
   data?.error_description||
   data?.error||
   ("Auth HTTP "+response.status)
  );
 }

 return data;
}


/* ============================================================
   SESSION
   ============================================================ */

function saveSession(session){

 if(!session){
  localStorage.removeItem("isimicoz_session");
  CURRENT_SESSION=null;
  CURRENT_USER=null;
  updateUserArea();
  return;
 }

 CURRENT_SESSION=session;
 CURRENT_USER=session.user||null;

 localStorage.setItem(
  "isimicoz_session",
  JSON.stringify(session)
 );

 updateUserArea();
}

function getSavedSession(){

 try{
  const raw=localStorage.getItem("isimicoz_session");

  if(!raw)return null;

  const session=JSON.parse(raw);

  if(
   !session?.access_token||
   !session?.user?.id
  ){
   return null;
  }

  return session;

 }catch(_){
  return null;
 }
}

async function restoreSession(){

 const saved=getSavedSession();

 if(!saved){
  CURRENT_SESSION=null;
  CURRENT_USER=null;
  updateUserArea();
  return null;
 }

 try{

  const data=
   await authRequest(
    "user",
    "GET",
    null,
    saved.access_token
   );

  const session={
   ...saved,
   user:data
  };

  saveSession(session);

  return session;

 }catch(e){

  console.warn("Oturum yenilenemedi:",e);

  localStorage.removeItem("isimicoz_session");

  CURRENT_SESSION=null;
  CURRENT_USER=null;

  updateUserArea();

  return null;
 }
}


/* ============================================================
   PROFILE
   ============================================================ */

async function getProfile(){

 if(!CURRENT_USER?.id)return null;

 try{

  const rows=
   await sb(
    "GET",
    "profiles?id=eq."+encodeURIComponent(CURRENT_USER.id)+"&select=*&limit=1"
   );

  return Array.isArray(rows)?rows[0]||null:null;

 }catch(e){

  console.warn("Profil okunamadı:",e);

  return null;
 }
}

async function ensureProfile(){

 if(!CURRENT_USER?.id)return null;

 const existing=await getProfile();

 if(existing)return existing;

 try{

  const metadata=
   CURRENT_USER.user_metadata||{};

  const payload={
   id:CURRENT_USER.id,
   full_name:
    metadata.full_name||
    metadata.name||
    "",
   phone:
    metadata.phone||
    "",
   role:
    ["customer","provider","admin"]
     .includes(metadata.role)
     ?metadata.role
     :"customer"
  };

  const rows=
   await sb(
    "POST",
    "profiles",
    payload
   );

  return Array.isArray(rows)?rows[0]:rows;

 }catch(e){

  console.warn(
   "Profil oluşturulamadı:",
   e
  );

  return null;
 }
}

async function registerUser(){

 if(!name)

 if(!email)

async function createRequest(){

 if(!CURRENT_USER){
  alert("Talep oluşturmak için giriş yapmalısın.");
  showAuth("login");
  return;
 }

 const category=
  document.getElementById("category").value;

 const description=
  document.getElementById("description").value.trim();

 const district=
  document.getElementById("district").value;

 const neighborhood=
  document.getElementById("neighborhood").value.trim();

 const urgency=
  document.getElementById("urgency").value;

 if(!category)
  return alert("Lütfen hizmet kategorisini seç.");

 if(description.length<5)
  return alert("Lütfen ihtiyacını daha açık anlat.");

 if(!district)
  return alert("Lütfen ilçe seç.");

 const btn=document.getElementById("createBtn");

 btn.disabled=true;
 btn.textContent="KAYDEDİLİYOR...";

 try{

  const payload={
   customer_id:CURRENT_USER.id,
   category_id:category,
   description,
   district,
   neighborhood:neighborhood||null,
   urgency,
   status:"pending"
  };

  const rows=
   await sb(
    "POST",
    "requests",
    payload
   );

  const row=
   Array.isArray(rows)?rows[0]:rows;

  if(!row?.id)
   throw new Error(
    "Talep kaydedildi ancak UUID alınamadı."
   );

  connection(true);

  alert("Talep başarıyla oluşturuldu. ✓");

  showRequestDetail(row.id);

 }catch(e){

  console.error(e);

  alert(
   "Talep oluşturulamadı.\n\n"+
   friendlyErrorMessage(e)
  );

 }finally{

  btn.disabled=false;
  btn.textContent="TALEBİ OLUŞTUR";
 }
}

function requestService(r){
 return serviceKey(r.category_id);
}

function requestStatusLabel(status,offerCount){

 if(status==="accepted")
  return{
   label:"Teklif Kabul Edildi",
   cls:"accepted"
  };

 if(status==="completed")
  return{
   label:"Tamamlandı",
   cls:"completed"
  };

 if(status==="cancelled")
  return{
   label:"İptal",
   cls:"cancelled"
  };

 if(offerCount>0)
  return{
   label:"Teklif Geldi",
   cls:"offered"
  };

 return{
  label:"Beklemede",
  cls:"pending"
 };
}

}

function offerFilter(o){

  o.id!==undefined&&
  o.id!==null&&
  o.id!==""

 }

 return (
  "request_id=eq."+

  "&provider_id=eq."+
  encodeURIComponent(o.provider_id)+
  "&created_at=eq."+
  encodeURIComponent(o.created_at)
 );
}

async function loadProvidersByIds(ids){

 const clean=[
  ...new Set(
   ids.filter(isUUID)
  )
 ];

 if(!clean.length)return [];

 try{

  const rows=
   await sb(
    "GET",
    "providers?select=id,name,district,phone&id=in.("+
    clean.join(",")+
    ")"
   );

  return Array.isArray(rows)?rows:[];

 }catch(e){

  console.warn(
   "Sağlayıcı bilgisi okunamadı:",
   e
  );

  return [];
 }
}

 }

 if(!confirm(

 ))return;

 }

 try{

   }
  );

  if(
   offer.id!==undefined&&
   offer.id!==null&&
   offer.id!==""

     "PATCH",
     "offers?request_id=eq."+

    );
   }
  }

  await sb(
   "PATCH",
   "requests?id=eq."+
   encodeURIComponent(requestId),
   {
    status:"accepted"
   }
  );

  connection(true);

  alert("Teklif kabul edildi ✓");

  showRequestDetail(requestId);

  console.error(e);

  alert(
   "Teklif kabul edilemedi.\n\n"+
   friendlyErrorMessage(e)
  );

  if(btnEl){
   btnEl.disabled=false;
   btnEl.textContent="✅ TEKLİFİ KABUL ET";
  }

}

function parseServices(v){

 if(Array.isArray(v))return v;

 if(typeof v==="string"){

  try{

   const x=JSON.parse(v);

   if(Array.isArray(x))
    return x;

  }catch(_){}

  return v
   .split(",")
   .map(x=>x.trim())
   .filter(Boolean);
 }

 return [];
}

function providerNameService(p){

 return parseServices(p.services)
  .map(
   x=>
    SERVICES[
     serviceKey(x)
    ]?.name||x
  );
}

function providerMatches(p,r){

 if(p.active===false)
  return false;

 const ps=
  parseServices(p.services)
   .map(serviceKey);

 const wanted=
  serviceKey(r.category_id);

 const serviceOK=
  !ps.length||
  ps.includes(wanted);

 const districtOK=
  !p.district||
  norm(p.district)===norm(r.district);

 return serviceOK&&districtOK;
}

   — verdiğim teklifler.
  </h1>

  <div
   id="providerOffersArea"
   class="card"
   style="text-align:center">
   ⏳ Teklifler yükleniyor...
  </div>
 `);

 try{

  const offers=
   await loadOffersByProvider(
    provider.id
   );

  const area=
   document.getElementById(
    "providerOffersArea"
   );

  if(!area)return;

  if(!offers.length){

   area.innerHTML=`
    <div class="empty">

     📑 Henüz teklif vermediniz.

     <br>

     <span class="small muted">
      Uygun bir talebe teklif verdiğinizde
      burada görünecek.
     </span>

    </div>
   `;

   return;
  }

  const requests=
   await loadRequestsByIds(
    offers.map(o=>o.request_id)
   );

  const requestById=
   Object.fromEntries(
    requests.map(r=>[
     String(r.id),
     r
    ])
   );

  area.outerHTML=
   offers
    .map(o=>
     providerOfferCard(
      o,
      requestById[
       String(o.request_id)
      ]
     )
    )
    .join("");

 }catch(e){

  const area=
   document.getElementById(
    "providerOffersArea"
   );

  if(area){

   area.innerHTML=`
    <div class="error">
     Teklifler yüklenemedi:<br>
     ${esc(friendlyErrorMessage(e))}
    </div>
   `;
  }
 }
}

function providerRequestCard(r,p){

 const k=
  requestService(r);

 const s=
  SERVICES[k]||
  {
   name:r.category_id||"Hizmet",
   emoji:"🛠️"
  };

 return `
  <article class="request">

   <div class="requestTop">

    <div>

     <h3>
      ${s.emoji} ${esc(s.name)}
     </h3>

     <div class="small muted">
      Talep UUID: ${esc(r.id)}
     </div>

    </div>

    <span class="status">
     ${esc(r.urgency||r.status||"pending")}
    </span>

   </div>

   <div class="description">
    ${esc(r.description||"")}
   </div>

   <div class="meta">

    <span>
     📍 ${esc(r.district||"")}
    </span>

    ${
     r.neighborhood
     ?`<span>
         🏘️ ${esc(r.neighborhood)}
       </span>`
     :""
    }

   </div>

   <button
    class="btn primary"
    onclick="openOffer(
     '${esc(r.id)}',

    )">
    💰 TEKLİF VER

  </article>
 `;
}

async function loadOffers(requestId){

 if(!isUUID(requestId))
  return [];

 try{

  const rows=
   await sb(
    "GET",
    "offers?request_id=eq."+
    encodeURIComponent(requestId)+
    "&select=*&order=created_at.desc"
   );

  return Array.isArray(rows)?rows:[];

 }catch(e){

  console.warn(
   "Teklif okunamadı:",
   e
  );

  return [];
 }
}

function openOffer(
 requestId,
 providerId,
 serviceName
){

 if(!isUUID(requestId)){

  alert(
   "Talep kimliği geçersiz."
  );

  return;
 }

 if(!isUUID(providerId)){

  alert(
   "Hizmet sağlayıcının gerçek UUID kimliği bulunamadı."
  );

  return;
 }

 const m=
  document.createElement("div");

 m.id="offerModal";

 m.className="modal";

 m.innerHTML=`

  <div class="formCard modalInner">

   <div class="sectionTitle">

    <div>

     <span class="badge">
      💰 TEKLİF OLUŞTUR
     </span>

     <h2>
      ${esc(serviceName)}
     </h2>

    </div>

    <button
     class="btn secondary smallBtn"
     style="width:auto"
     onclick="this.closest('#offerModal').remove()">
     ✕
    </button>

   </div>

   <label>
    Teklif fiyatı (TL) *
   </label>

   <input
    id="offerPrice"
    type="number"
    min="1"
    step="1"
    placeholder="Örn. 1500">

   <label>
    Müsait olduğunuz zaman *
   </label>

   <input
    id="offerTime"
    maxlength="200"
    placeholder="Örn. Bugün 18:00">

   <label>Mesajınız</label>

   <textarea
    id="offerNote"
    maxlength="1000"
    placeholder="İşin nasıl yapılacağını veya önemli bilgileri yazabilirsiniz.">
   </textarea>

   <button
    class="btn primary"
    id="offerBtn"
    onclick="sendOffer(
     '${esc(requestId)}',
     '${esc(providerId)}'
    )">
    TEKLİFİ GÖNDER
   </button>

  </div>
 `;

}

async function sendOffer(
 requestId,
 providerId
){

 if(!CURRENT_USER){

  alert(
   "Teklif verebilmek için giriş yapmalısın."
  );

  return;
 }

 const priceRaw=
  document.getElementById(
   "offerPrice"
  ).value.trim();

 const price=Number(priceRaw);

 const available_time=
  document.getElementById(
   "offerTime"
  ).value.trim();

 const note=
  document.getElementById(
   "offerNote"
  ).value.trim()||
  null;

 const b=
  document.getElementById("offerBtn");

 if(
  !priceRaw||
  !Number.isFinite(price)||
  price<=0
 ){

  alert(
   "Lütfen geçerli bir teklif fiyatı gir."
  );

  return;
 }

 if(!available_time){

  alert(
   "Müsait olduğunuz zamanı yazın."
  );

  return;
 }

 if(
  !isUUID(requestId)||
  !isUUID(providerId)
 ){

  alert(
   "Teklif için geçerli UUID gerekli."
  );

  return;
 }

 b.disabled=true;
 b.textContent="GÖNDERİLİYOR...";

 try{

  /*
   Sağlayıcının gerçekten bu Auth hesabına ait olduğunu
   uygulama seviyesinde kontrol et.
  */

  const providerRows=
   await sb(
    "GET",
    "providers?id=eq."+
    encodeURIComponent(providerId)+
    "&select=id,user_id&limit=1"
   );

  const provider=
   Array.isArray(providerRows)
   ?providerRows[0]
   :null;

  if(!provider){

   throw new Error(
    "Sağlayıcı bulunamadı."
   );
  }

  if(
   provider.user_id&&
   String(provider.user_id)!==
   String(CURRENT_USER.id)
  ){

   throw new Error(
    "Bu sağlayıcı hesabıyla teklif verme yetkiniz yok."
   );
  }

  await sb(
   "POST",
   "offers",
   {
    request_id:requestId,
    provider_id:providerId,
    price,
    available_time,
    note,
    status:"pending"
   }
  );

  connection(true);

  document
   .getElementById("offerModal")
   ?.remove();

  alert(
   "Teklif başarıyla gönderildi. ✓"
  );

  showProviderPanel(
   CURRENT_PROVIDER
  );

 }catch(e){

  console.error(e);

  alert(
   "Teklif gönderilemedi.\n\n"+
   friendlyErrorMessage(e)
  );

  b.disabled=false;
  b.textContent="TEKLİFİ GÖNDER";
 }
}


/* ============================================================
   HATA MESAJLARI
   ============================================================ */

function friendlyErrorMessage(e){

 const raw=
  String(e?.message||e||"");

 const low=
  raw.toLocaleLowerCase("tr-TR");

 let friendly=
  "İşlem tamamlanamadı. Lütfen tekrar deneyin.";

 if(
  low.includes("failed to fetch")||
  low.includes("networkerror")||
  low.includes("load failed")
 ){

  friendly=
   "İnternet bağlantısı kurulamadı. "+
   "Bağlantınızı kontrol edip tekrar deneyin.";

 }else if(
  low.includes("invalid login credentials")
 ){

  friendly=
   "E-posta veya şifre hatalı.";

 }else if(
  low.includes("email not confirmed")
 ){

  friendly=
   "E-posta adresiniz henüz doğrulanmamış.";

 }else if(
  low.includes("user already registered")
 ){

  friendly=
   "Bu e-posta adresiyle zaten bir hesap bulunuyor.";

 }else if(
  low.includes("password should be at least")
 ){

  friendly=
   "Şifre çok kısa.";

 }else if(
  low.includes("permission denied")
 ){

  friendly=
   "Bu işlem için yetkiniz yok.";

 }else if(
  low.includes("duplicate key")
 ){

  friendly=
   "Bu kayıt zaten mevcut.";

 }else if(
  low.includes("not-null")
 ){

  friendly=
   "Zorunlu bir alan boş bırakılmış.";

 }else if(
  low.includes("timeout")
 ){

  friendly=
   "Sunucudan yanıt alınamadı.";
 }

 return friendly+
  (
   raw
   ?`\n\nTeknik detay: ${raw}`
   :""
  );
}
