<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>İşimi Çöz — İzmir Pilot</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#07111f;color:#eef4fb;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

:root{
 --bg:#07111f;
 --card:#0d1a2b;
 --card2:#102238;
 --line:#20344d;
 --text:#eef4fb;
 --muted:#9eb0c5;
 --primary:#19c37d;
 --primary2:#0fa968;
 --danger:#ef5350;
 --warning:#f5b942;
 --blue:#4da3ff;
}

.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:88px}

.top{
 padding:18px 16px 14px;
 border-bottom:1px solid var(--line);
 background:rgba(7,17,31,.96);
 position:sticky;
 top:0;
 z-index:20;
}

.brand{display:flex;align-items:center;gap:10px}
.logo{
 width:38px;height:38px;border-radius:12px;
 background:linear-gradient(135deg,var(--primary),#36a3ff);
 display:grid;place-items:center;font-size:21px;font-weight:900;color:#03120d
}
.brand strong{font-size:18px}
.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}

main{padding:16px}

.hero{
 background:linear-gradient(145deg,#10243a,#0b1727);
 border:1px solid var(--line);
 border-radius:24px;
 padding:24px 20px;
 margin-bottom:16px;
}
.badge{
 display:inline-flex;align-items:center;gap:6px;
 padding:7px 10px;border-radius:99px;
 background:rgba(25,195,125,.12);
 border:1px solid rgba(25,195,125,.28);
 color:#6df0b5;font-size:12px;font-weight:700;
}
h1{font-size:31px;line-height:1.08;margin:16px 0 10px}
h2{font-size:22px;margin:0 0 8px}
h3{font-size:16px;margin:0 0 6px}
p{line-height:1.55}
.muted{color:var(--muted)}
.small{font-size:12px}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}

.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:18px;
 padding:16px;
}

.service{
 min-height:130px;
 transition:.15s transform,.15s border-color;
}
.service:active{transform:scale(.98)}
.service .emoji{font-size:28px}
.service strong{display:block;margin-top:9px;font-size:16px}
.service span{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:5px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.btn{
 width:100%;border:0;border-radius:14px;padding:14px 15px;
 font-weight:800;
}
.btn.primary{background:var(--primary);color:#03130d}
.btn.secondary{background:#14263b;color:var(--text);border:1px solid var(--line)}
.btn.blue{background:#256cae;color:white}
.btn.danger{background:#4a1f25;color:#ffb5b3;border:1px solid #6a2b32}
.btn.smallBtn{padding:10px 12px;font-size:13px}

.section{margin-top:18px}
.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}

.formCard{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:20px;
 padding:18px;
 margin-bottom:14px;
}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}
input,select,textarea{
 width:100%;
 background:#081523;
 color:var(--text);
 border:1px solid #29415d;
 border-radius:12px;
 padding:13px;
 outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
textarea{min-height:120px;resize:vertical}
select{appearance:auto}

.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{
 display:flex;align-items:center;gap:8px;
 background:#091827;border:1px solid var(--line);
 padding:10px;border-radius:12px;
 font-size:13px;
}
.check input{width:auto}

.notice{
 background:#0b2030;
 border:1px solid #1e4c66;
 color:#b9ddf2;
 padding:12px;
 border-radius:13px;
 font-size:12px;
 line-height:1.5;
 margin:12px 0;
}

.success{
 background:#0b2b20;
 border:1px solid #185d43;
 color:#8bf1c4;
 padding:12px;border-radius:13px;font-size:13px;
}
.warning{
 background:#30260e;
 border:1px solid #65501a;
 color:#f5d77c;
 padding:12px;border-radius:13px;font-size:13px;
}

.request{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:18px;
 padding:16px;
 margin-bottom:11px;
}
.requestTop{display:flex;justify-content:space-between;gap:10px}
.status{
 padding:5px 9px;border-radius:99px;
 background:rgba(245,185,66,.12);
 color:#ffd76b;font-size:11px;font-weight:800;
 height:max-content;
}
.meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:12px;margin:10px 0}
.meta span{background:#091827;padding:6px 8px;border-radius:8px}
.description{
 background:#091827;border-radius:12px;padding:11px;
 font-size:13px;line-height:1.5;
 margin:10px 0;
}

.profileHeader{
 display:flex;align-items:center;gap:13px;
 padding:16px;background:var(--card);
 border:1px solid var(--line);border-radius:18px;
}
.avatar{
 width:52px;height:52px;border-radius:50%;
 display:grid;place-items:center;
 background:#17334d;font-weight:900;font-size:18px
}
.activeDot{
 width:9px;height:9px;background:var(--primary);
 border-radius:50%;display:inline-block;margin-right:5px
}

.empty{text-align:center;padding:28px 15px;color:var(--muted)}

.bottom{
 position:fixed;bottom:0;left:0;right:0;
 background:rgba(7,17,31,.97);
 border-top:1px solid var(--line);
 z-index:30;
}
.bottomInner{
 max-width:760px;margin:auto;
 display:grid;grid-template-columns:repeat(4,1fr);
}
.navBtn{
 border:0;background:transparent;color:#8fa3b9;
 padding:11px 4px 10px;font-size:10px;
}
.navBtn b{display:block;font-size:19px;margin-bottom:3px}
.navBtn.active{color:var(--primary)}

.back{margin-bottom:12px}
.hidden{display:none!important}

@media(max-width:430px){
 main{padding:12px}
 .hero{padding:20px 16px}
 h1{font-size:27px}
 .grid{gap:8px}
 .service{padding:13px;min-height:122px}
 .row{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="app">

<header class="top">
  <div class="brand">
    <div class="logo">✓</div>
    <div>
      <strong>İŞİMİ ÇÖZ</strong>
      <small>İzmir Pilot Bölgesi</small>
    </div>
  </div>
</header>

<main id="app"></main>

</div>

<nav class="bottom">
 <div class="bottomInner">
   <button class="navBtn" id="navHome" onclick="showHome()"><b>⌂</b>ANA</button>
   <button class="navBtn" id="navRequest" onclick="showRequest()"><b>＋</b>TALEP</button>
   <button class="navBtn" id="navRequests" onclick="showRequests()"><b>▣</b>TALEPLER</button>
   <button class="navBtn" id="navProvider" onclick="showProviderEntry()"><b>🛠️</b>HİZMET VER</button>
 </div>
</nav>

<script>
/* =========================================================
   İŞİMİ ÇÖZ
   Tek dosyalık İzmir pilot sürüm
   ========================================================= */

const SERVICES = {
  klima:{name:"Klima",emoji:"❄️",desc:"Bakım, montaj, arıza ve temizlik"},
  elektrik:{name:"Elektrik",emoji:"⚡",desc:"Arıza, priz, tesisat ve aydınlatma"},
  tesisat:{name:"Tesisat",emoji:"🔧",desc:"Su, gider, musluk ve kaçak sorunları"},
  beyaz:{name:"Beyaz Eşya",emoji:"🧊",desc:"Çamaşır, bulaşık, buzdolabı ve fırın"},
  temizlik:{name:"Temizlik",emoji:"🧹",desc:"Ev, ofis ve detaylı temizlik"},
  nakliye:{name:"Nakliye",emoji:"🚚",desc:"Ev, ofis ve parça eşya taşıma"},
  cilingir:{name:"Çilingir",emoji:"🔐",desc:"Kilit, anahtar ve acil giriş"},
  oto:{name:"Oto",emoji:"🚗",desc:"Arıza, bakım, lastik ve yol yardımı"}
};

const DISTRICTS = [
 "Aliağa","Balçova","Bayındır","Bayraklı","Bergama","Beydağ",
 "Bornova","Buca","Çeşme","Çiğli","Dikili","Foça","Gaziemir",
 "Güzelbahçe","Güzelbahçe","Karabağlar","Karaburun","Karşıyaka",
 "Kemalpaşa","Kınık","Kiraz","Konak","Menderes","Menemen",
 "Narlıdere","Ödemiş","Seferihisar","Selçuk","Tire","Torbalı","Urla"
];

const KEYS = {
 requests:"isimi_coz_requests_v3",
 provider:"isimi_coz_provider_v3",
 providerLogged:"isimi_coz_provider_logged_v3"
};

function read(key, fallback){
 try{
   const raw=localStorage.getItem(key);
   return raw ? JSON.parse(raw) : fallback;
 }catch(e){return fallback}
}

function write(key,value){
 localStorage.setItem(key,JSON.stringify(value));
}

function getRequests(){return read(KEYS.requests,[])}
function getProvider(){return read(KEYS.provider,null)}
function providerLogged(){return read(KEYS.providerLogged,false)}

function escapeHTML(value){
 return String(value ?? "")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function uid(prefix){
 return prefix+"-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,7).toUpperCase();
}

function setNav(active){
 ["navHome","navRequest","navRequests","navProvider"].forEach(id=>{
   document.getElementById(id).classList.remove("active");
 });
 if(active) document.getElementById(active).classList.add("active");
}

function app(html){
 document.getElementById("app").innerHTML=html;
 window.scrollTo({top:0,behavior:"instant"});
}

function districtOptions(selected=""){
 return `<option value="">İlçe seç</option>`+
 DISTRICTS.filter((v,i,a)=>a.indexOf(v)===i).map(d=>
   `<option value="${escapeHTML(d)}" ${d===selected?"selected":""}>${escapeHTML(d)}</option>`
 ).join("");
}

function serviceOptions(selected=""){
 return `<option value="">Kategori seç</option>`+
 Object.entries(SERVICES).map(([key,s])=>
   `<option value="${key}" ${key===selected?"selected":""}>${s.emoji} ${s.name}</option>`
 ).join("");
}

/* ================= HOME ================= */

function showHome(){
 setNav("navHome");

 app(`
 <section class="hero">
   <span class="badge">📍 İZMİR PİLOT BÖLGESİ</span>
   <h1>İhtiyacın varsa,<br>çözümü var.</h1>
   <p class="muted">
     Ev, iş yeri, araç ve günlük yaşam hizmetlerini tek yerden bul.
     İhtiyacını anlat, talebini oluştur.
   </p>

   <div class="actions">
     <button class="btn primary" onclick="showRequest()">📢 İşimi Çözdür</button>
     <button class="btn secondary" onclick="showProviderEntry()">🛠️ Hizmet Ver</button>
   </div>
 </section>

 <div class="section">
   <div class="sectionTitle">
     <h2>Hizmet kategorileri</h2>
     <span class="small muted">İzmir</span>
   </div>

   <div class="grid">
     ${Object.entries(SERVICES).map(([key,s])=>`
       <button class="card service" onclick="showRequest('${key}')">
         <div class="emoji">${s.emoji}</div>
         <strong>${s.name}</strong>
         <span>${s.desc}</span>
       </button>
     `).join("")}
   </div>
 </div>

 <div class="section card">
   <h2>💡 Nasıl çalışıyor?</h2>
   <p class="muted small">
     İhtiyacını oluştur. Sistem hizmet kategorisi ve bölgeye göre
     uygun hizmet sağlayıcılarını belirlemek üzere talebini kaydeder.
     Pilot aşamada kayıtlar cihaz üzerinde tutulur.
   </p>
 </div>
 `);
}

/* ================= CUSTOMER REQUEST ================= */

function showRequest(preselected=""){
 setNav("navRequest");

 app(`
 <div class="back">
   <button class="btn secondary smallBtn" onclick="showHome()">← Ana sayfaya dön</button>
 </div>

 <div class="formCard">
   <span class="badge">📋 YENİ HİZMET TALEBİ</span>
   <h1>İhtiyacını anlat.</h1>
   <p class="muted small">
     Ne yapılması gerektiğini mümkün olduğunca açık anlat.
     Böylece uygun hizmet sağlayıcılarını daha doğru eşleştirebiliriz.
   </p>

   <label>Hizmet kategorisi *</label>
   <select id="reqService">${serviceOptions(preselected)}</select>

   <label>Sorunun / ihtiyacın *</label>
   <textarea id="reqDescription" maxlength="1000"
     placeholder="Örneğin: Klima çalışıyor fakat yeterince soğutmuyor."></textarea>
   <div class="small muted" id="charCount">0/1000</div>

   <label>Fotoğraf</label>
   <input id="reqPhoto" type="file" accept="image/*">
   <div class="small muted">Fotoğraf seçmek şimdilik cihaz üzerinde saklanmaz; sonraki aşamada sunucuya bağlanacaktır.</div>

   <div class="row">
     <div>
       <label>İlçe *</label>
       <select id="reqDistrict">${districtOptions()}</select>
     </div>
     <div>
       <label>Mahalle</label>
       <input id="reqNeighborhood" placeholder="Mahalle adı">
     </div>
   </div>

   <label>Ne zaman gerekli?</label>
   <select id="reqUrgency">
     <option value="Acil">🔴 Acil</option>
     <option value="Bugün" selected>🟡 Bugün</option>
     <option value="Uygun zamanda">🟢 Uygun zamanda</option>
   </select>

   <label>Adınız *</label>
   <input id="reqName" placeholder="Adınız">

   <label>Telefon *</label>
   <input id="reqPhone" type="tel" placeholder="05xxxxxxxxx">

   <div class="notice">
     🔒 Pilot sürüm: Talepler şu anda bu cihazda yerel olarak saklanır.
     Gerçek çoklu cihaz sistemi sonraki aşamada bağlanacaktır.
   </div>

   <button class="btn primary" onclick="createRequest()">TALEBİ OLUŞTUR</button>
 </div>
 `);

 const ta=document.getElementById("reqDescription");
 ta.addEventListener("input",()=>{
   document.getElementById("charCount").textContent=ta.value.length+"/1000";
 });
}

function createRequest(){
 const service=document.getElementById("reqService").value;
 const description=document.getElementById("reqDescription").value.trim();
 const district=document.getElementById("reqDistrict").value;
 const neighborhood=document.getElementById("reqNeighborhood").value.trim();
 const urgency=document.getElementById("reqUrgency").value;
 const name=document.getElementById("reqName").value.trim();
 const phone=document.getElementById("reqPhone").value.trim();

 if(!service){alert("Lütfen hizmet kategorisini seç.");return}
 if(description.length<5){alert("Lütfen ihtiyacınızı biraz daha açık anlat.");return}
 if(!district){alert("Lütfen ilçe seç.");return}
 if(!name){alert("Lütfen adınızı yaz.");return}
 if(!phone){alert("Lütfen telefon numaranızı yaz.");return}

 const requests=getRequests();

 const item={
   id:uid("IC"),
   service,
   description,
   district,
   neighborhood,
   urgency,
   name,
   phone,
   createdAt:new Date().toISOString(),
   status:"Beklemede"
 };

 requests.unshift(item);
 write(KEYS.requests,requests);

 alert("Talebiniz oluşturuldu. Talep numaranız: "+item.id);
 showRequests();
}

/* ================= CUSTOMER REQUESTS ================= */

function showRequests(){
 setNav("navRequests");

 const requests=getRequests();

 app(`
 <div class="back">
   <button class="btn secondary smallBtn" onclick="showHome()">← Ana sayfaya dön</button>
 </div>

 <div class="sectionTitle">
   <div>
     <span class="badge">▣ TALEPLERİM</span>
     <h1>Oluşturduğun talepler.</h1>
   </div>
 </div>

 <p class="muted small">
   Bu cihaz üzerinden oluşturduğun hizmet talepleri burada görünür.
 </p>

 ${requests.length ? requests.map(renderRequest).join("") : `
   <div class="card empty">
     <div style="font-size:35px">📋</div>
     <h3>Henüz talep yok</h3>
     <p>İhtiyacını anlat, ilk talebini oluştur.</p>
     <button class="btn primary" onclick="showRequest()">＋ Talep oluştur</button>
   </div>
 `}
 `);
}

function renderRequest(r){
 const s=SERVICES[r.service] || {name:r.service,emoji:"🛠️"};

 return `
 <article class="request">
   <div class="requestTop">
     <div>
       <h3>${s.emoji} ${escapeHTML(s.name)}</h3>
       <div class="small muted">${formatDate(r.createdAt)}</div>
     </div>
     <span class="status">${escapeHTML(r.status || "Beklemede")}</span>
   </div>

   <div class="description">“${escapeHTML(r.description)}”</div>

   <div class="meta">
     <span>📍 ${escapeHTML(r.district)}</span>
     ${r.neighborhood?`<span>🏘️ ${escapeHTML(r.neighborhood)}</span>`:""}
     <span>⏱️ ${escapeHTML(r.urgency)}</span>
   </div>

   <div class="small muted">
     Talep No: <strong>${escapeHTML(r.id)}</strong>
   </div>
 </article>
 `;
}

/* ================= PROVIDER ENTRY ================= */

function showProviderEntry(){
 setNav("navProvider");

 const provider=getProvider();

 if(provider && providerLogged()){
   showProviderPanel();
   return;
 }

 if(provider){
   app(`
    <div class="back">
      <button class="btn secondary smallBtn" onclick="showHome()">← Ana sayfaya dön</button>
    </div>

    <div class="formCard">
      <span class="badge">🛠️ HİZMET SAĞLAYICI</span>
      <h1>Tekrar hoş geldin.</h1>

      <div class="profileHeader">
        <div class="avatar">${escapeHTML((provider.name||"U").charAt(0).toUpperCase())}</div>
        <div>
          <strong>${escapeHTML(provider.name)}</strong>
          <div class="small muted">${escapeHTML(provider.mainServiceName || "Hizmet sağlayıcı")}</div>
        </div>
      </div>

      <div class="notice">
        Bu cihazda kayıtlı bir hizmet sağlayıcı hesabı bulundu.
        Yeni kayıt açmak yerine mevcut hesabına devam edebilirsin.
      </div>

      <button class="btn primary" onclick="providerLogin()">HİZMET SAĞLAYICI PANELİNE GİR</button>
      <br><br>
      <button class="btn secondary" onclick="showProviderRegister(true)">KAYDI DÜZENLE</button>
      <br><br>
      <button class="btn danger" onclick="providerLogout()">PANELDEN ÇIKIŞ</button>
    </div>
   `);
   return;
 }

 showProviderRegister(false);
}

function showProviderRegister(editMode=false){
 setNav("navProvider");

 const p=getProvider() || {};

 app(`
 <div class="back">
   <button class="btn secondary smallBtn" onclick="showHome()">← Ana sayfaya dön</button>
 </div>

 <div class="formCard">
   <span class="badge">🛠️ HİZMET SAĞLAYICI</span>
   <h1>${editMode?"Profilini güncelle.":"Hizmet vererek sisteme katıl."}</h1>

   <p class="muted small">
     Müşterilerin seni doğru bölgede ve doğru hizmet kategorisinde bulabilmesi için
     bilgilerini eksiksiz gir.
   </p>

   <label>Ad / İşletme *</label>
   <input id="pName" value="${escapeHTML(p.name||"")}" placeholder="Adınız veya işletme adı">

   <label>Telefon *</label>
   <input id="pPhone" type="tel" value="${escapeHTML(p.phone||"")}" placeholder="05xxxxxxxxx">

   <label>Ana hizmet bölgesi *</label>
   <select id="pDistrict">${districtOptions(p.district||"")}</select>

   <label>Verdiğin hizmetler *</label>
   <div class="checks">
     ${Object.entries(SERVICES).map(([key,s])=>`
       <label class="check">
         <input type="checkbox" name="pService" value="${key}"
          ${(p.services||[]).includes(key)?"checked":""}>
         ${s.emoji} ${s.name}
       </label>
     `).join("")}
   </div>

   <label>Açıklama</label>
   <textarea id="pDescription" maxlength="500"
    placeholder="Örneğin: Klima bakım, montaj ve arıza hizmetleri.">${escapeHTML(p.description||"")}</textarea>

   <div class="notice">
     🔒 Pilot sürümde sağlayıcı profili bu cihazda saklanır.
     Gerçek üyelik ve çoklu cihaz erişimi sonraki aşamada eklenecek.
   </div>

   <button class="btn primary" onclick="saveProvider()">
     ${editMode?"PROFİLİ GÜNCELLE":"HİZMET SAĞLAYICI OL"}
   </button>
 </div>
 `);
}

function saveProvider(){
 const name=document.getElementById("pName").value.trim();
 const phone=document.getElementById("pPhone").value.trim();
 const district=document.getElementById("pDistrict").value;
 const description=document.getElementById("pDescription").value.trim();

 const services=[...document.querySelectorAll('input[name="pService"]:checked')]
   .map(x=>x.value);

 if(!name){alert("Ad / işletme adı gerekli.");return}
 if(!phone){alert("Telefon numarası gerekli.");return}
 if(!district){alert("Ana hizmet bölgesi gerekli.");return}
 if(!services.length){alert("En az bir hizmet seçmelisin.");return}

 const mainService=SERVICES[services[0]];

 const provider={
   id:(getProvider() && getProvider().id) || uid("SP"),
   name,
   phone,
   district,
   services,
   description,
   mainServiceName:mainService ? mainService.name : "Hizmet",
   active:true,
   updatedAt:new Date().toISOString(),
   createdAt:(getProvider() && getProvider().createdAt) || new Date().toISOString()
 };

 write(KEYS.provider,provider);
 write(KEYS.providerLogged,true);

 alert("Hizmet sağlayıcı profilin başarıyla kaydedildi.");
 showProviderPanel();
}

function providerLogin(){
 if(!getProvider()){
   showProviderRegister(false);
   return;
 }
 write(KEYS.providerLogged,true);
 showProviderPanel();
}

function providerLogout(){
 write(KEYS.providerLogged,false);
 showProviderEntry();
}

/* ================= PROVIDER PANEL ================= */

function showProviderPanel(){
 setNav("navProvider");

 const p=getProvider();

 if(!p){
   showProviderRegister(false);
   return;
 }

 if(!providerLogged()){
   showProviderEntry();
   return;
 }

 const requests=getRequests();

 const suitable=requests.filter(r=>{
   return p.active &&
          (p.services||[]).includes(r.service) &&
          r.district===p.district;
 });

 app(`
 <div class="back">
   <button class="btn secondary smallBtn" onclick="showHome()">← Ana sayfaya dön</button>
 </div>

 <div class="profileHeader">
   <div class="avatar">${escapeHTML((p.name||"U").charAt(0).toUpperCase())}</div>
   <div style="flex:1">
     <strong>${escapeHTML(p.name)}</strong>
     <div class="small muted">
       <span class="activeDot"></span>
       ${p.active?"Aktif hizmet sağlayıcı":"Pasif hizmet sağlayıcı"}
       • ${escapeHTML(p.district)}
     </div>
   </div>
 </div>

 <div class="grid section">
   <div class="card">
     <div style="font-size:24px">📋</div>
     <strong>${suitable.length}</strong>
     <div class="small muted">Uygun İş</div>
   </div>
   <div class="card">
     <div style="font-size:24px">🛠️</div>
     <strong>${p.services.length}</strong>
     <div class="small muted">Kategori</div>
   </div>
   <div class="card">
     <div style="font-size:24px">✓</div>
     <strong>${p.active?"Aktif":"Pasif"}</strong>
     <div class="small muted">Durum</div>
   </div>
   <div class="card">
     <div style="font-size:24px">📍</div>
     <strong>${escapeHTML(p.district)}</strong>
     <div class="small muted">Bölge</div>
   </div>
 </div>

 <div class="section">
   <div class="sectionTitle">
     <h2>Profilin</h2>
     <button class="btn secondary smallBtn" onclick="showProviderRegister(true)">Düzenle</button>
   </div>

   <div class="card">
     <div class="small muted">Ad / İşletme</div>
     <strong>${escapeHTML(p.name)}</strong>
     <br><br>
     <div class="small muted">Telefon</div>
     <strong>${escapeHTML(p.phone)}</strong>
     <br><br>
     <div class="small muted">Ana hizmet bölgesi</div>
     <strong>${escapeHTML(p.district)}</strong>
     <br><br>
     <div class="small muted">Hizmetler</div>
     <strong>${p.services.map(x=>SERVICES[x]?.name||x).join(", ")}</strong>
     ${p.description?`<br><br><div class="small muted">${escapeHTML(p.description)}</div>`:""}
   </div>
 </div>

 <div class="section">
   <div class="sectionTitle">
     <h2>⚙️ Hizmet Durumu</h2>
   </div>

   <div class="${p.active?"success":"warning"}">
     ${p.active
       ?"Aktifsin. Bölgen ve hizmet kategorilerinle eşleşen yeni talepleri görebilirsin."
       :"Şu anda pasifsin. Talepleri görmek için aktif olmalısın."}
   </div>

   <br>
   <button class="btn ${p.active?"danger":"primary"}" onclick="toggleProviderStatus()">
     ${p.active?"🔴 PASİF YAP":"🟢 AKTİF YAP"}
   </button>
 </div>

 <div class="section">
   <div class="sectionTitle">
     <h2>📋 Sana Uygun Talepler</h2>
     <span class="small muted">${suitable.length} kayıt</span>
   </div>

   ${p.active ? (
      suitable.length
      ? suitable.map(renderProviderRequest).join("")
      : `<div class="card empty">
           <div style="font-size:34px">🔎</div>
           <h3>Şimdilik uygun talep yok.</h3>
           <p>Yeni müşteri talepleri geldikçe burada görünecek.</p>
         </div>`
   ) : `
      <div class="card empty">
        <p>Hizmet durumunu aktif yaptığında uygun talepler burada görünecek.</p>
      </div>
   `}
 </div>

 <div class="section">
   <button class="btn danger" onclick="providerLogout()">HİZMET SAĞLAYICI PANELİNDEN ÇIK</button>
   <p class="small muted" style="text-align:center">
     Çıkış yapmak kaydını silmez.
   </p>
 </div>
 `);
}

function renderProviderRequest(r){
 const s=SERVICES[r.service] || {name:r.service,emoji:"🛠️"};

 return `
 <article class="request">
   <div class="requestTop">
     <div>
       <h3>${s.emoji} ${escapeHTML(s.name)}</h3>
       <div class="small muted">${formatDate(r.createdAt)}</div>
     </div>
     <span class="status">${escapeHTML(r.urgency)}</span>
   </div>

   <div class="description">${escapeHTML(r.description)}</div>

   <div class="meta">
     <span>📍 ${escapeHTML(r.district)}</span>
     ${r.neighborhood?`<span>🏘️ ${escapeHTML(r.neighborhood)}</span>`:""}
     <span>👤 ${escapeHTML(r.name)}</span>
   </div>

   <div class="small muted">
     Talep No: <strong>${escapeHTML(r.id)}</strong>
   </div>

   <br>

   <a class="btn primary" style="display:block;text-align:center"
      href="tel:${escapeHTML(r.phone)}">
      📞 MÜŞTERİYLE İLETİŞİME GEÇ
   </a>
 </article>
 `;
}

function toggleProviderStatus(){
 const p=getProvider();
 if(!p)return;

 p.active=!p.active;
 p.updatedAt=new Date().toISOString();

 write(KEYS.provider,p);
 showProviderPanel();
}

/* ================= UTILITIES ================= */

function formatDate(date){
 try{
   return new Intl.DateTimeFormat("tr-TR",{
     day:"2-digit",
     month:"2-digit",
     year:"numeric",
     hour:"2-digit",
     minute:"2-digit"
   }).format(new Date(date));
 }catch(e){
   return date;
 }
}

/* ================= START ================= */

showHome();

</script>
</body>
</html>
