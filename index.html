<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
#app.fadeIn{animation:fadeInUp .25s ease-out}
.fab{position:fixed;right:16px;bottom:78px;padding:13px 18px 13px 15px;border-radius:30px;background:#2f6fed;color:#fff;font-size:14px;font-weight:800;border:none;box-shadow:0 6px 16px rgba(0,0,0,.35);z-index:500;display:flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap}
.fab .fabIcon{font-size:20px;line-height:1}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
:root{--bg:#07111f;--card:#0d1a2b;--line:#20344d;--text:#eef4fb;--muted:#9eb0c5;--primary:#19c37d;--warning:#f5b942;--danger:#ef5350;--input-bg:#081523;--surface:#091827;--header-bg:rgba(7,17,31,.98);--secondary-bg:#14263b}
[data-theme="light"]{--bg:#f3f6fb;--card:#ffffff;--line:#dbe3ee;--text:#101826;--muted:#5c6b80;--primary:#0e9d63;--warning:#a86a00;--danger:#c62828;--input-bg:#eef2f7;--surface:#eef2f7;--header-bg:rgba(243,246,251,.98);--secondary-bg:#e7edf5}
[data-theme="light"] .badge{background:rgba(14,157,99,.12);border-color:rgba(14,157,99,.35);color:#0e6b45}
[data-theme="light"] .status{background:rgba(168,106,0,.14);color:#7a4f00}
[data-theme="light"] .status-pending{background:rgba(168,106,0,.14);color:#7a4f00}
[data-theme="light"] .status-offered{background:rgba(21,101,192,.14);color:#0f4c85}
[data-theme="light"] .status-accepted{background:rgba(14,157,99,.14);color:#0e6b45}
[data-theme="light"] .status-completed{background:rgba(14,157,99,.14);color:#0e6b45}
[data-theme="light"] .status-cancelled{background:rgba(198,40,40,.14);color:#8c1f1f}
[data-theme="light"] .notice{background:#e3f0f8;border-color:#bcdcee;color:#0c4460}
[data-theme="light"] .success{background:#e5f7ee;border-color:#a9e4c6;color:#0e6b45}
[data-theme="light"] .warning{background:#fdf1dc;border-color:#f0d29a;color:#7a4f00}
[data-theme="light"] .error{background:#fdeaea;border-color:#f3bcbe;color:#8c1f1f}
[data-theme="light"] .navBtn{color:#5c6b80}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:90px}
.top{padding:16px;border-bottom:1px solid var(--line);background:var(--header-bg);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--primary),#36a3ff);display:grid;place-items:center;font-size:21px;font-weight:900;color:#03120d}
.brand strong{font-size:18px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
main{padding:16px}.hero{background:linear-gradient(145deg,var(--card),var(--bg));border:1px solid var(--line);border-radius:24px;padding:24px 20px;margin-bottom:16px}
.badge{display:inline-flex;padding:7px 10px;border-radius:99px;background:rgba(25,195,125,.12);border:1px solid rgba(25,195,125,.28);color:#6df0b5;font-size:12px;font-weight:700}
h1{font-size:30px;line-height:1.08;margin:16px 0 10px}h2{font-size:22px;margin:0 0 8px}h3{font-size:16px;margin:0 0 6px}p{line-height:1.5}.muted{color:var(--muted)}.small{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card,.formCard,.request{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.service{min-height:125px;text-align:left;color:var(--text)}.service .emoji{font-size:28px}.service strong{display:block;margin-top:9px}.service span{display:block;color:var(--muted);font-size:12px;margin-top:5px;line-height:1.4}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.btn{width:100%;border:0;border-radius:14px;padding:14px 15px;font-weight:800}.primary{background:var(--primary);color:#03130d}.secondary{background:var(--secondary-bg);color:var(--text);border:1px solid var(--line)}.smallBtn{padding:10px 12px;font-size:13px}
.section{margin-top:18px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input,select,textarea{width:100%;background:var(--input-bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px;outline:none}textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notice,.success,.warning,.error{padding:12px;border-radius:13px;font-size:13px;line-height:1.5;margin:12px 0;white-space:pre-line}.notice{background:#0b2030;border:1px solid #1e4c66;color:#b9ddf2}.success{background:#0b2b20;border:1px solid #185d43;color:#8bf1c4}.warning{background:#30260e;border:1px solid #65501a;color:#f5d77c}.error{background:#35181b;border:1px solid #70272d;color:#ffb6b8}
.request{margin-bottom:11px}.requestTop{display:flex;justify-content:space-between;gap:10px}.status{padding:5px 9px;border-radius:99px;background:rgba(245,185,66,.12);color:#ffd76b;font-size:11px;font-weight:800;height:max-content}
.status-pending{background:rgba(245,185,66,.12);color:#ffd76b}.status-offered{background:rgba(54,163,255,.14);color:#8fd0ff}.status-accepted{background:rgba(25,195,125,.14);color:#6df0b5}.status-completed{background:rgba(25,195,125,.14);color:#6df0b5}.status-cancelled{background:rgba(239,83,80,.14);color:#ffb6b8}
.meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:12px;margin:10px 0}.meta span{background:var(--surface);padding:6px 8px;border-radius:8px}.description{background:var(--surface);border-radius:12px;padding:11px;font-size:13px;line-height:1.5;margin:10px 0}
.empty{text-align:center;padding:28px 15px;color:var(--muted)}.connection{position:fixed;bottom:74px;left:10px;z-index:15;padding:6px 9px;border-radius:99px;font-size:10px;font-weight:bold;transition:opacity .3s}.online{background:#0b2b20;color:#8bf1c4}.offline{background:#30260e;color:#f5d77c}
.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--header-bg);border-top:1px solid var(--line);z-index:30}.bottomInner{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.navBtn{border:0;background:transparent;color:#8fa3b9;padding:11px 4px 10px;font-size:10px}.navBtn b{display:block;font-size:19px;margin-bottom:3px}.navBtn.active{color:var(--primary)}
input[type=checkbox]{width:18px;height:18px;flex-shrink:0}
.btn{min-height:46px}
@media(max-width:430px){main{padding:12px}.hero{padding:20px 16px}h1{font-size:27px}.row{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}
</style>
</head>

   hafızasındaki listeye geri düşülür — geriye dönük uyumluluk için. */
function isRequestOwner(r){
 if(CURRENT_USER&&r.customer_id)return r.customer_id===CURRENT_USER.id;
 return isMyRequest(r.id);
}
function isMyProvider(id){return lsGetArray("iscoz_my_providers").includes(id)}
/* Sahiplik önceliği: gerçek hesap (owner_id) varsa ona bakılır;
   yoksa (giriş yapılmadan oluşturulmuş eski sağlayıcılar için)
   tarayıcı hafızasındaki listeye geri düşülür. */
function isProviderOwner(p){
 if(CURRENT_USER&&p.owner_id)return p.owner_id===CURRENT_USER.id;
 return isMyProvider(p.id);
}

/* ---- Site içi bildirim rozetleri ----
   Sunucuya yeni bir tablo eklemeden, tarayıcıda "en son görülen" durumu
   saklayarak yeni teklif / durum değişikliği rozetleri gösterir. */
function lsGetObj(key){try{return JSON.parse(localStorage.getItem(key)||"{}")}catch(e){return {}}}
function lsSetObjKey(key,id,val){try{const o=lsGetObj(key);o[id]=val;localStorage.setItem(key,JSON.stringify(o));}catch(e){console.warn("Tarayıcı hafızasına yazılamadı:",e)}}
function hasNewOffers(requestId,offerCount){
 if(!offerCount)return false;
 const seen=lsGetObj("iscoz_seen_offer_counts");
 return (seen[requestId]||0)<offerCount;
}
function markOffersSeen(requestId,offerCount){lsSetObjKey("iscoz_seen_offer_counts",requestId,offerCount);}
function offerSeenKey(o){return o.id!==undefined&&o.id!==null&&o.id!==""?String(o.id):o.request_id+"_"+o.provider_id;}
function hasOfferUpdate(o){
 if(o.status==="pending")return false;
 const seen=lsGetObj("iscoz_seen_offer_status");
 return seen[offerSeenKey(o)]!==o.status;
}
function markOfferSeen(o){lsSetObjKey("iscoz_seen_offer_status",offerSeenKey(o),o.status);}

function esc(v){
 return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
/* JSON verisini tek tırnaklı bir HTML onclick özniteliğine güvenle gömer
   (isim/açıklama gibi alanlarda apostrof geçse bile özniteliği kırmaz). */
function jsonAttr(obj){
 return JSON.stringify(obj).replaceAll("'","&#039;");
}
function app(html){const el=document.getElementById("app");el.innerHTML=html;window.scrollTo(0,0);el.classList.remove("fadeIn");void el.offsetWidth;el.classList.add("fadeIn")}

function connection(ok,text){
 const e=document.getElementById("connectionStatus");
 if(!e)return;
 e.className="connection "+(ok?"online":"offline");
 e.textContent=text||(ok?"Supabase bağlı ✓":"Yerel mod");
}
function norm(v){return String(v??"").trim().toLocaleLowerCase("tr-TR").normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function isUUID(v){return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(v||"").trim())}
function uuid(v){return isUUID(v)?String(v).trim():""}
function serviceKey(v){
 const n=norm(v);
 for(const [k,s] of Object.entries(SERVICES))if(n===norm(k)||n===norm(s.name))return k;
 return String(v??"").trim();
}
function serviceOptions(sel=""){
 return `<option value="">Kategori seç</option>`+Object.entries(SERVICES).map(([k,s])=>`<option value="${k}" ${k===sel?"selected":""}>${s.emoji} ${s.name}</option>`).join("");
}
function districtOptions(sel=""){
 return `<option value="">İlçe seç</option>`+DISTRICTS.map(d=>`<option value="${esc(d)}" ${d===sel?"selected":""}>${esc(d)}</option>`).join("");
}
/* ---- Oturum (Auth) durumu ----
   Giriş yapılmışsa istekler kullanıcının kendi JWT'siyle gider (RLS
   ileride auth.uid() ile eşleştirme yapabilsin diye). Giriş yapılmamışsa
   davranış birebir eskisi gibi kalır (anon anahtar). */
let CURRENT_USER=null;
let ACCESS_TOKEN=null;
function saveSession(session){
 try{
  CURRENT_USER=session?.user?{id:session.user.id,email:session.user.email}:null;
  ACCESS_TOKEN=session?.access_token||null;
  if(session){localStorage.setItem("iscoz_auth",JSON.stringify({access_token:session.access_token,refresh_token:session.refresh_token,user:CURRENT_USER}))}
  else{localStorage.removeItem("iscoz_auth")}
 }catch(e){console.warn("Oturum kaydedilemedi:",e)}
 renderAuthArea();
}
function loadSession(){
 try{
  const raw=localStorage.getItem("iscoz_auth");
  if(!raw)return null;
  return JSON.parse(raw);
 }catch(e){return null}
}
async function sb(method,path,body=null){
 const token=ACCESS_TOKEN||SUPABASE_KEY;
 const o={method,headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+token,Accept:"application/json"}};
 if(body!==null){o.headers["Content-Type"]="application/json";o.headers.Prefer="return=representation";o.body=JSON.stringify(body)}
 const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,o);
 const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(_){d=t}
 if(!r.ok)throw new Error(d?.message||d?.details||d?.hint||("Supabase HTTP "+r.status));
 return d;
}
async function authRequest(path,body){
 const r=await fetch(SUPABASE_URL+"/auth/v1/"+path,{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
 const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(_){d=t}
 if(!r.ok)throw new Error(d?.error_description||d?.msg||d?.message||("Kimlik doğrulama hatası: HTTP "+r.status));
 return d;
}
async function authSignUp(email,password){
 const d=await authRequest("signup",{email,password});
 if(d?.access_token)saveSession(d);
 return d;
}
async function authSignIn(email,password){
 const d=await authRequest("token?grant_type=password",{email,password});
 saveSession(d);
 return d;
}
async function authSignOut(){
 try{if(ACCESS_TOKEN&&ACCESS_TOKEN!==SUPABASE_KEY){await fetch(SUPABASE_URL+"/auth/v1/logout",{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+ACCESS_TOKEN}})}}
 catch(e){console.warn("Çıkış isteği başarısız (yine de oturum temizlenecek):",e)}
 saveSession(null);
 showHome();
}

 const next=current==="light"?"dark":"light";
 document.documentElement.setAttribute("data-theme",next);
 try{localStorage.setItem("iscoz_theme",next)}catch(e){}
 applyThemeIcon();
}

async function loadOfferCountsForRequests(requestIds){
 const clean=[...new Set(requestIds.filter(isUUID))];
 if(!clean.length)return {};
 try{
  const rows=await sb("GET","offers?request_id=in.("+clean.join(",")+")&select=request_id");
  const map={};
  (rows||[]).forEach(o=>{const k=String(o.request_id);map[k]=(map[k]||0)+1});
  return map;
 }catch(e){console.warn("Teklif sayıları okunamadı:",e);return {}}
}

function playNotificationBeep(){
 try{
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type="sine";o.frequency.value=880;
  g.gain.setValueAtTime(0.001,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.15,ctx.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);
  o.connect(g);g.connect(ctx.destination);
  o.start();o.stop(ctx.currentTime+0.32);
 }catch(e){console.warn("Bildirim sesi çalınamadı:",e)}
}
function showToast(msg){
 const el=document.createElement("div");

 el.onclick=()=>{el.remove();showNotifications()};
 document.body.appendChild(el);
 setTimeout(()=>el.remove(),6000);
}
async function checkUnreadNotifications(){
 try{
  let myRequests=[],myProviders=[];
  if(CURRENT_USER){
   [myRequests,myProviders]=await Promise.all([
    sb("GET","requests?customer_id=eq."+encodeURIComponent(CURRENT_USER.id)+"&select=id"),
    sb("GET","providers?owner_id=eq."+encodeURIComponent(CURRENT_USER.id)+"&select=id,name")
   ]);
  }else{
   const reqIds=lsGetArray("iscoz_my_requests").filter(isUUID);
   const provIds=lsGetArray("iscoz_my_providers").filter(isUUID);
   if(reqIds.length)myRequests=await sb("GET","requests?id=in.("+reqIds.join(",")+")&select=id");
   if(provIds.length)myProviders=await sb("GET","providers?id=in.("+provIds.join(",")+")&select=id,name");
  }
  let count=0;
  if(myRequests.length){
   const offersLists=await Promise.all(myRequests.map(r=>loadOffers(r.id)));
   myRequests.forEach((r,i)=>{if(hasNewOffers(r.id,offersLists[i].length))count++});
  }
  for(const p of myProviders){
   let offers=[];
   try{offers=await loadOffersByProvider(p.id)}catch(e){continue}
   offers.forEach(o=>{if(hasOfferUpdate(o))count++});
  }
  if(count>0){
   playNotificationBeep();
   showToast(`🔔 ${count} yeni bildirimin var — görmek için dokun`);
  }
 }catch(e){console.warn("Bildirim kontrolü başarısız:",e)}
}

/* Teknik Supabase/ağ hatalarını kullanıcının anlayacağı Türkçe mesaja çevirir.
   Teknik detay yine de altta küçük yazıyla gösterilir (destek için faydalı). */
function friendlyErrorMessage(e){
 const raw=String(e?.message||e||"");
 const low=raw.toLocaleLowerCase("tr-TR");
 let friendly="İşlem tamamlanamadı. Lütfen tekrar deneyin.";
 if(low.includes("failed to fetch")||low.includes("networkerror")||low.includes("load failed")){
  friendly="İnternet bağlantısı kurulamadı. Lütfen bağlantınızı kontrol edip tekrar deneyin.";
 }else if(low.includes("permission denied")){
  friendly="Bu işlem için yetkiniz yok. Sistem yöneticisiyle iletişime geçin.";
 }else if(low.includes("duplicate key")||low.includes("already exists")){
  friendly="Bu kayıt zaten mevcut.";
 }else if(low.includes("violates") && low.includes("not-null")){
  friendly="Zorunlu bir alan boş bırakılmış. Lütfen tüm zorunlu alanları doldurun.";
 }else if(low.includes("timeout")){
  friendly="Sunucudan yanıt alınamadı (zaman aşımı). Lütfen tekrar deneyin.";
 }
 return friendly+(raw?`\n\nTeknik detay: ${raw}`:"");
}

/* Fotoğrafı Supabase Storage'a yükler, herkese açık URL döner. */
function compressImage(file,maxDim=1280,quality=0.82){
 return new Promise(resolve=>{
  if(!file||!file.type||!file.type.startsWith("image/")){resolve(file);return}
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{
   let{width,height}=img;
   if(width>maxDim||height>maxDim){
    const scale=maxDim/Math.max(width,height);
    width=Math.round(width*scale);height=Math.round(height*scale);
   }
   const canvas=document.createElement("canvas");
   canvas.width=width;canvas.height=height;
   const ctx=canvas.getContext("2d");
   ctx.drawImage(img,0,0,width,height);
   canvas.toBlob(blob=>{
    URL.revokeObjectURL(url);
    if(!blob){resolve(file);return}
    resolve(new File([blob],(file.name||"photo").replace(/\.[^.]+$/,"")+".jpg",{type:"image/jpeg"}));
   },"image/jpeg",quality);
  };
  img.onerror=()=>{URL.revokeObjectURL(url);resolve(file)};
  img.src=url;
 });
}
async function uploadRequestPhoto(file){
 const compressed=await compressImage(file);
 const extMatch=(compressed.name||"").match(/\.([a-zA-Z0-9]+)$/);
 const ext=(extMatch?extMatch[1]:"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
 const rand=(crypto?.randomUUID)?crypto.randomUUID():(Date.now()+"-"+Math.random().toString(36).slice(2));
 const path=rand+"."+ext;
 const token=ACCESS_TOKEN||SUPABASE_KEY;
 const r=await fetch(SUPABASE_URL+"/storage/v1/object/request-photos/"+path,{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+token,"Content-Type":compressed.type||"application/octet-stream"},body:compressed});
 if(!r.ok){
  const t=await r.text();let d=null;try{d=JSON.parse(t)}catch(_){d=t}
  throw new Error(d?.message||d?.error||("Fotoğraf yüklenemedi: HTTP "+r.status));
 }
 return SUPABASE_URL+"/storage/v1/object/public/request-photos/"+path;
}

function offerFilter(o){

 return "request_id=eq."+encodeURIComponent(o.request_id)+"&provider_id=eq."+encodeURIComponent(o.provider_id)+"&created_at=eq."+encodeURIComponent(o.created_at);

function offerStatusBadge(status){

 return `<span class="status status-pending">Bekliyor</span>`;
}

 /* Gizlilik: teklif kabul edilmeden sağlayıcının telefonu gösterilmez. */
 const wa=isAccepted?whatsappLink(provider?.phone):null;

async function acceptOffer(offer,requestId,btnEl){

async function loadProviderCompletedCounts(ids){
 const clean=[...new Set(ids.filter(isUUID))];
 if(!clean.length)return {};
 try{
  const offRows=await sb("GET","offers?provider_id=in.("+clean.join(",")+")&status=eq.accepted&select=provider_id,request_id");
  const reqIds=[...new Set((offRows||[]).map(o=>o.request_id).filter(isUUID))];
  if(!reqIds.length)return {};
  const reqRows=await sb("GET","requests?id=in.("+reqIds.join(",")+")&select=id,status");
  const completedIds=new Set((reqRows||[]).filter(r=>r.status==="completed").map(r=>String(r.id)));

  (offRows||[]).forEach(o=>{

   const k=String(o.provider_id);

  });
  return out;
 }catch(e){console.warn("Tamamlanan iş sayısı okunamadı:",e);return {}}

async function loadProviderRatings(ids){

function parseServices(v){
 if(Array.isArray(v))return v;
 if(typeof v==="string"){try{const x=JSON.parse(v);if(Array.isArray(x))return x}catch(_){}return v.split(",").map(x=>x.trim()).filter(Boolean)}
 return [];
}
function providerNameService(p){return parseServices(p.services).map(x=>SERVICES[serviceKey(x)]?.name||x)}
function providerMatches(p,r){
 if(p.active===false)return false;
 if(r.status==="accepted"||r.status==="completed"||r.status==="cancelled")return false;
 const ps=parseServices(p.services).map(serviceKey);
 const wanted=serviceKey(r.category_id);
 const serviceOK=!ps.length||ps.includes(wanted);
 const districtOK=!p.district||norm(p.district)===norm(r.district);
 return serviceOK&&districtOK;
}

 area.innerHTML=filtered.length?filtered.map(p=>providerCard(p,CURRENT_PROVIDER_RATINGS[String(p.id)],CURRENT_PROVIDER_COMPLETED[String(p.id)])).join(""):`<div class="card empty">Bu kriterlere uyan sağlayıcı bulunamadı.<br><span class="small muted">Filtreleri değiştirip tekrar dene.</span></div>`;
}
async function showProviders(){
 nav("navProvider");
 app(`<div class="back"><button class="btn secondary smallBtn" onclick="showProviderEntry()">← Geri</button></div><span class="badge">🛠️ HİZMET SAĞLAYICILAR</span><h1>Kayıtlı sağlayıcılar.</h1>
 <div class="card section">
  <label>Ara (isim)</label><input id="pfSearch" type="text" placeholder="Sağlayıcı adı..." oninput="renderProviderList()">
  <div class="row section"><div><label>İlçe</label><select id="pfDistrict2" onchange="renderProviderList()"><option value="">Tüm ilçeler</option>${DISTRICTS.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join("")}</select></div><div><label>Hizmet</label><select id="pfService" onchange="renderProviderList()">${serviceFilterOptions()}</select></div></div>
  ${CURRENT_USER?`<label class="section" style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="pfFavOnly" onchange="renderProviderList()" style="width:20px;height:20px"> Sadece favorilerim ❤️</label>`:""}
 </div>
 <div id="providersArea" class="card" style="text-align:center">⏳ Yükleniyor...</div>`);
 try{
  const rows=await loadProviders();
  CURRENT_PROVIDERS=rows;
  CURRENT_PROVIDER_RATINGS=await loadProviderRatings(rows.map(p=>p.id));
  CURRENT_PROVIDER_COMPLETED=await loadProviderCompletedCounts(rows.map(p=>p.id));
  CURRENT_FAVORITE_IDS=await loadFavoriteIds();
  if(!rows.length){document.getElementById("providersArea").outerHTML=`<div class="card empty">Henüz sağlayıcı kaydı yok.<br><span class="small muted">İlk hizmet sağlayıcı sen ol!</span></div>`;return}
  renderProviderList();
 }catch(e){document.getElementById("providersArea").innerHTML=`<div class="error">Sağlayıcılar yüklenemedi:<br>${esc(friendlyErrorMessage(e))}</div>`}
}
function viewProviderRequests(providerId){
 const p=CURRENT_PROVIDERS.find(x=>String(x.id)===String(providerId));
 if(!p){alert("Sağlayıcı bulunamadı. Lütfen listeyi yenileyin.");return}
 showProviderPanel(p);
}
async function showProviderPanel(provider){
 nav("navProvider");
 const canEdit=isProviderOwner(provider);
 const editBtn=canEdit?`<button class="btn secondary" onclick='showProviderProfile(${jsonAttr(provider)})'>⚙️ PROFİLİMİ DÜZENLE</button>`:"";
 const ownerNotice=canEdit?"":`<div class="notice small">👀 Bu profili bu tarayıcıdan oluşturmadınız — sadece görüntüleyebilirsiniz.</div>`;
 app(`<div class="back"><button class="btn secondary smallBtn" onclick="showProviders()">← Sağlayıcı listesine dön</button></div><div class="card">${provider.logo_url?`<img src="${esc(provider.logo_url)}" alt="Logo" style="width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-bottom:10px">`:""}<h2>🛠️ ${esc(provider.name)}</h2><p class="muted">${esc(provider.district||"")}</p><div class="small" id="providerRatingArea">⏳</div>${ownerNotice}<div class="row section"><button class="btn secondary" onclick='showProviderOffers(${jsonAttr(provider)})'>📑 TEKLİFLERİM</button>${editBtn}</div></div><section class="section"><h2>⭐ Değerlendirmeler</h2><div id="providerReviewsArea" class="card" style="text-align:center">⏳ Yükleniyor...</div></section><section class="section"><h2>📋 Uygun Talepler</h2><div id="matchArea" class="card" style="text-align:center">⏳ Eşleşmeler aranıyor...</div></section>`);
 loadProviderRatings([provider.id]).then(async m=>{
  const completed=await loadProviderCompletedCounts([provider.id]);
  const el=document.getElementById("providerRatingArea");
  if(el)el.innerHTML=`${trustBadgeHtml(completed[String(provider.id)]||0,m[String(provider.id)])} ${ratingBadgeHtml(m[String(provider.id)])}${completed[String(provider.id)]?` • <span class="small muted">✅ ${completed[String(provider.id)]} iş tamamladı</span>`:""}`;
 });
 sb("GET","reviews?provider_id=eq."+encodeURIComponent(provider.id)+"&select=*&order=created_at.desc&limit=20").then(reviews=>{
  const box=document.getElementById("providerReviewsArea");
  if(!box)return;
  if(!reviews||!reviews.length){box.innerHTML=`<div class="small muted">Henüz değerlendirme yok.</div>`;return}
  box.outerHTML=reviews.map(rv=>`<article class="request"><div style="color:#ffb020;font-size:18px">${starsDisplay(rv.rating)}</div>${rv.comment?`<div class="description">${esc(rv.comment)}</div>`:`<div class="small muted">Yorum eklenmemiş.</div>`}<div class="small muted">${rv.created_at?new Date(rv.created_at).toLocaleDateString("tr-TR"):""}</div></article>`).join("");
 }).catch(e=>{const box=document.getElementById("providerReviewsArea");if(box)box.innerHTML=`<div class="small muted">Değerlendirmeler yüklenemedi.</div>`;console.warn(e)});
 try{
  const requests=await sb("GET","requests?select=*&order=created_at.desc&limit=100");
  const suitable=requests.filter(r=>providerMatches(provider,r));
  const box=document.getElementById("matchArea");
  if(!suitable.length){box.innerHTML=`<div class="empty">🔎 Şu anda kategori ve ilçenize uygun bir talep yok.<br><span class="small muted">Yeni bir talep geldiğinde burada görünecek.${canEdit?` Kategori veya ilçenizi genişletmek isterseniz "⚙️ Profilimi Düzenle" bölümünden güncelleyebilirsiniz.`:""}</span></div>`;return}
  box.outerHTML=suitable.map(r=>providerRequestCard(r,provider)).join("");
 }catch(e){document.getElementById("matchArea").innerHTML=`<div class="error">Talepler yüklenemedi:<br>${esc(friendlyErrorMessage(e))}</div>`}
}
/* ---------------- SAĞLAYICI PROFİLİ ---------------- */
function providerServiceCheckboxes(selectedKeys){
 return Object.entries(SERVICES).map(([k,s])=>`<label style="display:flex;align-items:center;gap:8px;font-weight:400;margin:8px 0"><input type="checkbox" value="${k}" ${selectedKeys.includes(k)?"checked":""} style="width:auto"> ${s.emoji} ${esc(s.name)}</label>`).join("");
}
function showProviderProfile(provider){
 nav("navProvider");
 const selectedKeys=parseServices(provider.services).map(serviceKey);
 const isActive=provider.active!==false;
 app(`<div class="back"><button class="btn secondary smallBtn" onclick='showProviderPanel(${jsonAttr(provider)})'>← Panele dön</button></div>
 <div class="formCard"><span class="badge">⚙️ PROFİLİM</span><h1>${esc(provider.name)}</h1>
 <div class="notice">📞 ${esc(provider.phone||"-")} • İzmir</div>
 <label>Hizmet kategorileri *</label>
 <div id="pfCategories">${providerServiceCheckboxes(selectedKeys)}</div>
 <label>İlçe / Bölge *</label><select id="pfDistrict">${districtOptions(provider.district||"")}</select>
 <label>Açıklama</label><textarea id="pfDescription" maxlength="500">${esc(provider.description||"")}</textarea>
 <label style="display:flex;align-items:center;gap:8px;margin-top:12px"><input type="checkbox" id="pfActive" ${isActive?"checked":""} style="width:20px;height:20px"> Şu anda hizmet veriyorum (aktif)</label>
 <div class="small muted">Pasif yaparsan yeni talep eşleşmelerinde görünmezsin — teklif alamazsın. Örneğin izinliyken kullanabilirsin.</div>
 <button class="btn primary section" id="pfSaveBtn" onclick='saveProviderProfile(${jsonAttr(provider)})'>DEĞİŞİKLİKLERİ KAYDET</button></div>`);
}
async function saveProviderProfile(provider){
 if(!isProviderOwner(provider)){alert("Bu profili yalnızca kendi hesabınızdan (veya kayıt ettiğiniz tarayıcıdan) düzenleyebilirsiniz.");return}
 const checked=[...document.querySelectorAll("#pfCategories input[type=checkbox]:checked")].map(x=>x.value);
 const district=document.getElementById("pfDistrict").value;
 const description=document.getElementById("pfDescription").value.trim();
 const active=document.getElementById("pfActive").checked;
 if(!checked.length)return alert("En az bir hizmet kategorisi seçmelisin.");
 if(!district)return alert("Lütfen ilçe seç.");
 const btn=document.getElementById("pfSaveBtn");btn.disabled=true;btn.textContent="KAYDEDİLİYOR...";
 try{
  await sb("PATCH","providers?id=eq."+encodeURIComponent(provider.id),{services:checked,district,description,active,updated_at:new Date().toISOString()});
  connection(true);
  const updated={...provider,services:checked,district,description,active};
  alert("Profil güncellendi ✓");
  showProviderPanel(updated);
 }catch(e){
  console.error(e);
  alert("Profil güncellenemedi.\n\n"+friendlyErrorMessage(e));
 }
 finally{btn.disabled=false;btn.textContent="DEĞİŞİKLİKLERİ KAYDET";}
}
async function loadOffersByProvider(providerId){
 if(!isUUID(providerId))return [];
 try{const rows=await sb("GET","offers?provider_id=eq."+encodeURIComponent(providerId)+"&select=*&order=created_at.desc");return Array.isArray(rows)?rows:[]}
 catch(e){console.warn("Teklifler okunamadı:",e);return []}
}
async function loadRequestsByIds(ids){
 const clean=[...new Set(ids.filter(isUUID))];
 if(!clean.length)return [];
 try{const rows=await sb("GET","requests?select=*&id=in.("+clean.join(",")+")");return Array.isArray(rows)?rows:[]}
 catch(e){console.warn("Talep bilgisi okunamadı:",e);return []}
}
function providerOfferCard(o,request){
 const price=Number(o.price);
 const k=request?requestService(request):"";
 const s=SERVICES[k]||{name:request?.category_id||"Hizmet",emoji:"🛠️"};
 const updateBadge=hasOfferUpdate(o)?`<div class="small section" style="color:#ff6b6b"><strong>🆕 ${o.status==="accepted"?"Teklifin kabul edildi!":"Durum güncellendi"}</strong></div>`:"";
 return `<article class="request"><div class="requestTop"><div><h3>${s.emoji} ${esc(s.name)}</h3><div class="small muted">${o.created_at?new Date(o.created_at).toLocaleString("tr-TR"):""}</div></div>${offerStatusBadge(o.status)}</div>${updateBadge}${request?`<div class="description">${esc(request.description||"")}</div><div class="meta"><span>📍 ${esc(request.district||"")}</span></div>`:`<div class="small muted">Talep bilgisi bulunamadı (silinmiş olabilir).</div>`}<div class="meta"><span>💰 ${Number.isFinite(price)?price.toLocaleString("tr-TR")+" TL":"-"}</span>${o.available_time?`<span>🕐 ${esc(o.available_time)}</span>`:""}</div>${o.note?`<div class="description">${esc(o.note)}</div>`:""}</article>`;
}
async function showProviderOffers(provider){
 nav("navProvider");
 app(`<div class="back"><button class="btn secondary smallBtn" onclick='showProviderPanel(${jsonAttr(provider)})'>← Sağlayıcı paneline dön</button></div><span class="badge">📑 TEKLİFLERİM</span><h1>${esc(provider.name)} — verdiğim teklifler.</h1><div id="providerOffersArea" class="card" style="text-align:center">⏳ Teklifler yükleniyor...</div>`);
 try{
  const offers=await loadOffersByProvider(provider.id);
  const area=document.getElementById("providerOffersArea");
  if(!offers.length){area.innerHTML=`<div class="empty">📑 Henüz teklif vermediniz.<br><span class="small muted">Uygun bir talebe teklif verdiğinizde burada görünecek.</span></div>`;return}
  const visibleOffers=offers.filter(o=>o.status!=="rejected");
  offers.forEach(markOfferSeen);
  if(!visibleOffers.length){area.innerHTML=`<div class="empty">📑 Aktif teklifiniz yok.<br><span class="small muted">Reddedilen teklifler burada gösterilmez.</span></div>`;return}
  const requests=await loadRequestsByIds(visibleOffers.map(o=>o.request_id));
  const requestById=Object.fromEntries(requests.map(r=>[String(r.id),r]));
  area.outerHTML=visibleOffers.map(o=>providerOfferCard(o,requestById[String(o.request_id)])).join("");
 }catch(e){document.getElementById("providerOffersArea").innerHTML=`<div class="error">Teklifler yüklenemedi:<br>${esc(friendlyErrorMessage(e))}</div>`}
}
function providerRequestCard(r,p){
 const k=requestService(r),s=SERVICES[k]||{name:r.category_id||"Hizmet",emoji:"🛠️"};
 return `<article class="request"><div class="requestTop"><div><h3>${s.emoji} ${esc(s.name)}</h3><div class="small muted">Talep UUID: ${esc(r.id)}</div></div><span class="status">${esc(r.urgency||r.status||"pending")}</span></div><div class="description">${esc(r.description||"")}</div>${r.photo_url?`<img src="${esc(r.photo_url)}" alt="Talep fotoğrafı" style="width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-top:8px">`:""}<div class="meta"><span>📍 ${esc(r.district||"")}</span>${r.neighborhood?`<span>🏘️ ${esc(r.neighborhood)}</span>`:""}</div><button class="btn primary" onclick="openOffer('${esc(r.id)}','${esc(p.id)}','${esc(s.name)}')">💰 TEKLİF VER</button></article>`;
}

/* ---------------- OFFERS ---------------- */
async function loadOffers(requestId){
 if(!isUUID(requestId))return [];
 try{const rows=await sb("GET","offers?request_id=eq."+encodeURIComponent(requestId)+"&select=*&order=created_at.desc");return Array.isArray(rows)?rows:[]}
 catch(e){console.warn("Teklif okunamadı:",e);return []}
}
function openOffer(requestId,providerId,serviceName){
 if(!isUUID(requestId)){alert("Talep kimliği geçersiz. Gerçek Supabase UUID bulunamadı.");return}
 if(!isUUID(providerId)){alert("Hizmet sağlayıcının gerçek UUID kimliği bulunamadı.");return}
 const m=document.createElement("div");m.id="offerModal";m.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px";
 m.innerHTML=`<div class="formCard" style="width:min(520px,100%);max-height:90vh;overflow:auto"><div class="sectionTitle"><div><span class="badge">💰 TEKLİF OLUŞTUR</span><h2>${esc(serviceName)}</h2></div><button class="btn secondary smallBtn" onclick="this.closest('#offerModal').remove()">✕</button></div>
 <label>Teklif fiyatı (TL) *</label><input id="offerPrice" type="number" min="1" step="1" placeholder="Örn. 1500">
 <label>Müsait olduğunuz zaman *</label><input id="offerTime" maxlength="200" placeholder="Örn. Bugün 18:00">
 <label>Mesajınız</label><textarea id="offerNote" maxlength="1000" placeholder="İşin nasıl yapılacağını veya önemli bilgileri yazabilirsiniz."></textarea>
 <button class="btn primary" id="offerBtn" onclick="sendOffer('${requestId}','${providerId}')">TEKLİFİ GÖNDER</button></div>`;
 document.body.appendChild(m);
}
async function sendOffer(requestId,providerId){
 const priceRaw=document.getElementById("offerPrice").value.trim(),price=Number(priceRaw),available_time=document.getElementById("offerTime").value.trim(),note=document.getElementById("offerNote").value.trim()||null,b=document.getElementById("offerBtn");
 if(!priceRaw||!Number.isFinite(price)||price<=0)return alert("Lütfen geçerli bir teklif fiyatı gir (0'dan büyük).");
 if(!available_time)return alert("Müsait olduğunuz zamanı yazın.");
 if(!isUUID(requestId)||!isUUID(providerId))return alert("Teklif için geçerli UUID gerekli.");
 if(containsPhoneNumber(note))return alert("Mesaj içinde telefon numarası paylaşımı fark edildi. Güvenliğin için ilk iletişim platform üzerinden sürdürülmeli — teklif kabul edilince iletişim bilgisi otomatik açılır.");
 b.disabled=true;b.textContent="GÖNDERİLİYOR...";
 try{
  await sb("POST","offers",{request_id:requestId,provider_id:providerId,price,available_time,note,status:"pending"});
  connection(true);document.getElementById("offerModal")?.remove();alert("Teklif başarıyla gönderildi. ✓");showRequests();
 }catch(e){console.error(e);alert("Teklif gönderilemedi.\n\n"+friendlyErrorMessage(e));b.disabled=false;b.textContent="TEKLİFİ GÖNDER"}
}

/* ---------------- START ---------------- */
async function restoreSession(){
 const s=loadSession();
 if(!s?.access_token)return;
 CURRENT_USER=s.user;ACCESS_TOKEN=s.access_token;renderAuthArea();
 try{
  const r=await fetch(SUPABASE_URL+"/auth/v1/user",{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+s.access_token}});
  if(!r.ok)throw new Error("Oturum geçersiz");
 }catch(e){console.warn("Kayıtlı oturum artık geçerli değil, çıkış yapılıyor:",e);saveSession(null);}
}
async function startApp(){connection(false,"Supabase bağlanıyor...");renderAuthArea();applyThemeIcon();await restoreSession();showHome();checkUnreadNotifications();await testDB()}
startApp();
if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW kayıt hatası:",e))});
}
</script>
