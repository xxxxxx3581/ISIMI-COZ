<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>İşimi Çöz — İzmir</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#07111f;color:#eef4fb;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
:root{--bg:#07111f;--card:#0d1a2b;--line:#20344d;--text:#eef4fb;--muted:#9eb0c5;--primary:#19c37d;--warning:#f5b942;--danger:#ef5350}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:90px}
.top{padding:16px;border-bottom:1px solid var(--line);background:rgba(7,17,31,.98);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--primary),#36a3ff);display:grid;place-items:center;font-size:21px;font-weight:900;color:#03120d}
.brand strong{font-size:18px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
main{padding:16px}.hero{background:linear-gradient(145deg,#10243a,#0b1727);border:1px solid var(--line);border-radius:24px;padding:24px 20px;margin-bottom:16px}
.badge{display:inline-flex;padding:7px 10px;border-radius:99px;background:rgba(25,195,125,.12);border:1px solid rgba(25,195,125,.28);color:#6df0b5;font-size:12px;font-weight:700}
h1{font-size:30px;line-height:1.08;margin:16px 0 10px}h2{font-size:22px;margin:0 0 8px}h3{font-size:16px;margin:0 0 6px}p{line-height:1.5}.muted{color:var(--muted)}.small{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card,.formCard,.request{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.service{min-height:125px;text-align:left;color:var(--text)}.service .emoji{font-size:28px}.service strong{display:block;margin-top:9px}.service span{display:block;color:var(--muted);font-size:12px;margin-top:5px;line-height:1.4}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.btn{width:100%;border:0;border-radius:14px;padding:14px 15px;font-weight:800}.primary{background:var(--primary);color:#03130d}.secondary{background:#14263b;color:var(--text);border:1px solid var(--line)}.smallBtn{padding:10px 12px;font-size:13px}
.section{margin-top:18px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input,select,textarea{width:100%;background:#081523;color:var(--text);border:1px solid #29415d;border-radius:12px;padding:13px;outline:none}textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notice,.success,.warning,.error{padding:12px;border-radius:13px;font-size:13px;line-height:1.5;margin:12px 0}.notice{background:#0b2030;border:1px solid #1e4c66;color:#b9ddf2}.success{background:#0b2b20;border:1px solid #185d43;color:#8bf1c4}.warning{background:#30260e;border:1px solid #65501a;color:#f5d77c}.error{background:#35181b;border:1px solid #70272d;color:#ffb6b8}
.request{margin-bottom:11px}.requestTop{display:flex;justify-content:space-between;gap:10px}.status{padding:5px 9px;border-radius:99px;background:rgba(245,185,66,.12);color:#ffd76b;font-size:11px;font-weight:800;height:max-content}
.meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:12px;margin:10px 0}.meta span{background:#091827;padding:6px 8px;border-radius:8px}.description{background:#091827;border-radius:12px;padding:11px;font-size:13px;line-height:1.5;margin:10px 0}
.empty{text-align:center;padding:28px 15px;color:var(--muted)}.connection{position:fixed;top:10px;right:10px;z-index:100;padding:6px 9px;border-radius:99px;font-size:10px;font-weight:bold}.online{background:#0b2b20;color:#8bf1c4}.offline{background:#30260e;color:#f5d77c}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(7,17,31,.98);border-top:1px solid var(--line);z-index:30}.bottomInner{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.navBtn{border:0;background:transparent;color:#8fa3b9;padding:11px 4px 10px;font-size:10px}.navBtn b{display:block;font-size:19px;margin-bottom:3px}.navBtn.active{color:var(--primary)}
@media(max-width:430px){main{padding:12px}.hero{padding:20px 16px}h1{font-size:27px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="connectionStatus" class="connection offline">Supabase bağlanıyor...</div>
<div class="app">
<header class="top"><div class="brand"><div class="logo">✓</div><div><strong>İŞİMİ ÇÖZ</strong><small>İzmir Pilot Bölgesi</small></div></div></header>
<main id="app"></main></div>
<nav class="bottom"><div class="bottomInner">
<button class="navBtn" id="navHome" onclick="showHome()"><b>⌂</b>ANA</button>
<button class="navBtn" id="navRequest" onclick="showRequest()"><b>＋</b>TALEP</button>
<button class="navBtn" id="navRequests" onclick="showRequests()"><b>▣</b>TALEPLER</button>
<button class="navBtn" id="navProvider" onclick="showProviderEntry()"><b>🛠️</b>HİZMET VER</button>
</div></nav>

<script>
/* =========================================================
   İŞİMİ ÇÖZ — TEMİZ SUPABASE SÜRÜMÜ
   Gerçek requests tablosu:
   id(uuid), customer_id(uuid), category_id(text),
   description(text), district(text), neighborhood(text),
   urgency(text), photo_url(text), status(text), created_at(timestamptz)

   providers:
   id, name, phone, district, description, active,
   created_at, city, services, updated_at

   offers:
   request_id(uuid), provider_id(uuid), price(numeric),
   available_time(text), note(text), status(text), created_at
========================================================= */

const SUPABASE_URL="https://zvffspbowdzvrrzefhkr.supabase.co";
const SUPABASE_KEY="sb_publishable_L_qb9Q4fHktE51PEqEhTAg_O4R0eDiW";

const SERVICES={
 klima:{name:"Klima",emoji:"❄️",desc:"Bakım, montaj, arıza ve temizlik"},
 elektrik:{name:"Elektrik",emoji:"⚡",desc:"Arıza, priz, tesisat ve aydınlatma"},
 tesisat:{name:"Tesisat",emoji:"🔧",desc:"Su, gider, musluk ve kaçak sorunları"},
 beyaz:{name:"Beyaz Eşya",emoji:"🧊",desc:"Çamaşır, bulaşık, buzdolabı ve fırın"},
 temizlik:{name:"Temizlik",emoji:"🧹",desc:"Ev, ofis ve detaylı temizlik"},
 nakliye:{name:"Nakliye",emoji:"🚚",desc:"Ev, ofis ve parça eşya taşıma"},
 cilingir:{name:"Çilingir",emoji:"🔐",desc:"Kilit, anahtar ve acil giriş"},
 oto:{name:"Oto",emoji:"🚗",desc:"Arıza, bakım, lastik ve yol yardımı"}
};

const DISTRICTS=["Aliağa","Balçova","Bayındır","Bayraklı","Bergama","Beydağ","Bornova","Buca","Çeşme","Çiğli","Dikili","Foça","Gaziemir","Güzelbahçe","Karabağlar","Karaburun","Karşıyaka","Konak","Menemen","Menderes","Narlıdere","Ödemiş","Seferihisar","Selçuk","Tire","Torbalı","Urla","Kiraz","Kemalpaşa","Kınık"];

function esc(v){
 return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function app(html){document.getElementById("app").innerHTML=html;window.scrollTo(0,0)}
function nav(id){["navHome","navRequest","navRequests","navProvider"].forEach(x=>document.getElementById(x)?.classList.remove("active"));document.getElementById(id)?.classList.add("active")}
function connection(ok,text){const e=document.getElementById("connectionStatus");e.className="connection "+(ok?"online":"offline");e.textContent=text||(ok?"Supabase bağlı ✓":"Yerel mod")}
function norm(v){return String(v??"").trim().toLocaleLowerCase("tr-TR").normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function isUUID(v){return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(v||"").trim())}
function uuid(v){return isUUID(v)?String(v).trim():""}
function serviceKey(v){
 const n=norm(v);
 for(const [k,s] of Object.entries(SERVICES))if(n===norm(k)||n===norm(s.name))return k;
 return String(v??"").trim();
}
function serviceOptions(sel=""){
 return `<option value="">Kategori seç</option>`+Object.entries(SERVICES).map(([k,s])=>`<option value="${k}" ${k===sel?"selected":""}>${s.emoji} ${s.name}</option>`).join("");
}
function districtOptions(sel=""){
 return `<option value="">İlçe seç</option>`+DISTRICTS.map(d=>`<option value="${esc(d)}" ${d===sel?"selected":""}>${esc(d)}</option>`).join("");
}
async function sb(method,path,body=null){
 const o={method,headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,Accept:"application/json"}};
 if(body!==null){o.headers["Content-Type"]="application/json";o.headers.Prefer="return=representation";o.body=JSON.stringify(body)}
 const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,o);
 const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(_){d=t}
 if(!r.ok)throw new Error(d?.message||d?.details||d?.hint||("Supabase HTTP "+r.status));
 return d;
}
async function testDB(){
 try{await sb("GET","requests?select=id&limit=1");connection(true);return true}
 catch(e){console.error(e);connection(false,"Supabase bağlantı hatası");return false}
}

/* ---------------- HOME ---------------- */
function showHome(){
 nav("navHome");
 const cards=Object.entries(SERVICES).map(([k,s])=>`
 <button class="card service" type="button" onclick="showRequest('${k}')">
  <div class="emoji">${s.emoji}</div><strong>${esc(s.name)}</strong><span>${esc(s.desc)}</span>
 </button>`).join("");
 app(`<section class="hero"><span class="badge">📍 İZMİR PİLOT BÖLGESİ</span><h1>İhtiyacın varsa,<br>çözümü var.</h1><p class="muted">Ev, iş yeri, araç ve günlük yaşam hizmetlerini tek yerden bul.</p><div class="actions"><button class="btn primary" onclick="showRequest()">📢 İşimi Çözdür</button><button class="btn secondary" onclick="showProviderEntry()">🛠️ Hizmet Ver</button></div></section>
 <section><div class="sectionTitle"><div><h2>Hizmet kategorileri</h2><div class="small muted">İhtiyacını seç ve talep oluştur.</div></div></div><div class="grid">${cards}</div></section>
 <section class="card section"><h2>💡 Nasıl çalışıyor?</h2><p class="muted small">İhtiyacını oluştur. Talebin Supabase'e kaydedilsin. Uygun hizmet sağlayıcıları talebini görsün ve teklif verebilsin.</p></section>`);
}

/* ---------------- REQUESTS ---------------- */
function showRequest(pre=""){
 nav("navRequest");
 app(`<div class="back"><button class="btn secondary smallBtn" onclick="showHome()">← Ana sayfaya dön</button></div>
 <div class="formCard"><span class="badge">📋 YENİ HİZMET TALEBİ</span><h1>İhtiyacını anlat.</h1>
 <label>Hizmet kategorisi *</label><select id="category">${serviceOptions(pre)}</select>
 <label>Sorunun / ihtiyacın *</label><textarea id="description" maxlength="1000" placeholder="Örneğin: Klima çalışıyor fakat yeterince soğutmuyor."></textarea>
 <div class="row"><div><label>İl</label><input value="İzmir" readonly></div><div><label>İlçe *</label><select id="district">${districtOptions()}</select></div></div>
 <label>Mahalle</label><input id="neighborhood" placeholder="Mahalle adı">
 <label>Ne zaman gerekli?</label><select id="urgency"><option>Bugün</option><option>Acil</option><option>Uygun zamanda</option></select>
 <div class="notice">🔒 Talep kaydında müşteri adı ve telefonunun kullanılmadığı mevcut Supabase şemasına uyum sağlanmıştır. İletişim bilgileri bu sürümde tarayıcıda tutulmaz.</div>
 <button class="btn primary" id="createBtn" onclick="createRequest()">TALEBİ OLUŞTUR</button></div>`);
}
async function createRequest(){
 const category=document.getElementById("category").value;
 const description=document.getElementById("description").value.trim();
 const district=document.getElementById("district").value;
 const neighborhood=document.getElementById("neighborhood").value.trim();
 const urgency=document.getElementById("urgency").value;
 if(!category)return alert("Lütfen hizmet kategorisini seç.");
 if(description.length<5)return alert("Lütfen ihtiyacınızı daha açık anlat.");
 if(!district)return alert("Lütfen ilçe seç.");
 const btn=document.getElementById("createBtn");btn.disabled=true;btn.textContent="KAYDEDİLİYOR...";
 try{
  const payload={category_id:category,description,district,neighborhood:neighborhood||null,urgency,status:"pending"};
  const rows=await sb("POST","requests",payload);
  const row=Array.isArray(rows)?rows[0]:rows;
  if(!row?.id)throw new Error("Talep kaydedildi ancak UUID alınamadı.");
  connection(true);
  alert("Talep başarıyla oluşturuldu. ✓\n\nTalep kimliği:\n"+row.id);
  showRequests();
 }catch(e){console.error(e);alert("Talep oluşturulamadı:\n\n"+e.message)}
 finally{btn.disabled=false;btn.textContent="TALEBİ OLUŞTUR";}
}
function requestService(r){return serviceKey(r.category_id)}
function requestCard(r,offersHtml=""){
 const k=requestService(r),s=SERVICES[k]||{name:r.category_id||"Hizmet",emoji:"🛠️"};
 return `<article class="request"><div class="requestTop"><div><h3>${s.emoji} ${esc(s.name)}</h3><div class="small muted">${r.created_at?new Date(r.created_at).toLocaleString("tr-TR"):""}</div></div><span class="status">${esc(r.status||"pending")}</span></div><div class="description">${esc(r.description||"")}</div><div class="meta"><span>📍 ${esc(r.district||"")}</span>${r.neighborhood?`<span>🏘️ ${esc(r.neighborhood)}</span>`:""}<span>⏱️ ${esc(r.urgency||"")}</span></div><div class="small muted">ID: <strong>${esc(r.id)}</strong></div>${offersHtml}</article>`;
}
async function showRequests(){
 nav("navRequests");
 app(`<div class="back"><button class="btn secondary smallBtn" onclick="showHome()">← Ana sayfaya dön</button></div><span class="badge">▣ TALEPLER</span><h1>Oluşturulan talepler.</h1><div id="requestsArea" class="card" style="text-align:center">⏳ Yükleniyor...</div>`);
 try{
  const rows=await sb("GET","requests?select=*&order=created_at.desc&limit=100");
  const area=document.getElementById("requestsArea");
  if(!rows.length){area.innerHTML=`<div class="empty">📋<h3>Henüz talep yok.</h3><button class="btn primary" onclick="showRequest()">＋ Talep oluştur</button></div>`;return}
  const html=[];
  for(const r of rows){
   const offers=await loadOffers(r.id);
   html.push(requestCard(r,offers.length?`<div class="section"><strong>💰 ${offers.length} teklif</strong>${offers.map(renderOffer).join("")}</div>`:`<div class="small muted section">Henüz teklif gelmedi.</div>`));
  }
  area.outerHTML=html.join("");
 }catch(e){document.getElementById("requestsArea").innerHTML=`<div class="error">Talepler yüklenemedi:<br>${esc(e.message)}</div>`}
}

/* ---------------- PROVIDERS ---------------- */
function parseServices(v){
 if(Array.isArray(v))return v;
 if(typeof v==="string"){try{const x=JSON.parse(v);if(Array.isArray(x))return x}catch(_){}return v.split(",").map(x=>x.trim()).filter(Boolean)}
 return [];
}
function providerNameService(p){return parseServices(p.services).map(x=>SERVICES[serviceKey(x)]?.name||x)}
function providerMatches(p,r){
 if(p.active===false)return false;
 const ps=parseServices(p.services).map(serviceKey);
 const wanted=serviceKey(r.category_id);
 const serviceOK=!ps.length||ps.includes(wanted);
 const districtOK=!p.district||norm(p.district)===norm(r.district);
 return serviceOK&&districtOK;
}
async function loadProviders(){
 const rows=await sb("GET","providers?select=*&order=created_at.desc&limit=200");
 return Array.isArray(rows)?rows:[];
}
function providerCard(p){
 const names=providerNameService(p).join(", ")||"Hizmet belirtilmemiş";
 return `<article class="request"><div class="requestTop"><div><h3>🛠️ ${esc(p.name||"Hizmet Sağlayıcı")}</h3><div class="small muted">İzmir • ${esc(p.district||"")}</div></div><span class="status">${p.active===false?"Pasif":"Aktif"}</span></div><div class="meta"><span>🔧 ${esc(names)}</span></div>${p.description?`<div class="description">${esc(p.description)}</div>`:""}${p.phone?`<a class="btn primary" style="display:block;text-align:center" href="tel:${esc(p.phone)}">📞 İLETİŞİME GEÇ</a>`:""}</article>`;
}
function showProviderEntry(){
 nav("navProvider");
 app(`<div class="back"><button class="btn secondary smallBtn" onclick="showHome()">← Ana sayfaya dön</button></div>
 <div class="formCard"><span class="badge">🛠️ HİZMET SAĞLAYICI</span><h1>Hizmet ver.</h1>
 <label>Ad / İşletme *</label><input id="pName" placeholder="Örn. Ferhat Klima Servisi">
 <label>Telefon *</label><input id="pPhone" type="tel" placeholder="05xxxxxxxxx">
 <div class="row"><div><label>İl</label><input id="pCity" value="İzmir" readonly></div><div><label>İlçe *</label><select id="pDistrict">${districtOptions()}</select></div></div>
 <label>Hizmet kategorisi *</label><select id="pCategory">${serviceOptions()}</select>
 <label>Açıklama</label><textarea id="pDescription" maxlength="500" placeholder="Hizmetlerin hakkında kısa bilgi"></textarea>
 <div class="notice">Sağlayıcı kaydı doğrudan Supabase'deki providers tablosuna gönderilir.</div>
 <button class="btn primary" id="saveProvider" onclick="registerProvider()">HİZMET SAĞLAYICI KAYDI OLUŞTUR</button>
 <button class="btn secondary section" onclick="showProviders()">KAYITLI SAĞLAYICILARI GÖR</button></div>`);
}
async function registerProvider(){
 const name=document.getElementById("pName").value.trim(),phone=document.getElementById("pPhone").value.trim(),district=document.getElementById("pDistrict").value,category=document.getElementById("pCategory").value,description=document.getElementById("pDescription").value.trim();
 if(!name||!phone||!district||!category)return alert("Ad, telefon, ilçe ve hizmet kategorisi zorunludur.");
 const b=document.getElementById("saveProvider");b.disabled=true;b.textContent="KAYDEDİLİYOR...";
 try{
  const now=new Date().toISOString();
  const payload={name,phone,district,description,active:true,created_at:now,city:"İzmir",services:[category],updated_at:now};
  const rows=await sb("POST","providers",payload);
  const p=Array.isArray(rows)?rows[0]:rows;
  if(!p?.id)throw new Error("Sağlayıcı kaydedildi ancak ID alınamadı.");
  connection(true);alert("Hizmet sağlayıcı başarıyla kaydedildi. ✓");showProviderPanel(p);
 }catch(e){console.error(e);alert("Sağlayıcı kaydedilemedi:\n\n"+e.message)}
 finally{b.disabled=false;b.textContent="HİZMET SAĞLAYICI KAYDI OLUŞTUR";}
}
async function showProviders(){
 nav("navProvider");
 app(`<div class="back"><button class="btn secondary smallBtn" onclick="showProviderEntry()">← Geri</button></div><span class="badge">🛠️ HİZMET SAĞLAYICILAR</span><h1>Kayıtlı sağlayıcılar.</h1><div id="providersArea" class="card" style="text-align:center">⏳ Yükleniyor...</div>`);
 try{const rows=await loadProviders();document.getElementById("providersArea").outerHTML=rows.length?rows.map(providerCard).join(""):`<div class="card empty">Henüz sağlayıcı kaydı yok.</div>`}
 catch(e){document.getElementById("providersArea").innerHTML=`<div class="error">Sağlayıcılar yüklenemedi:<br>${esc(e.message)}</div>`}
}
async function showProviderPanel(provider){
 nav("navProvider");
 app(`<div class="back"><button class="btn secondary smallBtn" onclick="showProviderEntry()">← Hizmet Ver'e dön</button></div><div class="card"><h2>🛠️ ${esc(provider.name)}</h2><p class="muted">${esc(provider.district||"")}</p></div><section class="section"><h2>📋 Uygun Talepler</h2><div id="matchArea" class="card" style="text-align:center">⏳ Eşleşmeler aranıyor...</div></section>`);
 try{
  const requests=await sb("GET","requests?select=*&order=created_at.desc&limit=100");
  const suitable=requests.filter(r=>providerMatches(provider,r));
  const box=document.getElementById("matchArea");
  if(!suitable.length){box.innerHTML=`<div class="empty">🔎 Bu sağlayıcıya uygun talep yok.</div>`;return}
  box.outerHTML=suitable.map(r=>providerRequestCard(r,provider)).join("");
 }catch(e){document.getElementById("matchArea").innerHTML=`<div class="error">Talepler yüklenemedi:<br>${esc(e.message)}</div>`}
}
function providerRequestCard(r,p){
 const k=requestService(r),s=SERVICES[k]||{name:r.category_id||"Hizmet",emoji:"🛠️"};
 return `<article class="request"><div class="requestTop"><div><h3>${s.emoji} ${esc(s.name)}</h3><div class="small muted">Talep UUID: ${esc(r.id)}</div></div><span class="status">${esc(r.urgency||r.status||"pending")}</span></div><div class="description">${esc(r.description||"")}</div><div class="meta"><span>📍 ${esc(r.district||"")}</span>${r.neighborhood?`<span>🏘️ ${esc(r.neighborhood)}</span>`:""}</div><button class="btn primary" onclick="openOffer('${esc(r.id)}','${esc(p.id)}','${esc(s.name)}')">💰 TEKLİF VER</button></article>`;
}

/* ---------------- OFFERS ---------------- */
async function loadOffers(requestId){
 if(!isUUID(requestId))return [];
 try{const rows=await sb("GET","offers?request_id=eq."+encodeURIComponent(requestId)+"&select=*&order=created_at.desc");return Array.isArray(rows)?rows:[]}
 catch(e){console.warn("Teklif okunamadı:",e);return []}
}
function renderOffer(o){
 const price=Number(o.price);
 return `<article class="card" style="margin-top:10px"><div class="requestTop"><strong>💰 Teklif</strong><strong>${Number.isFinite(price)?price.toLocaleString("tr-TR")+" TL":"-"}</strong></div><div class="small muted">Durum: ${esc(o.status||"pending")}</div>${o.available_time?`<div class="small">🕐 ${esc(o.available_time)}</div>`:""}${o.note?`<div class="description">${esc(o.note)}</div>`:""}</article>`;
}
function openOffer(requestId,providerId,serviceName){
 if(!isUUID(requestId)){alert("Talep kimliği geçersiz. Gerçek Supabase UUID bulunamadı.");return}
 if(!isUUID(providerId)){alert("Hizmet sağlayıcının gerçek UUID kimliği bulunamadı.");return}
 const m=document.createElement("div");m.id="offerModal";m.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px";
 m.innerHTML=`<div class="formCard" style="width:min(520px,100%);max-height:90vh;overflow:auto"><div class="sectionTitle"><div><span class="badge">💰 TEKLİF OLUŞTUR</span><h2>${esc(serviceName)}</h2></div><button class="btn secondary smallBtn" onclick="this.closest('#offerModal').remove()">✕</button></div>
 <label>Teklif fiyatı (TL) *</label><input id="offerPrice" type="number" min="0" step="1" placeholder="Örn. 1500">
 <label>Müsait olduğunuz zaman *</label><input id="offerTime" maxlength="200" placeholder="Örn. Bugün 18:00">
 <label>Mesajınız</label><textarea id="offerNote" maxlength="1000" placeholder="İşin nasıl yapılacağını veya önemli bilgileri yazabilirsiniz."></textarea>
 <button class="btn primary" id="offerBtn" onclick="sendOffer('${requestId}','${providerId}')">TEKLİFİ GÖNDER</button></div>`;
 document.body.appendChild(m);
}
async function sendOffer(requestId,providerId){
 const price=Number(document.getElementById("offerPrice").value),available_time=document.getElementById("offerTime").value.trim(),note=document.getElementById("offerNote").value.trim()||null,b=document.getElementById("offerBtn");
 if(!Number.isFinite(price)||price<0)return alert("Geçerli bir fiyat gir.");
 if(!available_time)return alert("Müsait olduğunuz zamanı yazın.");
 if(!isUUID(requestId)||!isUUID(providerId))return alert("Teklif için geçerli UUID gerekli.");
 b.disabled=true;b.textContent="GÖNDERİLİYOR...";
 try{
  await sb("POST","offers",{request_id:requestId,provider_id:providerId,price,available_time,note,status:"pending"});
  connection(true);document.getElementById("offerModal")?.remove();alert("Teklif başarıyla gönderildi. ✓");showRequests();
 }catch(e){console.error(e);alert("Teklif gönderilemedi:\n\n"+e.message);b.disabled=false;b.textContent="TEKLİFİ GÖNDER"}
}

/* ---------------- START ---------------- */
async function startApp(){connection(false,"Supabase bağlanıyor...");showHome();await testDB()}
startApp();
</script>
