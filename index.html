async function v2SaveEdit(row,car,maxPh){
  if(window.__v2Saving) return;
  var g=function(i){var e=document.getElementById(i);return e?String(e.value||'').trim():'';};
  var title=g('v2eTitle'); if(!title){ alert('Başlık boş olamaz.'); return; }
  var priceRaw=g('v2ePrice'), price=priceRaw===''?null:Number(priceRaw); if(price!=null&&(!isFinite(price)||price<0)){ alert('Geçerli bir fiyat gir.'); return; }
  var phone=g('v2ePhone'); if(phone&&phone.replace(/\D/g,'').length<10){ alert('Telefon numarası eksik görünüyor.'); return; }
  var files=Array.from((document.getElementById('v2ePhotos')||{}).files||[]), have=listingPhotosFromRow(row).length;
  if(have+files.length>maxPh){ alert('En fazla '+maxPh+' fotoğraf olabilir.'); return; }
  var btn=document.getElementById('v2eSave'); window.__v2Saving=true; if(btn){ btn.disabled=true; btn.textContent='Kaydediliyor…'; }
  try{
    var md=Object.assign({},row.metadata||{}); md.phone=phone||null; md.whatsapp=(phone&&g('v2eWa')==='1')?phone:null;
    if(car){ if(document.getElementById('v2ePartsOn')&&document.getElementById('v2ePartsOn').checked){ md.parts_set=true; md.parts=Object.assign({},window.__v2EditParts||{}); } else { delete md.parts_set; delete md.parts; } }
    if(car){ md.brand=g('v2eBrand')||md.brand||null; md.model=g('v2eModel')||md.model||null; if(g('v2eYear')) md.year=Number(g('v2eYear')); if(g('v2eKm')) md.km=Number(g('v2eKm')); }
    var s=getAuthSession(), failed=[];
    if(files.length){
      md.photos=Array.isArray(md.photos)?md.photos.slice():[];
      for(var i=0;i<files.length;i++){ try{ md.photos.push(await uploadListingPhoto(s.user.id,row.id,files[i],s.access_token||s.accessToken)); }catch(pe){ failed.push((files[i].name||'foto')+': '+(pe&&pe.message||pe)); } }
    }
    var body={title:title,description:g('v2eDesc')||null,price:price,currency:g('v2eCur')||'TRY',metadata:md};
    if(!car){ body.district=g('v2eDist')||row.district; body.neighborhood=g('v2eNb')||null; }
    var out=await listingsAuthWrite('PATCH','listings?id=eq.'+encodeURIComponent(row.id),body);
    if(!Array.isArray(out.data)||!out.data.length) throw new Error('Kayıt güncellenemedi.');
    __listingCache.gayrimenkul=[]; __listingCache.otomobil=[];
    v2Toast(failed.length?'Kaydedildi; bazı fotoğraflar yüklenemedi.':'İlan güncellendi');
    if(window.__v2EditFrom==='detail'){ V2_NAV.replaceNext=true; return v2LoadDetail(row.id,car?'otomobil':'gayrimenkul'); }
    if(window.__v2EditFrom==='ws'){ V2_NAV.replaceNext=true; return v2Workspace(row.id,car?'otomobil':'gayrimenkul'); }
    window.__mineSeg='listings'; showMine();
  }catch(err){ console.error('v2SaveEdit',err); alert(err&&err.message?err.message:String(err)); if(btn){ btn.disabled=false; btn.textContent='Kaydet'; } }
  finally{ window.__v2Saving=false; }
}

function v2TokenExp(s){
  try{
    if(s&&s.expires_at) return Number(s.expires_at)*1000;
    var t=s&&(s.access_token||s.accessToken); if(!t) return 0;
    var p=JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    return (p.exp||0)*1000;
  }catch(e){ return 0; }
}

async function v2EnsureFreshToken(){
  var s=getAuthSession(); if(!s||!s.refresh_token) return s;
  var exp=v2TokenExp(s); if(!exp||exp-Date.now()>60000) return s;
  if(__v2Refreshing) return __v2Refreshing;
  __v2Refreshing=(async function(){
    try{
      var r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});
      var d=await r.json().catch(function(){return {};});
      if(!r.ok||!d.access_token){ console.warn('Oturum yenilenemedi',d&&(d.error_description||d.msg||d.error)); return s; }
      var ns=Object.assign({},s,d,{user:d.user||s.user}); saveAuthSession(ns); return ns;
    }catch(e){ console.warn('Oturum yenileme hatası',e); return s; }
    finally{ setTimeout(function(){ __v2Refreshing=null; },0); }
  })();
  return __v2Refreshing;
}

function v2NavSig(name,args){
  var a0=args&&args[0], keyed=(name==='v2LoadDetail'||name==='showRequestDetail'||name==='v2EditListing'||name==='showProviderPanel'||name==='viewMyListingSummary'||name==='openOfficialPrepGate'||name==='v2Workspace');
  return name+((keyed&&(typeof a0==='string'||typeof a0==='number'))?':'+a0:'');
}

function v2NavUrl(name,args){
  var base=location.pathname+location.search;
  if(name==='v2LoadDetail'&&args&&args[0]) return base+'#ilan='+(args[1]==='gayrimenkul'?'gayrimenkul':'otomobil')+':'+encodeURIComponent(args[0]);
  if(V2_NAV.idx<0) return base+location.hash;
  return base;
}

function v2NavPush(name,fn,args){
  if(V2_NAV.busy) return;
  try{
    var sig=v2NavSig(name,args), cur=V2_NAV.stack[V2_NAV.idx], url=v2NavUrl(name,args), rep=V2_NAV.replaceNext||name==='v2DraftResult';
    V2_NAV.replaceNext=false;
    if(cur) cur.scroll=window.scrollY||0;
    if(V2_NAV.idx<0){ V2_NAV.stack=[{sig:sig,fn:fn,scroll:0}]; V2_NAV.idx=0; history.replaceState({v2:0},'',url); }
    else if(cur&&(cur.sig===sig||rep)){ cur.sig=sig; cur.fn=fn; history.replaceState({v2:V2_NAV.idx},'',url); }
    else{ V2_NAV.stack=V2_NAV.stack.slice(0,V2_NAV.idx+1); V2_NAV.stack.push({sig:sig,fn:fn,scroll:0}); V2_NAV.idx++; history.pushState({v2:V2_NAV.idx},'',url); }

function v2PickContinue(state){
  var best=null;
  (state.listings||[]).forEach(function(r){
    var type=r.listing_type==='otomobil'?'otomobil':'gayrimenkul', k=myListingStatusMeta(r.status).key;
    if(k==='sold'||k==='rented'||k==='archived') return;
    var pr=v2WsProgress(r,type);
    if(pr.completed) return;
    /* Sadece gerçekten başlanmış hazırlıklar: dokunulmamış taslak "Devam et" zinciri oluşturmasın */
    if(!pr.started) return;
    var score=(pr.pct<100)?3:1;
    if(!best||score>best.score) best={score:score,r:r,type:type,pr:pr,k:k};
  });

function openAuthModal(mode){
 document.getElementById("authModal")?.remove();
 const title=mode==='signup'?'Hesap oluştur':'Giriş yap';
 const button=mode==='signup'?'KAYIT OL':'GİRİŞ YAP';

 const switchMode=mode==='signup'?'login':'signup';

 const html=`<div class="modal" id="authModal"><div class="modalCard"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2>${title}</h2><button class="authBtn" type="button" onclick="closeAuthModal()">Kapat</button></div><label>E-posta</label><input id="authEmail" type="email" autocomplete="email" placeholder="ornek@email.com"><label>Şifre</label><input id="authPassword" type="password" autocomplete="${mode==='signup'?'new-password':'current-password'}" placeholder="En az 6 karakter"><div id="authError"></div><button class="btn primary" id="authSubmit" type="button" onclick="submitAuth('${mode}')">${button}</button><p class="muted small" style="text-align:center;margin-bottom:0">${switchText} <button class="authBtn" type="button" onclick="openAuthModal('${switchMode}')">${switchLabel}</button></p></div></div>`;
 document.body.insertAdjacentHTML('beforeend',html);
 setTimeout(()=>document.getElementById('authEmail')?.focus(),50);
}
function closeAuthModal(){document.getElementById("authModal")?.remove()}
async function submitAuth(mode){
 const email=document.getElementById('authEmail')?.value.trim(); const password=document.getElementById('authPassword')?.value; const err=document.getElementById('authError'); const btn=document.getElementById('authSubmit');
 if(!email||!password){if(err)err.innerHTML='<div class="authError">E-posta ve şifre gerekli.</div>';return}
 if(password.length<6){if(err)err.innerHTML='<div class="authError">Şifre en az 6 karakter olmalı.</div>';return}
 btn.disabled=true;btn.textContent='BEKLEYİN...';
 try{
   let url=SUPABASE_URL+'/auth/v1/'+(mode==='signup'?'signup':'token?grant_type=password');
   const r=await fetch(url,{method:'POST',headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});
   const data=await r.json().catch(()=>({}));
   if(!r.ok)throw new Error(data.error_description||data.msg||data.message||'Kimlik doğrulama başarısız.');

      closeAuthModal(); alert('Kayıt tamamlandı. E-posta doğrulaması açıksa gelen kutunu kontrol et, ardından giriş yap.'); return;
   }
   saveAuthSession(data); closeAuthModal(); alert(mode==='signup'?'Hesap oluşturuldu. ✓':'Giriş başarılı. ✓');
 }catch(e){if(err)err.innerHTML='<div class="authError">'+escapeHTML(e.message||String(e))+'</div>';}finally{if(btn){btn.disabled=false;btn.textContent=buttonText(mode)}}
}

function getKurumFlow(id){return (id&&KURUM_FLOWS[id])?KURUM_FLOWS[id]:null;}
function kurumQuestionsAnswered(){
 const flow=getKurumFlow(H.kurumFlowId);
 if(!flow||!flow.questions||!flow.questions.length)return true;
 const a=H.answers||{};
 return flow.questions.every(q=>a[q.key]!=null&&String(a[q.key]).trim()!=='');
}
function kurumRequiredDocsUploaded(){
 const docs=getKurumDocumentChecklist(H.answers||{});
 return docs.filter(d=>d.required!==false).every(d=>getDocumentFiles(d.key).length>0);
}
function kurumAnswerLabel(q,val){
 if(!q)return String(val||'');
 if(q.type==='choice'&&q.options){
  const hit=q.options.find(o=>o[0]===val);
  return hit?hit[1]:String(val||'');
 }
 return String(val||'');
}

function defaultCaseSteps(){return activeStepTemplate().map(x=>({id:null,step_key:x.key,title:x.title,description:x.description,sort_order:x.sort_order,institution:x.institution,status:'pending',is_optional:false,metadata:{},completed_at:null}));}
function normalizeCaseSteps(rows){const byKey={};(Array.isArray(rows)?rows:[]).forEach(r=>{if(r&&r.step_key)byKey[r.step_key]=r;});return activeStepTemplate().map(t=>byKey[t.key]||({...t,key:t.key,step_key:t.key,title:t.title,description:t.description,sort_order:t.sort_order,institution:t.institution,status:'pending',id:null,is_optional:false,metadata:{},completed_at:null}));}
async function loadCaseSteps(){
 H.caseSteps=defaultCaseSteps();
 if(!H.dbId)return;
 try{
  const rows=await supabaseAuthRequest('GET','hallet_case_steps?select=id,case_id,step_key,title,description,sort_order,institution,status,is_optional,metadata,completed_at,created_at,updated_at&case_id=eq.'+encodeURIComponent(H.dbId)+'&order=sort_order.asc&limit=50');
  if(Array.isArray(rows)&&rows.length)H.caseSteps=normalizeCaseSteps(rows);
 }catch(e){console.warn('Hallet işlem adımları yüklenemedi; yerel akış kullanılacak.',e);}
}
async function ensureCaseSteps(){
 if(!H.dbId)return;
 const steps=H.caseSteps&&H.caseSteps.length?H.caseSteps:defaultCaseSteps();
 H.caseSteps=steps;
 try{
  const existing=await supabaseAuthRequest('GET','hallet_case_steps?select=id,step_key&case_id=eq.'+encodeURIComponent(H.dbId)+'&limit=50');
  const existingKeys=new Set((Array.isArray(existing)?existing:[]).map(x=>x.step_key));
  const missing=steps.filter(x=>!existingKeys.has(x.step_key)).map(x=>({case_id:H.dbId,step_key:x.step_key,title:x.title,description:x.description,sort_order:x.sort_order,institution:x.institution,status:x.status||'pending',is_optional:!!x.is_optional,metadata:x.metadata||{},completed_at:x.completed_at||null}));
  if(missing.length){const created=await supabaseAuthRequest('POST','hallet_case_steps',missing);(Array.isArray(created)?created:[]).forEach(r=>{const st=H.caseSteps.find(x=>x.step_key===r.step_key);if(st)st.id=r.id;});}
 }catch(e){console.warn('Hallet işlem adımları kaydedilemedi; dosya kaydı korunuyor.',e);}
}
async function updateCaseStep(key){
 const fromSaved=!!H.dbId;
 const step=H.caseSteps.find(x=>x.step_key===key);
 if(!step)return;
 const previousStatus=step.status||'pending';
 const previousCompletedAt=step.completed_at||null;
 let nextStatus=previousStatus==='completed'?'pending':'completed';
 const nextCompletedAt=nextStatus==='completed'?new Date().toISOString():null;
 if(H.module==='kurum_basvurusu'&&nextStatus==='completed'){
  if(key==='info'&&!kurumQuestionsAnswered()){
   alert('Önce başvuru bilgilerini tamamla (soruları yanıtla).');
   return;
  }
  if(key==='documents'&&!kurumRequiredDocsUploaded()){
   alert('Zorunlu belgeler yüklenmeden bu adım tamamlanamaz.');
   return;
  }
 }
 if(!H.dbId){
  step.status=nextStatus;
  step.completed_at=nextCompletedAt;
  return showActiveResult(false);
 }
 const target=H.caseSteps.find(x=>x.step_key===key)||step;
 target.status=nextStatus;
 target.completed_at=nextCompletedAt;
 try{
  const filter=target.id
   ? 'id=eq.'+encodeURIComponent(target.id)
   : 'case_id=eq.'+encodeURIComponent(H.dbId)+'&step_key=eq.'+encodeURIComponent(key);
  const updated=await supabaseAuthRequest(
   'PATCH',
   'hallet_case_steps?'+filter+'&select=id,case_id,step_key,status,completed_at,updated_at',
   {status:nextStatus,completed_at:nextCompletedAt,updated_at:new Date().toISOString()}
  );
  if(!Array.isArray(updated)||!updated.length)throw new Error('İşlem adımı veritabanında güncellenemedi.');
  const saved=updated[0];
  if(saved.status!==nextStatus){throw new Error('İşlem adımı durumu doğrulanamadı.');}
  target.status=saved.status;
  target.completed_at=saved.completed_at||null;
 }catch(e){
  target.status=previousStatus;
  target.completed_at=previousCompletedAt;
  console.error('İşlem adımı kaydedilemedi:',e);
  const c=document.querySelector('#hallet-root .hc');
  if(c&&!c.querySelector('.err'))c.insertAdjacentHTML('beforeend','<div class="err">İşlem adımı kaydedilemedi. Lütfen tekrar deneyin.</div>');
 }
 showActiveResult(fromSaved);
}
function stepSummary(){const steps=H.caseSteps&&H.caseSteps.length?H.caseSteps:defaultCaseSteps();const done=steps.filter(x=>x.status==='completed').length;return {steps,done,total:steps.length,percent:steps.length?Math.round(done/steps.length*100):0};}

 if(a.multiple_owners==='yes')docs.push({key:'owners',title:'Malik / temsil kontrolü',reason:'Birden fazla malik için taraf ve temsil durumunun tamamlanması gerekir.',required:true});

function documentSummary(docs){

 return {total,ready,percent,complete:total>0&&ready===total,missing};
}

function buildCasePayload(){
 const a=H.answers;
 const sale=Number(a.sale_price)||0;
 const purchase=Number(a.acquisition_price)||0;
 const municipalValue=Number(a.municipal_tax_value)||0;
 const harcBase=Math.max(sale,municipalValue,0);
 const sellerFee=harcBase*0.02;
 const buyerFee=harcBase*0.02;
 const totalFee=harcBase*0.04;
 const grossGain=(sale>0&&purchase>0)?sale-purchase:null;
 const warnings=[];
 if(a.seller_type!=='real_person')warnings.push('Bu aktif akış gerçek kişi satışı için hazırlanmıştır. Tüzel kişi satışında farklı belge ve süreçler gerekebilir.');
 if(a.property_location!=='turkey')warnings.push('Yurt dışındaki taşınmazlar için bu Türkiye tapu satış akışı kullanılmamalıdır.');
 if(a.title_deed!=='yes')warnings.push('Tapu bilgileri işlem öncesinde doğrulanmalıdır.');
 if(a.multiple_owners==='yes')warnings.push('Birden fazla malik varsa tüm maliklerin veya geçerli temsilcilerinin işlem durumu ayrıca kontrol edilmelidir.');
 if(a.encumbrance!=='no')warnings.push('Haciz, ipotek veya başka bir takyidat varsa satış öncesinde güncel tapu kaydı üzerinden ayrıca değerlendirilmelidir.');
 if(a.representation==='yes')warnings.push('Vekâletname/temsil belgesinin kapsamı ve geçerliliği işlem öncesinde kontrol edilmelidir.');
 if(a.buyer_ready!=='yes')warnings.push('Alıcının hazır olmaması işlem zamanlamasını etkileyebilir.');
 let fivePassed=false;
 if(a.acquisition_date){const d=new Date(a.acquisition_date+'T00:00:00');if(!Number.isNaN(d.getTime())){const x=new Date(d);x.setFullYear(x.getFullYear()+5);fivePassed=new Date()>=x;if(!fivePassed&&a.acquisition_type==='purchase')warnings.push('5 yıllık süre dolmadan satışta değer artış kazancı yönünden vergi değerlendirmesi gerekebilir.');}}
 const capitalGainRelevant=!fivePassed&&a.acquisition_type!=='inheritance'&&a.acquisition_type!=='gift';
 if(sale>0&&municipalValue>0&&sale<municipalValue)warnings.push('Beyan edilen satış bedeli emlak vergisi değerinden düşük görünüyor; tapu harcı ön hesabında daha yüksek değer esas alınmıştır.');
 return {
   case_type:'konut_satisi',
   status:(H.status==='completed'?'completed':(H.status||'draft')),
   title:'Konut satışı',
   summary:'İşini Hallet ön kontrol dosyası — konut satışı',
   user_id:getAuthSession()?.user?.id||null,
   customer_id:getAuthSession()?.user?.id||null,
   district:a.district||null,
   city:a.city||'İzmir',
   created_at:H.createdAt||new Date().toISOString(),
   updated_at:new Date().toISOString(),
   metadata:{
     case_no:H.caseId,
     module:'tasinmaz',
     transaction_type:'konut_satisi',
     answers:a,
     calculations:{sale_price:sale,municipal_tax_value:municipalValue,harc_base:harcBase,acquisition_price:purchase,gross_difference:grossGain,seller_tapu_harci:sellerFee,buyer_tapu_harci:buyerFee,total_tapu_harci:totalFee,five_years_passed:fivePassed,capital_gain_relevant:capitalGainRelevant},
     warnings,
     documents:H.documents,
     document_summary:documentSummary(getDocumentChecklist(a)),
     rule_engine:{version:'v2',checked_at:new Date().toISOString(),capital_gain_relevant:capitalGainRelevant,tapu_harci_base:harcBase},
     source_note:'Bu dosya ön kontrol aracıdır; resmi başvuru sırasında TKGM’nin güncel koşulları esas alınmalıdır.'
   }
 };
}
async function saveCase(silent=false){
 if(!H.caseId)H.caseId='IH-'+new Date().toISOString().replace(/\D/g,'').slice(0,14)+'-'+Math.random().toString(36).slice(2,7).toUpperCase();
 const session=getAuthSession();
 if(!session?.access_token||!session?.user?.id){openAuthModal('login');return;}
 const btn=document.querySelector('#hallet-root [data-a="savecase"]');
 if(btn){btn.disabled=true;btn.textContent='KAYDEDİLİYOR...';}
 try{
   const payload=buildCasePayload();
   let rows;
   if(H.dbId){
     rows=await supabaseAuthRequest('PATCH','hallet_cases?id=eq.'+encodeURIComponent(H.dbId),payload);
   }else{
     rows=await supabaseAuthRequest('POST','hallet_cases',payload);
   }
   const row=Array.isArray(rows)?rows[0]:rows;
   H.dbId=row?.id||H.dbId;
   H.createdAt=row?.created_at||H.createdAt||new Date().toISOString();
   await ensureCaseSteps();
   if(btn){btn.textContent='✓ DOSYA KAYDEDİLDİ';btn.disabled=true;btn.classList.add('saved');}
   if(!silent)alert('İşlem dosyan Supabase hesabına kaydedildi. ✓\n\nDosya No: '+H.caseId);
 }catch(e){
   console.error('Hallet dosya kayıt hatası:',e);
   if(btn){btn.disabled=false;btn.textContent='DOSYAYI KAYDET';}
   alert('Dosya kaydedilemedi.\n\n'+(e.message||'Bilinmeyen hata'));
 }
}

function evrakReadFields(def){

  const el=document.getElementById(f.id);
  d[f.id]=el?(el.value||'').trim():'';
 });
 return d;
}
function evrakFillFields(def,draft){

 });
}

async function evrakTypeSave(typeKey){
 const def=EVRAK_DRAFT_DEFS[typeKey];
 if(!def)return;
 const d=(H.evrakDraft&&H.evrakType===typeKey)?H.evrakDraft:null;
 if(!d){alert('Önce önizleme yapın.');return;}
 const session=getAuthSession();
 if(!session?.access_token||!session?.user?.id){openAuthModal('login');return;}
 const ready=!!def.ready(d);
 const caseNo='IH-'+new Date().toISOString().replace(/\D/g,'').slice(0,14)+'-'+Math.random().toString(36).slice(2,7).toUpperCase();
 const payload={
  case_type:'konut_satisi',
  status:ready?'in_progress':'draft',
  title:def.title,
  summary:'Evrak taslağı · '+def.title,
  user_id:session.user.id,
  customer_id:session.user.id,
  city:null,
  metadata:{
   module:'evrak_hazirlama',
   document_type:def.document_type,
   case_no:caseNo,
   draft:d,
   ready:ready,
   disclaimer:'Taslak / bilgilendirme — resmî belge yerine geçmez'
  }
 };
 try{
  if(H.dbId){
   payload.status=H.status==='completed'?'completed':payload.status;
   await supabaseAuthRequest('PATCH','hallet_cases?id=eq.'+encodeURIComponent(H.dbId),payload);
  }else{
   const rows=await supabaseAuthRequest('POST','hallet_cases',payload);
   const row=Array.isArray(rows)?rows[0]:rows;
   H.dbId=row?.id||null;
  }
  H.caseId=caseNo;
  alert((ready?'Hazır ✓ — ':'')+'İşlem dosyasına kaydedildi.\n\n'+def.title);
  cases();
 }catch(e){
  console.error(e);
  alert('Kayıt başarısız: '+(e?.message||e));
 }
}
function evrakOpenSaved(row,m){

 H.dbId=row.id; H.caseId=m.case_no||null; H.status=row.status||'draft'; H.module='evrak_hazirlama'; H.evrakDraft=draft;

async function savePropCase(silent){
 const f=getPropFlow(H.propFlowId); if(!f){alert('Akış yok');return;}
 const session=getAuthSession();
 if(!session?.access_token||!session?.user?.id){openAuthModal('login');return;}
 if(!H.caseId)H.caseId='IH-'+new Date().toISOString().replace(/\D/g,'').slice(0,14)+'-'+Math.random().toString(36).slice(2,7).toUpperCase();
 const docs=getPropDocumentChecklist(H.answers);
 const ready=docs.filter(d=>H.documents[d.key]).length;
 const payload={
  case_type:f.case_type,
  user_id:session.user.id,
  customer_id:session.user.id,
  status:(H.status==='completed'?'completed':(H.status||'draft')),
  title:f.title,
  summary:'Hazırlık dosyası — resmî işlem yerine geçmez',
  city:'İzmir',
  district:null,
  metadata:{
   module:'prop',
   prop_flow:f.id,
   transaction_type:f.case_type,
   case_no:H.caseId,
   answers:H.answers||{},
   documents:H.documents||{},
   document_summary:{total:docs.length,ready,percent:docs.length?Math.round(ready/docs.length*100):0,missing:docs.filter(d=>!H.documents[d.key]).map(d=>({key:d.key,title:d.title}))},
   disclaimer:f.disclaimer
  }
 };
 try{
  let rows;
  if(H.dbId)rows=await supabaseAuthRequest('PATCH','hallet_cases?id=eq.'+encodeURIComponent(H.dbId),payload);
  else rows=await supabaseAuthRequest('POST','hallet_cases',payload);
  const row=Array.isArray(rows)?rows[0]:rows;
  H.dbId=row?.id||H.dbId;
  H.createdAt=row?.created_at||H.createdAt||new Date().toISOString();
  await ensureCaseSteps();
  if(!silent)alert('Dosya kaydedildi.\n\n'+f.title+'\nNo: '+H.caseId);
  propResult(false);
 }catch(e){
  console.error(e);
  alert('Kayıt başarısız. case_type için DB constraint güncel mi kontrol edin.\n\n'+((e&&e.message)||e));
 }
}

async function storageUpload(path,file,token){
  // POST /object/{bucket}/{path} — authenticated path is only for GET download
  if(!token)throw new Error('Belge yüklemek için giriş yapmalısınız.');
  const safePath=path.split('/').filter(Boolean).map(encodeURIComponent).join('/');
  const url=SUPABASE_URL+'/storage/v1/object/hallet-documents/'+safePath;
  console.log('[DOCUMENT_LAYER] upload', {path,url,size:file&&file.size,type:file&&file.type});
  const headers={
    'Authorization':'Bearer '+token,
    'apikey':SUPABASE_KEY,
    'Content-Type':file.type||'application/octet-stream',
    'x-upsert':'false'
  };
  const res=await fetch(url,{method:'POST',headers,body:file});
  const text=await res.text();
  if(!res.ok){
    let d=null;try{d=text?JSON.parse(text):null}catch(e){}
    console.error('[DOCUMENT_LAYER] upload fail', {status:res.status,message:d&&d.message,details:d&&d.details,text:text&&text.slice(0,300)});
    throw new Error((d&&(d.message||d.error))||text||('Belge yüklenemedi (HTTP '+res.status+').'));
  }
  return true;
}
async function storageDelete(path,token){
  if(!token)throw new Error('Silmek için giriş yapmalısınız.');
  if(!path)throw new Error('Silinecek dosya yolu yok.');
  const safePath=String(path).split('/').filter(Boolean).map(encodeURIComponent).join('/');
  const url=SUPABASE_URL+'/storage/v1/object/hallet-documents/'+safePath;
  console.log('[DOCUMENT_LAYER] delete storage', {path,url});
  const res=await fetch(url,{method:'DELETE',headers:{'Authorization':'Bearer '+token,'apikey':SUPABASE_KEY}});
  const text=await res.text().catch(function(){return '';});
  if(!res.ok && res.status!==404){
    let d=null;try{d=text?JSON.parse(text):null}catch(e){}
    console.error('[DOCUMENT_LAYER] delete storage fail', {status:res.status,message:d&&d.message,text:text&&text.slice(0,300)});
    throw new Error((d&&(d.message||d.error))||text||('Storage silinemedi (HTTP '+res.status+').'));
  }
  return true;
}

async function saveDocumentRow(docKey,file,path){
  const session=getAuthSession();
  if(!session||!session.access_token||!session.user||!session.user.id||!H.dbId)throw new Error('Belgeyi kaydetmek için önce işlem dosyasını kaydetmelisiniz.');
  let docs=[];
  try{
    if(typeof activeDocumentChecklist==='function')docs=activeDocumentChecklist(H.answers||{})||[];
    else if(H.module==='prop'&&typeof getPropDocumentChecklist==='function')docs=getPropDocumentChecklist(H.answers||{})||[];
    else if(typeof getDocumentChecklist==='function')docs=getDocumentChecklist(H.answers||{})||[];
  }catch(e){docs=[];}
  const meta=(docs||[]).find(function(d){return d.key===docKey;});
  const body={
    case_id:H.dbId,
    doc_key:docKey,
    title:(meta&&meta.title)||docKey,
    is_required:!!(meta&&meta.required===true),
    is_conditional:false,
    condition_note:null,
    status:'uploaded',
    storage_path:path,
    mime_type:file.type||null,
    file_size_bytes:file.size||0,
    metadata:{original_name:file.name||null},
    user_id:session.user.id,
    updated_at:new Date().toISOString()
  };
  console.log('[DOCUMENT_LAYER] db insert', {case_id:H.dbId,doc_key:docKey,storage_path:path});
  const rows=await supabaseAuthRequest('POST','hallet_documents',body);
  return Array.isArray(rows)?rows[0]:rows;
}
async function ensureCaseSaved(){
  if(H.dbId)return true;
  if(H.module==='prop')await savePropCase(true);
  else if(H.module==='kurum_basvurusu')await saveKurumCase(true);
  else if(H.module==='arac_flow')await saveVehicleFlowCase(true);
  else if(H.module==='arac'||H.module==='arac_satisi')await saveAracCase(true);
  else await saveCase(true);
  return !!H.dbId;
}
async function uploadDocument(docKey,file){
  if(!file)return;
  const session=getAuthSession();
  if(!session||!session.access_token||!session.user||!session.user.id){openAuthModal('login');return;}
  if(file.size>10*1024*1024){alert('Dosya en fazla 10 MB olabilir.');return;}
  if(!(file.type==='application/pdf'||(file.type&&file.type.indexOf('image/')===0))){alert('Sadece PDF veya görsel dosyaları yükleyebilirsiniz.');return;}
  let uploadedPath=null;
  try{
    const saved=await ensureCaseSaved();
    if(!saved||!H.dbId)throw new Error('İşlem dosyası kaydedilemedi.');
    const safeName=(file.name||'belge').replace(/[^a-zA-Z0-9._-]/g,'_');
    const path=session.user.id+'/'+H.dbId+'/'+docKey+'/'+Date.now()+'-'+safeName;
    await storageUpload(path,file,session.access_token);
    uploadedPath=path;
    let row=null;
    try{
      row=await saveDocumentRow(docKey,file,path);
    }catch(dbErr){
      console.error('[DOCUMENT_LAYER] db after upload failed, rolling back storage', dbErr);
      try{await storageDelete(path,session.access_token);}catch(rb){console.error('[DOCUMENT_LAYER] rollback failed', rb);}
      throw dbErr;
    }
    H.documents[docKey]=true;
    const uploadedFile={id:row&&row.id||null,path:path,name:file.name||safeName,type:file.type||null,size:file.size||0};
    const existingFiles=getDocumentFiles(docKey);
    H.documentFiles[docKey]=existingFiles.concat([uploadedFile]);
    if(H.module==='kurum_basvurusu'){await saveKurumCase(true);kurumResult(false);}
    else if(H.module==='prop'){propResult(false);}
    else if(H.module==='arac_flow'){await saveVehicleFlowCase(true);vehicleFlowResult(false);}
    else if(H.module==='arac'||H.module==='arac_satisi'){await saveAracCase(true);aracResult(false);}
    else{await saveCase(true);result(false);}
    alert('Belge başarıyla yüklendi. ✓\n\n'+(file.name||'Belge'));
  }catch(e){
    console.error('[DOCUMENT_LAYER] upload error', e);
    alert('Belge yüklenemedi.\n\n'+(e&&e.message?e.message:'Bilinmeyen hata'));
  }
}
async function deleteDocument(docKey,index){
  const session=getAuthSession();
  if(!session||!session.access_token){openAuthModal('login');return;}
  const files=getDocumentFiles(docKey);
  const f=files[Number(index)||0];
  if(!f||!f.path){alert('Silinecek belge bulunamadı.');return;}
  if(!confirm('Bu belgeyi silmek istiyor musunuz?\n\n'+(f.name||f.path)))return;
  try{
    console.log('[DOCUMENT_LAYER] delete', {docKey,index,path:f.path,id:f.id});
    await storageDelete(f.path,session.access_token);
    if(f.id){
      await supabaseAuthRequest('DELETE','hallet_documents?id=eq.'+encodeURIComponent(f.id));
    }else if(H.dbId){
      // id yoksa path + case ile sil
      await supabaseAuthRequest('DELETE','hallet_documents?case_id=eq.'+encodeURIComponent(H.dbId)+'&storage_path=eq.'+encodeURIComponent(f.path));
    }
    const next=files.slice();
    next.splice(Number(index)||0,1);
    H.documentFiles[docKey]=next;
    if(!next.length)H.documents[docKey]=false;
    if(H.module==='kurum_basvurusu')kurumResult(false);
    else if(H.module==='prop')propResult(false);
    else if(H.module==='arac_flow')vehicleFlowResult(false);
    else if(H.module==='arac'||H.module==='arac_satisi')aracResult(false);
    else result(false);
    alert('Belge silindi.');
  }catch(e){
    console.error('[DOCUMENT_LAYER] delete error', e);
    alert('Belge silinemedi.\n\n'+(e&&e.message?e.message:'Bilinmeyen hata'));
  }
}

async function saveKurumCase(silent){

  }
 };

 try{

  if(H.dbId)rows=await supabaseAuthRequest('PATCH','hallet_cases?id=eq.'+encodeURIComponent(H.dbId)+'&select=id,status,created_at',payload);
  else rows=await supabaseAuthRequest('POST','hallet_cases?select=id,status,created_at',payload);

  await ensureCaseSteps();

  if(!silent)kurumResult(true);

 }

async function markCaseCompleted(){

     const stepState=stepSummary();
     const docs=activeDocumentChecklist(H.answers||{});
     const docState=documentSummary(docs);
     const canComplete=docState.complete&&stepState.done>=stepState.total&&stepState.total>0;
     if(!canComplete){alert('Önce tüm hazırlık adımlarını ve gerekli belgeleri tamamla.');return;}

     try{
      const updated=await supabaseAuthRequest('PATCH','hallet_cases?id=eq.'+encodeURIComponent(H.dbId),{status:'completed',updated_at:new Date().toISOString()});

     }
    }

document.addEventListener('click',function(e){
  var node=e.target;
  if(node&&node.nodeType===3)node=node.parentElement;
  if(!node||!node.closest)return;
  var openBtn=node.closest('#hallet-root [data-a="openDoc"]');
  if(openBtn){
    e.preventDefault();
    e.stopPropagation();
    if(e.stopImmediatePropagation)e.stopImmediatePropagation();
    openDocument(openBtn.getAttribute('data-k')||'',Number(openBtn.getAttribute('data-i')||0)||0);
    return;
  }
  var delBtn=node.closest('#hallet-root [data-a="deleteDoc"]');
  if(delBtn){
    e.preventDefault();
    e.stopPropagation();
    if(e.stopImmediatePropagation)e.stopImmediatePropagation();
    if(typeof deleteDocument==='function')deleteDocument(delBtn.getAttribute('data-k')||'',Number(delBtn.getAttribute('data-i')||0)||0);
    return;
  }
  var el=node.closest('#hallet-root [data-a]');
  if(!el)return;
  e.preventDefault();
  e.stopPropagation();
  dispatch(el.getAttribute('data-a')||el.dataset.a,el);
},true);
document.addEventListener('change',function(e){
  const box=e.target.closest&&e.target.closest('#hallet-root input[data-kurum-doc]');

},true);
