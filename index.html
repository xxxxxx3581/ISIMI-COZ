<script>
const SUPABASE_URL="https://zvffspbowdzvrrzefhkr.supabase.co";
const SUPABASE_KEY="sb_publishable_L_qb9Q4fHktE51PEqEhTAg_O4R0eDiW";

const SERVICES={
 klima:{name:"Klima",emoji:"❄️",desc:"Bakım, montaj, arıza ve temizlik"},
 elektrik:{name:"Elektrik",emoji:"⚡",desc:"Arıza, priz, tesisat ve aydınlatma"},
 tesisat:{name:"Tesisat",emoji:"🔧",desc:"Su, gider, musluk ve kaçak sorunları"},
 beyaz:{name:"Beyaz Eşya",emoji:"🧊",desc:"Çamaşır, bulaşık, buzdolabı ve fırın"},
 temizlik:{name:"Temizlik",emoji:"🧹",desc:"Ev, ofis ve detaylı temizlik"},
 nakliye:{name:"Nakliye",emoji:"🚚",desc:"Ev, ofis ve parça eşya taşıma"},
 cilingir:{name:"Çilingir",emoji:"🔐",desc:"Kilit, anahtar ve acil giriş"},
 oto:{name:"Oto",emoji:"🚗",desc:"Arıza, bakım, lastik ve yol yardımı"}
};

const DISTRICTS=[...new Set(["Aliağa","Balçova","Bayındır","Bayraklı","Bergama","Beydağ","Bornova","Buca","Çeşme","Çiğli","Dikili","Foça","Gaziemir","Güzelbahçe","Karabağlar","Karaburun","Karşıyaka","Konak","Menemen","Menderes","Narlıdere","Ödemiş","Seferihisar","Selçuk","Tire","Torbalı","Urla","Kiraz","Kemalpaşa","Kınık"])];

const KEYS={requests:"isimi_coz_requests_v5",provider:"isimi_coz_provider_v5",providerLogged:"isimi_coz_provider_logged_v5"};

function read(k,f){try{const x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}}
function write(k,v){localStorage.setItem(k,JSON.stringify(v))}
function getRequests(){return read(KEYS.requests,[])}
function getProvider(){return read(KEYS.provider,null)}
function providerLogged(){return read(KEYS.providerLogged,false)}
function uid(prefix){return prefix+"-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,7).toUpperCase();}

function escapeHTML(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function app(h){document.getElementById("app").innerHTML=h;window.scrollTo(0,0)}
function setNav(a){["navHome","navRequest","navRequests","navProvider"].forEach(id=>document.getElementById(id)?.classList.remove("active"));if(a)document.getElementById(a)?.classList.add("active")}
function setConnection(ok,text){const e=document.getElementById("connectionStatus");if(!e)return;e.className="connection "+(ok?"online":"offline");e.textContent=text||(ok?"Supabase bağlı ✓":"Yerel mod")}

async function supabaseRequest(method,path,body=null){
 const o={method,headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Accept":"application/json","Prefer":"return=representation"}};
 if(body!==null)o.body=JSON.stringify(body);
 const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,o);
 const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){d=t}
 if(!r.ok)throw new Error(d?.message||d?.details||d?.hint||"Supabase işlemi başarısız.");
 return d;
}

function normalize(v){
 return String(v??"").trim().toLowerCase()
 .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
 .replace(/ı/g,"i").replace(/İ/g,"i");
}
function pick(o,names,def=""){for(const n of names){if(o&&o[n]!==undefined&&o[n]!==null)return o[n]}return def}
function serviceKeyFromValue(v){
 const x=normalize(v);
 for(const [k,s] of Object.entries(SERVICES)){
  if(x===normalize(k)||x===normalize(s.name))return k;
 }
 return String(v??"").trim();
}

async function testSupabase(){
 try{await supabaseRequest("GET","talepler?select=id&limit=1");setConnection(true,"Supabase bağlı ✓");return true}
 catch(e){console.error(e);setConnection(false,"Yerel mod");return false}
}

async function loadRequestsFromSupabase(){
 try{
  const data=await supabaseRequest("GET","talepler?select=*&order=created_at.desc&limit=200");
  if(Array.isArray(data)){
   const mapped=data.map(mapRequest);write(KEYS.requests,mapped);setConnection(true,"Supabase bağlı ✓");return mapped;
  }
 }catch(e){console.warn("Talepler alınamadı:",e)}
 return getRequests();
}
function mapRequest(r){
 const kategori=pick(r,["kategori","category","service"],"");
 return {
  id:pick(r,["talep_no","id"],""),
  talep_no:pick(r,["talep_no","request_no","id"],""),
  service:serviceKeyFromValue(kategori),kategori:kategori,
  description:pick(r,["aciklama","description"],""),
  aciklama:pick(r,["aciklama","description"],""),
  il:pick(r,["il","city"],"İzmir"),
  district:pick(r,["ilce","district"],""),ilce:pick(r,["ilce","district"],""),
  neighborhood:pick(r,["mahalle","neighborhood"],""),mahalle:pick(r,["mahalle","neighborhood"],""),
  urgency:pick(r,["aciliyet","urgency"],""),
  aciliyet:pick(r,["aciliyet","urgency"],""),
  name:pick(r,["ad_soyad","name"],""),ad_soyad:pick(r,["ad_soyad","name"],""),
  phone:pick(r,["telefon","phone"],""),telefon:pick(r,["telefon","phone"],""),
  status:pick(r,["durum","status"],"Beklemede"),durum:pick(r,["durum","status"],"Beklemede"),
  createdAt:pick(r,["created_at","createdAt"],"")
 };
}

/* ---------------- PROVIDER DATA: SUPABASE ---------------- */

async function loadProvidersFromSupabase(){
 try{
  const rows=await supabaseRequest("GET","providers?select=*&limit=500");
  if(!Array.isArray(rows))return [];
  const providers=rows.map(mapProvider);
  setConnection(true,"Supabase bağlı ✓");
  return providers;
 }catch(e){
  console.error("providers okunamadı:",e);
  return [];
 }
}

async function loadCategories(){
 try{
  const rows=await supabaseRequest("GET","categories?select=*&limit=500");
  return Array.isArray(rows)?rows:[];
 }catch(e){console.warn("categories okunamadı:",e);return []}
}

async function loadProviderCategories(){
 try{
  const rows=await supabaseRequest("GET","provider_categories?select=*&limit=1000");
  return Array.isArray(rows)?rows:[];
 }catch(e){console.warn("provider_categories okunamadı:",e);return []}
}

function mapProvider(r){
 return {
  id:pick(r,["id","provider_id"],""),
  name:pick(r,["name","ad","ad_soyad","business_name","isletme"],"Hizmet Sağlayıcı"),
  phone:pick(r,["phone","telefon","telefon_numarasi"],""),
  category:pick(r,["category","kategori","category_id"],""),
  city:pick(r,["il","city"],"İzmir"),
  district:pick(r,["ilce","district"],""),
  neighborhood:pick(r,["mahalle","neighborhood"],""),
  description:pick(r,["description","aciklama"],""),
  active:pick(r,["active","aktif"],true)!==false,
  services:[]
 };
}

function categoryValueFromRow(row,categories){
 const raw=pick(row,["category_id","kategori_id","category","kategori"],"");
 if(!raw)return "";
 const c=categories.find(x=>String(x.id)===String(raw));
 if(c)return pick(c,["name","name_tr","ad","kategori"],raw);
 return raw;
}

async function enrichProviders(providers){
 const [cats,links]=await Promise.all([loadCategories(),loadProviderCategories()]);
 const byId={};
 providers.forEach(p=>byId[String(p.id)]=p);

 links.forEach(link=>{
  const pid=pick(link,["provider_id","providers_id","provider"],"");
  const val=categoryValueFromRow(link,cats);
  if(byId[String(pid)]&&val)byId[String(pid)].services.push(serviceKeyFromValue(val));
 });

 providers.forEach(p=>{
  const direct=p.category;
  if(direct&&!p.services.length)p.services=[serviceKeyFromValue(direct)];
  p.services=[...new Set(p.services.filter(Boolean))];
 });
 return providers;
}

function providerMatchesRequest(p,r){
 if(!p.active)return false;
 const ps=(p.services||[]).map(serviceKeyFromValue);
 const rk=serviceKeyFromValue(r.kategori||r.service);
 const district=normalize(p.district),rd=normalize(r.ilce||r.district);
 const city=normalize(p.city),rc=normalize(r.il||"İzmir");
 const categoryOK=ps.length?ps.includes(rk):true;
 const districtOK=district?district===rd:true;
 const cityOK=!city||!rc||city===rc||city==="izmir";
 return categoryOK&&districtOK&&cityOK;
}

/* ---------------- REQUEST ---------------- */

function serviceOptions(selected=""){return `<option value="">Kategori seç</option>`+Object.entries(SERVICES).map(([k,s])=>`<option value="${k}" ${k===selected?"selected":""}>${s.emoji} ${s.name}</option>`).join("")}
function districtOptions(selected=""){return `<option value="">İlçe seç</option>`+DISTRICTS.map(d=>`<option value="${escapeHTML(d)}" ${d===selected?"selected":""}>${escapeHTML(d)}</option>`).join("")}
function makeRequestNumber(){const d=new Date();return `IC-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}-${Math.floor(1000+Math.random()*9000)}`}

function showRequest(preselected=""){
 setNav("navRequest");
 app(`<div class="back"><button class="btn secondary smallBtn" onclick="showHome()">← Ana sayfaya dön</button></div>
 <div class="formCard"><span class="badge">📋 YENİ HİZMET TALEBİ</span><h1>İhtiyacını anlat.</h1><p class="muted small">Sorununu açıkça anlat. Böylece doğru hizmet sağlayıcısına ulaşmak kolaylaşır.</p>
 <label>Hizmet kategorisi *</label><select id="reqService">${serviceOptions(preselected)}</select>
 <label>Sorunun / ihtiyacın *</label><textarea id="reqDescription" maxlength="1000" placeholder="Örneğin: Klima çalışıyor fakat yeterince soğutmuyor."></textarea><div class="small muted" id="charCount">0/1000</div>
 <div class="row"><div><label>İl *</label><select id="reqCity"><option value="İzmir" selected>İzmir</option></select></div><div><label>İlçe *</label><select id="reqDistrict">${districtOptions()}</select></div></div>
 <label>Mahalle</label><input id="reqNeighborhood" placeholder="Mahalle adı">
 <label>Ne zaman gerekli?</label><select id="reqUrgency"><option value="Acil">🔴 Acil</option><option value="Bugün" selected>🟡 Bugün</option><option value="Uygun zamanda">🟢 Uygun zamanda</option></select>
 <label>Adınız *</label><input id="reqName" placeholder="Adınız Soyadınız" autocomplete="name">
 <label>Telefon *</label><input id="reqPhone" type="tel" inputmode="tel" placeholder="05xxxxxxxxx" autocomplete="tel">
 <div class="notice">🔒 Bilgileriniz hizmet talebinin oluşturulması amacıyla kullanılır.</div>
 <button class="btn primary" id="createRequestButton" onclick="createRequest()">TALEBİ OLUŞTUR</button></div>`);
 document.getElementById("reqDescription")?.addEventListener("input",e=>document.getElementById("charCount").textContent=e.target.value.length+"/1000");
}

async function createRequest(){
 const g=id=>document.getElementById(id)?.value.trim();
 const service=document.getElementById("reqService").value,description=g("reqDescription"),city=g("reqCity"),district=g("reqDistrict"),neighborhood=g("reqNeighborhood"),urgency=document.getElementById("reqUrgency").value,name=g("reqName"),phone=g("reqPhone");
 if(!service)return alert("Lütfen hizmet kategorisini seç.");
 if(description.length<5)return alert("Lütfen ihtiyacınızı biraz daha açık anlat.");
 if(!district)return alert("Lütfen ilçe seç.");
 if(!name)return alert("Lütfen adınızı ve soyadınızı yaz.");
 if(!phone)return alert("Lütfen telefon numaranızı yaz.");
 const b=document.getElementById("createRequestButton");b.disabled=true;b.textContent="TALEP KAYDEDİLİYOR...";
 const talep_no=makeRequestNumber();
 const item={talep_no,kategori:service,aciklama:description,il:city,ilce:district,mahalle:neighborhood,aciliyet:urgency,ad_soyad:name,telefon:phone,durum:"Beklemede"};
 try{await supabaseRequest("POST","talepler",item);setConnection(true,"Supabase bağlı ✓");write(KEYS.requests,[{...mapRequest(item),createdAt:new Date().toISOString()},...getRequests()]);alert("Talebiniz başarıyla oluşturuldu.\n\nTalep No: "+talep_no)}catch(e){console.error(e);write(KEYS.requests,[{...mapRequest(item),createdAt:new Date().toISOString()},...getRequests()]);alert("Sunucu kaydı başarısız oldu; cihazdaki yedek kaydedildi.\n\n"+e.message)}
 b.disabled=false;b.textContent="TALEBİ OLUŞTUR";showRequests();
}

/* ---------------- REQUEST LIST ---------------- */

async function showRequests(){
 setNav("navRequests");
 app(`<div class="back"><button class="btn secondary smallBtn" onclick="showHome()">← Ana sayfaya dön</button></div><span class="badge">▣ TALEPLERİM</span><h1>Oluşturduğun talepler.</h1><p class="muted small">Taleplerin sistemden yükleniyor...</p><div class="card" id="requestsLoading" style="text-align:center">⏳ Talepler yükleniyor...</div>`);
 const requests=await loadRequestsFromSupabase(),area=document.getElementById("requestsLoading");if(!area)return;
 area.outerHTML=requests.length?requests.map(renderRequest).join(""):`<div class="card empty">📋<h3>Henüz talep yok</h3><p>İhtiyacını anlat, ilk talebini oluştur.</p><button class="btn primary" onclick="showRequest()">＋ Talep oluştur</button></div>`;
}
function renderRequest(r){
 const k=serviceKeyFromValue(r.service||r.kategori),s=SERVICES[k]||{name:r.kategori||"Hizmet",emoji:"🛠️"};
 return `<article class="request"><div class="requestTop"><div><h3>${s.emoji} ${escapeHTML(s.name)}</h3><div class="small muted">${escapeHTML(r.createdAt||"")}</div></div><span class="status">${escapeHTML(r.status||r.durum||"Beklemede")}</span></div><div class="description">“${escapeHTML(r.description||r.aciklama||"")}”</div><div class="meta"><span>📍 ${escapeHTML(r.ilce||"")}</span>${r.mahalle?`<span>🏘️ ${escapeHTML(r.mahalle)}</span>`:""}<span>⏱️ ${escapeHTML(r.aciliyet||"")}</span></div><div class="small muted">Talep No: <strong>${escapeHTML(r.talep_no||"")}</strong></div></article>`;
}

async function loadProvidersFromSupabase(){

 try{

  const data = await supabaseRequest(
   "GET",
   "providers?select=*&order=created_at.desc&limit=100"
  );

  if(Array.isArray(data)){
   return data;
  }

 }catch(error){

  console.error("Providers yükleme hatası:", error);

 }

 return [];

}


function renderProviderCard(p){

 const services = Array.isArray(p.services)
  ? p.services
  : [];

 const serviceNames = services.map(x =>
  SERVICES[x]?.name || x
 );

 return `
  <article class="request">

   <div class="requestTop">

    <div>
     <h3>🛠️ ${escapeHTML(p.name || "Hizmet Sağlayıcı")}</h3>

     <div class="small muted">
      ${escapeHTML(p.city || "İzmir")} •
      ${escapeHTML(p.district || "")}
     </div>
    </div>

    <span class="status" style="${
      p.active
      ? "background:rgba(25,195,125,.12);color:#8bf1c4"
      : ""
    }">
     ${p.active ? "Aktif" : "Pasif"}
    </span>

   </div>

   <div class="meta">

    <span>📍 ${escapeHTML(p.city || "İzmir")}</span>

    <span>🏘️ ${escapeHTML(p.district || "")}</span>

    <span>🛠️ ${
      escapeHTML(serviceNames.join(", ") || "Hizmet belirtilmemiş")
    }</span>

   </div>

   ${
    p.description
    ?
    `<div class="description">${escapeHTML(p.description)}</div>`
    :
    ""
   }

   ${
    p.phone
    ?
    `<a
       class="btn primary"
       style="display:block;text-align:center"
       href="tel:${escapeHTML(p.phone)}"
     >
       📞 İLETİŞİME GEÇ
     </a>`
    :
    ""
   }

  </article>
 `;
}

     Kayıtlı hizmet sağlayıcılar.
    </h1>

   </div>

  </div>

  <p class="muted small">
   Supabase'de kayıtlı hizmet sağlayıcılar burada görünür.
  </p>

  <div
   class="card"
   id="providersArea"
   style="text-align:center"
  >

  .join("");

async function registerProvider(){
 const name=document.getElementById("pName").value.trim();
 const phone=document.getElementById("pPhone").value.trim();
 const city=document.getElementById("pCity").value.trim()||"İzmir";
 const district=document.getElementById("pDistrict").value;
 const category=document.getElementById("pCategory").value;
 const description=document.getElementById("pDescription").value.trim();

 if(!name){alert("Ad / işletme adı gerekli.");return}
 if(!phone){alert("Telefon gerekli.");return}
 if(!district){alert("İlçe seç.");return}
 if(!category){alert("Hizmet kategorisi seç.");return}

 const btn=document.getElementById("saveProviderBtn");
 if(btn){btn.disabled=true;btn.textContent="KAYDEDİLİYOR...";}

 const now=new Date().toISOString();

 /*
  providers tablosu doğrulanmış kolonlar:
  id, name, phone, district, description, active,
  created_at, city, services, updated_at
 */

 const payload={
  name:name,
  phone:phone,
  district:district,
  description:description,
  active:true,
  created_at:now,
  city:city,
  services:[category],
  updated_at:now
 };

 try{
  const rows=await supabaseRequest("POST","providers",payload);
  const row=Array.isArray(rows)?rows[0]:rows;

  const provider={
   id:row?.id||uid("SP"),
   name:name,
   phone:phone,
   city:city,
   district:district,
   description:description,
   active:true,
   services:[category],
   createdAt:now,
   updatedAt:now,
   mainServiceName:SERVICES[category]?.name||category
  };

  write(KEYS.provider,provider);
  write(KEYS.providerLogged,true);

  setConnection(true,"Supabase bağlı ✓");

  alert("Hizmet sağlayıcı başarıyla kaydedildi.");
  showProviderPanel();

 }catch(error){
  console.error("Provider kayıt hatası:",error);
  alert("Supabase kayıt hatası:\n\n"+(error?.message||String(error))+"\n\nKayıt oluşturulmadı.");
 }finally{
  if(btn){btn.disabled=false;btn.textContent="HİZMET SAĞLAYICI KAYDI OLUŞTUR";}
 }
}

async function loadProviderDirectory(){
 const box=document.getElementById("providerDirectory");if(!box)return;
 box.innerHTML=`<div class="card" style="margin-top:14px;text-align:center">⏳ Hizmet sağlayıcılar yükleniyor...</div>`;
 let providers=await loadProvidersFromSupabase();providers=await enrichProviders(providers);
 if(!providers.length){box.innerHTML=`<div class="warning">Supabase'de <strong>providers</strong> tablosundan okunabilir hizmet sağlayıcı kaydı bulunamadı.</div>`;return}
 box.innerHTML=`<div class="section"><h2>Hizmet sağlayıcılar</h2>${providers.map(p=>renderProviderCard(p)).join("")}</div>`;
}

function renderProviderCard(p){
 const cats=(p.services||[]).map(k=>SERVICES[k]?.name||k).filter(Boolean).join(", ")||"Kategori bilgisi yok";
 return `<article class="request"><div class="requestTop"><div><h3>🛠️ ${escapeHTML(p.name)}</h3><div class="small muted">${escapeHTML(p.city)} • ${escapeHTML(p.district)}</div></div><span class="status">${p.active?"Aktif":"Pasif"}</span></div><div class="meta"><span>🔧 ${escapeHTML(cats)}</span>${p.neighborhood?`<span>🏘️ ${escapeHTML(p.neighborhood)}</span>`:""}</div>${p.description?`<div class="description">${escapeHTML(p.description)}</div>`:""}${p.phone?`<a class="btn primary" style="display:block;text-align:center" href="tel:${escapeHTML(p.phone)}">📞 HİZMET SAĞLAYICIYI ARA</a>`:"<div class=\"warning\">Bu sağlayıcının telefon numarası kayıtlı değil.</div>"}<br><button class="btn secondary" onclick='openProviderById(${JSON.stringify(String(p.id))})'>📋 UYGUN TALEPLERİ GÖR</button></article>`;
}

async function openProviderById(id){
 let providers=await loadProvidersFromSupabase();providers=await enrichProviders(providers);const p=providers.find(x=>String(x.id)===String(id));
 if(p)showProviderPanel(p);else alert("Hizmet sağlayıcı bulunamadı.");
}

async function showProviderPanel(p){
 setNav("navProvider");
 app(`<div class="back"><button class="btn secondary smallBtn" onclick="showProviderEntry()">← Hizmet sağlayıcılara dön</button></div><div class="profileHeader"><div class="avatar">${escapeHTML((p.name||"U").charAt(0).toUpperCase())}</div><div style="flex:1"><strong>${escapeHTML(p.name)}</strong><div class="small muted"><span class="activeDot"></span>${p.active?"Aktif":"Pasif"} • ${escapeHTML(p.district)}</div></div></div><div class="grid section"><div class="card"><div style="font-size:24px">📋</div><strong id="matchCount">...</strong><div class="small muted">Uygun İş</div></div><div class="card"><div style="font-size:24px">🛠️</div><strong>${p.services.length}</strong><div class="small muted">Kategori</div></div></div><div class="section"><h2>📋 Sana Uygun Talepler</h2><div id="matchedRequests" class="card" style="text-align:center">⏳ Eşleşmeler aranıyor...</div></div>`);
 const requests=await loadRequestsFromSupabase();
 const suitable=requests.filter(r=>providerMatchesRequest(p,r));
 document.getElementById("matchCount").textContent=suitable.length;
 const box=document.getElementById("matchedRequests");
 if(!suitable.length){box.innerHTML=`<div class="empty">🔎<h3>Şimdilik uygun talep yok.</h3><p>Sağlayıcının kategorisi ve ilçesi ile eşleşen talepler burada görünecek.</p></div>`}
 else box.outerHTML=suitable.map(r=>renderProviderRequest(r)).join("");
}

function renderProviderRequest(r){
 const k=serviceKeyFromValue(r.service||r.kategori),s=SERVICES[k]||{name:r.kategori||"Hizmet",emoji:"🛠️"};
 const phone=r.telefon||r.phone||"";
 return `<article class="request"><div class="requestTop"><div><h3>${s.emoji} ${escapeHTML(s.name)}</h3><div class="small muted">Talep No: ${escapeHTML(r.talep_no||"")}</div></div><span class="status">${escapeHTML(r.aciliyet||"Beklemede")}</span></div><div class="description">${escapeHTML(r.aciklama||r.description||"")}</div><div class="meta"><span>📍 ${escapeHTML(r.ilce||r.district||"")}</span>${r.mahalle?`<span>🏘️ ${escapeHTML(r.mahalle)}</span>`:""}<span>👤 ${escapeHTML(r.ad_soyad||r.name||"")}</span></div>${phone?`<a class="btn primary" style="display:block;text-align:center" href="tel:${escapeHTML(phone)}">📞 MÜŞTERİYLE İLETİŞİME GEÇ</a>`:`<div class="warning">Bu talepte telefon numarası bulunmuyor.</div>`}</article>`;
}
