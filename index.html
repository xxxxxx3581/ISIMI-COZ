/* =========================================================
   LOCAL STORAGE
   ========================================================= */

const KEYS = {

 requests:"isimi_coz_requests_v4",

 provider:"isimi_coz_provider_v4",

 providerLogged:"isimi_coz_provider_logged_v4"

};


/* =========================================================
   LOCAL STORAGE FONKSİYONLARI
   ========================================================= */

function read(key,fallback){

 try{

  const raw=localStorage.getItem(key);

  return raw ? JSON.parse(raw) : fallback;

 }catch(e){

  return fallback;

 }

}


function write(key,value){

 localStorage.setItem(
  key,
  JSON.stringify(value)
 );

}


function getRequests(){

 return read(KEYS.requests,[]);

}


function getProvider(){

 return read(KEYS.provider,null);

}


function providerLogged(){

 return read(KEYS.providerLogged,false);

}


/* =========================================================
   YARDIMCI
   ========================================================= */

function escapeHTML(value){

 return String(value ?? "")

  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


function uid(prefix){

 return prefix+"-"+

 Date.now().toString(36).toUpperCase()+"-"+

 Math.random()
 .toString(36)
 .slice(2,7)
 .toUpperCase();

}


function setNav(active){

 [
  "navHome",
  "navRequest",
  "navRequests",
  "navProvider"
 ].forEach(id=>{

  const el=document.getElementById(id);

  if(el) el.classList.remove("active");

 });

 if(active){

  const el=document.getElementById(active);

  if(el) el.classList.add("active");

 }

}


function app(html){

 document.getElementById("app").innerHTML=html;

 window.scrollTo(0,0);

/* =========================================================
   SUPABASE DURUM
   ========================================================= */

function setConnection(online,text){

 const el=document.getElementById("connectionStatus");

 if(!el)return;

 el.className=
  "connection "+
  (online?"online":"offline");

 el.textContent=
  text ||
  (online?"Supabase bağlı":"Yerel mod");

}


/* =========================================================
   SUPABASE REST İSTEK
   ========================================================= */

async function supabaseRequest(method,path,body=null){

 const options={

  method,

  headers:{
   "apikey":SUPABASE_KEY,
   "Authorization":"Bearer "+SUPABASE_KEY,
   "Content-Type":"application/json",
   "Accept":"application/json",
   "Prefer":"return=representation"
  }

 };

 if(body!==null){

  options.body=JSON.stringify(body);

 }

 const response=
  await fetch(
   SUPABASE_URL+
   "/rest/v1/"+
   path,
   options
  );

 const text=await response.text();

 let data=null;

 try{
  data=text ? JSON.parse(text) : null;
 }catch(e){
  data=text;
 }

 if(!response.ok){

  throw new Error(
   data?.message ||
   data?.details ||
   data?.hint ||
   "Supabase işlemi başarısız."
  );

 }

 return data;

}

 }

}


/* =========================================================
   KATEGORİ OPTION
   ========================================================= */

function serviceOptions(selected=""){

 return `<option value="">Kategori seç</option>`+

 Object.entries(SERVICES)

 .map(([key,s])=>`

  <option
   value="${key}"
   ${key===selected?"selected":""}
  >
   ${s.emoji} ${s.name}
  </option>

 `)

 .join("");

}


/* =========================================================
   İLÇE OPTION
   ========================================================= */

function districtOptions(selected=""){

 const unique=
  [...new Set(DISTRICTS)];

 return `<option value="">İlçe seç</option>`+

 unique

 .map(d=>`

  <option
   value="${escapeHTML(d)}"
   ${d===selected?"selected":""}
  >
   ${escapeHTML(d)}
  </option>

 `)

 .join("");

}


/* =========================================================
   TALEP NUMARASI
   ========================================================= */

function makeRequestNumber(){

 const date=
  new Date();

 const y=
  date.getFullYear();

 const m=
  String(date.getMonth()+1)
  .padStart(2,"0");

 const d=
  String(date.getDate())
  .padStart(2,"0");

 const random=
  Math.floor(
   1000+
   Math.random()*9000
  );

 return `IC-${y}${m}${d}-${random}`;

}


/* =========================================================
   SUPABASE'A TALEP KAYDET
   ========================================================= */

async function saveRequestToSupabase(item){

 const payload={

  talep_no:item.talep_no,

  kategori:item.kategori,

  aciklama:item.aciklama,

  il:item.il,

  ilce:item.ilce,

  mahalle:item.mahalle,

  aciliyet:item.aciliyet,

  ad_soyad:item.ad_soyad,

  telefon:item.telefon,

  durum:item.durum

 };

 return await supabaseRequest(
  "POST",
  "talepler",
  payload
 );

}


/* =========================================================
   TALEPLERİ SUPABASE'DEN ÇEK
   ========================================================= */

async function loadRequestsFromSupabase(){

 try{

  const data=
   await supabaseRequest(
    "GET",
    "talepler?select=*&limit=100"
   );

  if(Array.isArray(data)){

   const mapped=
    data.map(mapSupabaseRequest);

   write(
    KEYS.requests,
    mapped
   );

   setConnection(
    true,
    "Supabase bağlı ✓"
   );

   return mapped;

  }

 }catch(error){

  console.warn(
   "Supabase talepleri alınamadı:",
   error
  );

 }

 return getRequests();

}


/* =========================================================
   SUPABASE KAYDINI UYGULAMA FORMATINA ÇEVİR
   ========================================================= */

function mapSupabaseRequest(r){

 return {

  id:r.talep_no,

  talep_no:r.talep_no,

  service:r.kategori,

  kategori:r.kategori,

  description:r.aciklama,

  aciklama:r.aciklama,

  il:r.il || "İzmir",

  district:r.ilce,

  ilce:r.ilce,

  neighborhood:r.mahalle,

  mahalle:r.mahalle,

  urgency:r.aciliyet,

  aciliyet:r.aciliyet,

  name:r.ad_soyad,

  ad_soyad:r.ad_soyad,

  phone:r.telefon,

  telefon:r.telefon,

  status:r.durum || "Beklemede",

  durum:r.durum || "Beklemede"

 };

}

async function createRequest(){

 const service=
  document.getElementById(
   "reqService"
  ).value;

 const description=
  document.getElementById(
   "reqDescription"
  ).value.trim();

 const city=
  document.getElementById(
   "reqCity"
  ).value;

 const district=
  document.getElementById(
   "reqDistrict"
  ).value;

 const neighborhood=
  document.getElementById(
   "reqNeighborhood"
  ).value.trim();

 const urgency=
  document.getElementById(
   "reqUrgency"
  ).value;

 const name=
  document.getElementById(
   "reqName"
  ).value.trim();

 const phone=
  document.getElementById(
   "reqPhone"
  ).value.trim();


 if(!service){

  alert(
   "Lütfen hizmet kategorisini seç."
  );

  return;

 }


 if(description.length<5){

  alert(
   "Lütfen ihtiyacınızı biraz daha açık anlat."
  );

  return;

 }


 if(!district){

  alert(
   "Lütfen ilçe seç."
  );

  return;

 }


 if(!name){

  alert(
   "Lütfen adınızı ve soyadınızı yaz."
  );

  return;

 }


 if(!phone){

  alert(
   "Lütfen telefon numaranızı yaz."
  );

  return;

 }


 const button=
  document.getElementById(
   "createRequestButton"
  );

 if(button){

  button.disabled=true;

  button.textContent=
   "TALEP KAYDEDİLİYOR...";

 }


 const talep_no=
  makeRequestNumber();


 const item={

  id:talep_no,

  talep_no,

  service,

  kategori:service,

  description,

  aciklama:description,

  il:city,

  district,

  ilce:district,

  neighborhood,

  mahalle:neighborhood,

  urgency,

  aciliyet:urgency,

  name,

  ad_soyad:name,

  phone,

  telefon:phone,

  status:"Beklemede",

  durum:"Beklemede",

  createdAt:
   new Date().toISOString()

 };


 let savedOnline=false;


 try{

  await saveRequestToSupabase(
   item
  );

  savedOnline=true;

  setConnection(
   true,
   "Supabase bağlı ✓"
  );

 }catch(error){

  console.error(
   "Supabase kayıt hatası:",
   error
  );

 }


 /*
  Yerel yedek:
  Supabase başarılı olsa bile
  cihazda da tutulur.
 */

 const requests=
  getRequests();

 requests.unshift(item);

 write(
  KEYS.requests,
  requests
 );


 if(button){

  button.disabled=false;

  button.textContent=
   "TALEBİ OLUŞTUR";

 }


 if(savedOnline){

  alert(
   "Talebiniz başarıyla oluşturuldu.\n\n"+
   "Talep No: "+
   talep_no
  );

 }else{

  alert(
   "Talebiniz cihazınıza kaydedildi.\n\n"+
   "Talep No: "+
   talep_no+
   "\n\n"+
   "Sunucu bağlantısı kurulamadığı için yerel yedek kullanıldı."
  );

 }


 showRequests();

}

function saveProvider(){

 const name=
  document.getElementById(
   "pName"
  ).value.trim();

 const phone=
  document.getElementById(
   "pPhone"
  ).value.trim();

 const district=
  document.getElementById(
   "pDistrict"
  ).value;

 const description=
  document.getElementById(
   "pDescription"
  ).value.trim();


 const services=
  [
   ...document.querySelectorAll(
    'input[name="pService"]:checked'
   )
  ]
  .map(x=>x.value);


 if(!name){

  alert(
   "Ad / işletme adı gerekli."
  );

  return;

 }


 if(!phone){

  alert(
   "Telefon numarası gerekli."
  );

  return;

 }


 if(!district){

  alert(
   "Ana hizmet bölgesi gerekli."
  );

  return;

 }


 if(!services.length){

  alert(
   "En az bir hizmet seçmelisin."
  );

  return;

 }


 const old=
  getProvider();


 const main=
  SERVICES[services[0]];


 const provider={

  id:
   old?.id ||
   uid("SP"),

  name,

  phone,

  district,

  services,

  description,

  mainServiceName:
   main
   ?
   main.name
   :
   "Hizmet",

  active:true,

  createdAt:
   old?.createdAt ||
   new Date().toISOString(),

  updatedAt:
   new Date().toISOString()

 };


 write(
  KEYS.provider,
  provider
 );


 write(
  KEYS.providerLogged,
  true
 );


 alert(
  "Hizmet sağlayıcı profilin kaydedildi."
 );


 showProviderPanel();

}
