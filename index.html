<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>İşimi Çöz — İzmir</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  background:#07111f;
  color:#eef4fb;
  font-family:Arial,Helvetica,sans-serif
}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:90px}

.top{
  padding:16px;
  border-bottom:1px solid #20344d;
  background:#07111f;
  position:sticky;
  top:0;
  z-index:20
}

.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(135deg,#19c37d,#36a3ff);
  display:grid;place-items:center;
  font-size:22px;font-weight:900;color:#03120d
}
.brand strong{font-size:18px}
.brand small{display:block;color:#9eb0c5;font-size:11px;margin-top:2px}

main{padding:15px}

.hero{
  background:linear-gradient(145deg,#10243a,#0b1727);
  border:1px solid #20344d;
  border-radius:24px;
  padding:22px 18px;
  margin-bottom:15px
}

.badge{
  display:inline-flex;
  padding:7px 10px;
  border-radius:99px;
  background:rgba(25,195,125,.12);
  border:1px solid rgba(25,195,125,.28);
  color:#6df0b5;
  font-size:12px;
  font-weight:700
}

h1{font-size:29px;line-height:1.1;margin:15px 0 9px}
h2{font-size:21px;margin:0 0 8px}
h3{font-size:16px;margin:0 0 6px}
p{line-height:1.5}
.muted{color:#9eb0c5}
.small{font-size:12px}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px
}

.card{
  background:#0d1a2b;
  border:1px solid #20344d;
  border-radius:18px;
  padding:15px
}

.service{
  min-height:125px;
  color:#eef4fb;
  text-align:left
}
.service .emoji{font-size:27px}
.service strong{display:block;margin-top:8px}
.service span{
  display:block;
  color:#9eb0c5;
  font-size:12px;
  margin-top:5px;
  line-height:1.4
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:15px
}

.btn{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  font-weight:800
}
.primary{background:#19c37d;color:#03130d}
.secondary{
  background:#14263b;
  color:#eef4fb;
  border:1px solid #20344d
}
.danger{
  background:#4a1f25;
  color:#ffb5b3;
  border:1px solid #6a2b32
}

.formCard{
  background:#0d1a2b;
  border:1px solid #20344d;
  border-radius:20px;
  padding:18px
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:14px 0 7px
}

input,select,textarea{
  width:100%;
  background:#081523;
  color:#eef4fb;
  border:1px solid #29415d;
  border-radius:12px;
  padding:13px;
  outline:none
}

textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#19c37d}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.notice{
  background:#0b2030;
  border:1px solid #1e4c66;
  color:#b9ddf2;
  padding:12px;
  border-radius:13px;
  font-size:12px;
  line-height:1.5;
  margin:13px 0
}

.success{
  background:#0b2b20;
  border:1px solid #185d43;
  color:#8bf1c4;
  padding:12px;
  border-radius:13px
}

.request{
  background:#0d1a2b;
  border:1px solid #20344d;
  border-radius:18px;
  padding:15px;
  margin-bottom:10px
}

.requestTop{
  display:flex;
  justify-content:space-between;
  gap:10px
}

.status{
  padding:5px 9px;
  border-radius:99px;
  background:rgba(245,185,66,.12);
  color:#ffd76b;
  font-size:11px;
  font-weight:800;
  height:max-content
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:10px
}

.meta span{
  background:#091827;
  color:#9eb0c5;
  padding:6px 8px;
  border-radius:8px;
  font-size:12px
}

.description{
  background:#091827;
  border-radius:12px;
  padding:11px;
  font-size:13px;
  line-height:1.5;
  margin-top:10px
}

.empty{
  text-align:center;
  padding:30px 15px;
  color:#9eb0c5
}

.profile{
  display:flex;
  align-items:center;
  gap:12px;
  background:#0d1a2b;
  border:1px solid #20344d;
  border-radius:18px;
  padding:15px
}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#17334d;
  display:grid;
  place-items:center;
  font-size:19px;
  font-weight:900
}

.checks{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.check{
  display:flex;
  align-items:center;
  gap:7px;
  background:#091827;
  border:1px solid #20344d;
  border-radius:11px;
  padding:10px;
  font-size:12px
}

.check input{width:auto}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#07111f;
  border-top:1px solid #20344d;
  z-index:30
}

.bottomInner{
  max-width:760px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr)
}

.navBtn{
  border:0;
  background:transparent;
  color:#8fa3b9;
  padding:10px 3px;
  font-size:10px
}

.navBtn b{
  display:block;
  font-size:18px;
  margin-bottom:3px
}

.navBtn.active{color:#19c37d}

@media(max-width:430px){
  main{padding:12px}
  .row{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="app">

<header class="top">
  <div class="brand">
    <div class="logo">✓</div>
    <div>
      <strong>İŞİMİ ÇÖZ</strong>
      <small>İzmir Pilot Bölgesi</small>
    </div>
  </div>
</header>

<main id="app"></main>

</div>

<nav class="bottom">
  <div class="bottomInner">
    <button class="navBtn" id="navHome" onclick="showHome()">
      <b>⌂</b>ANA
    </button>

    <button class="navBtn" id="navRequest" onclick="showRequest()">
      <b>＋</b>TALEP
    </button>

    <button class="navBtn" id="navRequests" onclick="showRequests()">
      <b>▣</b>TALEPLER
    </button>

    <button class="navBtn" id="navProvider" onclick="showProvider()">
      <b>🛠️</b>HİZMET VER
    </button>
  </div>
</nav>

<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL = "https://zvffspbowdzvrrzefhkr.supabase.co";

/*
  BURAYA SUPABASE PUBLISHABLE KEY'İNİ KOY.
  Eski secret/service_role anahtarı kesinlikle koyma.
*/
const SUPABASE_KEY = "BURAYA_PUBLISHABLE_KEY";

const TABLE = "talepler";


/* =========================================================
   HİZMETLER
   ========================================================= */

const SERVICES = {
  klima:{
    name:"Klima",
    emoji:"❄️",
    desc:"Bakım, montaj, arıza ve temizlik"
  },
  elektrik:{
    name:"Elektrik",
    emoji:"⚡",
    desc:"Arıza, priz, tesisat ve aydınlatma"
  },
  tesisat:{
    name:"Tesisat",
    emoji:"🔧",
    desc:"Su, gider, musluk ve kaçak"
  },
  beyaz:{
    name:"Beyaz Eşya",
    emoji:"🧊",
    desc:"Çamaşır, bulaşık, buzdolabı"
  },
  temizlik:{
    name:"Temizlik",
    emoji:"🧹",
    desc:"Ev, ofis ve detaylı temizlik"
  },
  nakliye:{
    name:"Nakliye",
    emoji:"🚚",
    desc:"Ev, ofis ve parça eşya"
  },
  cilingir:{
    name:"Çilingir",
    emoji:"🔐",
    desc:"Kilit, anahtar ve acil giriş"
  },
  oto:{
    name:"Oto",
    emoji:"🚗",
    desc:"Arıza, bakım ve yol yardımı"
  }
};

const DISTRICTS=[
"Aliağa","Balçova","Bayındır","Bayraklı","Bergama","Beydağ",
"Bornova","Buca","Çeşme","Çiğli","Dikili","Foça","Gaziemir",
"Güzelbahçe","Karabağlar","Karaburun","Karşıyaka","Kemalpaşa",
"Kınık","Kiraz","Konak","Menderes","Menemen","Narlıdere",
"Ödemiş","Seferihisar","Selçuk","Tire","Torbalı","Urla"
];


/* =========================================================
   YARDIMCI FONKSİYONLAR
   ========================================================= */

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function uid(){
  return "IC-"+Date.now().toString(36).toUpperCase();
}

function app(html){
  document.getElementById("app").innerHTML=html;
  window.scrollTo(0,0);
}

function nav(id){
  ["navHome","navRequest","navRequests","navProvider"]
    .forEach(x=>document.getElementById(x).classList.remove("active"));

  if(id)document.getElementById(id).classList.add("active");
}

function districts(){
  return `<option value="">İlçe seç</option>`+
  DISTRICTS.map(x=>`<option>${esc(x)}</option>`).join("");
}

function services(){
  return `<option value="">Kategori seç</option>`+
  Object.entries(SERVICES)
  .map(([k,v])=>`<option value="${k}">${v.emoji} ${v.name}</option>`)
  .join("");
}

function serviceName(key){
  return SERVICES[key]?.name || key || "Genel";
}


/* =========================================================
   SUPABASE İSTEKLERİ
   ========================================================= */

async function supabaseRequest(path,options={}){
  const response=await fetch(
    SUPABASE_URL+"/rest/v1/"+path,
    {
      ...options,
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer "+SUPABASE_KEY,
        "Content-Type":"application/json",
        "Prefer":options.prefer || "return=representation",
        ...(options.headers||{})
      }
    }
  );

  const text=await response.text();

  let data=null;

  try{
    data=text?JSON.parse(text):null;
  }catch{
    data=text;
  }

  if(!response.ok){
    throw new Error(
      data?.message ||
      data?.hint ||
      data?.details ||
      text ||
      "Supabase bağlantı hatası"
    );
  }

  return data;
}


/* =========================================================
   ANA SAYFA
   ========================================================= */

function showHome(){

  nav("navHome");

  app(`
  <section class="hero">

    <span class="badge">📍 İZMİR PİLOT BÖLGESİ</span>

    <h1>İhtiyacın varsa,<br>çözümü var.</h1>

    <p class="muted">
      Ev, iş yeri, araç ve günlük yaşam hizmetlerini
      tek yerden bul.
    </p>

    <div class="actions">

      <button class="btn primary"
        onclick="showRequest()">
        📢 İŞİMİ ÇÖZDÜR
      </button>

      <button class="btn secondary"
        onclick="showProvider()">
        🛠️ HİZMET VER
      </button>

    </div>

  </section>

  <div class="section">

    <h2>Hizmet kategorileri</h2>

    <div class="grid">

      ${Object.entries(SERVICES).map(([key,s])=>`

        <button class="card service"
          onclick="showRequest('${key}')">

          <div class="emoji">${s.emoji}</div>

          <strong>${s.name}</strong>

          <span>${s.desc}</span>

        </button>

      `).join("")}

    </div>

  </div>

  <div class="card" style="margin-top:15px">

    <h2>💡 Nasıl çalışıyor?</h2>

    <p class="muted small">
      İhtiyacını yaz, konumunu ve iletişim bilgilerini gir.
      Talebin sisteme kaydedilsin.
      Hizmet sağlayıcılar uygun talepleri görebilsin.
    </p>

  </div>
  `);
}


/* =========================================================
   TALEP OLUŞTUR
   ========================================================= */

function showRequest(selected=""){

  nav("navRequest");

  app(`

  <div class="formCard">

    <span class="badge">📋 YENİ HİZMET TALEBİ</span>

    <h1>İhtiyacını anlat.</h1>

    <p class="muted small">
      İhtiyacını mümkün olduğunca açık yaz.
    </p>

    <label>Hizmet kategorisi *</label>

    <select id="kategori">
      ${services()}
    </select>

    <label>İhtiyacın / açıklama *</label>

    <textarea id="aciklama"
      maxlength="1000"
      placeholder="Örneğin: Klimam çalışıyor fakat soğutmuyor."></textarea>

    <label>İl *</label>

    <input id="il"
      value="İzmir"
      readonly>

    <div class="row">

      <div>

        <label>İlçe *</label>

        <select id="ilce">
          ${districts()}
        </select>

      </div>

      <div>

        <label>Mahalle</label>

        <input id="mahalle"
          placeholder="Mahalle">

      </div>

    </div>

    <label>Ne zaman gerekli?</label>

    <select id="aciliyet">

      <option value="Acil">🔴 Acil</option>

      <option value="Normal" selected>
        🟡 Normal
      </option>

      <option value="Uygun zamanda">
        🟢 Uygun zamanda
      </option>

    </select>

    <label>Ad Soyad *</label>

    <input id="ad_soyad"
      placeholder="Adınız Soyadınız">

    <label>Telefon *</label>

    <input id="telefon"
      type="tel"
      placeholder="05xxxxxxxxx">

    <div class="notice">

      🔒 Bilgilerin talebin hizmet sağlayıcıya
      ulaştırılması amacıyla kullanılacaktır.

    </div>

    <button class="btn primary"
      onclick="createRequest()">

      📢 TALEBİ OLUŞTUR

    </button>

  </div>
  `);

  if(selected){
    document.getElementById("kategori").value=selected;
  }
}


/* =========================================================
   TALEP KAYDET
   ========================================================= */

async function createRequest(){

  const kategori=document.getElementById("kategori").value;
  const aciklama=document.getElementById("aciklama").value.trim();
  const il=document.getElementById("il").value;
  const ilce=document.getElementById("ilce").value;
  const mahalle=document.getElementById("mahalle").value.trim();
  const aciliyet=document.getElementById("aciliyet").value;
  const ad_soyad=document.getElementById("ad_soyad").value.trim();
  const telefon=document.getElementById("telefon").value.trim();

  if(!kategori){
    alert("Hizmet kategorisini seç.");
    return;
  }

  if(aciklama.length<5){
    alert("İhtiyacını biraz daha açık yaz.");
    return;
  }

  if(!ilce){
    alert("İlçe seç.");
    return;
  }

  if(!ad_soyad){
    alert("Ad Soyad yaz.");
    return;
  }

  if(!telefon){
    alert("Telefon numaranı yaz.");
    return;
  }

  const talep_no="IC-"+new Date().getFullYear()+"-"+Date.now().toString().slice(-6);

  const data={

    talep_no:talep_no,

    kategori:serviceName(kategori),

    aciklama:aciklama,

    il:il,

    ilce:ilce,

    mahalle:mahalle,

    aciliyet:aciliyet,

    ad_soyad:ad_soyad,

    telefon:telefon,

    durum:"beklemede"

  };

  try{

    if(
      SUPABASE_KEY==="BURAYA_PUBLISHABLE_KEY"
    ){
      alert(
        "Supabase anahtarı henüz index.html içine eklenmemiş."
      );
      return;
    }

    await supabaseRequest(
      "talepler",
      {
        method:"POST",
        body:JSON.stringify(data)
      }
    );

    alert(
      "Talebiniz başarıyla oluşturuldu.\n\n"+
      "Talep No: "+talep_no
    );

    showRequests();

  }catch(error){

    console.error(error);

    alert(
      "Talep kaydedilemedi.\n\n"+
      error.message
    );

  }
}


/* =========================================================
   TALEPLER
   ========================================================= */

async function showRequests(){

  nav("navRequests");

  app(`
    <div class="card">

      <span class="badge">▣ TALEPLER</span>

      <h1>Hizmet talepleri</h1>

      <p class="muted small">
        Sisteme kaydedilen talepler.
      </p>

      <div id="requestsList">
        <div class="empty">
          Yükleniyor...
        </div>
      </div>

    </div>
  `);

  try{

    const rows=await supabaseRequest(
      "talepler?select=*&order=id.desc"
    );

    const box=document.getElementById("requestsList");

    if(!rows || !rows.length){

      box.innerHTML=`
        <div class="empty">
          <div style="font-size:36px">📋</div>
          <h3>Henüz talep yok.</h3>
        </div>
      `;

      return;
    }

    box.innerHTML=rows.map(renderRequest).join("");

  }catch(error){

    document.getElementById("requestsList").innerHTML=`
      <div class="notice">
        Talepler yüklenemedi.<br><br>
        ${esc(error.message)}
      </div>
    `;
  }
}


function renderRequest(r){

  return `

  <article class="request">

    <div class="requestTop">

      <div>

        <h3>
          🛠️ ${esc(r.kategori || "Genel")}
        </h3>

        <div class="small muted">
          Talep No:
          <strong>${esc(r.talep_no || "-")}</strong>
        </div>

      </div>

      <span class="status">
        ${esc(r.durum || "beklemede")}
      </span>

    </div>

    <div class="description">
      ${esc(r.aciklama || "")}
    </div>

    <div class="meta">

      <span>📍 ${esc(r.il || "İzmir")}</span>

      <span>
        🏘️ ${esc(r.ilce || "")}
      </span>

      ${
        r.mahalle
        ? `<span>🏠 ${esc(r.mahalle)}</span>`
        : ""
      }

      <span>
        ⏱️ ${esc(r.aciliyet || "Normal")}
      </span>

    </div>

    <div class="small muted" style="margin-top:10px">

      👤 ${esc(r.ad_soyad || "")}

      ${
        r.telefon
        ? ` • 📞 ${esc(r.telefon)}`
        : ""
      }

    </div>

  </article>

  `;
}


/* =========================================================
   HİZMET VER
   ========================================================= */

function showProvider(){

  nav("navProvider");

  app(`

  <div class="formCard">

    <span class="badge">🛠️ HİZMET VER</span>

    <h1>Hizmet sağlayıcı ol.</h1>

    <p class="muted">
      Şimdilik başvuru bilgilerini alıyoruz.
      Sağlayıcı paneli bir sonraki aşamada
      taleplerle eşleştirilecek.
    </p>

    <label>Ad / İşletme *</label>

    <input id="provider_name"
      placeholder="Adınız veya işletme adınız">

    <label>Telefon *</label>

    <input id="provider_phone"
      type="tel"
      placeholder="05xxxxxxxxx">

    <label>Hizmet kategorisi *</label>

    <select id="provider_category">
      ${services()}
    </select>

    <label>İlçe *</label>

    <select id="provider_district">
      ${districts()}
    </select>

    <label>Açıklama</label>

    <textarea id="provider_description"
      placeholder="Verdiğiniz hizmetleri anlatın."></textarea>

    <button class="btn primary"
      onclick="saveProvider()">

      🛠️ HİZMET VERME BAŞVURUSU

    </button>

  </div>
  `);
}


async function saveProvider(){

  const name=document.getElementById("provider_name").value.trim();
  const phone=document.getElementById("provider_phone").value.trim();
  const category=document.getElementById("provider_category").value;
  const district=document.getElementById("provider_district").value;
  const description=document.getElementById("provider_description").value.trim();

  if(!name){
    alert("Ad / işletme adı gerekli.");
    return;
  }

  if(!phone){
    alert("Telefon gerekli.");
    return;
  }

  if(!category){
    alert("Hizmet kategorisi seç.");
    return;
  }

  if(!district){
    alert("İlçe seç.");
    return;
  }

  /*
    Sağlayıcı sistemi için mevcut talepler tablosunu
    değiştirmiyoruz.
    Şimdilik başvuru bilgileri kullanıcıya gösteriliyor.
  */

  alert(
    "Hizmet sağlayıcı başvurun alındı.\n\n"+
    "Ad: "+name+"\n"+
    "Hizmet: "+serviceName(category)+"\n"+
    "İlçe: "+district
  );

  showHome();
}


/* =========================================================
   BAŞLANGIÇ
   ========================================================= */

showHome();

</script>

</body>
</html>
