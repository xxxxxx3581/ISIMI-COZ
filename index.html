const SERVICES={

 kamera:{name:"Kamera / Güvenlik",emoji:"📷",desc:"Kamera ve güvenlik sistemleri"}

const DISTRICTS=[...new Set(["Aliağa","Balçova","Bayındır","Bayraklı","Bergama","Beydağ","Bornova","Buca","Çeşme","Çiğli","Dikili","Foça","Gaziemir","Güzelbahçe","Karabağlar","Karaburun","Karşıyaka","Konak","Menemen","Menderes","Narlıdere","Ödemiş","Seferihisar","Selçuk","Tire","Torbalı","Urla","Kiraz","Kemalpaşa","Kınık"])];

const KEYS={requests:"isimi_coz_requests_v5",provider:"isimi_coz_provider_v5",providerLogged:"isimi_coz_provider_logged_v5"};

function read(k,f){try{const x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}}
function write(k,v){localStorage.setItem(k,JSON.stringify(v))}
function getRequests(){return read(KEYS.requests,[])}
function getProvider(){return read(KEYS.provider,null)}
function providerLogged(){return read(KEYS.providerLogged,false)}
function escapeHTML(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function app(h){document.getElementById("app").innerHTML=h;window.scrollTo(0,0)}
function setNav(a){["navHome","navRequest","navRequests","navProvider"].forEach(id=>document.getElementById(id)?.classList.remove("active"));if(a)document.getElementById(a)?.classList.add("active")}
function setConnection(ok,text){const e=document.getElementById("connectionStatus");if(!e)return;e.className="connection "+(ok?"online":"offline");e.textContent=text||(ok?"Supabase bağlı ✓":"Yerel mod")}

async function supabaseRequest(method,path,body=null){
 const o={method,headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Accept":"application/json","Prefer":"return=representation"}};
 if(body!==null)o.body=JSON.stringify(body);
 const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,o);
 const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){d=t}
 if(!r.ok)throw new Error(d?.message||d?.details||d?.hint||"Supabase işlemi başarısız.");
 return d;
}

async function supabaseAuthRequest(method,path,body=null){
 const session=getAuthSession();
 const token=session?.access_token;
 if(!token)throw new Error("Bu işlem dosyasını kaydetmek için önce giriş yapmalısınız.");
 const o={method,headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+token,"Content-Type":"application/json","Accept":"application/json","Prefer":"return=representation"}};
 if(body!==null)o.body=JSON.stringify(body);
 const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,o);
 const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){d=t}
 if(!r.ok)throw new Error(d?.message||d?.details||d?.hint||"Yetkili Supabase işlemi başarısız.");
 return d;
}

function normalize(v){
 return String(v??"").trim().toLowerCase()
 .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
 .replace(/ı/g,"i").replace(/İ/g,"i");
}
function pick(o,names,def=""){for(const n of names){if(o&&o[n]!==undefined&&o[n]!==null)return o[n]}return def}
function serviceKeyFromValue(v){
 const x=normalize(v);
 for(const [k,s] of Object.entries(SERVICES)){
  if(x===normalize(k)||x===normalize(s.name))return k;
 }
 return String(v??"").trim();
}

 catch(e){console.error(e);setConnection(false,"Yerel mod");return false}
}

async function loadRequestsFromSupabase(opts={}){
 const mineOnly=!!opts.mineOnly;
 try{
  let path="talepler?select=*&order=created_at.desc&limit=200";
  if(mineOnly){
   const session=getAuthSession();
   const uid=session?.user?.id;
   if(!uid){
    // Giriş yok: sunucudan kişisel talep çekme; yalnızca cihazdaki kendi yedekleri (user_id yok/local)
    return getRequests().filter(r=>!r.user_id&&!r.customer_id);
   }
   // Kendi kayıtları: user_id (tercih) — kolon yoksa sorgu hata verir, catch local fallback
   path="talepler?select=*&user_id=eq."+encodeURIComponent(uid)+"&order=created_at.desc&limit=200";
  }
  const data=await supabaseRequest("GET",path);
  if(Array.isArray(data)){
   let mapped=data.map(mapRequest);
   if(mineOnly){
    const session=getAuthSession();
    const uid=session?.user?.id;
    if(uid)mapped=mapped.filter(r=>!r.user_id&&!r.customer_id||r.user_id===uid||r.customer_id===uid);
    write(KEYS.requests,mapped);
   }else{
    // Sağlayıcı eşleştirme için gelen liste — RLS asıl koruma; istemci yine de saklar
    write(KEYS.requests,mapped);
   }
   setConnection(true,"Supabase bağlı ✓");
   return mapped;
  }
 }catch(e){
  console.warn("Talepler alınamadı:",e);
  if(mineOnly){
   const session=getAuthSession();
   const uid=session?.user?.id;
   if(!uid)return getRequests().filter(r=>!r.user_id&&!r.customer_id);
   return getRequests().filter(r=>r.user_id===uid||r.customer_id===uid||(!r.user_id&&!r.customer_id));
  }
 }
 return mineOnly?[]:getRequests();
}
function mapRequest(r){
 const kategori=pick(r,["kategori","category","service"],"");
 return {
  id:pick(r,["talep_no","id"],""),
  talep_no:pick(r,["talep_no","request_no","id"],""),
  service:serviceKeyFromValue(kategori),kategori:kategori,
  description:pick(r,["aciklama","description"],""),
  aciklama:pick(r,["aciklama","description"],""),
  il:pick(r,["il","city"],"İzmir"),
  district:pick(r,["ilce","district"],""),ilce:pick(r,["ilce","district"],""),
  neighborhood:pick(r,["mahalle","neighborhood"],""),mahalle:pick(r,["mahalle","neighborhood"],""),
  urgency:pick(r,["aciliyet","urgency"],""),
  aciliyet:pick(r,["aciliyet","urgency"],""),
  name:pick(r,["ad_soyad","name"],""),ad_soyad:pick(r,["ad_soyad","name"],""),
  phone:pick(r,["telefon","phone"],""),telefon:pick(r,["telefon","phone"],""),
  status:pick(r,["durum","status"],"Beklemede"),durum:pick(r,["durum","status"],"Beklemede"),
  createdAt:pick(r,["created_at","createdAt"],""),
  user_id:pick(r,["user_id","owner_id"],null),
  customer_id:pick(r,["customer_id"],null)
 };
}

async function loadCategories(){
 try{
  const rows=await supabaseRequest("GET","categories?select=*&limit=500");
  return Array.isArray(rows)?rows:[];
 }catch(e){console.warn("categories okunamadı:",e);return []}

async function loadProviderCategories(){
 try{
  const rows=await supabaseRequest("GET","provider_categories?select=*&limit=1000");
  return Array.isArray(rows)?rows:[];
 }catch(e){console.warn("provider_categories okunamadı:",e);return []}

function mapProvider(r){
 return {
  id:pick(r,["id","provider_id"],""),
  name:pick(r,["name","ad","ad_soyad","business_name","isletme"],"Hizmet Sağlayıcı"),
  phone:pick(r,["phone","telefon","telefon_numarasi"],""),
  category:pick(r,["category","kategori","category_id"],""),
  city:pick(r,["il","city"],"İzmir"),
  district:pick(r,["ilce","district"],""),
  neighborhood:pick(r,["mahalle","neighborhood"],""),
  description:pick(r,["description","aciklama"],""),
  active:pick(r,["active","aktif"],true)!==false,
  services:[]
 };
}

function categoryValueFromRow(row,categories){
 const raw=pick(row,["category_id","kategori_id","category","kategori"],"");
 if(!raw)return "";
 const c=categories.find(x=>String(x.id)===String(raw));
 if(c)return pick(c,["name","name_tr","ad","kategori"],raw);
 return raw;
}

async function enrichProviders(providers){
 const [cats,links]=await Promise.all([loadCategories(),loadProviderCategories()]);
 const byId={};
 providers.forEach(p=>byId[String(p.id)]=p);

 links.forEach(link=>{
  const pid=pick(link,["provider_id","providers_id","provider"],"");
  const val=categoryValueFromRow(link,cats);
  if(byId[String(pid)]&&val)byId[String(pid)].services.push(serviceKeyFromValue(val));
 });

 providers.forEach(p=>{
  const direct=p.category;
  if(direct&&!p.services.length)p.services=[serviceKeyFromValue(direct)];
  p.services=[...new Set(p.services.filter(Boolean))];
 });
 return providers;
}

function providerMatchesRequest(p,r){
 if(!p.active)return false;
 const ps=(p.services||[]).map(serviceKeyFromValue);
 const rk=serviceKeyFromValue(r.kategori||r.service);
 const district=normalize(p.district),rd=normalize(r.ilce||r.district);
 const city=normalize(p.city),rc=normalize(r.il||"İzmir");
 const categoryOK=ps.length?ps.includes(rk):true;
 const districtOK=district?district===rd:true;
 const cityOK=!city||!rc||city===rc||city==="izmir";
 return categoryOK&&districtOK&&cityOK;
}

function getAuthSession(){try{return JSON.parse(localStorage.getItem("isimi_coz_auth_session")||"null")}catch(e){return null}}
function saveAuthSession(session){if(session)localStorage.setItem("isimi_coz_auth_session",JSON.stringify(session));else localStorage.removeItem("isimi_coz_auth_session");updateAuthArea()}
function getAppTheme(){try{return localStorage.getItem('isimi-theme')||'dark';}catch(e){return 'dark';}}

function updateAuthArea(){
 const el=document.getElementById("authArea"); if(!el)return;
 const session=getAuthSession();
 if(session?.user){ currentAuthUser=session.user; const email=session.user.email||"Hesabım"; el.innerHTML='<div class="authBar"><span class="authUser">'+escapeHTML(email)+'</span><button class="authBtn" type="button" onclick="logoutUser()">Çıkış</button></div>'; }
 else { currentAuthUser=null; el.innerHTML='<div class="authBar"><button class="authBtn" type="button" onclick="openAuthModal(\'login\')">Giriş</button><button class="authBtn primary" type="button" onclick="openAuthModal(\'signup\')">Kayıt Ol</button></div>'; }
}
function openAuthModal(mode){
 document.getElementById("authModal")?.remove();
 const title=mode==='signup'?'Hesap oluştur':'Giriş yap';
 const button=mode==='signup'?'KAYIT OL':'GİRİŞ YAP';
 const switchText=mode==='signup'?'Zaten hesabın var mı?':'Hesabın yok mu?';
 const switchMode=mode==='signup'?'login':'signup';
 const switchLabel=mode==='signup'?'Giriş yap':'Kayıt ol';
 const html=`<div class="modal" id="authModal"><div class="modalCard"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2>${title}</h2><button class="authBtn" type="button" onclick="closeAuthModal()">Kapat</button></div><label>E-posta</label><input id="authEmail" type="email" autocomplete="email" placeholder="ornek@email.com"><label>Şifre</label><input id="authPassword" type="password" autocomplete="${mode==='signup'?'new-password':'current-password'}" placeholder="En az 6 karakter"><div id="authError"></div><button class="btn primary" id="authSubmit" type="button" onclick="submitAuth('${mode}')">${button}</button><p class="muted small" style="text-align:center;margin-bottom:0">${switchText} <button class="authBtn" type="button" onclick="openAuthModal('${switchMode}')">${switchLabel}</button></p></div></div>`;
 document.body.insertAdjacentHTML('beforeend',html);
 setTimeout(()=>document.getElementById('authEmail')?.focus(),50);
}
function closeAuthModal(){document.getElementById("authModal")?.remove()}
async function submitAuth(mode){
 const email=document.getElementById('authEmail')?.value.trim(); const password=document.getElementById('authPassword')?.value; const err=document.getElementById('authError'); const btn=document.getElementById('authSubmit');
 if(!email||!password){if(err)err.innerHTML='<div class="authError">E-posta ve şifre gerekli.</div>';return}
 if(password.length<6){if(err)err.innerHTML='<div class="authError">Şifre en az 6 karakter olmalı.</div>';return}
 btn.disabled=true;btn.textContent='BEKLEYİN...';
 try{
   let url=SUPABASE_URL+'/auth/v1/'+(mode==='signup'?'signup':'token?grant_type=password');
   const r=await fetch(url,{method:'POST',headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});
   const data=await r.json().catch(()=>({}));
   if(!r.ok)throw new Error(data.error_description||data.msg||data.message||'Kimlik doğrulama başarısız.');
   if(mode==='signup' && !data.access_token){
      closeAuthModal(); alert('Kayıt tamamlandı. E-posta doğrulaması açıksa gelen kutunu kontrol et, ardından giriş yap.'); return;
   }
   saveAuthSession(data); closeAuthModal(); alert(mode==='signup'?'Hesap oluşturuldu. ✓':'Giriş başarılı. ✓');
 }catch(e){if(err)err.innerHTML='<div class="authError">'+escapeHTML(e.message||String(e))+'</div>';}finally{if(btn){btn.disabled=false;btn.textContent=buttonText(mode)}}
}
function buttonText(mode){return mode==='signup'?'KAYIT OL':'GİRİŞ YAP'}
function logoutUser(){saveAuthSession(null);alert('Çıkış yapıldı.')}
updateAuthArea();

}
function kurumRequiredDocsUploaded(){

}
function kurumAnswerLabel(q,val){
 if(!q)return String(val||'');
 if(q.type==='choice'&&q.options){
  const hit=q.options.find(o=>o[0]===val);
  return hit?hit[1]:String(val||'');
 }
 return String(val||'');
}

function defaultCaseSteps(){return activeStepTemplate().map(x=>({id:null,step_key:x.key,title:x.title,description:x.description,sort_order:x.sort_order,institution:x.institution,status:'pending',is_optional:false,metadata:{},completed_at:null}));}
function normalizeCaseSteps(rows){const byKey={};(Array.isArray(rows)?rows:[]).forEach(r=>{if(r&&r.step_key)byKey[r.step_key]=r;});return activeStepTemplate().map(t=>byKey[t.key]||({...t,key:t.key,step_key:t.key,title:t.title,description:t.description,sort_order:t.sort_order,institution:t.institution,status:'pending',id:null,is_optional:false,metadata:{},completed_at:null}));}
async function loadCaseSteps(){
 H.caseSteps=defaultCaseSteps();
 if(!H.dbId)return;
 try{
  const rows=await supabaseAuthRequest('GET','hallet_case_steps?select=id,case_id,step_key,title,description,sort_order,institution,status,is_optional,metadata,completed_at,created_at,updated_at&case_id=eq.'+encodeURIComponent(H.dbId)+'&order=sort_order.asc&limit=50');
  if(Array.isArray(rows)&&rows.length)H.caseSteps=normalizeCaseSteps(rows);
 }catch(e){console.warn('Hallet işlem adımları yüklenemedi; yerel akış kullanılacak.',e);}
}
async function ensureCaseSteps(){
 if(!H.dbId)return;
 const steps=H.caseSteps&&H.caseSteps.length?H.caseSteps:defaultCaseSteps();
 H.caseSteps=steps;
 try{
  const existing=await supabaseAuthRequest('GET','hallet_case_steps?select=id,step_key&case_id=eq.'+encodeURIComponent(H.dbId)+'&limit=50');
  const existingKeys=new Set((Array.isArray(existing)?existing:[]).map(x=>x.step_key));
  const missing=steps.filter(x=>!existingKeys.has(x.step_key)).map(x=>({case_id:H.dbId,step_key:x.step_key,title:x.title,description:x.description,sort_order:x.sort_order,institution:x.institution,status:x.status||'pending',is_optional:!!x.is_optional,metadata:x.metadata||{},completed_at:x.completed_at||null}));
  if(missing.length){const created=await supabaseAuthRequest('POST','hallet_case_steps',missing);(Array.isArray(created)?created:[]).forEach(r=>{const st=H.caseSteps.find(x=>x.step_key===r.step_key);if(st)st.id=r.id;});}
 }catch(e){console.warn('Hallet işlem adımları kaydedilemedi; dosya kaydı korunuyor.',e);}
}
async function updateCaseStep(key){
 const fromSaved=!!H.dbId;
 const step=H.caseSteps.find(x=>x.step_key===key);
 if(!step)return;
 const previousStatus=step.status||'pending';
 const previousCompletedAt=step.completed_at||null;
 let nextStatus=previousStatus==='completed'?'pending':'completed';
 const nextCompletedAt=nextStatus==='completed'?new Date().toISOString():null;
 if(H.module==='kurum_basvurusu'&&nextStatus==='completed'){
  if(key==='info'&&!kurumQuestionsAnswered()){
   alert('Önce başvuru bilgilerini tamamla (soruları yanıtla).');
   return;
  }
  if(key==='documents'&&!kurumRequiredDocsUploaded()){
   alert('Zorunlu belgeler yüklenmeden bu adım tamamlanamaz.');
   return;
  }
 }
 if(!H.dbId){
  step.status=nextStatus;
  step.completed_at=nextCompletedAt;
  return showActiveResult(false);
 }
 const target=H.caseSteps.find(x=>x.step_key===key)||step;
 target.status=nextStatus;
 target.completed_at=nextCompletedAt;
 try{
  const filter=target.id
   ? 'id=eq.'+encodeURIComponent(target.id)
   : 'case_id=eq.'+encodeURIComponent(H.dbId)+'&step_key=eq.'+encodeURIComponent(key);
  const updated=await supabaseAuthRequest(
   'PATCH',
   'hallet_case_steps?'+filter+'&select=id,case_id,step_key,status,completed_at,updated_at',
   {status:nextStatus,completed_at:nextCompletedAt,updated_at:new Date().toISOString()}
  );
  if(!Array.isArray(updated)||!updated.length)throw new Error('İşlem adımı veritabanında güncellenemedi.');
  const saved=updated[0];
  if(saved.status!==nextStatus){throw new Error('İşlem adımı durumu doğrulanamadı.');}
  target.status=saved.status;
  target.completed_at=saved.completed_at||null;
 }catch(e){
  target.status=previousStatus;
  target.completed_at=previousCompletedAt;
  console.error('İşlem adımı kaydedilemedi:',e);
  const c=document.querySelector('#hallet-root .hc');
  if(c&&!c.querySelector('.err'))c.insertAdjacentHTML('beforeend','<div class="err">İşlem adımı kaydedilemedi. Lütfen tekrar deneyin.</div>');
 }
 showActiveResult(fromSaved);
}

async function storageUpload(path,file,token){
  if(!token)throw new Error('Belge yüklemek için giriş yapmalısınız.');
  const safePath=path.split('/').map(encodeURIComponent).join('/');
  const url=SUPABASE_URL+'/storage/v1/object/authenticated/hallet-documents/'+safePath;
  const headers={
    'Authorization':'Bearer '+token,
    'apikey':SUPABASE_KEY,
    'Content-Type':file.type||'application/octet-stream',
    'x-upsert':'false'
  };
  const res=await fetch(url,{method:'POST',headers,body:file});
  const text=await res.text();
  if(!res.ok){let d=null;try{d=text?JSON.parse(text):null}catch(e){}throw new Error(d?.message||d?.error||text||'Belge yüklenemedi.');}
  return true;
}
async function saveDocumentRow(docKey,file,path){
  const session=getAuthSession();
  if(!session?.access_token||!session?.user?.id||!H.dbId)throw new Error('Belgeyi kaydetmek için önce işlem dosyasını kaydetmelisiniz.');
  const docs=getDocumentChecklist(H.answers);
  const meta=docs.find(d=>d.key===docKey);
  const body={
    case_id:H.dbId,
    doc_key:docKey,
    title:meta?.title||docKey,
    is_required:meta?.required===true,
    is_conditional:false,
    condition_note:null,
    status:'uploaded',
    storage_path:path,
    mime_type:file.type||null,
    file_size_bytes:file.size||0,
    metadata:{original_name:file.name||null},
    user_id:session.user.id,
    updated_at:new Date().toISOString()
  };
  const rows=await supabaseAuthRequest('POST','hallet_documents',body);
  return Array.isArray(rows)?rows[0]:rows;
}

  return !!H.dbId;

async function uploadDocument(docKey,file){
  if(!file)return;
  const session=getAuthSession();
  if(!session?.access_token||!session?.user?.id){openAuthModal('login');return;}
  if(file.size>10*1024*1024){alert('Dosya en fazla 10 MB olabilir.');return;}
  if(!(file.type==='application/pdf'||file.type.startsWith('image/'))){alert('Sadece PDF veya görsel dosyaları yükleyebilirsiniz.');return;}
  try{
    const saved=await ensureCaseSaved();
    if(!saved)throw new Error('İşlem dosyası kaydedilemedi.');
    const safeName=(file.name||'belge').replace(/[^a-zA-Z0-9._-]/g,'_');
    const path=session.user.id+'/'+H.dbId+'/'+docKey+'/'+Date.now()+'-'+safeName;
    await storageUpload(path,file,session.access_token);
    await saveDocumentRow(docKey,file,path);
    H.documents[docKey]=true;
    const uploadedFile={path,name:file.name||safeName,type:file.type||null,size:file.size||0};
    const existingFiles=getDocumentFiles(docKey);
    H.documentFiles[docKey]=existingFiles.concat([uploadedFile]);
    if(H.module==='kurum_basvurusu'){
      await saveKurumCase(true);
      kurumResult(false);
    }else if(H.module==='prop'){
      // Belge yükleme sonrası dosya formunu yeniden kaydetme: kullanıcı açıkça
      // “DOSYAYI KAYDET” butonuna bastığında dosya metadata'sı güncellensin.
      propResult(false);
    }else{
      await saveCase(true);
      result(false);
    }
    alert('Belge başarıyla yüklendi. ✓\n\n'+(file.name||'Belge'));

  viewer.addEventListener('click',function(ev){ev.stopPropagation();},true);

  document.body.appendChild(viewer);

  try{

      try{return decodeURIComponent(p);}catch(e){return p;}

      method:'GET',
      headers:{
        'Authorization':'Bearer '+session.access_token,
        'apikey':SUPABASE_KEY
      }
    });
    if(!fileRes.ok){
      const errText=await fileRes.text().catch(function(){return '';});
      let errData=null;

      const msg=(errData&&(errData.message||errData.error))||errText||('Dosya okunamadı (HTTP '+fileRes.status+').');
      if(fileRes.status===401||fileRes.status===403||/jwt|token|auth|expired|oturum/i.test(String(msg))){
        throw new Error('Oturum süresi dolmuş olabilir. Lütfen tekrar giriş yapıp belgeyi açın.');
      }
      throw new Error(msg);
    }
    const blob=await fileRes.blob();

    const isImage=mime.indexOf('image/')===0||/\.(jpe?g|png|gif|webp|bmp|heic|heif)$/i.test(name);

    // Viewer'ı anında silme: hata mesajını modal içinde göster (flash→geri dönme olmasın)

  }
}

 if(btn){btn.disabled=true;btn.textContent='KAYDEDİLİYOR...';}
 try{
  let rows;
  if(H.dbId)rows=await supabaseAuthRequest('PATCH','hallet_cases?id=eq.'+encodeURIComponent(H.dbId)+'&select=id,status,created_at',payload);
  else rows=await supabaseAuthRequest('POST','hallet_cases?select=id,status,created_at',payload);
  const row=Array.isArray(rows)?rows[0]:rows;
  H.dbId=row?.id||H.dbId;
  H.createdAt=row?.created_at||H.createdAt;
  H.module='kurum_basvurusu';
  await ensureCaseSteps();
  if(btn){btn.disabled=false;btn.textContent='✓ KAYDEDİLDİ';}
  if(!silent)alert('Kurum başvuru dosyan kaydedildi.\n\nDosya No: '+H.caseId)
  if(!silent)kurumResult(true);
 }catch(e){
  console.error('Kurum kayıt hatası:',e);
  if(btn){btn.disabled=false;btn.textContent='DOSYAYI KAYDET';}
  alert('Dosya kaydedilemedi.\\n\\n'+(e&&e.message?e.message:'Bilinmeyen hata')+'\\n\\nNot: case_type constraint sadece konut_satisi ise migration gerekir.');
 }
}
function kurumResult(fromSaved){
 const flow=getKurumFlow(H.kurumFlowId);
 if(!flow){return kurumHome();}
 const a=H.answers||{};
 const docs=getKurumDocumentChecklist(a);
 const stepState=stepSummary();
 const isCompleted=H.status==='completed';
 const readyDocs=docs.filter(d=>{
  if(getDocumentFiles(d.key).length)return true;
  if(d.required===false&&H.documents[d.key]===true)return true;
  return false;
 });
 const missingDocs=docs.filter(d=>readyDocs.indexOf(d)<0);
 const docState={total:docs.length,ready:readyDocs.length,percent:docs.length?Math.round(readyDocs.length/docs.length*100):0,complete:docs.length>0&&missingDocs.length===0,missing:missingDocs};
 const canComplete=!isCompleted&&!!docState.complete&&(stepState.done||0)>=(stepState.total||5)&&(stepState.total||0)>0;
 const action=isCompleted?null:(docState.missing&&docState.missing.length?{title:'Eksik belgeleri tamamla',detail:docState.missing[0].title}:{title:'Resmî kanala git',detail:'Başvuruyu e-Devlet üzerinden tamamla.'});
 let html=top(fromSaved?'cases':'kurum')+'<div class="hc"><div class="hk">Kurum başvurusu</div><h1>'+esc(flow.title)+'</h1>';
 html+='<div class="hl" style="border:1px solid #35535a;border-radius:12px;padding:4px 0;background:#0e2025">';
 html+='<div class="li"><strong>İşlem:</strong> Kurum Başvurusu</div>';
 html+='<div class="li"><strong>Kurum:</strong> '+esc(flow.institution)+'</div>';
 html+='<div class="li"><strong>Başvuru:</strong> '+esc(flow.application_type)+'</div>';
 html+='<div class="li"><strong>İlerleme:</strong> '+stepState.done+' / '+stepState.total+' adım ('+stepState.percent+'%)</div>';
 html+='<div class="li"><strong>Belgeler:</strong> '+docState.ready+' / '+docState.total+' hazır'+(docState.missing&&docState.missing.length?(' — eksik: '+esc(docState.missing[0].title)):'')+'</div>';
 html+='<div class="li"><strong>Şimdi:</strong> '+(isCompleted?'<span class="ok">✓ İşlem tamamlandı</span>':esc(action?action.title:'—'))+'</div></div>';
 html+='<h2>Başvuru bilgileri</h2><p class="hm small">Bu bilgiler yalnızca hazırlık ve dosya takibi içindir. Resmî başvuru e-Devlet üzerinden yapılır; T.C. kimlik numarası burada istenmez.</p><div class="hl">';
 (flow.questions||[]).forEach(q=>{
  const val=a[q.key];
  const shown=(val!=null&&String(val).trim()!=='')?kurumAnswerLabel(q,val):'— henüz yanıtlanmadı';
  html+='<div class="li"><strong>'+esc(q.title)+'</strong><br><span class="hm">'+esc(shown)+'</span></div>';
 });
 html+='<div class="li"><label class="hm">Hazırlık notu (isteğe bağlı)</label><textarea class="hi" id="kurumNotes" rows="3" placeholder="Örn. randevu için yanında bulunduracakların, hatırlatmalar…">'+esc(a.notes||'')+'</textarea></div>';
 html+='</div><div class="hg"><button type="button" class="hb" data-a="kurum_edit_info">Bilgileri düzenle</button><button type="button" class="hb" data-a="kurum_save_notes">Notu kaydet</button></div>';
 if(!kurumQuestionsAnswered())html+='<div class="li"><span class="hm">Başvuru bilgileri eksik. “Bilgileri düzenle” ile soruları tamamla.</span></div>';
 html+='<h2>Resmî başvuru</h2><div class="li"><span class="hm">Başvuruyu resmî kurumun kendi sistemi üzerinden tamamlamalısın. İşini Hallet resmî başvuru yapmaz ve sonuç garantisi vermez.</span></div>';
 html+='<div class="hg"><a class="hb hp" href="'+esc(flow.official_channel_url)+'" target="_blank" rel="noopener noreferrer">Resmî kanala git →</a></div>';
 html+='<p class="hm small">'+esc(flow.source_note)+' Kontrol: '+esc(flow.checked_at)+'</p>';
 html+='<h2>Gerekli belgeler</h2><p class="hm small">Belgeleri işlem dosyana yükleyebilirsin. Yalnızca işaretlemek, dosya yüklemiş sayılmaz.</p><div class="hl">'+docs.map(d=>{
  const files=getDocumentFiles(d.key);
  const uploaded=files.length>0;
  const statusLabel=uploaded?'✓ Yüklendi':'○ Eksik';
  const statusClass=uploaded?'ok':'';
  return '<div class="li"><div><strong>'+esc(d.title)+'</strong>'+(d.required===false?' <span class="hm">(opsiyonel)</span>':'')+'<br><span class="hm">'+esc(d.reason||'')+'</span><br><span class="'+statusClass+'">'+statusLabel+'</span></div>'+(files.length?('<div style="margin-top:8px;display:grid;gap:6px">'+files.map((f,i)=>'<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid #29464d;border-radius:10px;background:#0e2025"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📄 '+esc(f.name||('Belge '+(i+1)))+'</span><button type="button" class="topb" data-a="openDoc" data-k="'+esc(d.key)+'" data-i="'+i+'">Görüntüle</button></div>').join('')+'</div>'):'')+'<div style="margin-top:9px"><label style="display:inline-flex;align-items:center;gap:7px;margin:0;padding:8px 10px;border:1px solid #35535a;border-radius:10px;background:#10252b;color:#fff;font:700 12px Arial,sans-serif;cursor:pointer">📎 Belge ekle<input type="file" data-upload-doc="'+esc(d.key)+'" accept="application/pdf,image/*" style="display:none"></label></div></div>';
 }).join('')+'</div>';
 html+='<h2>İşlem adımları</h2><div class="hl">'+stepState.steps.map((st,i)=>'<div class="li" style="display:flex;gap:10px;align-items:flex-start"><span>'+(st.status==='completed'?'✅':(i+1)+'.')+'</span><span style="flex:1"><strong>'+esc(st.title)+'</strong><br><span class="hm">'+esc(st.description||'')+'</span></span><button type="button" class="topb" data-a="stepToggle" data-k="'+esc(st.step_key)+'">'+(st.status==='completed'?'Geri al':'Tamamla')+'</button></div>').join('')+'</div>';
 if(canComplete)html+='<div class="li" style="margin-top:12px;border:1px solid #2f6f4e;border-radius:12px;padding:12px;background:#0f2a1c"><strong class="ok">✓ Hazır</strong><br><span class="hm">Adımlar ve belgeler tamam. Dosyayı tamamlandı işaretleyebilirsin (resmî başvuru anlamına gelmez).</span><div class="hg" style="margin-top:10px"><button class="hb hp" data-a="completecase">✓ Başvuruyu Tamamlandı Olarak İşaretle</button></div></div>';
 if(isCompleted)html+='<div class="li"><span class="ok">✓</span> <strong>Bu işlem dosyası tamamlandı.</strong></div>';
 html+='<div class="hg" style="margin-top:14px">';
 if(!isCompleted)html+='<button class="hb hp" data-a="kurum_save">DOSYAYI KAYDET</button>';
 if(fromSaved)html+='<button class="hb" data-a="cases">← DOSYALARIMA DÖN</button>';
 html+='<button class="hb" data-a="kurum">Kurum listesi</button><button class="hb hs" data-a="close">Kapat</button></div></div>';
 render(html);
}

function dispatch(a,e){if(a==='close')return close();if(a==='gate')return gate();if(a==='cases')return cases();if(a==='caseopen')return openCase(e.dataset.id);if(a==='openDoc')return openDocument(e.dataset.k,Number(e.dataset.i||0));if(a==='stepToggle')return updateCaseStep(e.dataset.k);if(a==='islem')return islem();if(a==='tasinmaz')return tasinmaz();if(a==='tapu_rehber')return tapuRehber();if(a==='prop_start')return propStart(e.dataset.id);if(a==='prop_qback'){H.step=Math.max(0,H.step-1);return propQuestion();}if(a==='prop_answer'){H.answers[e.dataset.k]=e.dataset.v;H.step++;return propQuestion();}if(a==='prop_answer_input'){const i=document.getElementById('qinput');const f=getPropFlow(H.propFlowId);const q=f&&f.questions[H.step];if(q)H.answers[q.key]=i?i.value:'';H.step++;return propQuestion();}if(a==='prop_doc'){H.documents[e.dataset.k]=!!e.checked;if(H.dbId)return savePropCase(true);return propResult(!!H.dbId);}if(a==='prop_save')return savePropCase();if(a==='prop_print')return propPrint();if(a==='prop_whatsapp')return propShareWhatsApp();if(a==='arac')return arac();if(a==='arac_satis')return aracSatisStart();if(a==='arac_qback'){H.step=Math.max(0,H.step-1);return aracQuestion();}if(a==='arac_answer'){H.answers[e.dataset.k]=e.dataset.v;H.step++;return aracQuestion();}if(a==='arac_answer_input'){const i=document.getElementById('qinput');const q=ARAC_QUESTIONS[H.step];if(q)H.answers[q.key]=i?i.value:'';H.step++;return aracQuestion();}if(a==='arac_doc'){H.documents[e.dataset.k]=!!e.checked;return aracResult(!!H.dbId);}if(a==='arac_save')return saveAracCase();if(a==='evrak_type'){if(e&&e.dataset&&e.dataset.fresh==='1'){H.dbId=null;H.evrakDraft=null;}return evrakTypeForm(e.dataset.t,H.evrakDraft);}if(a==='evrak_type_preview')return evrakTypePreview(e.dataset.t);if(a==='evrak_type_save')return evrakTypeSave(e.dataset.t);if(a==='evrak_mark_done')return evrakMarkDone();if(a==='evrak_print')return evrakPrint();if(a==='evrak_whatsapp')return evrakShareWhatsApp();if(a==='evrak_konut_edit'){const d=H.evrakDraft||{};return evrakSatisBilgiSaved({id:H.dbId,status:H.status||'draft',title:'Konut satış bilgi formu'},{document_type:'konut_satis_bilgi_formu',draft:d,case_no:H.caseId});}if(a==='yakinda')return msg((e&&e.dataset&&e.dataset.t)||'Yakında','Bu kategori menüde yer alıyor; tam akış henüz açılmadı. Uydurma hukuki süreç eklenmez. Şimdilik Konut satışı, Evrak (konut form) ve Kurum pilotlarını kullan.');if(a==='konut')return konut();if(a==='start'){H.step=0;return question()}if(a==='qback'){H.step=Math.max(0,H.step-1);return question()}if(a==='answer'){H.answers[e.dataset.k]=e.dataset.v;H.step++;return question()}if(a==='docReady')return;if(a==='docToggle'){H.documents[e.dataset.k]=!!e.checked;if(H.module==='kurum_basvurusu'){kurumResult(false);if(H.dbId)return saveKurumCase();return;}result(false);if(H.dbId)return saveCase(true);return;}if(a==='savecase')return saveCase();if(a==='save'){const i=document.getElementById('qinput');if(!i||!String(i.value).trim()){const c=document.querySelector('#hallet-root .hc');if(c&&!c.querySelector('.err'))c.insertAdjacentHTML('beforeend','<div class="err">Lütfen bir değer girerek devam et.</div>');return}H.answers[e.dataset.k]=i.value.trim();H.step++;return question()}if(a==='new'){H.step=0;H.answers={};H.documents={};H.documentStatuses={};H.documentFiles={};H.caseId=null;H.dbId=null;H.status=null;H.module=null;H.kurumFlowId=null;H.caseSteps=[];return gate()}if(a==='isimi')return goIsimi();if(a==='evrak')return evrak();if(a==='evrak_satis_bilgi')return evrakSatisBilgi();if(a==='evrak_preview')return evrakPreview();if(a==='evrak_print')return evrakPrint();if(a==='evrak_savecase')return evrakSaveCase();if(a==='evrak_back')return islem();if(a==='completecase')return markCaseCompleted();if(a==='kurum')return kurumHome();if(a==='kurum_flow')return kurumStartFlow(e.dataset.id);if(a==='kurum_q')return kurumAnswer(e.dataset.k,e.dataset.v);if(a==='kurum_save')return saveKurumCase();if(a==='kurum_result')return kurumResult(false);if(a==='kurum_edit_info'){H.step=0;return kurumQuestion();}if(a==='kurum_save_notes'){const t=document.getElementById('kurumNotes');if(t)H.answers.notes=t.value||'';return saveKurumCase();}}
document.addEventListener('click',function(e){
  var node=e.target;
  if(node&&node.nodeType===3)node=node.parentElement;
  if(!node||!node.closest)return;
  var openBtn=node.closest('#hallet-root [data-a="openDoc"]');
  if(openBtn){
    e.preventDefault();
    e.stopPropagation();
    if(e.stopImmediatePropagation)e.stopImmediatePropagation();
    openDocument(openBtn.getAttribute('data-k')||'',Number(openBtn.getAttribute('data-i')||0)||0);
    return;
  }
  var el=node.closest('#hallet-root [data-a]');
  if(!el)return;
  e.preventDefault();
  e.stopPropagation();
  dispatch(el.getAttribute('data-a')||el.dataset.a,el);
},true);
document.addEventListener('change',function(e){
  const box=e.target.closest&&e.target.closest('#hallet-root input[data-kurum-doc]');
  if(!box)return;
  H.documents[box.getAttribute('data-kurum-doc')]=!!box.checked;
  if(H.module==='kurum_basvurusu'){kurumResult(false);if(H.dbId)saveKurumCase();}
},true);

document.addEventListener('change',function(e){
  const el=e.target.closest&&e.target.closest('#hallet-root input[data-upload-doc]');
  if(!el)return;
  e.stopPropagation();
  const f=el.files&&el.files[0];
  if(f)uploadDocument(el.dataset.uploadDoc,f);
  el.value='';
},true);

window.Hallet={showGate:gate,showIslemMenu:islem,showTasinmazMenu:tasinmaz,showKonutSatis:konut,showQuestion:question,showResult:result,showCases:cases,showEvrak:evrak,showKurum:kurumHome,close:close};
})();

document.addEventListener('click',function(e){const b=e.target.closest&&e.target.closest('#openHalletButton');if(!b)return;e.preventDefault();e.stopPropagation();if(window.Hallet)window.Hallet.showGate();},true);
