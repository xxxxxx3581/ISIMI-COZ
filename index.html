/* ================= V2 UX (A7) — marketplace arayüzü ================= */
:root{--v2-pri:#14b87a;--v2-pri-ink:#032b1e;--v2-soft:rgba(20,184,122,.14);--v2-soft-line:rgba(20,184,122,.42);--v2-heart:#e11d48;--v2-ph1:#0f2136;--v2-ph2:#16304d;--v2-overlay:rgba(3,10,18,.66);--v2-tag-bg:rgba(7,15,26,.78);--v2-tag-ink:#f1f5f9}
html[data-theme="light"]{--v2-pri:#0b7f54;--v2-pri-ink:#ffffff;--v2-soft:rgba(11,127,84,.09);--v2-soft-line:rgba(11,127,84,.38);--v2-ph1:#e7eef5;--v2-ph2:#d5e1ec;--v2-overlay:rgba(15,28,42,.48);--v2-tag-bg:rgba(255,255,255,.92);--v2-tag-ink:#0f1c2a}
body.v2NoScroll{overflow:hidden}
.app{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.connection{top:auto!important;bottom:calc(74px + env(safe-area-inset-bottom,0px))!important;right:8px!important;width:8px;height:8px;padding:0!important;font-size:0!important;border-radius:50%;opacity:.85;border:1px solid var(--line)}
.connection.online{background:#22c55e!important}.connection.offline{background:#f59e0b!important}

/* header */
.v2Top{display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--top-bg);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);position:sticky;top:0;z-index:40}
.v2Ico{flex:0 0 auto;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:19px;line-height:1;display:inline-grid;place-items:center;cursor:pointer;padding:0}
.v2Ico:hover,.v2Ico:focus-visible{border-color:var(--v2-pri)}
.v2Ico.flat{border-color:transparent;background:transparent}
.v2Brand{display:flex;align-items:center;gap:8px;min-width:0;border:0;background:transparent;color:var(--text);padding:4px 2px;cursor:pointer;flex:1 1 auto;text-align:left}
.v2Logo{flex:0 0 auto;width:30px;height:30px;border-radius:10px;background:linear-gradient(145deg,var(--primary),var(--primary-2) 55%,var(--accent));display:grid;place-items:center;color:var(--logo-ink);font-weight:900;font-size:16px}
.v2Brand strong{font-size:16.5px;font-weight:900;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v2TopR{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.v2AraBtn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--v2-soft-line);background:var(--v2-soft);color:var(--v2-pri);font-weight:800;font-size:14px;cursor:pointer}
.v2AraBtn:active{transform:scale(.97)}
.headerAuthRow{display:flex;align-items:center}
.authBar{display:flex;align-items:center;gap:6px}
.authBar .authBtn,.authBar .a7ProfileChip{min-height:40px}

/* bottom nav */
.bottom{background:var(--top-bg)!important;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottomInner{display:flex!important;max-width:760px}
.bottomInner .navBtn{flex:1;min-width:0;min-height:56px;padding:7px 2px 6px;color:var(--muted)!important;font-size:11px!important;font-weight:700;border-radius:12px}
.bottomInner .navBtn b{font-size:19px!important;margin-bottom:2px}
.bottomInner .navBtn.active{color:var(--v2-pri)!important}
.bottomInner .navBtn.navPlus b{display:inline-grid;place-items:center;width:34px;height:26px;border-radius:9px;background:var(--v2-pri);color:var(--v2-pri-ink);font-size:18px!important;line-height:1}

/* drawer */
.appDrawer{overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}

.appDrawerNav button{min-height:44px;display:flex;align-items:center;gap:10px}

/* buttons */
.v2Btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:800;font-size:14.5px;cursor:pointer;text-align:center}

.v2Btn.block{width:100%}
.v2Btn:active{transform:scale(.985)}
.v2Btn:focus-visible,.v2Ico:focus-visible,.v2Chip:focus-visible,.v2Card:focus-visible{outline:2px solid var(--v2-pri);outline-offset:2px}

/* home */
.v2Home{padding:6px 0 8px}
.v2Hero h1{font-size:26px;line-height:1.12;margin:10px 0 6px;letter-spacing:-.03em}

.v2Search .ic{font-size:17px;opacity:.85}
.v2Search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:16px;padding:11px 4px}

.v2Eg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.v2Eg button{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 11px;font-size:12.5px;cursor:pointer}
.v2Cats{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 4px;margin:0}

.v2Cat{flex:1 1 calc(50% - 6px);min-width:calc(50% - 6px);max-width:calc(50% - 6px);box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:800;font-size:13px;cursor:pointer}

.v2Cat:active{transform:scale(.97);border-color:var(--v2-pri)}
/* kompakt ana kategori şeridi */
.v2CompCats{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 2px}
.v2Comp{flex:1 1 calc(50% - 6px);min-width:calc(50% - 6px);box-sizing:border-box;display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:800;font-size:13px;cursor:pointer;text-align:left}
.v2Comp .ic{flex:0 0 32px;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:var(--v2-soft)}

.v2Comp .tx small{font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v2Comp:active{transform:scale(.98);border-color:var(--v2-pri)}
.v2CompFood{border-color:rgba(245,158,11,.55)!important}
.v2CompFood .ic{background:rgba(245,158,11,.18)}
.v2CompSub{flex:1 1 100%;display:none;gap:6px;flex-wrap:wrap;padding:2px 0 4px}
.v2CompSub.on{display:flex}
.v2CompSub button{flex:1 1 calc(33.33% - 6px);min-width:88px;min-height:38px;padding:8px 8px;border-radius:12px;border:1px solid var(--line);background:var(--card2,var(--card));color:var(--text);font-weight:800;font-size:12.5px;cursor:pointer}

.v2Pill{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);font-weight:700;font-size:13.5px;cursor:pointer}

.v2Home .homeFeatured{margin-top:14px}

/* keşfet */
.v2K{padding:0 0 18px}
.v2KTop{display:flex;align-items:center;gap:8px;margin:8px 0 10px}

.v2Chip{flex:0 0 auto;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:700;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}

.v2Ctl .v2Btn{flex:0 0 auto}
.v2Sel{flex:1 1 auto;min-width:0;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 10px;font-size:14px;font-weight:700;-webkit-appearance:none;appearance:none}
.v2Seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:0 0 auto}

.check,.meta span,.description{background:var(--v2-sub)}
html[data-theme="light"] .badge{color:#0a6b47;background:rgba(11,127,84,.10);border-color:rgba(11,127,84,.32)}
html[data-theme="light"] .status{color:#7a4f00;background:rgba(245,185,66,.22)}
html[data-theme="light"] .notice{background:#e8f3fb;border-color:#b4d5ea;color:#0f4360}

html[data-theme="light"] .error{background:#fdeaea;border-color:#f1b5b5;color:#8a1f1f}

/* Geri butonu */
.v2Back{display:inline-flex;align-items:center;gap:4px;min-height:42px;padding:0 14px 0 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:800;font-size:14.5px;cursor:pointer}
.v2Back:active{transform:scale(.97)}
.v2KTop .v2Back+h1{margin-left:2px}

/* Belirgin sekmeler / çipler */
.v2Chip{border-width:1.5px;border-color:var(--v2-soft-line);background:var(--v2-soft);color:var(--text)}
.v2Chip.on{background:var(--v2-pri);border-color:var(--v2-pri);color:var(--v2-pri-ink)}
.v2Chip.on .v2Chip{color:inherit}
.v2Cats .v2Cat span{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px}
.v2Cat:nth-child(1) span{background:rgba(59,130,246,.16)}.v2Cat:nth-child(2) span{background:rgba(249,115,22,.18)}.v2Cat:nth-child(3) span{background:rgba(139,92,246,.18)}.v2Cat:nth-child(4) span{background:rgba(34,160,107,.20)}
.v2Cat{border-width:1.5px}
.v2Pill{border-width:1.5px;font-weight:800}
.v2Pills .v2Pill:nth-child(1){background:var(--v2-pri);border-color:var(--v2-pri);color:var(--v2-pri-ink)}
.v2Pills .v2Pill:nth-child(2){background:rgba(249,115,22,.14);border-color:rgba(249,115,22,.5)}
.v2Pills .v2Pill:nth-child(3){background:rgba(59,130,246,.14);border-color:rgba(59,130,246,.5)}

/* Sonraki adım / yardımcı işlemler */
.v2Pill2{border-width:1.5px;padding:0 13px 0 7px;font-weight:800}
.v2Pill2 i{font-style:normal;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px}
.v2Pill2 .ic-b{background:rgba(59,130,246,.2)}.v2Pill2 .ic-o{background:rgba(249,115,22,.22)}.v2Pill2 .ic-p{background:rgba(139,92,246,.22)}.v2Pill2 .ic-g{background:rgba(34,160,107,.24)}
.v2Sum{font-size:14px;font-weight:700;margin:2px 0 10px;color:var(--text)}
.v2Steps{margin:10px 0}

/* Özellikler (açılır) */
.v2Acc{border:1.5px solid var(--v2-soft-line);border-radius:14px;background:var(--card);overflow:hidden}
.v2Acc>summary{list-style:none;cursor:pointer;padding:14px;font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:10px;background:var(--v2-soft)}
.v2Acc>summary::-webkit-details-marker{display:none}
.v2Acc>summary::after{content:"›";margin-left:auto;font-size:22px;opacity:.7;transition:transform .15s}
.v2Acc[open]>summary::after{transform:rotate(90deg)}
.v2AccIn{padding:6px 14px 12px}
.v2AccIn .v2Facts2{margin:8px 0 6px}

/* İlan sahibi araç çubuğu */
.v2Own{border:1.5px solid var(--v2-soft-line);background:var(--v2-soft);border-radius:16px;padding:12px;margin:10px 0}
.v2OwnT{font-size:13px;font-weight:800;margin:0 0 10px}
.v2OwnBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.v2OwnBtns .v2Btn{min-height:44px;font-size:13.5px}
.v2Hints{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--muted)}
.v2Hints button{border:1px dashed var(--v2-pri);background:transparent;color:var(--v2-pri);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:800;cursor:pointer}

/* Açıklama düzenleme */
.v2DescEmpty{width:100%;text-align:left;border:1.5px dashed var(--v2-soft-line);background:var(--v2-soft);color:var(--text);border-radius:14px;padding:16px;font-weight:800;font-size:15px;cursor:pointer}
.v2DescEmpty small{display:block;font-weight:600;color:var(--muted);margin-top:4px}
.v2DescTa{width:100%;box-sizing:border-box;min-height:150px;border-radius:12px;border:1.5px solid var(--v2-pri);background:var(--v2-in);color:var(--text);padding:12px;font-size:15px;line-height:1.5}
.v2DescBtns{display:flex;gap:8px;margin-top:8px}.v2DescBtns .v2Btn{flex:1}

/* İletişim çubuğu */
.v2Btn.msg{background:#2b6cb0;border-color:#2b6cb0;color:#fff}
.v2Btn.nophone{background:var(--card);color:var(--muted);border-style:dashed;font-size:14px}
html[data-theme="light"] .v2Btn.msg{background:#1f5fa8}

/* Parça haritası: palet + gösterge (Sahibinden benzeri, kendi tasarımımız) */
.v2P-lokal{fill:#ff9a3c}.v2P-boyali{fill:#3f82d6}.v2P-degisen{fill:#f0484f}
.v2T-lokal{fill:#1a1206}.v2T-boyali,.v2T-degisen{fill:#fff}
.v2Gl2{fill:#fff;opacity:.16;pointer-events:none}
.v2Pal{display:flex;flex-wrap:wrap;gap:6px}
.v2PalB{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--text);font-weight:800;font-size:13px;cursor:pointer}
.v2PalB.on{border-color:var(--v2-pri);background:var(--v2-soft)}
.v2PalB.p-lokal.on{border-color:#ff9a3c}.v2PalB.p-boyali.on{border-color:#3f82d6}.v2PalB.p-degisen.on{border-color:#f0484f}
.v2Lg{display:grid;grid-template-columns:18px 1fr;column-gap:8px;align-items:start}
.v2Lg .v2Sq{grid-row:1/3;width:16px;height:16px;border-radius:4px;margin-top:2px;background:var(--v2-p-orig);border:1px solid var(--line)}
.v2Sq.s-lokal{background:#ff9a3c}.v2Sq.s-boyali{background:#3f82d6}.v2Sq.s-degisen{background:#f0484f}
.v2Lg b{font-size:14px}.v2Lg ul{margin:3px 0 0;padding-left:16px;font-size:13px;line-height:1.5;color:var(--text)}
.v2PClear{margin-top:6px}
.v2ChkRow{margin:0 0 8px}
@media(max-width:380px){.v2CarWrap{flex-direction:column}.v2Car{max-width:170px}}
.v2SvgHost{flex:0 0 46%;max-width:200px;min-width:120px}
.v2SvgHost .v2Car{display:block;width:100%;max-width:none;height:auto}
.v2PEd .v2Legend{min-width:0}

/* ===== Sahibinden benzeri detay üst çubuğu, yol, sayaç, tablo ===== */
.v2TopAct{margin-left:auto;display:flex;gap:8px}
.v2TopAct .v2Ico{width:44px;height:44px;font-size:21px}
.v2TopAct .v2Ico.is-fav{color:var(--v2-heart);border-color:var(--v2-heart)}
.v2Crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;margin:2px 0 6px;font-size:12.5px}
.v2Crumbs button{border:0;background:transparent;color:var(--v2-pri);font-weight:800;font-size:12.5px;padding:6px 2px;cursor:pointer}
.v2Crumbs span{color:var(--muted)}
.v2NoRow{display:flex;flex-wrap:wrap;align-items:center;gap:0 4px}
.v2NoBtn{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13px;padding:2px 0;cursor:pointer}
.v2Hero .ldCarousel{position:relative}
.v2Hero .ldCarouselMeta{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;align-items:center;gap:8px;pointer-events:none;margin:0}
.v2Hero [data-ld-count]{background:rgba(7,15,26,.72);color:#fff!important;padding:3px 11px;border-radius:99px;font-size:12.5px;font-weight:800}
.v2Hero .ldCarouselDots{display:none}
.v2Spec dd.price{color:var(--v2-pri);font-size:16px}
.v2Spec dd.no{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em}
.v2Steps .v2Pills2{flex-wrap:wrap;overflow-x:visible;margin-right:0;padding-bottom:2px;gap:6px}
.v2Pills2::-webkit-scrollbar{display:none}
.v2Pill2{flex:0 0 auto;white-space:nowrap}
.v2Recent{margin:16px 0 4px}
.v2Recent h3{font-size:16px}
.v2Rail>.v2Card .v2Heart{width:34px;height:34px}
.v2DActions .v2Btn.msg{flex:1.3}
.v2Home .v2Rail>.v2Card{flex:0 0 min(58vw,210px)}

/* ===== Sekmeler (Açıklama | Özellikler | Konum), auth şeridi, sahip hasar editörü ===== */
.v2Tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 0;border-bottom:3px solid var(--v2-pri);padding-bottom:0}
.v2Tabs button{min-height:48px;border:2px solid var(--v2-soft-line);border-bottom:0;border-radius:12px 12px 0 0;background:var(--v2-soft);color:var(--text);font-weight:800;font-size:14px;cursor:pointer;padding:0 4px}
.v2Tabs button.on{background:var(--v2-pri);border-color:var(--v2-pri);color:var(--v2-pri-ink)}
.v2TabPanel{border:2px solid var(--v2-soft-line);border-top:0;border-radius:0 0 14px 14px;padding:14px;margin:0 0 12px;background:var(--card);min-height:60px}
.v2TabPanel .v2Desc{margin:0}
.v2DescTap{cursor:text;border-radius:10px}
.v2DescTap:hover{background:var(--v2-soft)}
.v2LocBtns{display:flex;gap:8px;flex-wrap:wrap}
.v2Hero{margin:6px 0 0}
.v2DT{margin:4px 0 2px}
.v2Sum{font-size:13.5px;color:var(--muted);font-weight:700;margin:0 0 8px}
.v2DmgBtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.v2DmgBtns .v2Btn{flex:1 1 40%}
.v2AuthStrip{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border:1.5px solid var(--v2-soft-line);background:var(--v2-soft);border-radius:14px;padding:10px 12px;margin:6px 0 4px}
.v2AuthStrip .tx b{display:block;font-size:14px}.v2AuthStrip .tx small{color:var(--muted);font-size:12px}
.v2AuthStrip .btns{display:flex;gap:8px}
.v2AuthStrip.in{font-size:13px;font-weight:700;justify-content:flex-start;gap:14px}
.v2AuthStrip.in a,.v2AuthStrip.in button{color:var(--v2-pri);font-weight:800;background:transparent;border:0;font-size:13px;cursor:pointer;padding:6px 2px;text-decoration:none}
.v2AuthStrip.in button{margin-left:auto}

/* ===== Üst mini giriş çubuğu (küçük sekme), kompakt hasar bölümü, performans ===== */
.v2Top{flex-wrap:wrap;row-gap:0;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:var(--bg)}
.bottom{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:var(--bg)!important}
.v2TopMini{flex:0 0 100%;display:flex;justify-content:flex-end;align-items:center;gap:4px;min-height:26px;font-size:12px;color:var(--muted);margin:-2px 0 2px}
.v2Mini{border:0;background:transparent;color:var(--text);font-weight:800;font-size:12.5px;padding:4px 8px;border-radius:999px;cursor:pointer;text-decoration:none;line-height:1.2}
.v2Mini.pri{background:var(--v2-pri);color:var(--v2-pri-ink)}
.v2Mini:not(.pri):hover{background:var(--v2-soft)}
.v2DmgLine{font-size:12.5px;color:var(--muted);margin:0 0 8px;line-height:1.5}
.v2DmgLine b{color:var(--text);font-weight:800}
.v2Fine{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.45}
.v2PEd .v2PalB{min-height:34px;padding:0 10px;font-size:12.5px;gap:4px;border-width:1.5px;border-radius:10px}
.v2PEd .v2Pal{gap:5px}
.v2Sec2 .v2Car{max-width:150px}
.v2SvgHost{flex:0 0 40%;max-width:160px;min-width:110px}
.v2Lg b{font-size:13px}.v2Lg ul{font-size:12.5px}
.v2Similar,#v2Similar,.v2Rail{content-visibility:auto;contain-intrinsic-size:auto 260px}
.v2FeatWrap{display:block}
.v2SvgHost{flex:0 0 36%;max-width:130px;min-width:100px}
.v2Sec2 .v2Car{max-width:130px}

/* ===== Logo, bağlantı rozeti, kompakt aksiyon çubuğu, çalışma alanı, devam kartı ===== */
.connection{display:none!important}
.v2Brand{gap:8px}
.v2LogoMk{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#042f2e;background:linear-gradient(145deg,#14b87a 0%,#0d9488 55%,#38bdf8 120%);box-shadow:0 3px 10px rgba(20,184,122,.35),inset 0 1px 0 rgba(255,255,255,.28);overflow:visible}
.v2LogoMk svg{display:block}
.v2Wm{display:inline-flex;align-items:baseline;gap:4px;font-size:17px;line-height:1;letter-spacing:-.03em;font-weight:900}
.v2Wm b{font-weight:900;color:var(--text);letter-spacing:-.02em}
.v2Wm i{font-style:normal;font-weight:900;color:var(--primary);letter-spacing:-.02em}
.v2LogoLine{display:inline-flex;align-items:center;gap:8px}
@media(max-width:340px){.v2LogoMk{display:none}}

.v2DActions{max-width:560px;margin:8px auto 0;padding:6px 0 4px;gap:6px}
.v2DActions .v2Btn{min-height:42px;font-size:13.5px;border-radius:12px;padding:0 8px;gap:5px;white-space:nowrap}
.v2DActions .v2Btn.nophone{font-size:13px;white-space:normal;line-height:1.25;padding:6px 10px}
.v2DActions .v2Btn.msg{flex:1}
@media(min-width:720px){.v2DActions .v2Btn{min-height:46px;font-size:15px}}

.v2Cont{border:1.5px solid var(--v2-soft-line);background:var(--v2-soft);border-radius:16px;padding:12px;margin:12px 0 4px}
.v2ContH{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.02em;margin:0 0 8px}
.v2ContRow{display:flex;gap:12px;align-items:center;margin:0 0 10px}
.v2ContRow .ic{flex:0 0 42px;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--card);border:1px solid var(--line)}
.v2ContRow b{display:block;font-size:15px}
.v2ContRow small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.v2ContRow small.mis{color:var(--text);font-weight:700}

.v2Ws{padding-bottom:12px}
.v2WsHead{display:flex;gap:12px;align-items:center;margin:2px 0 12px}
.v2WsHead .ic{flex:0 0 46px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--v2-soft);border:1px solid var(--v2-soft-line)}
.v2WsHead h1{margin:0;font-size:19px;letter-spacing:-.02em}
.v2WsHead p{margin:2px 0 0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v2WsHead>div{flex:1;min-width:0}
.v2Pl{flex:0 0 auto;font-size:12px;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:4px 9px;background:var(--card)}
.v2WsProg{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.v2WsProg .bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.v2WsProg .bar i{display:block;height:100%;background:var(--v2-pri);border-radius:99px;transition:width .25s}
.v2WsProg b{font-size:15px}.v2WsProg small{color:var(--muted);font-size:12px;white-space:nowrap}
.v2WsNext{border:1.5px solid var(--v2-pri);background:var(--v2-soft);border-radius:14px;padding:12px;margin:0 0 6px}
.v2WsNext small{display:block;font-size:11.5px;font-weight:800;color:var(--v2-pri);text-transform:uppercase;letter-spacing:.04em}
.v2WsNext b{display:block;font-size:16px;margin:2px 0}.v2WsNext span{font-size:13px;color:var(--muted)}
.v2WsDone{border:1.5px solid var(--v2-pri);background:var(--v2-soft);border-radius:14px;padding:14px;margin:0 0 6px}
.v2WsDone b{font-size:18px;color:var(--v2-pri)}.v2WsDone p{margin:4px 0}.v2WsDone .nx{font-size:12.5px;color:var(--muted);margin-top:10px}
.v2WsH{font-size:14px;margin:16px 0 8px;display:flex;align-items:center;gap:8px}.v2WsH small{color:var(--muted);font-weight:700}
.v2ChkList{display:flex;flex-direction:column;gap:8px}
.v2Chk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:12px;cursor:pointer;min-height:56px}
.v2Chk .bx{flex:0 0 26px;width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;font-weight:900;font-size:15px;color:var(--v2-pri-ink)}
.v2Chk.on{border-color:var(--v2-soft-line);background:var(--v2-soft)}
.v2Chk.on .bx{background:var(--v2-pri);border-color:var(--v2-pri)}
.v2Chk .tx{flex:1;min-width:0}.v2Chk .tx b{display:block;font-size:14.5px}.v2Chk .tx b em{font-style:normal;font-weight:600;color:var(--muted);font-size:12px}
.v2Chk .tx small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:1px}
.v2Chk .go{flex:0 0 auto;color:var(--v2-pri);font-weight:800;font-size:12.5px}
.v2Chk.auto:disabled{opacity:1;cursor:default}
.v2WsLinks{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.v2WsLinks button{border:0;background:transparent;color:var(--v2-pri);font-weight:800;font-size:13px;padding:8px 4px;cursor:pointer}
.v2WsBar .v2Btn.idle{background:var(--card);color:var(--muted);border-color:var(--line)}
/* ===== K1a — yeni ana ekran (Kehribar) — yalnız .v2Home.hmx için ===== */
html:root:has(#app .v2Home.hmx){background:#2B2118}
html:root body:has(#app .v2Home.hmx){--hm-bg:#2B2118;--hm-card:#3A2D20;--hm-line:#54422D;--hm-ink:#F6ECDC;--hm-muted:#CDBB9F;--hm-pri:#F0B35A;--hm-chip:#4A3A27;--hm-chipLine:#6A5236;--hm-chipIcon:#F0B35A;background:#2B2118!important;color:#F6ECDC}
body:has(#app .v2Home.hmx) .v2Top{display:none!important}
body:has(#app .v2Home.hmx) nav.bottom{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:744px;margin:0 auto;border-radius:28px;background:var(--hm-card)!important;border:1px solid var(--hm-line);box-shadow:0 6px 18px rgba(40,20,5,.18);-webkit-backdrop-filter:none;backdrop-filter:none;padding-bottom:0;overflow:hidden}
body:has(#app .v2Home.hmx) .bottomInner .navBtn{color:var(--hm-muted)!important;white-space:nowrap}
body:has(#app .v2Home.hmx) .bottomInner .navBtn.active{color:var(--hm-chipIcon)!important;font-weight:800}

async function supabaseRequest(method,path,body=null){
 const o={method,headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Accept":"application/json","Prefer":"return=representation"}};
 if(body!==null)o.body=JSON.stringify(body);
 const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,o);
 const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){d=t}
 if(!r.ok)throw new Error(d?.message||d?.details||d?.hint||"Supabase işlemi başarısız.");
 return d;
}

/* Faz3-A2: Hizmet okumaları — giriş varsa kullanıcı token'ı ile (RLS sahiplik kuralları için), yoksa anon. */
async function supabaseReadAuth(method,path){
 try{await v2EnsureFreshToken();}catch(e){}
 const session=getAuthSession();
 const token=session&&session.access_token;
 if(!token)return supabaseRequest(method,path);
 const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{method,headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+token,"Accept":"application/json"}});
 if(r.status===401)return supabaseRequest(method,path);
 const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){d=t}
 if(!r.ok)throw new Error(d?.message||d?.details||d?.hint||"Supabase işlemi başarısız.");
 return d;
}

async function supabaseAuthRequest(method,path,body=null){

 if(body!==null)o.body=JSON.stringify(body);
 const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,o);
 const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){d=t}
 if(!r.ok)throw new Error(d?.message||d?.details||d?.hint||"Yetkili Supabase işlemi başarısız.");
 return d;
}

  const session=getAuthSession();
  const requireAuth=opts.requireAuth!==false; // default true for writes
  const token=(session&&session.access_token)?session.access_token:null;
  if(requireAuth&&!token){
    throw new Error('Bu işlem için giriş yapmalısınız. Çıkış yapıp tekrar giriş deneyin.');
  }
  const authToken=token||SUPABASE_KEY;
  const o={
    method:method,
    headers:{
      "apikey":SUPABASE_KEY,
      "Authorization":"Bearer "+authToken,
      "Content-Type":"application/json",
      "Accept":"application/json",
      "Prefer":"return=representation"
    }
  };
  if(body!==null&&body!==undefined)o.body=JSON.stringify(body);
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,o);
  const txt=await r.text();
  let d=null;try{d=txt?JSON.parse(txt):null;}catch(e){d=txt;}
  if(!r.ok){
    const msg=(d&&(d.message||d.details||d.hint))||("Supabase "+method+" başarısız ("+r.status+")");
    throw new Error(msg);
  }
  // Critical: HTTP 200 + [] means RLS blocked or no matching row — NOT success
  if((method==="PATCH"||method==="DELETE"||method==="POST")&&Array.isArray(d)&&d.length===0){
    throw new Error("Kayıt yazılamadı (0 satır). Oturum eşleşmiyor veya RLS UPDATE engelliyor. Talebin user_id alanının sizin hesabınıza ait olduğundan emin olun.");
  }
  return d;
}



/* A-paketi: sunucu fonksiyonu çağrısı. Fonksiyon henüz yoksa (404) {__missing:true} döner; eski akış yedek olarak çalışır. */
async function hzRpc(name,body){
  await v2EnsureFreshToken();
  const s=getAuthSession(),t=s&&s.access_token;
  if(!t)throw new Error('Bu işlem için giriş yapmalısın.');
  const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+t,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(body||{})});
  const txt=await r.text();let d=null;try{d=txt?JSON.parse(txt):null}catch(e){d=txt}
  if(r.status===404&&d&&(d.code==='PGRST202'||/function/i.test(String(d.message||''))))return {__missing:true};
  if(!r.ok)throw new Error((d&&(d.message||d.details||d.hint))||('İşlem başarısız ('+r.status+')'));
  return d;
}
function hzErrText(e){return String((e&&e.message)||e||'').replace(/^[A-Z_]+:\s*/,'')}

function normalize(v){
 return String(v??"").trim().toLowerCase()
 .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
 .replace(/ı/g,"i").replace(/İ/g,"i");
}
function pick(o,names,def=""){for(const n of names){if(o&&o[n]!==undefined&&o[n]!==null)return o[n]}return def}
function serviceKeyFromValue(v){
 const x=normalize(v);
 for(const [k,s] of Object.entries(SERVICES)){
  if(x===normalize(k)||x===normalize(s.name))return k;
 }
 return String(v??"").trim();
}

function getLocalJobState(){
  try{return JSON.parse(localStorage.getItem('isimi_coz_job_state')||'{}')||{};}catch(e){return {};}
}
function setLocalJobState(requestId,talepNo,patch){
  if(!requestId&&!talepNo)return;
  const all=getLocalJobState();
  const key=String(requestId||talepNo);
  const prev=all[key]||{};
  all[key]=Object.assign({},prev,patch||{},{requestId:requestId||prev.requestId||null,talepNo:talepNo||prev.talepNo||null,updatedAt:Date.now()});
  // also index by talep_no
  if(talepNo)all[String(talepNo)]=all[key];
  if(requestId)all[String(requestId)]=all[key];
  try{localStorage.setItem('isimi_coz_job_state',JSON.stringify(all));}catch(e){}
}
function readLocalJobState(requestId,talepNo){
  const all=getLocalJobState();
  return all[String(requestId||'') ]||all[String(talepNo||'') ]||null;
}
function applyLocalJobState(r){
  if(!r)return r;
  const loc=readLocalJobState(r.id,r.talep_no);
  if(!loc||!loc.status)return r;
  // Local wins for pilot when server still pending but user already accepted/completed in UI
  const server=String(r.status||r.durum||'').toLowerCase();
  const local=String(loc.status||'').toLowerCase();
  if(local==='completed'||local==='tamamlandı'||local.indexOf('tamam')>=0){
    r.status='Tamamlandı';r.durum='Tamamlandı';r._localJob=true;
  }else if(local==='accepted'||local==='devam ediyor'||local.indexOf('devam')>=0){
    if(server.indexOf('tamam')<0&&server!=='completed'){
      r.status='Devam ediyor';r.durum='Devam ediyor';r._localJob=true;
    }
  }
  if(loc.acceptedOfferId)r._acceptedOfferId=loc.acceptedOfferId;
  return r;
}

function statusToUI(st){
  const s=String(st||'pending').toLowerCase();
  if(s==='pending')return 'Beklemede';
  if(s==='accepted')return 'Devam ediyor';
  if(s==='completed')return 'Tamamlandı';
  if(s==='cancelled'||s==='canceled')return 'İptal';
  return st||'Beklemede';
}
function statusToDB(st){
  const s=String(st||'').toLowerCase();
  if(s.indexOf('bekle')>=0||s==='pending')return 'pending';
  if(s.indexOf('devam')>=0||s==='accepted')return 'accepted';
  if(s.indexOf('tamam')>=0||s==='completed')return 'completed';
  if(s.indexOf('iptal')>=0)return 'cancelled';
  return 'pending';
}
function encodeRequestDescription(talepNo,name,phone,city,text){
  return '§'+String(talepNo||'')+'§'+String(name||'')+'§'+String(phone||'')+'§'+String(city||'İzmir')+'§\n'+String(text||'');
}
function parseRequestDescription(raw){
  const s=String(raw||'');
  if(s.charAt(0)==='§'){
    const parts=s.split('§');
    if(parts.length>=6){
      return {talep_no:parts[1],ad_soyad:parts[2],telefon:parts[3],il:parts[4],aciklama:parts.slice(5).join('§').replace(/^\n/,'').trim()};
    }
  }
  return {talep_no:'',ad_soyad:'',telefon:'',il:'İzmir',aciklama:s};
}

function mapRequest(r){

 }

async function enrichProviders(providers){
 const [cats,links]=await Promise.all([loadCategories(),loadProviderCategories()]);
 const byId={};
 providers.forEach(p=>byId[String(p.id)]=p);

 links.forEach(link=>{
  const pid=pick(link,["provider_id","providers_id","provider"],"");
  const val=categoryValueFromRow(link,cats);
  if(byId[String(pid)]&&val)byId[String(pid)].services.push(serviceKeyFromValue(val));
 });

 providers.forEach(p=>{
  const direct=p.category;
  if(direct&&!p.services.length)p.services=[serviceKeyFromValue(direct)];
  p.services=[...new Set(p.services.filter(Boolean))];
 });
 return providers;
}

function providerMatchesRequest(p,r){
 if(!p.active)return false;
 const ps=(p.services||[]).map(serviceKeyFromValue);
 const rk=serviceKeyFromValue(r.kategori||r.service);
 const district=normalize(p.district),rd=normalize(r.ilce||r.district);
 const city=normalize(p.city),rc=normalize(r.il||"İzmir");
 const categoryOK=ps.length?ps.includes(rk):true;
 const districtOK=district?district===rd:true;
 const cityOK=!city||!rc||city===rc||city==="izmir";
 return categoryOK&&districtOK&&cityOK;
}

    dx=mx; if(i>=N&&dx<0) dx=0; if(i===0&&dx>0) dx=0;

async function kesfetEnsureCache(kind, force){
  if(kind!=='gayrimenkul'&&kind!=='otomobil') return;
  var has=__listingCache[kind]&&__listingCache[kind].length;
  if(!force&&has) return;
  if(force&&has&&(Date.now()-(__kesfetTS[kind]||0))<60000) return;   /* 60 sn içinde tekrar çekme: gereksiz ağ ve JSON işleme yok */
  if(__kesfetInflight[kind]) return __kesfetInflight[kind];
  __kesfetInflight[kind]=(async function(){
    try{
      var path=kind==='gayrimenkul'?
        "listings?listing_type=eq.gayrimenkul&status=eq.published&order=created_at.desc&select=id,title,price,currency,city,district,neighborhood,category,description,status,created_at,metadata":
        "listings?listing_type=eq.otomobil&status=eq.published&order=created_at.desc&select=id,title,price,currency,city,district,category,description,metadata,created_at";
      var rows=await supabaseRequest('GET',path);
      var bst=await v2LoadBoosts(); if(Array.isArray(rows)) rows.forEach(function(r){ r._boost=!!bst[String(r.id)]; });
      __listingCache[kind]=Array.isArray(rows)?rows:[]; __kesfetTS[kind]=Date.now();
    }finally{ __kesfetInflight[kind]=null; }
  })();
  return __kesfetInflight[kind];
}

/* Öne çıkan ilanlar (listing_boosts; yalnız admin/sistem yazar). Hata olursa sessizce boş döner, liste etkilenmez. */
var __v2Boosts={t:0,map:{}};
async function v2LoadBoosts(){
  if(Date.now()-__v2Boosts.t<60000) return __v2Boosts.map;
  var m={};
  try{ var now=new Date().toISOString();
    var rows=await supabaseRequest('GET','listing_boosts?select=listing_id&starts_at=lte.'+encodeURIComponent(now)+'&ends_at=gt.'+encodeURIComponent(now)+'&limit=500');
    if(Array.isArray(rows)) rows.forEach(function(x){ if(x&&x.listing_id) m[String(x.listing_id)]=1; });
  }catch(e){}
  __v2Boosts={t:Date.now(),map:m}; return m;
}
/* Varsayılan "en yeni" sıralamada öne çıkan ilanlar üstte; fiyat sıralamaları değişmez. */
function kesfetBuildList(keepCache){
  return kesfetBuildListRaw(keepCache).then(function(b){
    try{ var st=getListingFilterState(b.filterType)||{}; var sort=st.sort||'new';
      if(sort==='new'&&b.list.some(function(x){return x.row&&x.row._boost;})){
        b.list=b.list.filter(function(x){return x.row&&x.row._boost;}).concat(b.list.filter(function(x){return !(x.row&&x.row._boost);}));
      }
    }catch(e){}
    return b;
  });
}
function kesfetBuildListRaw(keepCache){
  var cat=window.__kesfetCat||'all';
  return (async function(){
    function dedupe(arr){ var seen={}; return arr.filter(function(x){ var k=x.type+':'+x.row.id; if(seen[k]) return false; seen[k]=1; return true; }); }
    if(cat==='konut'||cat==='arsa'||cat==='isyeri'||cat==='gayrimenkul'){
      await kesfetEnsureCache('gayrimenkul',!keepCache);
      var st=getListingFilterState('gayrimenkul')||{};
      if(cat==='konut') st.category='Konut'; else if(cat==='arsa') st.category='Arsa'; else if(cat==='isyeri') st.category='İş Yeri';
      return {list:dedupe(applyListingFiltersLocal('gayrimenkul',__listingCache.gayrimenkul).map(function(r){return {row:r,type:'gayrimenkul'};})),filterType:'gayrimenkul'};
    }
    if(cat==='otomobil'){
      await kesfetEnsureCache('otomobil',!keepCache);
      return {list:dedupe(applyListingFiltersLocal('otomobil',__listingCache.otomobil).map(function(r){return {row:r,type:'otomobil'};})),filterType:'otomobil'};
    }
    await kesfetEnsureCache('gayrimenkul',!keepCache);
    await kesfetEnsureCache('otomobil',!keepCache);
    var gm=applyListingFiltersLocal('gayrimenkul',__listingCache.gayrimenkul).map(function(r){return {row:r,type:'gayrimenkul'};});
    var ot=applyListingFiltersLocal('otomobil',__listingCache.otomobil).map(function(r){return {row:r,type:'otomobil'};});
    var list=dedupe(gm.concat(ot));
    var sort=getListingFilterState('gayrimenkul').sort||'new';
    list.sort(function(a,b){
      var pa=v2Num(a.row.price), pb=v2Num(b.row.price);
      if(sort==='price_asc') return (pa==null?Infinity:pa)-(pb==null?Infinity:pb);
      if(sort==='price_desc') return (pb==null?-Infinity:pb)-(pa==null?-Infinity:pa);
      return String(b.row.created_at||'').localeCompare(String(a.row.created_at||''));
    });
    return {list:list,filterType:'gayrimenkul'};
  })();
}

function kesfetAppliedChipDefs(type){
  var f=getListingFilterState(type)||{}, chips=[], cat=window.__kesfetCat||'all';
  function add(k,l){ if(l==null||l===''||l===false) return; chips.push({key:k,label:String(l)}); }
  function nf(x){ return Number(x).toLocaleString(V2_MARKET.locale); }
  function rng(a,b,suf){ suf=suf||''; if(a&&b) return nf(a)+' – '+nf(b)+suf; if(b) return '≤ '+nf(b)+suf; return '≥ '+nf(a)+suf; }
  if(f.q) add('q','🔎 '+f.q);
  if(f.deal) add('deal',f.deal==='satilik'?'Satılık':f.deal==='kiralik'?'Kiralık':f.deal);
  if(f.category&&!(cat==='konut'&&f.category==='Konut')&&!(cat==='arsa'&&f.category==='Arsa')&&!(cat==='isyeri'&&f.category==='İş Yeri')) add('category',f.category);
  if(f.city) add('city',f.city);
  if(f.district) add('district',f.district);
  if(f.neighborhood) add('neighborhood',f.neighborhood);
  if(f.brand) add('brand',f.brand);
  if(f.model) add('model',f.model);
  if(f.minYear||f.maxYear) add('year',(f.minYear&&f.minYear===f.maxYear)?f.minYear:(f.minYear&&f.maxYear)?(f.minYear+' – '+f.maxYear):f.minYear?(f.minYear+' ve üzeri'):(f.maxYear+' ve altı'));
  if(f.minKm||f.maxKm) add('km',rng(f.minKm,f.maxKm,' km'));
  if(f.fuel) add('fuel',f.fuel);
  if(f.gear) add('gear',f.gear);
  if(f.body) add('body',f.body);
  if(f.drive) add('drive',f.drive);
  if(f.seller_type) add('seller_type',f.seller_type==='professional'?'Profesyonel':f.seller_type==='individual'?'Bireysel':f.seller_type);
  if(f.rooms) add('rooms',f.rooms);
  if(f.minSqm||f.maxSqm) add('sqm',rng(f.minSqm,f.maxSqm,' '+V2_MARKET.units.area));
  if(f.zoning) add('zoning','İmar: '+f.zoning);
  if(f.minPrice||f.maxPrice) add('price',rng(f.minPrice,f.maxPrice,' '+v2Cur()));
  var adv=(V2_ADV.otomobil||[]).concat(V2_ADV.gayrimenkul||[]);
  Object.keys(f).forEach(function(k){
    if(k.indexOf('x_')!==0||!f[k]) return;
    var sp=adv.filter(function(a){return a.k===k;})[0]; add(k,(sp?sp.l+': ':'')+f[k]);
  });
  return chips;
}

function myListingStatusMeta(status,row){

  if(s==='draft'){ const rv=row&&row.metadata&&row.metadata.pf_review; if(rv==='pending') return {label:'İncelemede', emoji:'⏳', key:'draft', review:'pending'}; if(rv==='rejected') return {label:'Reddedildi', emoji:'⛔', key:'draft', review:'rejected'}; }
  if(s==='published') return {label:'Yayında', emoji:'🟢', key:'published'};
  if(s==='passive'||s==='paused'||s==='archived') return {label:'Yayında değil', emoji:'⏸️', key:'passive'};
  if(s==='sold') return {label:'Satıldı', emoji:'🏷️', key:'sold'};

function myListingMissingHints(row){
  const miss=[];
  if(!row) return miss;
  if(!(row.title||'').trim()) miss.push('Başlık');
  const photos=typeof listingPhotosFromRow==='function'?listingPhotosFromRow(row):[];
  if(!photos.length) miss.push('Fotoğraf');
  if(row.listing_type==='otomobil'){
    const m=row.metadata||{};
    if(!(m.brand||'').toString().trim()) miss.push('Marka');
    if(!(m.model||'').toString().trim()) miss.push('Model');
  }else{
    if(!(row.city||'').trim()) miss.push('İl');
    if(!(row.district||'').trim()) miss.push('İlçe');
  }
  return miss;
}
function myListingTxnHint(row){
  var st=myListingStatusMeta(row&&row.status,row);
  if(st.review==='pending') return {emoji:'⏳',label:'Onay bekliyor'};
  if(st.review==='rejected') return {emoji:'⛔',label:'Düzeltme gerekiyor'};
  if(st.key==='draft') return {emoji:'📋',label:'İlan tamamlanmadı'};
  if(st.key==='passive') return {emoji:'📋',label:'Yayında değil'};
  if(st.key==='published'){ var t0=(row&&row.listing_type==='otomobil')?'otomobil':'gayrimenkul', pr0=v2WsProgress(row,t0); if(pr0.completed) return {emoji:'✅',label:'Hazırlık tamamlandı'}; if(pr0.started&&pr0.docDone>0) return {emoji:'📋',label:'Hazırlık %'+pr0.pct}; return {emoji:'📋',label:(t0==='otomobil')?'Devir hazırlığı başlamadı':'Satış hazırlığı başlamadı'}; }
  if(st.key==='sold'||st.key==='rented') return {emoji:'✅',label:'İşlem tamamlandı'};
  return {emoji:'📋',label:'İşlem başlamadı'};

  if(st.key==='published') more.push(['⏸ Yayından kaldır',"v2SetListingStatus('"+id+"','"+type+"','passive')"]);

/* İlan fotoğrafını yüklemeden önce tarayıcıda küçült (uzun kenar en fazla 1600 px, WEBP; desteklenmezse JPEG).
   GIF ve küçültülemeyen dosyalar olduğu gibi gider; sonuç büyükse orijinal kullanılır. */
async function shrinkListingPhoto(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type||''))return file;
  try{
    const img=await new Promise(function(res,rej){const i=new Image();i.onload=function(){res(i)};i.onerror=rej;i.src=URL.createObjectURL(file);});
    const sc=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    const w=Math.max(1,Math.round(img.naturalWidth*sc)),h=Math.max(1,Math.round(img.naturalHeight*sc));
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(img.src);
    let out=await new Promise(function(r){cv.toBlob(function(b){r(b)},'image/webp',0.82)});
    if(!out||out.type!=='image/webp')out=await new Promise(function(r){cv.toBlob(function(b){r(b)},'image/jpeg',0.85)});
    if(out&&out.size>0&&out.size<file.size)return out;
  }catch(e){}
  return file;
}
async function uploadListingPhoto(ownerId, listingId, file, token){
  if(!file||!token)throw new Error('Fotoğraf yükleme için giriş gerekli.');
  if(!(file.type&&file.type.indexOf('image/')===0))throw new Error('Sadece görsel dosyaları yüklenebilir.');
  const small=await shrinkListingPhoto(file);
  if(small!==file){const ext=small.type==='image/webp'?'.webp':'.jpg';file=new File([small],String(file.name||'photo').replace(/\.[^.]*$/,'')+ext,{type:small.type});}
  if(file.size>5*1024*1024)throw new Error('Her fotoğraf en fazla 5 MB olabilir.');
  const safeName=String(file.name||'photo.jpg').replace(/[^a-zA-Z0-9._-]/g,'_').slice(0,80)||'photo.jpg';
  const path=ownerId+'/'+listingId+'/'+Date.now()+'-'+safeName;
  const safePath=path.split('/').filter(Boolean).map(encodeURIComponent).join('/');
  const url=SUPABASE_URL+'/storage/v1/object/listing-photos/'+safePath;
  const res=await fetch(url,{
    method:'POST',
    headers:{
      'Authorization':'Bearer '+token,
      'apikey':SUPABASE_KEY,
      'Content-Type':file.type||'image/jpeg',
      'x-upsert':'false'
    },
    body:file
  });
  const text=await res.text();
  if(!res.ok){
    let d=null;try{d=text?JSON.parse(text):null;}catch(e){}
    throw new Error((d&&(d.message||d.error))||('Fotoğraf yüklenemedi (HTTP '+res.status+')'));
  }
  return {path:path, name:safeName, size:file.size, type:file.type||'image/jpeg'};
}

function normalizeListingText(v){
  try{
    return String(v==null?'':v)
      .toLocaleLowerCase('tr-TR')
      .replace(/\s+/g,' ')
      .trim();
  }catch(e){
    return String(v==null?'':v).toLowerCase().replace(/\s+/g,' ').trim();
  }
}
function listingMatchesSearch(row,q){
  const s=normalizeListingText(q);
  if(!s) return true;
  const md=(row&&row.metadata)||{};
  const bag=normalizeListingText([
    row&&row.title,
    row&&row.description,
    row&&row.category,
    row&&row.city,
    row&&row.district,
    row&&row.neighborhood,
    md.brand, md.model, md.version, md.fuel, md.gear, md.body, md.color,
    md.vehicle_type, md.property_kind, md.drive, md.condition
  ].join(' '));
  return bag.indexOf(s)>=0;
}
function applyListingFiltersLocal(type, rows){
  var f=getListingFilterState(type)||{};
  var list=(rows||[]).filter(function(row){
    if(!listingMatchesSearch(row,f.q)) return false;
    var md=(row&&row.metadata)||{};
    var price=v2Num(row.price), minP=v2Num(f.minPrice), maxP=v2Num(f.maxPrice);
    if(minP!=null&&(price==null||price<minP)) return false;
    if(maxP!=null&&(price==null||price>maxP)) return false;
    if(f.city&&normalizeListingText(row.city)!==normalizeListingText(f.city)) return false;
    if(f.district&&normalizeListingText(row.district)!==normalizeListingText(f.district)) return false;
    if(type==='gayrimenkul'){
      if(f.category&&normalizeListingText(row.category)!==normalizeListingText(f.category)) return false;
      if(f.deal&&normalizeListingText(md.deal_type)!==normalizeListingText(f.deal)) return false;
      if(f.neighborhood&&normalizeListingText(row.neighborhood)!==normalizeListingText(f.neighborhood)) return false;
      if(f.rooms&&normalizeListingText(md.rooms||'')!==normalizeListingText(f.rooms)) return false;
      if(f.zoning&&normalizeListingText(md.zoning||md.imar||'')!==normalizeListingText(f.zoning)) return false;
      var sqm=v2Num(md.sqm||md.m2||md.area), minS=v2Num(f.minSqm), maxS=v2Num(f.maxSqm);
      if(minS!=null&&(sqm==null||sqm<minS)) return false;
      if(maxS!=null&&(sqm==null||sqm>maxS)) return false;
    }
    if(type==='otomobil'){
      if(f.brand&&normalizeListingText(md.brand).indexOf(normalizeListingText(f.brand))<0) return false;
      if(f.model&&normalizeListingText(md.model).indexOf(normalizeListingText(f.model))<0) return false;
      var y=v2Num(md.year), km=v2Num(md.km), minY=v2Num(f.minYear), maxY=v2Num(f.maxYear), minK=v2Num(f.minKm), maxK=v2Num(f.maxKm);
      if(minY!=null&&(y==null||y<minY)) return false;
      if(maxY!=null&&(y==null||y>maxY)) return false;
      if(minK!=null&&(km==null||km<minK)) return false;
      if(maxK!=null&&(km==null||km>maxK)) return false;
      if(f.fuel&&normalizeListingText(md.fuel)!==normalizeListingText(f.fuel)) return false;
      if(f.gear&&normalizeListingText(md.gear)!==normalizeListingText(f.gear)) return false;
      if(f.body&&normalizeListingText([md.body,md.vehicle_type,row.category].filter(Boolean).join(' ')).indexOf(normalizeListingText(f.body))<0) return false;
      if(f.drive&&normalizeListingText(md.drive)!==normalizeListingText(f.drive)) return false;
      if(f.seller_type&&normalizeListingText(md.seller_type)!==normalizeListingText(f.seller_type)) return false;
    }
    var bad=false;
    Object.keys(f).forEach(function(k){
      if(bad||k.indexOf('x_')!==0||!f[k]) return;
      if(normalizeListingText(md[k.slice(2)])!==normalizeListingText(f[k])) bad=true;
    });
    return !bad;
  });
  var sort=f.sort||'new';
  function asc(a,b){ var x=a==null?Infinity:a, y=b==null?Infinity:b; return x-y; }
  function desc(a,b){ var x=a==null?-Infinity:a, y=b==null?-Infinity:b; return y-x; }
  list.sort(function(a,b){
    var am=a.metadata||{}, bm=b.metadata||{};
    if(sort==='price_asc') return asc(v2Num(a.price),v2Num(b.price));
    if(sort==='price_desc') return desc(v2Num(a.price),v2Num(b.price));
    if(sort==='year_desc'&&type==='otomobil') return desc(v2Num(am.year),v2Num(bm.year));
    if(sort==='km_asc'&&type==='otomobil') return asc(v2Num(am.km),v2Num(bm.km));
    if(sort==='sqm_desc'&&type==='gayrimenkul') return desc(v2Num(am.sqm||am.m2||am.area),v2Num(bm.sqm||bm.m2||bm.area));
    return String(b.created_at||'').localeCompare(String(a.created_at||''));
  });
  return list;
}

function closeGmPhotoViewer(){
  const el=document.getElementById('gmPhotoViewer');
  if(el) el.remove();
  try{ document.body.style.overflow=''; }catch(e){}
  __gmViewer.open=false;
  __gmViewer.scale=1; __gmViewer.tx=0; __gmViewer.ty=0;
}

function gmViewerApplyTransform(){
  const img=document.getElementById('gmViewerImg');
  if(!img) return;
  img.style.transform='translate('+__gmViewer.tx+'px,'+__gmViewer.ty+'px) scale('+__gmViewer.scale+')';
}

function gmViewerShowIndex(i){
  const urls=__gmViewer.urls||[];
  if(!urls.length) return;
  __gmViewer.index=((i%urls.length)+urls.length)%urls.length;
  __gmViewer.scale=1; __gmViewer.tx=0; __gmViewer.ty=0;
  const img=document.getElementById('gmViewerImg');
  const counter=document.getElementById('gmViewerCounter');
  if(img){
    img.src=urls[__gmViewer.index];
    img.style.transform='translate(0px,0px) scale(1)';
  }
  if(counter) counter.textContent=(__gmViewer.index+1)+' / '+urls.length;
}

function gmViewerNav(delta){
  gmViewerShowIndex(__gmViewer.index+delta);
}

function openGmPhotoViewer(urls, startIndex){
  const list=(urls||[]).filter(Boolean).map(String);
  if(!list.length) return;
  closeGmPhotoViewer();
  __gmViewer.urls=list;
  __gmViewer.index=Math.max(0, Math.min(Number(startIndex)||0, list.length-1));
  __gmViewer.open=true;
  __gmViewer.scale=1; __gmViewer.tx=0; __gmViewer.ty=0;
  try{ document.body.style.overflow='hidden'; }catch(e){}
  const wrap=document.createElement('div');
  wrap.id='gmPhotoViewer';
  wrap.setAttribute('role','dialog');
  wrap.setAttribute('aria-modal','true');
  wrap.style.cssText='position:fixed;inset:0;z-index:2147483000;background:rgba(0,0,0,.94);display:flex;flex-direction:column;touch-action:none;';
  wrap.innerHTML=
    '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;color:#fff;flex-shrink:0">'+
      '<span id="gmViewerCounter" style="font-size:14px;opacity:.9"></span>'+
      '<button type="button" id="gmViewerClose" style="border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:999px;width:40px;height:40px;font-size:20px;cursor:pointer">×</button>'+
    '</div>'+
    '<div id="gmViewerStage" style="flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none">'+
      '<img id="gmViewerImg" alt="" draggable="false" style="max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center;will-change:transform;user-select:none;-webkit-user-drag:none;"/>'+
    '</div>'+
    '<div style="display:flex;gap:10px;justify-content:center;padding:12px;flex-shrink:0">'+
      '<button type="button" id="gmViewerPrev" class="btn secondary smallBtn" style="min-width:44px">‹</button>'+
      '<button type="button" id="gmViewerNext" class="btn secondary smallBtn" style="min-width:44px">›</button>'+
    '</div>';
  document.body.appendChild(wrap);
  document.getElementById('gmViewerClose').onclick=function(e){ e.preventDefault(); e.stopPropagation(); closeGmPhotoViewer(); };
  document.getElementById('gmViewerPrev').onclick=function(e){ e.preventDefault(); e.stopPropagation(); gmViewerNav(-1); };
  document.getElementById('gmViewerNext').onclick=function(e){ e.preventDefault(); e.stopPropagation(); gmViewerNav(1); };
  wrap.addEventListener('click', function(e){ if(e.target===wrap||e.target.id==='gmViewerStage') closeGmPhotoViewer(); });
  gmViewerShowIndex(__gmViewer.index);

  const stage=document.getElementById('gmViewerStage');
  let pointers=new Map();
  let lastDist=0;
  let panX=0, panY=0, startTx=0, startTy=0, startScale=1;
  let mode='none';

  function dist(a,b){
    const dx=a.clientX-b.clientX, dy=a.clientY-b.clientY;
    return Math.sqrt(dx*dx+dy*dy);
  }

  stage.addEventListener('pointerdown', function(e){
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, e);
    if(pointers.size===1){
      mode='pan';
      panX=e.clientX; panY=e.clientY;
      startTx=__gmViewer.tx; startTy=__gmViewer.ty; startScale=__gmViewer.scale;
    }else if(pointers.size===2){
      mode='pinch';
      const pts=Array.from(pointers.values());
      lastDist=dist(pts[0], pts[1]);
      startScale=__gmViewer.scale;
    }
  });
  stage.addEventListener('pointermove', function(e){
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, e);
    if(mode==='pinch' && pointers.size>=2){
      const pts=Array.from(pointers.values());
      const d=dist(pts[0], pts[1]);
      if(lastDist>0){
        let s=startScale*(d/lastDist);
        s=Math.max(1, Math.min(4, s));
        __gmViewer.scale=s;
        if(s===1){ __gmViewer.tx=0; __gmViewer.ty=0; }
        gmViewerApplyTransform();
      }
    }else if(mode==='pan' && pointers.size===1 && __gmViewer.scale>1){
      const dx=e.clientX-panX, dy=e.clientY-panY;
      __gmViewer.tx=startTx+dx;
      __gmViewer.ty=startTy+dy;
      gmViewerApplyTransform();
    }
  });
  function endPtr(e){
    pointers.delete(e.pointerId);
    if(pointers.size<2) lastDist=0;
    if(pointers.size===0){
      mode='none';
      if(__gmViewer.scale<=1.05){ __gmViewer.scale=1; __gmViewer.tx=0; __gmViewer.ty=0; gmViewerApplyTransform(); }
    }else if(pointers.size===1){
      mode='pan';
      const p=Array.from(pointers.values())[0];
      panX=p.clientX; panY=p.clientY;
      startTx=__gmViewer.tx; startTy=__gmViewer.ty; startScale=__gmViewer.scale;
    }
  }
  stage.addEventListener('pointerup', endPtr);
  stage.addEventListener('pointercancel', endPtr);
  stage.addEventListener('wheel', function(e){
    e.preventDefault();
    const delta=e.deltaY>0?-0.15:0.15;
    __gmViewer.scale=Math.max(1, Math.min(4, __gmViewer.scale+delta));
    if(__gmViewer.scale===1){ __gmViewer.tx=0; __gmViewer.ty=0; }
    gmViewerApplyTransform();
  }, {passive:false});
}

function bindListingDetailCarousel(root, urls){
  const el=root&&root.querySelector('[data-ld-carousel]');
  const list=(urls||[]).filter(Boolean);
  if(!el||!list.length) return;
  function show(i){
    const n=list.length;
    const idx=((Number(i)||0)%n+n)%n;
    el.setAttribute('data-ld-index', String(idx));
    const img=el.querySelector('[data-ld-img]');
    const openBtn=el.querySelector('[data-gm-photo-idx]');
    if(img) img.src=list[idx];
    if(openBtn) openBtn.setAttribute('data-gm-photo-idx', String(idx));
    const c=el.querySelector('[data-ld-count]');
    if(c) c.textContent=(idx+1)+' / '+n;
    const dots=el.querySelectorAll('[data-ld-dot]');
    for(let d=0;d<dots.length;d++) dots[d].className=d===idx?'on':'';
  }
  el.querySelectorAll('[data-ld-nav]').forEach(function(btn){
    btn.addEventListener('click', function(ev){
      ev.preventDefault(); ev.stopPropagation();
      const cur=Number(el.getAttribute('data-ld-index')||0);
      show(cur+Number(btn.getAttribute('data-ld-nav')||0));
    });
  });
  el.querySelectorAll('[data-ld-dot]').forEach(function(dot){
    dot.addEventListener('click', function(ev){
      ev.preventDefault();
      show(Number(dot.getAttribute('data-ld-dot')||0));
    });
  });
  let x0=null;
  const stage=el.querySelector('.ldCarouselStage');
  if(stage&&list.length>1){
    stage.addEventListener('touchstart', function(e){ if(e.touches&&e.touches[0]) x0=e.touches[0].clientX; }, {passive:true});
    stage.addEventListener('touchend', function(e){
      if(x0==null||!e.changedTouches||!e.changedTouches[0]) return;
      const dx=e.changedTouches[0].clientX-x0; x0=null;
      if(Math.abs(dx)<40) return;
      const cur=Number(el.getAttribute('data-ld-index')||0);
      show(cur+(dx<0?1:-1));
    }, {passive:true});
  }
}

// A3.1-only write helper (does not modify global supabaseWrite)
async function listingsAuthWrite(method, path, body){
  await v2EnsureFreshToken();
  const session=typeof getAuthSession==='function'?getAuthSession():null;
  const token=session&&(session.access_token||session.accessToken);
  const uid=session&&session.user&&(session.user.id||session.user.user_id);
  if(!token){
    throw new Error('Oturum token bulunamadı. Çıkış yapıp tekrar giriş yapın.');
  }
  if(!uid){
    throw new Error('Kullanıcı kimliği bulunamadı. Çıkış yapıp tekrar giriş yapın.');
  }
  const headers={
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+token,
    "Content-Type":"application/json",
    "Accept":"application/json",
    "Prefer":"return=representation"
  };
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{
    method:method,
    headers:headers,
    body:(body!==null&&body!==undefined)?JSON.stringify(body):undefined
  });
  const txt=await r.text();
  let d=null; try{d=txt?JSON.parse(txt):null;}catch(e){d=txt;}
  if(!r.ok){
    const msg=(d&&(d.message||d.error_description||d.details||d.hint))||("Supabase "+method+" başarısız ("+r.status+")");
    throw new Error(msg);
  }
  if((method==="POST"||method==="PATCH")&&Array.isArray(d)&&d.length===0){
    throw new Error("Kayıt yazılamadı (0 satır döndü). JWT ile owner_id eşleşmesini kontrol edin.");
  }
  return {data:d, uid:uid, token:token};
}


function gmCollectFormDraft(){
  const ids=['gmTitle','gmDesc','gmDealType','gmCategory','gmRooms','gmBuildingAge','gmFloor','gmHeating','gmBaths','gmBalcony','gmElevator','gmParking','gmFurnished','gmSite','gmUsage','gmSqm','gmArsaSqm','gmZoning','gmPrice','gmCurrency','gmCity','gmDistrict','gmNeighborhood','gmPhone','gmWa'];
  const d={};
  ids.forEach(function(id){
    const el=document.getElementById(id);
    d[id]=el?String(el.value||''):'';
  });
  const fi=document.getElementById('gmPhotos');
  d._files=fi&&fi.files?Array.from(fi.files):[];
  try{
    const slim=Object.assign({}, d);
    delete slim._files;
    localStorage.setItem('gm_listing_form_draft', JSON.stringify({data:slim, title:slim.gmTitle||'', ts:Date.now()}));
  }catch(e){}
  return d;
}
function gmApplyFormDraft(d){
  if(!d) return;
  Object.keys(d).forEach(function(id){
    if(id==='_files') return;
    const el=document.getElementById(id);
    if(el&&d[id]!=null) el.value=d[id];
  });
  try{ if(typeof gmOnCategoryChange==='function') gmOnCategoryChange(); }catch(e){}
  const fi=document.getElementById('gmPhotos');
  if(fi&&d._files&&d._files.length&&typeof DataTransfer!=='undefined'){
    try{
      const dt=new DataTransfer();
      d._files.forEach(function(f){ try{ dt.items.add(f); }catch(e){} });
      fi.files=dt.files;
    }catch(e){}
  }
}

async function createGayrimenkulListing(){
  const session=typeof getAuthSession==='function'?getAuthSession():null;
  const uid=session&&session.user&&(session.user.id||session.user.user_id);
  const token=session&&(session.access_token||session.accessToken);
  if(!session||!uid||!token){
    alert('Giriş gerekli. Oturum veya token eksik; çıkış yapıp tekrar giriş yapın.');
    return showGayrimenkulCreateForm();
  }
  const title=(document.getElementById('gmTitle')?.value||'').trim();
  const description=(document.getElementById('gmDesc')?.value||'').trim();
  const category=(document.getElementById('gmCategory')?.value||'').trim();
  const priceRaw=(document.getElementById('gmPrice')?.value||'').trim();
  const currency=(document.getElementById('gmCurrency')?.value||'TRY').trim()||'TRY';
  const city=(document.getElementById('gmCity')?.value||'').trim();
  const district=(document.getElementById('gmDistrict')?.value||'').trim();
  const neighborhood=(document.getElementById('gmNeighborhood')?.value||'').trim();
  const fileInput=document.getElementById('gmPhotos');
  const files=fileInput&&fileInput.files?Array.from(fileInput.files):[];
  if(!title){ alert('Başlık zorunlu.'); return; }
  if(!category){ alert('Tür seçin.'); return; }
  if(!city){ alert('İl seçin.'); return; }
  if(!district){ alert('İlçe seçin.'); return; }
  if(files.length>8){ alert('En fazla 8 fotoğraf yükleyebilirsin.'); return; }
  let price=null;
  if(priceRaw!==''){
    price=Number(priceRaw);
    if(!isFinite(price)||price<0){ alert('Geçerli bir fiyat girin.'); return; }
  }
  const btn=document.getElementById('gmSaveBtn');
  if(Date.now()-(window.__gmCreatingAt||0)<4000) return; window.__gmCreatingAt=Date.now();
  if(btn){ btn.disabled=true; btn.textContent='Kaydediliyor…'; }
  try{
    const catRaw=(document.getElementById('gmCategory')?.value||category||'').trim();
    const catParts=catRaw.split('|');
    const categoryMain=catParts[0]||'Konut';
    const subtype=catParts[1]||'';
    const deal=(document.getElementById('gmDealType')?.value||'').trim();
    const metaExtra={
      source: 'a3.1',
      property_kind: categoryMain,
      property_subtype: subtype||null,
      deal_type: deal||null,
      rooms: (document.getElementById('gmRooms')?.value||'').trim()||null,
      building_age: (document.getElementById('gmBuildingAge')?.value||'').trim()||null,
      floor: (document.getElementById('gmFloor')?.value||'').trim()||null,
      heating: (document.getElementById('gmHeating')?.value||'').trim()||null,
      baths: (document.getElementById('gmBaths')?.value||'').trim()||null,
      balcony: (document.getElementById('gmBalcony')?.value||'').trim()||null,
      elevator: (document.getElementById('gmElevator')?.value||'').trim()||null,
      parking: (document.getElementById('gmParking')?.value||'').trim()||null,
      furnished: (document.getElementById('gmFurnished')?.value||'').trim()||null,
      in_site: (document.getElementById('gmSite')?.value||'').trim()||null,
      usage_status: (document.getElementById('gmUsage')?.value||'').trim()||null,
      sqm: (document.getElementById('gmSqm')?.value||document.getElementById('gmArsaSqm')?.value||'').trim()||null,
      zoning: (document.getElementById('gmZoning')?.value||'').trim()||null,
      phone: (document.getElementById('gmPhone')?.value||'').trim()||null,
      whatsapp: ((document.getElementById('gmWa')?.value||'')==='1'&&(document.getElementById('gmPhone')?.value||'').trim())?(document.getElementById('gmPhone').value.trim()):null,
      photos: []
    };
    const body={
      owner_id: uid,
      listing_type: 'gayrimenkul',
      category: categoryMain,
      title: title,
      description: description||null,
      price: price,
      currency: currency,
      city: city,
      district: district,
      neighborhood: neighborhood||null,
      status: 'draft',
      metadata: metaExtra
    };
    const out=await listingsAuthWrite('POST','listings',body);
    const res=out.data;
    const row=Array.isArray(res)?res[0]:res;
    if(!row||!row.id) throw new Error('Kayıt oluşturulamadı.');

    // Photos after listing exists (path isolated by owner_id/listing_id)
    const uploaded=[];
    const failed=[];
    if(files.length){
      if(btn) btn.textContent='Fotoğraflar yükleniyor…';
      for(let i=0;i<files.length;i++){
        try{
          const meta=await uploadListingPhoto(uid, row.id, files[i], token);
          uploaded.push(meta);
        }catch(pe){
          failed.push((files[i]&&files[i].name?files[i].name:'foto')+': '+(pe&&pe.message?pe.message:String(pe)));
        }
      }
      if(uploaded.length){
        try{
          const md=Object.assign({}, row.metadata||{}, {
            source: 'a3.1',
            property_kind: categoryMain,
            photos: uploaded
          });
          const patch=await listingsAuthWrite(
            'PATCH',
            'listings?id=eq.'+encodeURIComponent(row.id),
            { metadata: md }
          );
          const patched=Array.isArray(patch.data)?patch.data[0]:patch.data;
          if(patched) Object.assign(row, patched);
          else row.metadata=md;
        }catch(me){
          failed.push('Fotoğraf kaydı güncellenemedi: '+(me&&me.message?me.message:String(me)));
        }
      }
    }
    clearGmListingFormDraft();
    showGayrimenkulDraftResult(row, {uploaded:uploaded.length, failed:failed});
  }catch(err){
    alert(err&&err.message?err.message:String(err));
    if(btn){ btn.disabled=false; btn.textContent='Taslak olarak kaydet'; }
  }
}

/* === V1 ANLAMA PAKETİ (araç ilanı, izole) === */
function parseOtoFreeText(str){
  const raw=String(str||'').trim();
  const partial={};
  const notes=[];
  if(!raw) return {partial:partial, notes:notes, raw:raw};
  const lower=raw.toLocaleLowerCase('tr-TR');

  // Yıl
  let ym=raw.match(/\b(19[5-9]\d|20[0-3]\d)\b/);
  if(ym) partial.year=ym[1];

  // KM: 45 bin, 45000, 45.000, 45bin
  let km=null;
  let m=lower.match(/(\d{1,3}(?:[.\s]\d{3})+|\d+)\s*(bin)?\s*km\b/);
  if(m){
    let n=m[1].replace(/[.\s]/g,'');
    km=parseInt(n,10);
    if(m[2]) km=km*1000;
  }else{
    m=lower.match(/(\d{1,3})\s*bin(?:\s*km)?\b/);
    if(m) km=parseInt(m[1],10)*1000;
  }
  if(km!=null&&isFinite(km)&&km>=0) partial.km=String(km);

  // Marka — katalogdan en uzun eşleşme
  try{
    const brands=typeof otoCatalogBrands==='function'?otoCatalogBrands():Object.keys(OTO_CATALOG||{});
    let best='';
    brands.forEach(function(b){
      if(!b||b==='Diğer') return;
      const bl=b.toLocaleLowerCase('tr-TR');
      if(lower.indexOf(bl)>=0 && bl.length>best.length) best=b;
    });
    // sık kısaltmalar
    if(!best){
      if(/\bbmw\b/i.test(raw)) best='BMW';
      else if(/\bvw\b|\bvolkswagen\b/i.test(raw)) best='Volkswagen';
      else if(/\bmercedes\b|\bbenz\b/i.test(raw)) best='Mercedes-Benz';
    }
    if(best) partial.brand=best;
  }catch(e){}

  // Model + version — yalnızca katalog kesin eşleşmesi
  try{
    if(partial.brand&&OTO_CATALOG[partial.brand]){
      const models=OTO_CATALOG[partial.brand];
      let foundModel='', foundVer='';
      Object.keys(models).forEach(function(mod){
        const ml=mod.toLocaleLowerCase('tr-TR');
        if(ml.length>=2 && lower.indexOf(ml)>=0){
          if(mod.length>=foundModel.length){ foundModel=mod; }
        }
        const vers=models[mod]||[];
        vers.forEach(function(v){
          if(!v) return;
          const vl=String(v).toLocaleLowerCase('tr-TR');
          // kelime sınırı benzeri: 320i, 1.5 tsi
          const re=new RegExp('(?:^|[^a-z0-9])'+vl.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?:[^a-z0-9]|$)','i');
          if(re.test(lower) || lower.indexOf(vl)>=0){
            if(String(v).length>=String(foundVer).length){
              foundVer=v;
              if(!foundModel) foundModel=mod;
            }
          }
        });
      });
      if(foundModel) partial.model=foundModel;
      if(foundVer) partial.version=foundVer;
    }
  }catch(e){}

  // 320i vb. version eşleşti ama model yoksa not
  if(!partial.model && partial.version){
    notes.push('Versiyon: '+partial.version+' (model seçimini formdan kontrol et)');
  }

  // Renk
  try{
    const colors=(typeof OTO_COLORS!=='undefined'?OTO_COLORS:[]).filter(Boolean);
    colors.forEach(function(c){
      if(c==='Diğer') return;
      if(lower.indexOf(c.toLocaleLowerCase('tr-TR'))>=0) partial.color=c;
    });
  }catch(e){}

  // Vites
  if(/\botomatik\b/.test(lower)) partial.gear='Otomatik';
  else if(/\bmanuel\b/.test(lower)) partial.gear='Manuel';
  else if(/yar[iı]\s*otomatik/.test(lower)) partial.gear='Yarı otomatik';

  // Yakıt
  if(/\bbenzin\b/.test(lower)) partial.fuel='Benzin';
  else if(/\bdizel\b|\bdiesel\b/.test(lower)) partial.fuel='Dizel';
  else if(/\blpg\b/.test(lower)) partial.fuel='LPG';
  else if(/\bhibrit\b|\bhybrid\b/.test(lower)) partial.fuel='Hibrit';
  else if(/\belektrik/.test(lower)) partial.fuel='Elektrik';

  // Çekiş
  if(/\b4x4\b/.test(lower)) partial.drive='4x4';
  else if(/\bawd\b/.test(lower)) partial.drive='AWD';
  else if(/önden|onden/.test(lower)) partial.drive='Önden';
  else if(/arkadan/.test(lower)) partial.drive='Arkadan';

  // Kasa
  try{
    const bodies=(typeof OTO_BODY_TYPES!=='undefined'?OTO_BODY_TYPES:[]).filter(Boolean);
    bodies.forEach(function(b){
      if(b==='Diğer') return;
      if(lower.indexOf(b.toLocaleLowerCase('tr-TR'))>=0) partial.body=b;
    });
  }catch(e){}

  // Kondisyon
  if(/\bs[iı]f[iı]r\b/.test(lower)) partial.condition='Sıfır';
  else if(/ikinci\s*el|2\.\s*el/.test(lower)) partial.condition='İkinci el';

  // Hasar — çelişkide sessizce birini silme
  const hasHasarsiz=/hasars[iı]z/.test(lower);
  const hasHasarKaydi=/hasar\s*kayd[iı]/.test(lower)||(/hasarl[iı]/.test(lower)&&!hasHasarsiz);
  if(hasHasarsiz&&hasHasarKaydi){
    notes.push('Çelişki: hem hasarsız hem hasar ifadesi var — formdan netleştir');
    partial.damage='Hasarsız';
    notes.push('Hasar (alternatif): Hasar kaydı var');
  }else if(hasHasarsiz) partial.damage='Hasarsız';
  else if(hasHasarKaydi) partial.damage='Hasar kaydı var';

  // Boya — katalog değerleri
  if(/boyas[iı]z/.test(lower)) partial.paint='Boyasız';
  else if(/tamamen\s*boyal[iı]/.test(lower)) partial.paint='Tamamen boyalı';
  else if(/k[iı]smi\s*boyal[iı]|lokal\s*boyal[iı]/.test(lower)) partial.paint='Kısmi boyalı';
  // serbest boya ifadesi (kapı vs.) — katalog dışı, not olarak
  const paintFree=raw.match(/(sa[gğ]\s*ön\s*kap[iı][^\n,]{0,40}boya[^\n,]{0,20}|sol\s*ön\s*kap[iı][^\n,]{0,40}boya[^\n,]{0,20}|kap[iı]da\s*boya[^\n,]{0,20}|boya\s*var[^\n,]{0,30})/i);
  if(paintFree){
    notes.push('Boya notu: '+paintFree[0].trim());
    if(!partial.paint) partial.paint='Kısmi boyalı'; // yumuşak eşleme: kapıda boya ≈ kısmi; kullanıcı onaylar
  }

  // Değişen parça
  if(/de[gğ]i[sş]en\s*par[cç]a\s*yok|par[cç]a\s*de[gğ]i[sş]memi[sş]/.test(lower)) partial.changed_parts='Yok';
  else if(/de[gğ]i[sş]en\s*par[cç]a/.test(lower)) partial.changed_parts='Var';

  // Servis / muayene / garanti
  if(/yetkili\s*servis/.test(lower)) partial.service_history='Yetkili servis';
  else if(/[oö]zel\s*servis/.test(lower)) partial.service_history='Özel servis';
  if(/muayene\s*ge[cç]erli|ge[cç]erli\s*muayene/.test(lower)) partial.inspection='Geçerli';
  else if(/muayene\s*ge[cç]mi[sş]/.test(lower)) partial.inspection='Geçmiş';
  if(/\bgaranti\s*var\b/.test(lower)) partial.warranty='Var';
  else if(/\bgaranti\s*yok\b/.test(lower)) partial.warranty='Yok';

  // Motor cc / hp kaba
  m=lower.match(/\b(\d(?:[.,]\d)?)\s*(?:litre|l)\b/);
  if(m){
    const lit=parseFloat(m[1].replace(',','.'));
    if(lit>=0.6&&lit<=8) partial.engine_cc=String(Math.round(lit*1000));
  }
  m=lower.match(/\b(\d{3,4})\s*cc\b/);
  if(m) partial.engine_cc=m[1];
  m=lower.match(/\b(\d{2,3})\s*hp\b/);
  if(m) partial.power_hp=m[1];

  return {partial:partial, notes:notes, raw:raw};
}

  notes=notes||[];
  const rows=[];
  const labels={
    brand:'Marka', model:'Model', version:'Versiyon', year:'Yıl', km:'Kilometre',
    color:'Renk', gear:'Vites', fuel:'Yakıt', body:'Kasa', drive:'Çekiş',
    engine_cc:'Motor (cc)', power_hp:'Güç (HP)', condition:'Kondisyon',
    damage:'Hasar', paint:'Boya', changed_parts:'Değişen parça',
    service_history:'Servis', inspection:'Muayene', warranty:'Garanti'
  };
  Object.keys(labels).forEach(function(k){
    if(partial[k]!=null&&String(partial[k]).trim()!==''){
      let val=String(partial[k]);
      if(k==='km'){ try{ val=Number(val).toLocaleString('tr-TR')+' km'; }catch(e){} }
      rows.push('<div class="small" style="margin:4px 0"><b>'+labels[k]+':</b> '+escapeHTML(val)+'</div>');
    }
  });
  notes.forEach(function(n){
    rows.push('<div class="small muted" style="margin:4px 0">• '+escapeHTML(n)+'</div>');
  });
  if(!rows.length){
    app(`<div class="back"><button class="btn secondary smallBtn" type="button" onclick="renderOtomobilWizard()">← Geri</button></div>
    <div class="formCard"><span class="badge">🤖 Anla</span><h1>Anlaşılamadı</h1>
    <p class="muted">Cümleden güvenli alan çıkarılamadı. Bilgi uydurulmadı — formu elle doldurabilir veya cümleyi netleştirip tekrar deneyebilirsin.</p>
    <button class="btn primary" type="button" onclick="renderOtomobilWizard()">Forma dön</button></div>`);
    return;
  }
  window.__otoParsePending={partial:partial, raw:rawText||'', notes:notes};
  app(`<div class="back"><button class="btn secondary smallBtn" type="button" onclick="otoParseEdit()">← Düzenle</button></div>
  <div class="formCard">
    <span class="badge">🤖 Anla</span>
    <h1>Bunları doğru anladım mı?</h1>
    <p class="muted small">Yalnızca cümleden çıkarılan bilgiler. Onaylamadan ilan alanları değişmez.</p>
    <div class="card" style="text-align:left;margin:12px 0">${rows.join('')}</div>
    <div class="splitActions">
      <button class="btn primary" type="button" onclick="otoParseConfirmYes()">✓ Evet, devam et</button>
      <button class="btn secondary" type="button" onclick="otoParseEdit()">✎ Düzenle</button>
    </div>
  </div>`);
}

function otoParseFromWizard(){
  const el=document.getElementById('otoFreeText');
  const text=el?el.value:'';
  const res=parseOtoFreeText(text);
  showOtoParseConfirm(res.partial, res.raw, res.notes);
}

function otoParseConfirmYes(){
  const pend=window.__otoParsePending;
  if(!pend||!pend.partial){ renderOtomobilWizard(); return; }
  __otoW=__otoW||{step:0,data:{},files:[]};
  __otoW.data=Object.assign({}, __otoW.data||{}, pend.partial);
  // Onaylandıktan sonra uygun adıma geç (kalıcı step numarası eklemeden)
  if(__otoW.data.brand||__otoW.data.model||__otoW.data.year) __otoW.step=Math.max(__otoW.step|0, 1);
  window.__otoParsePending=null;
  try{
    const draft={step:__otoW.step, data:Object.assign({}, __otoW.data), hasFiles:false};
    localStorage.setItem('oto_listing_draft', JSON.stringify(draft));
  }catch(e){}
  renderOtomobilWizard();
}

function otoParseEdit(){
  const raw=(window.__otoParsePending&&window.__otoParsePending.raw)||'';
  window.__otoParsePending=null;
  __otoW=__otoW||{step:0,data:{},files:[]};
  __otoW._freeTextKeep=raw;
  __otoW.step=0;
  renderOtomobilWizard();
}

function startOtomobilWizard(){
  if(v2ListingTypeClosed('otomobil')) return;
  const session=typeof getAuthSession==='function'?getAuthSession():null;
  if(!session||!session.user||!(session.user.id||session.user.user_id)){
    app(`<div class="back"><button class="btn secondary smallBtn" type="button" onclick="showOtomobilHub()">← Otomobil</button></div>
    <div class="formCard"><span class="badge">🚗 İlan Ver</span><h1>Giriş gerekli</h1>
    <p class="muted">İlan vermek için giriş yapmalısın.</p>
    <button class="btn primary" type="button" onclick="openAuthModal('login')">Giriş yap</button></div>`);
    return;
  }
  __otoW={step:0, data:{currency:'TRY',city:'İzmir',seller_type:'individual',vehicle_type:'Otomobil'}, files:[]};
  renderOtomobilWizard();
}

function otoWizardBack(){
  otoSaveStepFields();
  __otoW.step=Math.max(0,(__otoW.step|0)-1);
  renderOtomobilWizard();
}
function otoWizardNext(){
  otoSaveStepFields();
  const d=__otoW.data;
  const step=__otoW.step|0;
  if(step===1){
    if(!d.brand||!d.model||!d.year||d.km===''){ alert('Marka, model, yıl ve kilometre zorunlu.'); return; }
  }
  if(step===4){
    if(d.price===''||d.price===undefined||!d.city||!d.district){ alert('Fiyat, il ve ilçe zorunlu.'); return; }
  }
  if(step===5){
    if(!d.title||!d.description){ alert('Başlık ve açıklama zorunlu.'); return; }
  }
  if(step===6){
    if(!(__otoW.files&&__otoW.files.length)){ alert('En az bir fotoğraf seçmelisin.'); return; }
  }
  __otoW.step=Math.min(7,step+1);
  renderOtomobilWizard();
}

      drive:d.drive||'',

      color:d.color||'',
      condition:d.condition||'',
      damage:d.damage||'',
      paint:d.paint||'',
      changed_parts:d.changed_parts||'',
      service_history:d.service_history||'',
      inspection:d.inspection||'',
      warranty:d.warranty||'',
      seller_type:d.seller_type==='professional'?'professional':'individual',
      phone:(d.phone||'').trim()||null,
      whatsapp:((d.phone||'').trim()&&d.wa==='1')?(d.phone||'').trim():null,
      ...(d.parts_set?{parts_set:true,parts:(d.parts&&typeof d.parts==='object')?d.parts:{}}:{}),

function parseServiceFreeText(str){
  const raw=String(str||'').trim();
  const lower=raw.toLocaleLowerCase('tr-TR');
  const out={category:'', urgency:'', note:raw};
  if(!raw) return out;
  // Kategori — SERVICES anahtarları / isimleri
  try{
    const map=[
      ['tesisat',/musluk|su ka[cç]|tesisat|tuvalet|lavabo|gid[e]?r|bor[u]/],
      ['klima',/klima|so[gğ]utm|kombi/],
      ['elektrik',/elektrik|priz|sigorta|aydınlat/],
      ['beyaz',/[cç]ama[sş][iı]r|bula[sş][iı]k|buzdolab[iı]|f[iı]r[iı]n|beyaz\s*e[sş]ya/],
      ['temizlik',/temizlik|s[uü]p[uü]r/],
      ['nakliye',/nakliye|ta[sş][iı]ma|evden eve/],
      ['cilingir',/[cç]ilingir|kilit|anahtar/],
      ['oto',/\boto\b|lastik|ak[uü]|yol yard[iı]m/],
      ['boya',/badana|boya\s*ustas[iı]/],
      ['montaj',/montaj|mobilya kur/]
    ];
    for(let i=0;i<map.length;i++){
      if(map[i][1].test(lower)){ out.category=map[i][0]; break; }
    }
  }catch(e){}
  // Zaman — uydurma yok; yalnızca açık ifadeler
  if(/\byar[iı]n\b/.test(lower)) out.urgency='Yarın';
  else if(/\bacil\b|\bacil\b/.test(lower)||/hemen/.test(lower)) out.urgency='Acil';
  else if(/\bbug[uü]n\b/.test(lower)) out.urgency='Bugün';
  return out;
}

function normalizeWhatsAppPhone(phone){
  let d=String(phone||'').replace(/\D+/g,'');
  if(!d)return '';
  if(d.indexOf('00')===0)d=d.slice(2);
  if(d.length===10&&d.charAt(0)==='5')d='90'+d;
  if(d.length===11&&d.charAt(0)==='0')d='90'+d.slice(1);
  if(d.indexOf('90')===0&&d.length>=12)return d;
  if(d.length>=10)return d;
  return '';
}
function whatsappHref(phone){
  const n=normalizeWhatsAppPhone(phone);
  return n?('https://wa.me/'+n):'';
}
function telHref(phone){
  const n=normalizeWhatsAppPhone(phone);
  if(!n)return '';
  return 'tel:+'+n;
}

async function loadOffersForRequest(talepNo){
  if(!talepNo)return [];
  try{
    // Resolve real requests.id (offers.request_id FK)
    let requestId=null;
    let local=(getRequests()||[]).find(function(x){
      return String(x.talep_no||'')===String(talepNo)||String(x.id)===String(talepNo);
    });
    if(local&&local.id&&String(local.id).length>30)requestId=local.id;
    if(!requestId){
      try{
        const found=await findRequestByNo(talepNo);
        if(found&&found.id&&String(found.id).length>30)requestId=found.id;
      }catch(e){}
    }
    if(!requestId){
      // Search requests by encoded talep_no in description
      try{
        const rows=await supabaseReadAuth('GET','requests?select=id,description&order=created_at.desc&limit=100');
        if(Array.isArray(rows)){
          for(let i=0;i<rows.length;i++){
            const meta=parseRequestDescription(rows[i].description||'');
            if(String(meta.talep_no)===String(talepNo)||String(rows[i].id)===String(talepNo)){
              requestId=rows[i].id;break;
            }
          }
        }
      }catch(e){console.warn('requests lookup',e);}
    }
    if(!requestId){
      console.warn('[OFFER] request id bulunamadı', talepNo);
      return [];
    }
    // offers uses created_at (NOT olusturulma_tarihi)
    let rows;
    try{
      rows=await supabaseReadAuth('GET','offers?select=*&request_id=eq.'+encodeURIComponent(String(requestId))+'&order=created_at.desc&limit=50');
    }catch(e1){
      console.warn('[OFFER] ordered select failed, retry plain', e1);
      rows=await supabaseReadAuth('GET','offers?select=*&request_id=eq.'+encodeURIComponent(String(requestId))+'&limit=50');
    }
    const list=Array.isArray(rows)?rows:[];
    console.log('[OFFER] loaded', list.length, 'for request', requestId);
    const out=[];
    for(let i=0;i<list.length;i++){
      const o=list[i];
      let pname='',pphone='';
      if(o.provider_id){
        try{
          const pr=await supabaseRequest('GET','providers?select=id,name,district&id=eq.'+encodeURIComponent(String(o.provider_id))+'&limit=1');
          if(Array.isArray(pr)&&pr[0]){pname=pr[0].name||'';o._pdist=pr[0].district||'';}
          pphone=await hzProviderPhone(o.provider_id);
        }catch(e){}
      }
      const st=o.status||'pending';
      out.push({
        id:o.id,
        request_id:o.request_id,
        provider_id:o.provider_id,
        provider_name:pname||'Hizmet Sağlayıcı',
        provider_phone:pphone||'',provider_district:o._pdist||'',
        fiyat:o.price,
        price:o.price,
        aciklama:o.note||'',
        note:o.note||'',
        available_time:o.available_time||'',
        durum:st==='accepted'?'Kabul edildi':(st==='rejected'?'Reddedildi':'Teklif bekliyor'),
        status:st,
        created_at:o.created_at||''
      });
    }
    return out;
  }catch(e){
    console.error('[OFFER] load failed', e);
    return [];
  }
}
