<script>
const SUPABASE_URL="https://zvffspbowdzvrrzefhkr.supabase.co";
const SUPABASE_KEY="sb_publishable_L_qb9Q4fHktE51PEqEhTAg_O4R0eDiW";

const SERVICES={
 klima:{name:"Klima",emoji:"❄️",desc:"Bakım, montaj, arıza ve temizlik"},
 elektrik:{name:"Elektrik",emoji:"⚡",desc:"Arıza, priz, tesisat ve aydınlatma"},
 tesisat:{name:"Tesisat",emoji:"🔧",desc:"Su, gider, musluk ve kaçak sorunları"},
 beyaz:{name:"Beyaz Eşya",emoji:"🧊",desc:"Çamaşır, bulaşık, buzdolabı ve fırın"},
 temizlik:{name:"Temizlik",emoji:"🧹",desc:"Ev, ofis ve detaylı temizlik"},
 nakliye:{name:"Nakliye",emoji:"🚚",desc:"Ev, ofis ve parça eşya taşıma"},
 cilingir:{name:"Çilingir",emoji:"🔐",desc:"Kilit, anahtar ve acil giriş"},
 oto:{name:"Oto",emoji:"🚗",desc:"Arıza, bakım, lastik ve yol yardımı"}
};

const DISTRICTS=[...new Set(["Aliağa","Balçova","Bayındır","Bayraklı","Bergama","Beydağ","Bornova","Buca","Çeşme","Çiğli","Dikili","Foça","Gaziemir","Güzelbahçe","Karabağlar","Karaburun","Karşıyaka","Konak","Menemen","Menderes","Narlıdere","Ödemiş","Seferihisar","Selçuk","Tire","Torbalı","Urla","Kiraz","Kemalpaşa","Kınık"])];

const KEYS={requests:"isimi_coz_requests_v5",provider:"isimi_coz_provider_v5",providerLogged:"isimi_coz_provider_logged_v5"};

function read(k,f){try{const x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}}
function write(k,v){localStorage.setItem(k,JSON.stringify(v))}
function getRequests(){return read(KEYS.requests,[])}
function getProvider(){return read(KEYS.provider,null)}
function providerLogged(){return read(KEYS.providerLogged,false)}
function escapeHTML(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function app(h){document.getElementById("app").innerHTML=h;window.scrollTo(0,0)}
function setNav(a){["navHome","navRequest","navRequests","navProvider"].forEach(id=>document.getElementById(id)?.classList.remove("active"));if(a)document.getElementById(a)?.classList.add("active")}
function setConnection(ok,text){const e=document.getElementById("connectionStatus");if(!e)return;e.className="connection "+(ok?"online":"offline");e.textContent=text||(ok?"Supabase bağlı ✓":"Yerel mod")}

async function supabaseRequest(method,path,body=null){
 const o={method,headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Accept":"application/json","Prefer":"return=representation"}};
 if(body!==null)o.body=JSON.stringify(body);
 const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,o);
 const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){d=t}
 if(!r.ok)throw new Error(d?.message||d?.details||d?.hint||"Supabase işlemi başarısız.");
 return d;
}

async function supabaseAuthRequest(method,path,body=null){
 const session=getAuthSession();
 const token=session?.access_token;
 if(!token)throw new Error("Bu işlem dosyasını kaydetmek için önce giriş yapmalısınız.");
 const o={method,headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+token,"Content-Type":"application/json","Accept":"application/json","Prefer":"return=representation"}};
 if(body!==null)o.body=JSON.stringify(body);
 const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,o);
 const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){d=t}
 if(!r.ok)throw new Error(d?.message||d?.details||d?.hint||"Yetkili Supabase işlemi başarısız.");
 return d;
}

function normalize(v){
 return String(v??"").trim().toLowerCase()
 .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
 .replace(/ı/g,"i").replace(/İ/g,"i");
}
function pick(o,names,def=""){for(const n of names){if(o&&o[n]!==undefined&&o[n]!==null)return o[n]}return def}
function serviceKeyFromValue(v){
 const x=normalize(v);
 for(const [k,s] of Object.entries(SERVICES)){
  if(x===normalize(k)||x===normalize(s.name))return k;
 }
 return String(v??"").trim();
}

async function testSupabase(){
 try{await supabaseRequest("GET","talepler?select=id&limit=1");setConnection(true,"Supabase bağlı ✓");return true}
 catch(e){console.error(e);setConnection(false,"Yerel mod");return false}
}

async function loadRequestsFromSupabase(){
 try{
  const data=await supabaseRequest("GET","talepler?select=*&order=created_at.desc&limit=200");
  if(Array.isArray(data)){
   const mapped=data.map(mapRequest);write(KEYS.requests,mapped);setConnection(true,"Supabase bağlı ✓");return mapped;
  }
 }catch(e){console.warn("Talepler alınamadı:",e)}
 return getRequests();
}
function mapRequest(r){
 const kategori=pick(r,["kategori","category","service"],"");
 return {
  id:pick(r,["talep_no","id"],""),
  talep_no:pick(r,["talep_no","request_no","id"],""),
  service:serviceKeyFromValue(kategori),kategori:kategori,
  description:pick(r,["aciklama","description"],""),
  aciklama:pick(r,["aciklama","description"],""),
  il:pick(r,["il","city"],"İzmir"),
  district:pick(r,["ilce","district"],""),ilce:pick(r,["ilce","district"],""),
  neighborhood:pick(r,["mahalle","neighborhood"],""),mahalle:pick(r,["mahalle","neighborhood"],""),
  urgency:pick(r,["aciliyet","urgency"],""),
  aciliyet:pick(r,["aciliyet","urgency"],""),
  name:pick(r,["ad_soyad","name"],""),ad_soyad:pick(r,["ad_soyad","name"],""),
  phone:pick(r,["telefon","phone"],""),telefon:pick(r,["telefon","phone"],""),
  status:pick(r,["durum","status"],"Beklemede"),durum:pick(r,["durum","status"],"Beklemede"),
  createdAt:pick(r,["created_at","createdAt"],"")
 };
}

/* ---------------- PROVIDER DATA: SUPABASE ---------------- */

async function loadProvidersFromSupabase(){
 try{
  const rows=await supabaseRequest("GET","providers?select=*&limit=500");
  if(!Array.isArray(rows))return [];
  const providers=rows.map(mapProvider);
  setConnection(true,"Supabase bağlı ✓");
  return providers;
 }catch(e){
  console.error("providers okunamadı:",e);
  return [];
 }
}

async function loadCategories(){
 try{
  const rows=await supabaseRequest("GET","categories?select=*&limit=500");
  return Array.isArray(rows)?rows:[];
 }catch(e){console.warn("categories okunamadı:",e);return []}
}

async function loadProviderCategories(){
 try{
  const rows=await supabaseRequest("GET","provider_categories?select=*&limit=1000");
  return Array.isArray(rows)?rows:[];
 }catch(e){console.warn("provider_categories okunamadı:",e);return []}
}

function mapProvider(r){
 return {
  id:pick(r,["id","provider_id"],""),
  name:pick(r,["name","ad","ad_soyad","business_name","isletme"],"Hizmet Sağlayıcı"),
  phone:pick(r,["phone","telefon","telefon_numarasi"],""),
  category:pick(r,["category","kategori","category_id"],""),
  city:pick(r,["il","city"],"İzmir"),
  district:pick(r,["ilce","district"],""),
  neighborhood:pick(r,["mahalle","neighborhood"],""),
  description:pick(r,["description","aciklama"],""),
  active:pick(r,["active","aktif"],true)!==false,
  services:[]
 };
}

function categoryValueFromRow(row,categories){
 const raw=pick(row,["category_id","kategori_id","category","kategori"],"");
 if(!raw)return "";
 const c=categories.find(x=>String(x.id)===String(raw));
 if(c)return pick(c,["name","name_tr","ad","kategori"],raw);
 return raw;
}

async function enrichProviders(providers){
 const [cats,links]=await Promise.all([loadCategories(),loadProviderCategories()]);
 const byId={};
 providers.forEach(p=>byId[String(p.id)]=p);

 links.forEach(link=>{
  const pid=pick(link,["provider_id","providers_id","provider"],"");
  const val=categoryValueFromRow(link,cats);
  if(byId[String(pid)]&&val)byId[String(pid)].services.push(serviceKeyFromValue(val));
 });

 providers.forEach(p=>{
  const direct=p.category;
  if(direct&&!p.services.length)p.services=[serviceKeyFromValue(direct)];
  p.services=[...new Set(p.services.filter(Boolean))];
 });
 return providers;
}

function providerMatchesRequest(p,r){
 if(!p.active)return false;
 const ps=(p.services||[]).map(serviceKeyFromValue);
 const rk=serviceKeyFromValue(r.kategori||r.service);
 const district=normalize(p.district),rd=normalize(r.ilce||r.district);
 const city=normalize(p.city),rc=normalize(r.il||"İzmir");
 const categoryOK=ps.length?ps.includes(rk):true;
 const districtOK=district?district===rd:true;
 const cityOK=!city||!rc||city===rc||city==="izmir";
 return categoryOK&&districtOK&&cityOK;
}

/* ---------------- REQUEST ---------------- */

function serviceOptions(selected=""){return `<option value="">Kategori seç</option>`+Object.entries(SERVICES).map(([k,s])=>`<option value="${k}" ${k===selected?"selected":""}>${s.emoji} ${s.name}</option>`).join("")}
function districtOptions(selected=""){return `<option value="">İlçe seç</option>`+DISTRICTS.map(d=>`<option value="${escapeHTML(d)}" ${d===selected?"selected":""}>${escapeHTML(d)}</option>`).join("")}
function makeRequestNumber(){const d=new Date();return `IC-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}-${Math.floor(1000+Math.random()*9000)}`}

async function createRequest(){
 const g=id=>document.getElementById(id)?.value.trim();
 const service=document.getElementById("reqService").value,description=g("reqDescription"),city=g("reqCity"),district=g("reqDistrict"),neighborhood=g("reqNeighborhood"),urgency=document.getElementById("reqUrgency").value,name=g("reqName"),phone=g("reqPhone");
 if(!service)return alert("Lütfen hizmet kategorisini seç.");
 if(description.length<5)return alert("Lütfen ihtiyacınızı biraz daha açık anlat.");
 if(!district)return alert("Lütfen ilçe seç.");
 if(!name)return alert("Lütfen adınızı ve soyadınızı yaz.");
 if(!phone)return alert("Lütfen telefon numaranızı yaz.");
 const b=document.getElementById("createRequestButton");b.disabled=true;b.textContent="TALEP KAYDEDİLİYOR...";
 const talep_no=makeRequestNumber();
 const item={talep_no,kategori:service,aciklama:description,il:city,ilce:district,mahalle:neighborhood,aciliyet:urgency,ad_soyad:name,telefon:phone,durum:"Beklemede"};

let currentAuthUser=null;
function authHeaders(token){return {"apikey":SUPABASE_KEY,"Authorization":"Bearer "+(token||SUPABASE_KEY),"Content-Type":"application/json"}}
function getAuthSession(){try{return JSON.parse(localStorage.getItem("isimi_coz_auth_session")||"null")}catch(e){return null}}
function saveAuthSession(session){if(session)localStorage.setItem("isimi_coz_auth_session",JSON.stringify(session));else localStorage.removeItem("isimi_coz_auth_session");updateAuthArea()}
function updateAuthArea(){
 const el=document.getElementById("authArea"); if(!el)return;
 const session=getAuthSession();
 if(session?.user){ currentAuthUser=session.user; const email=session.user.email||"Hesabım"; el.innerHTML='<div class="authBar"><span class="authUser">'+escapeHTML(email)+'</span><button class="authBtn" type="button" onclick="logoutUser()">Çıkış</button></div>'; }
 else { currentAuthUser=null; el.innerHTML='<div class="authBar"><button class="authBtn" type="button" onclick="openAuthModal(\'login\')">Giriş</button><button class="authBtn primary" type="button" onclick="openAuthModal(\'signup\')">Kayıt Ol</button></div>'; }
}
function openAuthModal(mode){
 document.getElementById("authModal")?.remove();
 const title=mode==='signup'?'Hesap oluştur':'Giriş yap';
 const button=mode==='signup'?'KAYIT OL':'GİRİŞ YAP';
 const switchText=mode==='signup'?'Zaten hesabın var mı?':'Hesabın yok mu?';
 const switchMode=mode==='signup'?'login':'signup';
 const switchLabel=mode==='signup'?'Giriş yap':'Kayıt ol';
 const html=`<div class="modal" id="authModal"><div class="modalCard"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2>${title}</h2><button class="authBtn" type="button" onclick="closeAuthModal()">Kapat</button></div><label>E-posta</label><input id="authEmail" type="email" autocomplete="email" placeholder="ornek@email.com"><label>Şifre</label><input id="authPassword" type="password" autocomplete="${mode==='signup'?'new-password':'current-password'}" placeholder="En az 6 karakter"><div id="authError"></div><button class="btn primary" id="authSubmit" type="button" onclick="submitAuth('${mode}')">${button}</button><p class="muted small" style="text-align:center;margin-bottom:0">${switchText} <button class="authBtn" type="button" onclick="openAuthModal('${switchMode}')">${switchLabel}</button></p></div></div>`;
 document.body.insertAdjacentHTML('beforeend',html);
 setTimeout(()=>document.getElementById('authEmail')?.focus(),50);
}
function closeAuthModal(){document.getElementById("authModal")?.remove()}
async function submitAuth(mode){
 const email=document.getElementById('authEmail')?.value.trim(); const password=document.getElementById('authPassword')?.value; const err=document.getElementById('authError'); const btn=document.getElementById('authSubmit');
 if(!email||!password){if(err)err.innerHTML='<div class="authError">E-posta ve şifre gerekli.</div>';return}
 if(password.length<6){if(err)err.innerHTML='<div class="authError">Şifre en az 6 karakter olmalı.</div>';return}
 btn.disabled=true;btn.textContent='BEKLEYİN...';
 try{
   let url=SUPABASE_URL+'/auth/v1/'+(mode==='signup'?'signup':'token?grant_type=password');
   const r=await fetch(url,{method:'POST',headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});
   const data=await r.json().catch(()=>({}));
   if(!r.ok)throw new Error(data.error_description||data.msg||data.message||'Kimlik doğrulama başarısız.');
   if(mode==='signup' && !data.access_token){
      closeAuthModal(); alert('Kayıt tamamlandı. E-posta doğrulaması açıksa gelen kutunu kontrol et, ardından giriş yap.'); return;
   }
   saveAuthSession(data); closeAuthModal(); alert(mode==='signup'?'Hesap oluşturuldu. ✓':'Giriş başarılı. ✓');
 }catch(e){if(err)err.innerHTML='<div class="authError">'+escapeHTML(e.message||String(e))+'</div>';}finally{if(btn){btn.disabled=false;btn.textContent=buttonText(mode)}}
}
function buttonText(mode){return mode==='signup'?'KAYIT OL':'GİRİŞ YAP'}
function logoutUser(){saveAuthSession(null);alert('Çıkış yapıldı.')}
updateAuthArea();

(function(){
'use strict';
const H={step:0,answers:{},caseId:null,createdAt:null};
function buildCasePayload(){
 const a=H.answers;
 const sale=Number(a.sale_price)||0;
 const purchase=Number(a.acquisition_price)||0;
 const harcBase=Math.max(sale,0);
 const sellerFee=harcBase*0.02;
 const buyerFee=harcBase*0.02;
 const totalFee=harcBase*0.04;
 const grossGain=(sale>0&&purchase>0)?sale-purchase:null;
 const warnings=[];
 if(a.seller_type!=='real_person')warnings.push('Bu aktif akış gerçek kişi satışı için hazırlanmıştır. Tüzel kişi satışında farklı belge ve süreçler gerekebilir.');
 if(a.property_location!=='turkey')warnings.push('Yurt dışındaki taşınmazlar için bu Türkiye tapu satış akışı kullanılmamalıdır.');
 if(a.title_deed!=='yes')warnings.push('Tapu bilgileri işlem öncesinde doğrulanmalıdır.');
 if(a.multiple_owners==='yes')warnings.push('Birden fazla malik varsa tüm maliklerin veya geçerli temsilcilerinin işlem durumu ayrıca kontrol edilmelidir.');
 if(a.encumbrance!=='no')warnings.push('Haciz, ipotek veya başka bir takyidat varsa satış öncesinde güncel tapu kaydı üzerinden ayrıca değerlendirilmelidir.');
 if(a.representation==='yes')warnings.push('Vekâletname/temsil belgesinin kapsamı ve geçerliliği işlem öncesinde kontrol edilmelidir.');
 if(a.buyer_ready!=='yes')warnings.push('Alıcının hazır olmaması işlem zamanlamasını etkileyebilir.');
 let fivePassed=false;
 if(a.acquisition_date){const d=new Date(a.acquisition_date+'T00:00:00');if(!Number.isNaN(d.getTime())){const x=new Date(d);x.setFullYear(x.getFullYear()+5);fivePassed=new Date()>=x;if(!fivePassed&&a.acquisition_type==='purchase')warnings.push('5 yıllık süre dolmadan satışta değer artış kazancı yönünden vergi değerlendirmesi gerekebilir.');}}
 return {
   case_no:H.caseId, user_id:getAuthSession()?.user?.id||null, module:'tasinmaz', transaction_type:'konut_satisi', status:'draft',
   answers:a,
   calculations:{sale_price:sale,acquisition_price:purchase,gross_difference:grossGain,seller_tapu_harci:sellerFee,buyer_tapu_harci:buyerFee,total_tapu_harci:totalFee,five_years_passed:fivePassed},
   warnings, source_note:'Bu dosya ön kontrol aracıdır; resmi başvuru sırasında TKGM’nin güncel koşulları esas alınmalıdır.'
 };
}
async function saveCase(){
 if(!H.caseId)H.caseId='IH-'+new Date().toISOString().replace(/\D/g,'').slice(0,14)+'-'+Math.random().toString(36).slice(2,7).toUpperCase();
 const session=getAuthSession();

 const btn=document.querySelector('#hallet-root [data-a="savecase"]');
 if(btn){btn.disabled=true;btn.textContent='KAYDEDİLİYOR...';}
 try{
   const payload=buildCasePayload();
   const rows=await supabaseAuthRequest('POST','hallet_cases?on_conflict=case_no',payload);
   H.createdAt=rows?.[0]?.created_at||H.createdAt||new Date().toISOString();
   if(btn){btn.textContent='✓ DOSYA KAYDEDİLDİ';btn.disabled=true;btn.classList.add('saved');}
   alert('İşlem dosyan Supabase hesabına kaydedildi. ✓\n\nDosya No: '+H.caseId);
 }catch(e){

 }
}

function render(x){const r=open();r.innerHTML='<div class="ha"><div class="hw">'+x+'</div></div>';r.scrollTop=0}
function top(back){return '<div class="ht"><strong>İşini Hallet</strong><button class="topb" data-a="'+(back||'close')+'">'+(back?'← Geri':'Kapat')+'</button></div>'}
function gate(){H.step=0;H.answers={};H.caseId=null;H.createdAt=null;render(top('close')+'<div class="hc"><div class="hk">Dijital işlem asistanı</div><h1>Ne yapmak istiyorsun?</h1><p class="hm">İşlemini seç. Gerekli adımları birlikte tamamlayalım.</p><div class="hg"><button class="hb hp" data-a="islem">📋 Bir işlem yapmak istiyorum</button><button class="hb" data-a="evrak">📄 Evrak hazırlamak istiyorum</button><button class="hb" data-a="kurum">🏛️ Bir kuruma başvuracağım</button><button class="hb" data-a="isimi">🛠️ Hizmet / usta bulmam gerekiyor</button></div></div>')}
function islem(){render(top('gate')+'<div class="hc"><div class="hk">İşlem seçimi</div><h2>Hangi işlemi yapmak istiyorsun?</h2><div class="hg"><button class="hb hp" data-a="tasinmaz">🏠 Taşınmaz işlemleri</button><button class="hb" data-a="evrak">📄 Evrak hazırlama</button><button class="hb" data-a="kurum">🏛️ Kurum başvurusu</button></div></div>')}
function tasinmaz(){render(top('islem')+'<div class="hc"><div class="hk">Taşınmaz işlemleri</div><h2>Hangi taşınmaz işlemi?</h2><div class="hg"><button class="hb hp" data-a="konut">🏠 Konut satışı</button></div></div>')}
function konut(){render(top('tasinmaz')+'<div class="hc"><div class="hk">Konut satışı</div><h2>Satış dosyasını oluşturalım</h2><p class="hm">11 kısa soruyla satış dosyasının ön kontrolünü yapacağız.</p><div class="hl"><div class="li">✓ Tapu ve mülkiyet</div><div class="li">✓ Alıcı ve satış bilgileri</div><div class="li">✓ Edinim tarihi ve vergi kontrolü</div></div><button class="hb hp" data-a="start">Satış dosyasını başlat →</button></div>')}
function question(){const q=QUESTIONS[H.step];if(!q)return result();let html='<div class="pr"><span style="width:'+Math.max(7,Math.round(H.step/QUESTIONS.length*100))+'%"></span></div>'+top(H.step?'qback':'konut')+'<div class="hc"><div class="hk">Soru '+(H.step+1)+' / '+QUESTIONS.length+'</div><h2>'+esc(q.title)+'</h2>';if(q.type==='date')html+='<label>Tarih</label><input class="hi" id="qinput" type="date" value="'+esc(H.answers[q.key]||'')+'"><button class="hb hp" style="margin-top:14px" data-a="save" data-k="'+q.key+'">Devam et →</button>';else if(q.type==='number')html+='<label>Satış bedeli (TL)</label><input class="hi" id="qinput" type="number" min="0" step="1" inputmode="decimal" placeholder="'+esc(q.placeholder)+'" value="'+esc(H.answers[q.key]||'')+'"><button class="hb hp" style="margin-top:14px" data-a="save" data-k="'+q.key+'">Devam et →</button>';else html+='<div class="hg">'+q.options.map(o=>'<button class="hb" data-a="answer" data-k="'+q.key+'" data-v="'+o[0]+'">'+esc(o[1])+'</button>').join('')+'</div>';html+='</div>';render(html)}
function result(){
 const a=H.answers;
 H.caseId=H.caseId||'IH-'+new Date().toISOString().replace(/\D/g,'').slice(0,14)+'-'+Math.random().toString(36).slice(2,7).toUpperCase();
 const warnings=[];
 if(a.seller_type!=='real_person')warnings.push('Bu aktif akış gerçek kişi satışı için hazırlanmıştır. Tüzel kişi satışında farklı belge ve süreçler gerekebilir.');
 if(a.property_location!=='turkey')warnings.push('Yurt dışındaki taşınmazlar için bu Türkiye tapu satış akışı kullanılmamalıdır.');
 if(a.title_deed!=='yes')warnings.push('Tapu bilgileri işlem öncesinde doğrulanmalıdır.');
 if(a.multiple_owners==='yes')warnings.push('Birden fazla malik varsa tüm maliklerin veya geçerli temsilcilerinin işlem durumu ayrıca kontrol edilmelidir.');
 if(a.encumbrance!=='no')warnings.push('Haciz, ipotek veya başka bir takyidat varsa satış öncesinde güncel tapu kaydı üzerinden ayrıca değerlendirme yapılmalıdır.');
 if(a.representation==='yes')warnings.push('Vekâletname/temsil belgesinin kapsamı ve geçerliliği işlem öncesinde kontrol edilmelidir.');
 if(a.buyer_ready!=='yes')warnings.push('Alıcının hazır olmaması işlem zamanlamasını etkileyebilir.');
 let five='Kontrol edilemedi';
 let fivePassed=false;
 if(a.acquisition_date){const d=new Date(a.acquisition_date+'T00:00:00');if(!Number.isNaN(d.getTime())){const x=new Date(d);x.setFullYear(x.getFullYear()+5);fivePassed=new Date()>=x;five=fivePassed?'5 yıllık süre dolmuş görünüyor.':'5 yıllık süre henüz dolmamış görünüyor.';if(!fivePassed&&a.acquisition_type==='purchase')warnings.push('5 yıllık süre dolmadan satışta değer artış kazancı yönünden vergi değerlendirmesi gerekebilir.');}}
 const sale=Number(a.sale_price)||0;
 const purchase=Number(a.acquisition_price)||0;
 const harcBase=Math.max(sale,0);
 const sellerFee=harcBase*0.02;
 const buyerFee=harcBase*0.02;
 const totalFee=harcBase*0.04;
 const grossGain=(sale>0&&purchase>0)?sale-purchase:null;
 const docs=[];
 docs.push(['Kimlik belgesi','Alıcı ve satıcı için gerekli.']);
 if(a.representation==='yes')docs.push(['Temsil belgesi','Vekâletname, vasi kararı veya ilgili temsil belgesi gerekir.']);
 docs.push(['Tapu senedi / tapu bilgisi','Varsa işlem sırasında kullanılmak üzere hazır bulundurulmalı; TKGM satış rehberinde tapu senedi “var olması halinde” belirtilmektedir.']);
 if(a.building==='yes')docs.push(['Geçerli DASK poliçesi','Bina niteliğindeki taşınmazlarda satış işlemi için kontrol edilmelidir.']);
 if(a.multiple_owners==='yes')docs.push(['Malik/temsil kontrolü','Birden fazla malik için taraf ve temsil durumunun tamamlanması gerekir.']);
 const officialNote='Bu dosya ön kontrol aracıdır; resmi başvuru sırasında TKGM’nin güncel koşulları esas alınmalıdır.';
 render(top('close')+'<div class="hc"><div class="hk">İşlem dosyası</div><h1>Satış dosyan hazır.</h1><p class="hm">Ön kontrol tamamlandı. Aşağıdaki sonuçlar verdiğin bilgilere göre oluşturuldu.</p>'+
 '<div class="hl"><div class="li"><strong>Dosya no:</strong> '+esc(H.caseId)+'</div><div class="li"><strong>Satış bedeli:</strong> '+money(sale)+'</div><div class="li"><strong>Edinim tarihi:</strong> '+dateText(a.acquisition_date)+'</div><div class="li"><strong>5 yıllık süre:</strong> '+esc(five)+'</div></div>'+
 '<h2>Gerekli belgeler</h2><div class="hl">'+docs.map(d=>'<div class="li"><span class="ok">✓</span> <strong>'+esc(d[0])+'</strong><br><span class="hm">'+esc(d[1])+'</span></div>').join('')+'</div>'+
 '<h2>Tapu harcı ön hesabı</h2><div class="hl"><div class="li"><strong>Satıcı:</strong> '+money(sellerFee)+' <span class="hm">(%2)</span></div><div class="li"><strong>Alıcı:</strong> '+money(buyerFee)+' <span class="hm">(%2)</span></div><div class="li"><strong>Toplam:</strong> '+money(totalFee)+' <span class="hm">(%4)</span></div></div><p class="hm small">Harç, satış için beyan edilen değerin emlak vergisi değerinden düşük olmaması esasıyla hesaplanır. Bu hesap döner sermaye ücretini içermez.</p>'+
 '<h2>Değer artış kazancı ön kontrolü</h2><div class="hl"><div class="li"><strong>Durum:</strong> '+esc(fivePassed?'5 yıllık süre dolmuş görünüyor.':'5 yıllık süre dolmamış / kontrol gerekli.')+'</div>'+(grossGain!==null&&!fivePassed?'<div class="li"><strong>Satış − alış farkı:</strong> '+money(grossGain)+'<br><span class="hm">Bu tutar nihai vergi matrahı değildir. 2026 için GİB kuralları kapsamında endeksleme, giderler ve 150.000 TL istisna gibi unsurlar ayrıca değerlendirilmelidir.</span></div>':'<div class="li"><span class="hm">Nihai değer artış kazancı hesabı için alış bedeli, edinim/satış tarihleri, endeksleme ve indirilebilir giderler ayrıca değerlendirilmelidir.</span></div>')+'</div>'+
 '<h2>Sonraki adımlar</h2><div class="hl"><div class="li">1. Güncel tapu kaydı ve taraf bilgilerini doğrula.</div><div class="li">2. Gerekli belgeleri hazırla ve temsil/takyidat durumunu kontrol et.</div><div class="li">3. Tapu başvurusunu Web Tapu veya yetkili tapu kanalı üzerinden başlat.</div><div class="li">4. Harç ve döner sermaye ödemelerini resmi bildirim üzerinden kontrol et.</div><div class="li">5. İşlem tamamlandığında belgeleri dosyana ekle.</div></div>'+
 (warnings.length?'<h2>Uyarılar</h2><div class="hl">'+warnings.map(w=>'<div class="li"><span class="warn">⚠</span> '+esc(w)+'</div>').join('')+'</div>':'<div class="li"><span class="ok">✓</span> Bu cevaplarla kritik bir uyarı tespit edilmedi.</div>')+
 '<div class="li" style="margin-top:14px"><strong>Resmî kaynak notu:</strong><br><span class="hm">'+esc(officialNote)+'</span></div><div class="hg"><button class="hb hp" data-a="savecase">DOSYAYI KAYDET</button><button class="hb" data-a="new">Yeni işlem başlat</button><button class="hb hs" data-a="close">Kapat</button></div></div>')
}
function msg(t,m,back){render(top(back||'gate')+'<div class="hc"><div class="hk">İşini Hallet</div><h2>'+esc(t)+'</h2><p class="hm">'+esc(m)+'</p><button class="hb hp" data-a="gate">İşlemlere dön</button></div>')}
function goIsimi(){close();if(typeof window.showHome==='function')window.showHome()}
function dispatch(a,e){if(a==='close')return close();if(a==='gate')return gate();if(a==='islem')return islem();if(a==='tasinmaz')return tasinmaz();if(a==='konut')return konut();if(a==='start'){H.step=0;return question()}if(a==='qback'){H.step=Math.max(0,H.step-1);return question()}if(a==='answer'){H.answers[e.dataset.k]=e.dataset.v;H.step++;return question()}if(a==='savecase')return saveCase();if(a==='save'){const i=document.getElementById('qinput');if(!i||!String(i.value).trim()){const c=document.querySelector('#hallet-root .hc');if(c&&!c.querySelector('.err'))c.insertAdjacentHTML('beforeend','<div class="err">Lütfen bir değer girerek devam et.</div>');return}H.answers[e.dataset.k]=i.value.trim();H.step++;return question()}if(a==='new'){H.step=0;H.answers={};H.caseId=null;return gate()}if(a==='isimi')return goIsimi();if(a==='evrak')return msg('Evrak hazırlama','Bu modül sonraki aşamada açılacak. Mevcut aktif akış taşınmaz konut satışıdır.');if(a==='kurum')return msg('Kurum başvurusu','Bu modül sonraki aşamada açılacak. Mevcut aktif akış taşınmaz konut satışıdır.')}
document.addEventListener('click',function(e){const el=e.target.closest&&e.target.closest('#hallet-root [data-a]');if(!el)return;e.preventDefault();e.stopPropagation();dispatch(el.dataset.a,el)},true);
window.Hallet={showGate:gate,showIslemMenu:islem,showTasinmazMenu:tasinmaz,showKonutSatis:konut,showQuestion:question,showResult:result,close:close};
})();

/* Hallet başlatıcısı — ana sayfaya dokunmadan çalışır. */
document.addEventListener('click',function(e){const b=e.target.closest&&e.target.closest('#openHalletButton');if(!b)return;e.preventDefault();e.stopPropagation();if(window.Hallet)window.Hallet.showGate();},true);
</script>
</body>
</html>
