  const available_time=(timeEl&&String(timeEl.value||'').trim())?String(timeEl.value).trim():'Uygun zamanda';
  if(!fiyatRaw){alert('Lütfen fiyat girin (ör. 2500).');return;}
  const fiyatNum=Number(String(fiyatRaw).replace(',','.').replace(/[^0-9.]/g,''));
  if(!fiyatNum||fiyatNum<=0){alert('Geçerli bir fiyat girin.');return;}
  if(window.__hzOfferBusy)return;
  window.__hzOfferBusy=true;
  const sendBtn=document.querySelector('[onclick^="submitOffer("]');
  if(sendBtn){sendBtn.disabled=true;sendBtn.textContent='GÖNDERİLİYOR...';}
  try{
    let requestId=null;
    const local=(getRequests()||[]).find(function(x){
      return String(x.talep_no||'')===String(talepNo)||String(x.id)===String(talepNo);
    });
    if(local&&local.id&&String(local.id).length>30)requestId=local.id;
    if(!requestId){
      const found=await findRequestByNo(talepNo);
      if(found&&found.id)requestId=found.id;
    }
    if(!requestId)throw new Error('Talep id bulunamadı: '+talepNo);
    /* provider_id tarayıcıdaki seçime değil, oturumdaki kullanıcının kendi AKTİF sağlayıcı kaydına göre belirlenir */
    const uidNow=session.user&&session.user.id;
    const mine=uidNow?await supabaseReadAuth('GET','providers?select=id&active=eq.true&or=(owner_id.eq.'+encodeURIComponent(uidNow)+',user_id.eq.'+encodeURIComponent(uidNow)+')&order=created_at.asc'):[];
    const mineIds=(Array.isArray(mine)?mine:[]).map(function(x){return String(x.id)});
    if(!mineIds.length)throw new Error('Hesabına bağlı aktif bir hizmet sağlayıcı kaydı yok. Teklif verebilmek için önce sağlayıcı kaydını tamamla.');
    const providerId=mineIds.indexOf(String(p.id))>=0?String(p.id):mineIds[0];
    const body={
      request_id:String(requestId),
      provider_id:providerId,
      provider_user_id:String(uidNow),
      price:fiyatNum,
      available_time:available_time,
      note:aciklama||null,
      status:'pending'
    };
    const res=await supabaseWrite('POST','offers',body,{requireAuth:true});
    if(!res||(Array.isArray(res)&&!res[0]))throw new Error('Teklif kaydı oluşmadı.');
    alert('Teklif gönderildi.\n\nFiyat: '+fiyatNum+' TL');
    if(typeof showProviderRequestDetail==='function')showProviderRequestDetail(talepNo);
  }catch(e){
    console.error(e);
    alert('Teklif gönderilemedi.\n\n'+hzErrText(e));
  }finally{
    window.__hzOfferBusy=false;
    if(sendBtn&&document.body.contains(sendBtn)){sendBtn.disabled=false;sendBtn.textContent='Teklif Gönder';}
  }
}


async function acceptOffer(talepNo,offerId,providerName,price){
  try{
    if(!offerId)throw new Error('Teklif id yok');
    const session=getAuthSession();
    if(!session||!session.access_token)throw new Error('Kabul için giriş yapmalısınız.');
    const r=await findRequestByNo(talepNo);
    if(!r||!r.id)throw new Error('Talep bulunamadı: '+talepNo);
    // Owner check (client-side hint; RLS is source of truth)
    if(r.user_id&&session.user&&session.user.id&&String(r.user_id)!==String(session.user.id)){
      throw new Error('Bu talep sizin hesabınıza ait değil. Kabul edilemez.');
    }
    if(!r.user_id){
      throw new Error('Bu talep sahipsiz (user_id boş). Eski kayıtlar kabul edilemez. Lütfen giriş yapıp YENİ talep oluşturun.');
    }
    // Sunucuda tek işlemde kabul (teklif kabul + diğerleri red + talep "devam ediyor"). Fonksiyon yoksa eski adımlar.
    const srv=await hzRpc('hz_accept_offer',{p_offer_id:String(offerId)});
    if(srv&&srv.__missing){
    // 1) accept offer — must return row
    const off=await supabaseWrite('PATCH','offers?id=eq.'+encodeURIComponent(String(offerId)),{status:'accepted'});
    if(!off||(Array.isArray(off)&&(!off[0]||off[0].status!=='accepted'))){
      throw new Error('Teklif durumu accepted olarak yazılamadı.');
    }
    // 2) reject other pending
    try{
      const others=await supabaseReadAuth('GET','offers?select=id&request_id=eq.'+encodeURIComponent(String(r.id))+'&status=eq.pending');
      if(Array.isArray(others)){
        for(let i=0;i<others.length;i++){
          if(String(others[i].id)!==String(offerId)){
            try{await supabaseWrite('PATCH','offers?id=eq.'+encodeURIComponent(String(others[i].id)),{status:'rejected'});}catch(e){}
          }
        }
      }
    }catch(e){console.warn(e);}
    // 3) request accepted — must return row
    const req=await supabaseWrite('PATCH','requests?id=eq.'+encodeURIComponent(String(r.id)),{status:'accepted'});
    if(!req||(Array.isArray(req)&&(!req[0]||req[0].status!=='accepted'))){
      throw new Error('Talep durumu accepted olarak yazılamadı.');
    }
    }else if(!srv||String(srv.status)!=='accepted'){
      throw new Error('Teklif kabul edilemedi. Sayfayı yenileyip tekrar dene.');
    }
    // Cache only AFTER verified DB write
    try{
      const list=(getRequests()||[]).map(function(x){
        if(String(x.talep_no||'')===String(talepNo)||String(x.id)===String(r.id)){
          x.status='Devam ediyor';x.durum='Devam ediyor';
        }
        return x;
      });
      write(KEYS.requests,list);
    }catch(e){}
    alert('Teklif kabul edildi.\nDurum: Devam ediyor');
    await showRequestDetail(talepNo);
  }catch(e){
    console.error(e);
    alert('Teklif kabul edilemedi.\n\n'+hzErrText(e));
  }
}

async function fetchServiceReviewForRequest(requestId){
  if(!requestId)return null;
  try{
    const rows=await supabaseRequest('GET','reviews?select=id,rating,comment,provider_id,created_at&request_id=eq.'+encodeURIComponent(String(requestId))+'&limit=1');
    return rows&&rows[0]?rows[0]:null;
  }catch(e){console.warn('reviews read:',e);return null}
}
async function fetchProviderReviewStats(providerId){
  if(!providerId)return {avg:null,count:0};
  try{
    const rows=await supabaseRequest('GET','reviews?select=rating&provider_id=eq.'+encodeURIComponent(String(providerId))+'&limit=500');
    if(!rows||!rows.length)return {avg:null,count:0};
    let sum=0;rows.forEach(function(x){sum+=Number(x.rating)||0});
    const avg=Math.round((sum/rows.length)*10)/10;
    return {avg:avg,count:rows.length};
  }catch(e){console.warn('provider review stats:',e);return {avg:null,count:0}}
}

async function submitServiceReview(talepNo){
  try{

    if(!session||!session.access_token||!session.user||!session.user.id){
      alert('Değerlendirme için giriş yapmalısınız.');return;
    }
    const rating=Number(window.__svcSelectedRating||0);
    if(rating<1||rating>5){alert('Lütfen 1–5 arası yıldız seçin.');return;}
    const commentEl=Array.from(document.querySelectorAll('textarea#svcReviewComment')).find(function(t){return String(t.value||'').trim();});
    const comment=(commentEl&&commentEl.value?String(commentEl.value).trim():'').slice(0,400);

    const body={

async function findRequestByNo(talepNo){
  if(!talepNo)return null;
  const key=String(talepNo);
  let list=getRequests()||[];
  let r=list.find(function(x){return String(x.talep_no||'')===key||String(x.id)===key;});
  try{
    const rows=await supabaseReadAuth('GET','requests?select=*&order=created_at.desc&limit=150');
    if(Array.isArray(rows)){
      for(let i=0;i<rows.length;i++){
        const mapped=mapRequest(rows[i]);
        if(String(mapped.talep_no||'')===key||String(mapped.id)===key||String(rows[i].id)===key){
          r=applyLocalJobState(mapped);
          try{
            const others=(getRequests()||[]).filter(function(x){return String(x.id)!==String(r.id)&&String(x.talep_no||'')!==String(r.talep_no||'');});
            write(KEYS.requests,[r].concat(others));
          }catch(e){}
          return r;
        }
      }
    }
  }catch(e){console.warn('findRequestByNo refresh',e);}
  return r?applyLocalJobState(r):null;
}

  }
}

async function hzWithdrawOffer(offerId,talepNo){

async function startVoiceInput(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const ta=document.getElementById('reqDescription');
  if(!ta)return;
  if(!SR){
    alert('Bu tarayıcı sesli girişi desteklemiyor. Lütfen metni elle yazın.');
    return;
  }
  const btn=document.getElementById('voiceBtn');
  const resetBtn=function(){if(btn){btn.disabled=false;btn.textContent='🎤 Sesli anlat';}};
  try{
    if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
      try{
        const stream=await navigator.mediaDevices.getUserMedia({audio:true});
        try{stream.getTracks().forEach(function(tr){tr.stop();});}catch(e){}
      }catch(permErr){
        resetBtn();
        alert('Mikrofon izni gerekli. Tarayıcı ayarlarından mikrofona izin verip tekrar deneyin.');
        return;
      }
    }
    const rec=new SR();
    rec.lang='tr-TR';
    rec.interimResults=false;
    rec.continuous=false;
    rec.maxAlternatives=1;
    if(btn){btn.disabled=true;btn.textContent='Dinleniyor…';}
    rec.onresult=function(ev){
      let text='';
      try{
        if(ev.results){
          for(let i=0;i<ev.results.length;i++){
            if(ev.results[i]&&ev.results[i][0]&&ev.results[i][0].transcript){
              text+=(text?' ':'')+ev.results[i][0].transcript;
            }
          }
        }
      }catch(e){}
      text=(text||'').trim();
      if(text){
        ta.value=(ta.value?ta.value+' ':'')+text;
        const cc=document.getElementById('charCount');
        if(cc)cc.textContent=ta.value.length+'/1000';
        try{ta.dispatchEvent(new Event('input',{bubbles:true}));}catch(e){}
      }
    };
    rec.onerror=function(ev){
      const code=(ev&&ev.error)?String(ev.error):'';
      if(code==='aborted')return;
      if(code==='not-allowed'||code==='service-not-allowed'){
        alert('Mikrofon izni reddedildi. Tarayıcı adres çubuğundan mikrofona izin verin.');
      }else if(code==='no-speech'){
        alert('Ses algılanamadı. Lütfen tekrar deneyin veya metni yazın.');
      }else if(code==='network'){
        alert('Ses tanıma ağına ulaşılamadı. Bağlantınızı kontrol edip tekrar deneyin.');
      }else if(code==='audio-capture'){
        alert('Mikrofona erişilemedi. Cihaz mikrofonunu kontrol edin.');
      }else{
        alert('Sesli giriş hatası ('+code+'). Lütfen metni yazın veya tekrar deneyin.');
      }
    };
    rec.onend=function(){
      resetBtn();
    };
    rec.start();
  }catch(e){
    resetBtn();
    alert('Sesli giriş başlatılamadı. Lütfen metni yazın.');
  }
}

function hzSeenKey(){const s=getAuthSession();return 'isimi_hz_seen_'+((s&&s.user&&s.user.id)||'anon')}

async function hzAlerts(p,reqs){
 const seen=hzSeen();const newReqs=providerOpenRequests(p,reqs).filter(r=>r.id&&!seen['r:'+r.id]);
 let offers=[];try{offers=await supabaseReadAuth('GET','offers?select=id,request_id,status&provider_id=eq.'+encodeURIComponent(String(p.id))+'&order=created_at.desc&limit=50');}catch(e){}
 offers=Array.isArray(offers)?offers:[];window.__hzOff=window.__hzOff||{};offers.forEach(o=>{window.__hzOff[o.id]=o});
 const dev=offers.filter(o=>o.status&&o.status!=='pending'&&seen['o:'+o.id]!==o.status).map(o=>({o,r:(reqs||[]).find(r=>String(r.id)===String(o.request_id))})).filter(x=>x.r&&!['Tamamlandı','İptal'].includes(String(x.r.status||x.r.durum)));
 const active=offers.filter(o=>o.status==='accepted').map(o=>({o,r:(reqs||[]).find(r=>String(r.id)===String(o.request_id))})).filter(x=>x.r&&String(x.r.status||x.r.durum)==='Devam ediyor');
 return {newReqs,dev,active};
}

   for(const p of mine){const a=await hzAlerts(p,reqs);n+=a.newReqs.length+a.dev.length}}}catch(e){}
 document.body.classList.toggle('hzHas',n>0);

/* Müşteri: kendi taleplerine gelen ve henüz görmediği bekleyen teklifler (mevcut RLS: talep sahibi kendi taleplerinin tekliflerini okur) */
async function hzCustAlerts(){
 const s=getAuthSession(),uid=s&&s.user&&s.user.id,out={total:0,byNo:{},active:[]};if(!uid)return out;
 const rows=await supabaseReadAuth('GET','requests?select=*&user_id=eq.'+encodeURIComponent(uid)+'&order=created_at.desc&limit=100');
 const reqs=(Array.isArray(rows)?rows:[]).filter(r=>['pending','accepted'].includes(String(r.status||'pending')));if(!reqs.length)return out;
 let offers=await supabaseReadAuth('GET','offers?select=id,request_id,status&request_id=in.('+reqs.map(r=>r.id).join(',')+')&limit=500');offers=Array.isArray(offers)?offers:[];
 const seen=hzSeen();
 reqs.forEach(r=>{const m=mapRequest(r),no=String(m.talep_no||m.id||'');
  if(String(r.status)==='accepted'){out.active.push(no);return}
  const n=offers.filter(o=>String(o.request_id)===String(r.id)&&o.status==='pending'&&!seen['co:'+o.id]).length;if(n){out.byNo[no]=n;out.total+=n}});
 return out;
}

function v2Fold(s){
  return String(s==null?'':s).toLocaleLowerCase('tr-TR').replace(/[’'`´]/g,'')
    .replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u')
    .replace(/â/g,'a').replace(/î/g,'i').replace(/û/g,'u').replace(/\u0307/g,'').replace(/\s+/g,' ').trim();
}

function v2ParseNum(s){
  s=String(s||'').trim();
  if(/^\d{1,3}(\.\d{3})+$/.test(s)) return parseFloat(s.replace(/\./g,''));
  return parseFloat(s.replace(',','.'));
}

function v2ParseListingQuery(text){
  var raw=String(text||'').trim();
  var tf=' '+v2Fold(raw).replace(/₺/g,' tl ')+' ';
  var t=tf, f={}, gm=0, car=0, extra={};
  function take(re){
    var m=t.match(re); if(!m) return null;
    var i=m.index, before=t.slice(Math.max(0,i-16),i), after=t.slice(i+m[0].length,i+m[0].length+26);
    t=t.slice(0,i)+' '+t.slice(i+m[0].length);
    return {m:m,before:before,after:after};
  }
  function mod(x){
    if(/^\s*(alti|altinda|kadar|max|maksimum|en fazla|azami)/.test(x.after)||/(max|maksimum|en fazla|azami)\s*$/.test(x.before)) return 'max';
    if(/^\s*(ustu|ustunde|uzeri|uzerinde|ve ustu|ve uzeri|sonrasi|en az|min|minimum)/.test(x.after)||/(min|minimum|en az)\s*$/.test(x.before)) return 'min';
    return '';
  }
  var x;
  /* oda */
  if((x=take(/(?:^|\s)(\d)\s*\+\s*([0-9])(?=\s|$)/))){ f.rooms=x.m[1]+'+'+x.m[2]; gm+=2; }
  /* km */
  if((x=take(/(\d{1,3}(?:\.\d{3})+|\d+(?:[.,]\d+)?)\s*(bin)?\s*km(?=\s|$)/))){
    var kn=v2ParseNum(x.m[1]); if(x.m[2]) kn*=1000;
    if(kn>0){ if(mod(x)==='min') f.minKm=String(Math.round(kn)); else f.maxKm=String(Math.round(kn)); car+=2; }
  }
  /* m² */
  if((x=take(/(\d{2,4})\s*(?:m2|m²|metrekare|mkare|m kare)(?=\s|$)/))){
    var sn=Number(x.m[1]); if(mod(x)==='max') f.maxSqm=String(sn); else f.minSqm=String(sn); gm+=1;
  }
  /* fiyat aralığı: 2-3 milyon */
  if((x=take(/(\d+(?:[.,]\d+)?)\s*[-–]\s*(\d+(?:[.,]\d+)?)\s*(milyon|mn|bin)(?=\s|$)/))){
    var u=x.m[3]==='bin'?1e3:1e6; f.minPrice=String(Math.round(v2ParseNum(x.m[1])*u)); f.maxPrice=String(Math.round(v2ParseNum(x.m[2])*u));
  }else if((x=take(/(\d+(?:[.,]\d+)?)\s*(milyon|mn|bin|k|tl|lira)(?=\s|$)/))){
    var mult=(x.m[2]==='milyon'||x.m[2]==='mn')?1e6:(x.m[2]==='bin'||x.m[2]==='k')?1e3:1;
    var pv=Math.round(v2ParseNum(x.m[1])*mult);
    if(pv>0){ if(mod(x)==='min') f.minPrice=String(pv); else f.maxPrice=String(pv); }
  }else if((x=take(/(?:^|\s)(\d{1,3}(?:\.\d{3}){2,}|\d{6,9})(?=\s|$)/))){
    var bp=Math.round(v2ParseNum(x.m[1])); if(bp>0){ if(mod(x)==='min') f.minPrice=String(bp); else f.maxPrice=String(bp); }
  }
  /* yıl */
  if((x=take(/(?:^|\s)((?:19[89]|20[0-3])\d)(\+)?(?=\s|$)/))){
    var yr=x.m[1]; car+=1;
    if(x.m[2]||/^\s*(ve\s+)?(ustu|uzeri|sonrasi|ustunde|yeni)/.test(x.after)) f.minYear=yr;
    else if(/^\s*(ve\s+)?(alti|oncesi|altinda|eski)/.test(x.after)) f.maxYear=yr;
    else { f.minYear=yr; f.maxYear=yr; }
  }
  /* ilan tipi + kategori */
  if(/(^|\s)satilik(\s|$)/.test(t)){ f.deal='satilik'; gm+=1; }
  else if(/(^|\s)(kiralik|kiralamak|kira)(\s|$)/.test(t)){ f.deal='kiralik'; gm+=1; }
  if(/(^|\s)(arsa|tarla|bag|bahce)(\s|$)/.test(t)){ f.category='Arsa'; gm+=2; }
  else if(/(^|\s)(is yeri|isyeri|dukkan|ofis|magaza|depo|fabrika|atolye)(\s|$)/.test(t)){ f.category='İş Yeri'; gm+=2; }
  else if(/(^|\s)(daire|ev|evi|konut|villa|rezidans|mustakil|yazlik|studyo|stüdyo)(\s|$)/.test(t)||f.rooms){ f.category='Konut'; gm+=2; }
  /* konum */
  try{
    var best='',bestLen=0;
    (typeof DISTRICTS!=='undefined'?DISTRICTS:[]).forEach(function(d){
      var df=v2Fold(d); if(df.length<3) return;
      var re=new RegExp('(?:^|[^a-z])'+df.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[a-z]{0,4}(?=$|[^a-z])');
      if(re.test(tf)&&df.length>bestLen){ best=d; bestLen=df.length; }
    });
    if(best){ f.district=best; f.city='İzmir'; }
    else if(/(^|[^a-z])izmir/.test(tf)) f.city='İzmir';
  }catch(e){}
  /* araç: mevcut parseOtoFreeText'i kullan */
  var p={};
  try{ var po=parseOtoFreeText(raw); p=(po&&po.partial)||{}; }catch(e){}
  if(p.brand){ f.brand=p.brand; car+=2; }
  if(p.model){ f.model=p.model; car+=1; }
  if(!f.brand){
    var hits=[];
    try{ Object.keys(OTO_CATALOG).forEach(function(b){ if(b==='Diğer') return; Object.keys(OTO_CATALOG[b]).forEach(function(mod){
      var mf=v2Fold(mod); if(mf.length<3) return;
      if(new RegExp('(?:^|\\s)'+mf.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=\\s|$)').test(tf)) hits.push([b,mod]);
    }); }); }catch(e){}
    if(hits.length===1){ f.brand=hits[0][0]; f.model=hits[0][1]; car+=2; }
  }
  if(p.fuel){ f.fuel=p.fuel; car+=1; }
  if(p.gear){ f.gear=p.gear; car+=1; }
  if(p.body){ f.body=p.body; car+=1; }
  if(p.drive){ f.drive=p.drive; car+=1; }
  if(/(^|\s)(araba|otomobil|arac|suv|sedan|hatchback|cabrio)(\s|$)/.test(tf)) car+=1;

  var type='q', cat='all', isCar=car>0&&car>=gm, isGm=gm>0&&!isCar;
  var keysCar=['brand','model','minYear','maxYear','minKm','maxKm','fuel','gear','body','drive'];
  var keysGm=['category','rooms','deal','minSqm','maxSqm'];
  var out={};
  if(isCar){
    type='otomobil'; cat='otomobil';
    keysCar.concat(['minPrice','maxPrice','city','district']).forEach(function(k){ if(f[k]!==undefined) out[k]=f[k]; });
  }else if(isGm){
    type='gayrimenkul';
    cat=f.category==='Konut'?'konut':f.category==='Arsa'?'arsa':f.category==='İş Yeri'?'isyeri':'gayrimenkul';
    keysGm.concat(['minPrice','maxPrice','city','district']).forEach(function(k){ if(f[k]!==undefined) out[k]=f[k]; });
  }else if(f.minPrice||f.maxPrice||f.district||f.city){
    type='common'; ['minPrice','maxPrice','city','district'].forEach(function(k){ if(f[k]!==undefined) out[k]=f[k]; });
  }
  return {raw:raw,type:type,cat:cat,f:out,structured:type!=='q',q:type==='q'?raw:''};
}

function v2Intent(text){
  var t=v2Fold(text);
  if(!t) return {kind:'empty'};
  if(/(ustasiyim|ustayim|kalfayim|hizmet veriyorum|hizmet vermek|hizmet sunuyorum|musteri ariyorum)/.test(t)||/(^|\s)is\s+(ariyorum|bakiyorum)(\s|$)/.test(t)) return {kind:'provider',raw:text};
  var subject=/(arac|araba|otomobil|oto\b|motor)/.test(t)?'arac':/(arsa|tarla)/.test(t)?'arsa':/(is yeri|isyeri|dukkan|ofis)/.test(t)?'isyeri':/(ev|evim|evimi|daire|konut|villa|tapu)/.test(t.replace(/\bev\b/g,' ev '))?'konut':'';
  if(/(sat(mak|acagim|ayim|iyorum|mam|ip)|satisa|satisini|devretmek|devredecegim|kiraya vermek|kiraya verece)/.test(t)) return {kind:'sell',subject:subject,raw:text};
  var parsed=v2ParseListingQuery(text);
  var svcStrong=/(^|\s)(usta|tamir|tamirat|tamiri|tadilat|ariza|bozuldu|calismiyor|kirildi|sizinti|tikandi|montaj|kurulum|badana|temizlik|nakliye|cilingir|tesisat|elektrikci|klima|kombi|petek)(\s|$)/.test(t);
  var svc=null; try{ svc=parseServiceFreeText(text); }catch(e){}
  if(svcStrong&&(!parsed.structured||parsed.type==='common')) return {kind:'service',svc:svc,raw:text};
  if(parsed.structured) return {kind:'listing',parsed:parsed,raw:text};
  if(/(tapu|noter|evrak|resmi|belge|kurum|ruhsat|vekalet|tescil|harc|basvuru|edevlet|e devlet|vergi|devir)/.test(t)) return {kind:'official',raw:text};
  if(svc&&svc.category) return {kind:'service',svc:svc,raw:text};
  return {kind:'listing',parsed:parsed,raw:text};
}

  if(parsed.q){ g.q=parsed.q; o.q=parsed.q; }

  return showKesfet(false);
}

function v2BindPartsEditor(root,parts,onChange){
  if(!root||root.__pbound) return; root.__pbound=true;
  function redraw(){
    var host=root.querySelector('.v2SvgHost'); if(host) host.innerHTML=v2SvgPartsHtml(parts,true);
    var lg=root.querySelector('.v2LgHost'); if(lg) lg.innerHTML=v2PartsLegendHtml(parts,'');
    if(onChange) onChange(parts);
  }
  function tap(g){
    var k=g.getAttribute('data-part'); if(!k) return; var tool=root.getAttribute('data-tool')||'lokal';
    if(tool==='orijinal'||parts[k]===tool) delete parts[k]; else parts[k]=tool;
    redraw(); var again=root.querySelector('[data-part="'+k+'"]'); if(again) again.focus();
  }
  root.addEventListener('click',function(e){
    var pb=e.target.closest('.v2PalB');
    if(pb){ root.setAttribute('data-tool',pb.getAttribute('data-tool')); root.querySelectorAll('.v2PalB').forEach(function(x){ var on=x===pb; x.classList.toggle('on',on); x.setAttribute('aria-checked',String(on)); }); return; }
    if(e.target.closest('.v2PClear')){ Object.keys(parts).forEach(function(k){ delete parts[k]; }); redraw(); return; }
    var g=e.target.closest('[data-part]'); if(g) tap(g);
  });
  root.addEventListener('keydown',function(e){ if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('data-part')){ e.preventDefault(); tap(e.target); } });
}

async function v2FillSimilar(row,type){
  var box=document.getElementById('v2Similar'); if(!box) return;
  try{
    var md=row.metadata||{};
    var rows=await supabaseRequest('GET','listings?listing_type=eq.'+type+'&status=eq.published&id=neq.'+encodeURIComponent(row.id)+'&order=created_at.desc&limit=24&select=id,title,price,currency,city,district,neighborhood,category,description,status,created_at,listing_type,metadata');
    rows=Array.isArray(rows)?rows:[];
    var pr=Number(row.price)||0;
    rows.forEach(function(r){
      var m=r.metadata||{}, s=0, rp=Number(r.price)||0;
      if(type==='otomobil'){ if(md.brand&&m.brand===md.brand) s+=3; if(md.model&&m.model===md.model) s+=2; }
      else{ if(row.category&&r.category===row.category) s+=2; if(md.rooms&&m.rooms===md.rooms) s+=1; }
      if(row.district&&r.district===row.district) s+=1; if(pr&&rp&&Math.abs(rp-pr)/pr<=0.3) s+=1; r.__s=s;
    });
    rows.sort(function(a,b){ return b.__s-a.__s; });
    var top=rows.slice(0,8); if(!document.getElementById('v2Similar')) return;
    if(!top.length){ var sec=document.getElementById('v2s-similar'); if(sec) sec.remove(); var jc=document.querySelector('[data-jump="v2s-similar"]'); if(jc) jc.remove(); return; }
    box.innerHTML=top.map(function(r){ return kesfetCardHtml(r,type); }).join('');
  }catch(e){ console.warn('benzer ilanlar',e); var s2=document.getElementById('v2s-similar'); if(s2) s2.remove(); var j2=document.querySelector('[data-jump="v2s-similar"]'); if(j2) j2.remove(); }
}

function v2FactsSummary(row,type){
  var md=row.metadata||{}, f=[];
  if(type==='otomobil'){
    if(md.year) f.push(md.year);
    if(md.km!==undefined&&md.km!==''&&isFinite(Number(md.km))) f.push(Number(md.km).toLocaleString(V2_MARKET.locale)+' '+V2_MARKET.units.distance);
    if(md.fuel) f.push(md.fuel); if(md.gear) f.push(md.gear);
  }else{
    if(md.rooms) f.push(md.rooms); var sq=md.sqm||md.m2||md.area; if(sq) f.push(sq+' '+V2_MARKET.units.area);
    if(md.floor) f.push(md.floor+'. kat'); else if(row.category&&row.category!=='Konut') f.push(row.category);
  }
  return f.join(' · ');
}

function v2CrumbsHtml(row,type){
  var md=row.metadata||{}, c=[], acc={};
  function push(label,filters){ Object.keys(filters).forEach(function(k){ acc[k]=filters[k]; }); c.push([label,JSON.parse(JSON.stringify(acc)),acc.__cat]); }
  if(type==='otomobil'){
    acc.__cat='otomobil'; push('Otomobil',{});
    if(md.brand) push(md.brand,{brand:md.brand}); if(md.model) push(md.model,{model:md.model});
  }else{
    var cat=row.category==='Arsa'?'arsa':row.category==='İş Yeri'?'isyeri':'konut';
    acc.__cat=cat; push(row.category||'Konut',{category:row.category||'Konut'});
    if(md.deal_type) push(md.deal_type==='kiralik'?'Kiralık':'Satılık',{deal:md.deal_type});

async function v2SaveEdit(row,car,maxPh){

function v2TokenExp(s){
  try{
    if(s&&s.expires_at) return Number(s.expires_at)*1000;
    var t=s&&(s.access_token||s.accessToken); if(!t) return 0;
    var p=JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    return (p.exp||0)*1000;
  }catch(e){ return 0; }
}

async function v2EnsureFreshToken(){
  var s=getAuthSession(); if(!s||!s.refresh_token) return s;
  var exp=v2TokenExp(s); if(!exp||exp-Date.now()>60000) return s;
  if(__v2Refreshing) return __v2Refreshing;
  __v2Refreshing=(async function(){
    try{
      var r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});
      var d=await r.json().catch(function(){return {};});
      if(!r.ok||!d.access_token){ console.warn('Oturum yenilenemedi',d&&(d.error_description||d.msg||d.error)); return s; }
      var ns=Object.assign({},s,d,{user:d.user||s.user}); saveAuthSession(ns); return ns;
    }catch(e){ console.warn('Oturum yenileme hatası',e); return s; }
    finally{ setTimeout(function(){ __v2Refreshing=null; },0); }
  })();
  return __v2Refreshing;
}

/* Alt menü sekmeleri: aralarında geçiş yeni geçmiş kaydı açmaz; geri tuşu doğrudan Ana sayfaya döner. */
var V2_NAV_TABS={showKesfet:1,showMine:1,showFoodHome:1,showAccount:1};
var V2_NAV_FOOD_INNER={showFoodSearch:1,showFoodVenue:1,showFoodCart:1,showFoodCheckout:1,showFoodOrders:1,showFoodOrderDetail:1,showFoodNotifications:1,showFoodAccount:1,showFoodHelp:1,showFoodCoupons:1,showFoodBusiness:1,showFoodMenu:1,showFoodSettings:1,showFoodCourier:1};
function v2NavPush(name,fn,args){
  if(V2_NAV.busy) return;
  try{
    var sig=v2NavSig(name,args), cur=V2_NAV.stack[V2_NAV.idx], url=v2NavUrl(name,args), rep=V2_NAV.replaceNext||name==='v2DraftResult';
    V2_NAV.replaceNext=false;
    if(cur) cur.scroll=window.scrollY||0;
    /* Ana sayfaya gidiş yeni kayıt açmaz: tarayıcı geçmişinde ilk kayda geri sarılır (arada kalan ekranlar geri tuşunda tekrar dolaşılmaz). */
    if(name==='showHome'&&V2_NAV.idx>0){ var n=V2_NAV.idx; V2_NAV.stack=[{sig:sig,name:name,fn:fn,scroll:0}]; V2_NAV.idx=0; V2_NAV.skip++; V2_NAV.homeUrl=url; history.go(-n); return; }
    if(!rep&&cur&&cur.sig!==sig&&V2_NAV_TABS[name]&&V2_NAV_TABS[cur.sig]) rep=true;
    if(name==='showFoodHome'&&cur&&V2_NAV_FOOD_INNER[cur.name]){
      var j=V2_NAV.idx-1; while(j>=0&&V2_NAV.stack[j].name!=='showFoodHome') j--;
      if(j>=0){ var n2=V2_NAV.idx-j; V2_NAV.stack=V2_NAV.stack.slice(0,j+1); V2_NAV.stack[j].fn=fn; V2_NAV.idx=j; V2_NAV.skip++; history.go(-n2); return; }
    }
    if(!rep&&cur&&V2_NAV_FOOD_INNER[name]&&V2_NAV_FOOD_INNER[cur.name]) rep=true;
    if(V2_NAV.idx<0){ V2_NAV.stack=[{sig:sig,name:name,fn:fn,scroll:0}]; V2_NAV.idx=0; history.replaceState({v2:0},'',url); }
    else if(cur&&(cur.sig===sig||rep)){ cur.sig=sig; cur.name=name; cur.fn=fn; history.replaceState({v2:V2_NAV.idx},'',url); }
    else{ V2_NAV.stack=V2_NAV.stack.slice(0,V2_NAV.idx+1); V2_NAV.stack.push({sig:sig,name:name,fn:fn,scroll:0}); V2_NAV.idx++; history.pushState({v2:V2_NAV.idx},'',url); }
  }catch(e){ console.warn('nav',e); }
}

function v2NavInstall(){
  ['showHome','showKesfet','showMine','showFavorites','showSavedSearches','v2LoadDetail','v2Workspace','v2EditListing','showRequest','showRequests','showRequestDetail','showProviderEntry','showProviderPanel','showProviderRequestDetail','showWorkAreaGayrimenkul','showWorkAreaArac','showListingsCategory','showGayrimenkulCreateForm','showGayrimenkulConfirm','showOtoParseConfirm','startOtomobilWizard','viewMyListingSummary','openOfficialPrepGate','v2DraftResult','showFoodHome','showAccount'].forEach(function(n){

  });

  var c=(state.cases||[]).filter(function(x){ return String(x.status||'')!=='completed'; })[0];

}

   const r=await fetch(url,{method:'POST',headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});

   if(!r.ok)throw new Error(data.error_description||data.msg||data.message||'Kimlik doğrulama başarısız.');

   }

async function ensureCaseSteps(){
 if(!H.dbId)return;
 const steps=H.caseSteps&&H.caseSteps.length?H.caseSteps:defaultCaseSteps();
 H.caseSteps=steps;
 try{
  const existing=await supabaseAuthRequest('GET','hallet_case_steps?select=id,step_key&case_id=eq.'+encodeURIComponent(H.dbId)+'&limit=50');
  const existingKeys=new Set((Array.isArray(existing)?existing:[]).map(x=>x.step_key));
  const missing=steps.filter(x=>!existingKeys.has(x.step_key)).map(x=>({case_id:H.dbId,step_key:x.step_key,title:x.title,description:x.description,sort_order:x.sort_order,institution:x.institution,status:x.status||'pending',is_optional:!!x.is_optional,metadata:x.metadata||{},completed_at:x.completed_at||null}));
  if(missing.length){const created=await supabaseAuthRequest('POST','hallet_case_steps',missing);(Array.isArray(created)?created:[]).forEach(r=>{const st=H.caseSteps.find(x=>x.step_key===r.step_key);if(st)st.id=r.id;});}
 }catch(e){console.warn('Hallet işlem adımları kaydedilemedi; dosya kaydı korunuyor.',e);}
}
async function updateCaseStep(key){
 const fromSaved=!!H.dbId;
 const step=H.caseSteps.find(x=>x.step_key===key);
 if(!step)return;
 const previousStatus=step.status||'pending';
 const previousCompletedAt=step.completed_at||null;
 let nextStatus=previousStatus==='completed'?'pending':'completed';
 const nextCompletedAt=nextStatus==='completed'?new Date().toISOString():null;
 if(H.module==='kurum_basvurusu'&&nextStatus==='completed'){
  if(key==='info'&&!kurumQuestionsAnswered()){
   alert('Önce başvuru bilgilerini tamamla (soruları yanıtla).');
   return;
  }
  if(key==='documents'&&!kurumRequiredDocsUploaded()){
   alert('Zorunlu belgeler yüklenmeden bu adım tamamlanamaz.');
   return;
  }
 }
 if(!H.dbId){
  step.status=nextStatus;
  step.completed_at=nextCompletedAt;
  return showActiveResult(false);
 }
 const target=H.caseSteps.find(x=>x.step_key===key)||step;
 target.status=nextStatus;
 target.completed_at=nextCompletedAt;
 try{
  const filter=target.id
   ? 'id=eq.'+encodeURIComponent(target.id)
   : 'case_id=eq.'+encodeURIComponent(H.dbId)+'&step_key=eq.'+encodeURIComponent(key);
  const updated=await supabaseAuthRequest(
   'PATCH',
   'hallet_case_steps?'+filter+'&select=id,case_id,step_key,status,completed_at,updated_at',
   {status:nextStatus,completed_at:nextCompletedAt,updated_at:new Date().toISOString()}
  );
  if(!Array.isArray(updated)||!updated.length)throw new Error('İşlem adımı veritabanında güncellenemedi.');
  const saved=updated[0];
  if(saved.status!==nextStatus){throw new Error('İşlem adımı durumu doğrulanamadı.');}
  target.status=saved.status;
  target.completed_at=saved.completed_at||null;
 }catch(e){
  target.status=previousStatus;
  target.completed_at=previousCompletedAt;
  console.error('İşlem adımı kaydedilemedi:',e);
  const c=document.querySelector('#hallet-root .hc');
  if(c&&!c.querySelector('.err'))c.insertAdjacentHTML('beforeend','<div class="err">İşlem adımı kaydedilemedi. Lütfen tekrar deneyin.</div>');
 }
 showActiveResult(fromSaved);
}

function buildCasePayload(){
 const a=H.answers;
 const sale=Number(a.sale_price)||0;
 const purchase=Number(a.acquisition_price)||0;
 const municipalValue=Number(a.municipal_tax_value)||0;
 const harcBase=Math.max(sale,municipalValue,0);
 const sellerFee=harcBase*0.02;
 const buyerFee=harcBase*0.02;
 const totalFee=harcBase*0.04;
 const grossGain=(sale>0&&purchase>0)?sale-purchase:null;
 const warnings=[];
 if(a.seller_type!=='real_person')warnings.push('Bu aktif akış gerçek kişi satışı için hazırlanmıştır. Tüzel kişi satışında farklı belge ve süreçler gerekebilir.');
 if(a.property_location!=='turkey')warnings.push('Yurt dışındaki taşınmazlar için bu Türkiye tapu satış akışı kullanılmamalıdır.');
 if(a.title_deed!=='yes')warnings.push('Tapu bilgileri işlem öncesinde doğrulanmalıdır.');
 if(a.multiple_owners==='yes')warnings.push('Birden fazla malik varsa tüm maliklerin veya geçerli temsilcilerinin işlem durumu ayrıca kontrol edilmelidir.');
 if(a.encumbrance!=='no')warnings.push('Haciz, ipotek veya başka bir takyidat varsa satış öncesinde güncel tapu kaydı üzerinden ayrıca değerlendirilmelidir.');
 if(a.representation==='yes')warnings.push('Vekâletname/temsil belgesinin kapsamı ve geçerliliği işlem öncesinde kontrol edilmelidir.');
 if(a.buyer_ready!=='yes')warnings.push('Alıcının hazır olmaması işlem zamanlamasını etkileyebilir.');
 let fivePassed=false;
 if(a.acquisition_date){const d=new Date(a.acquisition_date+'T00:00:00');if(!Number.isNaN(d.getTime())){const x=new Date(d);x.setFullYear(x.getFullYear()+5);fivePassed=new Date()>=x;if(!fivePassed&&a.acquisition_type==='purchase')warnings.push('5 yıllık süre dolmadan satışta değer artış kazancı yönünden vergi değerlendirmesi gerekebilir.');}}
 const capitalGainRelevant=!fivePassed&&a.acquisition_type!=='inheritance'&&a.acquisition_type!=='gift';
 if(sale>0&&municipalValue>0&&sale<municipalValue)warnings.push('Beyan edilen satış bedeli emlak vergisi değerinden düşük görünüyor; tapu harcı ön hesabında daha yüksek değer esas alınmıştır.');
 return {
   case_type:'konut_satisi',
   status:(H.status==='completed'?'completed':(H.status||'draft')),
   title:'Konut satışı',
   summary:'İşini Hallet ön kontrol dosyası — konut satışı',
   user_id:getAuthSession()?.user?.id||null,
   customer_id:getAuthSession()?.user?.id||null,
   district:a.district||null,
   city:a.city||'İzmir',
   created_at:H.createdAt||new Date().toISOString(),
   updated_at:new Date().toISOString(),
   metadata:{
     case_no:H.caseId,
     module:'tasinmaz',
     transaction_type:'konut_satisi',
     answers:a,
     calculations:{sale_price:sale,municipal_tax_value:municipalValue,harc_base:harcBase,acquisition_price:purchase,gross_difference:grossGain,seller_tapu_harci:sellerFee,buyer_tapu_harci:buyerFee,total_tapu_harci:totalFee,five_years_passed:fivePassed,capital_gain_relevant:capitalGainRelevant},
     warnings,
     documents:H.documents,
     document_summary:documentSummary(getDocumentChecklist(a)),
     rule_engine:{version:'v2',checked_at:new Date().toISOString(),capital_gain_relevant:capitalGainRelevant,tapu_harci_base:harcBase},
     source_note:'Bu dosya ön kontrol aracıdır; resmi başvuru sırasında TKGM’nin güncel koşulları esas alınmalıdır.'
   }
 };
}
async function saveCase(silent=false){
 if(!H.caseId)H.caseId='IH-'+new Date().toISOString().replace(/\D/g,'').slice(0,14)+'-'+Math.random().toString(36).slice(2,7).toUpperCase();
 const session=getAuthSession();
 if(!session?.access_token||!session?.user?.id){openAuthModal('login');return;}
 const btn=document.querySelector('#hallet-root [data-a="savecase"]');
 if(btn){btn.disabled=true;btn.textContent='KAYDEDİLİYOR...';}
 try{
   const payload=buildCasePayload();
   let rows;
   if(H.dbId){
     rows=await supabaseAuthRequest('PATCH','hallet_cases?id=eq.'+encodeURIComponent(H.dbId),payload);
   }else{
     rows=await supabaseAuthRequest('POST','hallet_cases',payload);
   }
   const row=Array.isArray(rows)?rows[0]:rows;
   H.dbId=row?.id||H.dbId;
   H.createdAt=row?.created_at||H.createdAt||new Date().toISOString();
   await ensureCaseSteps();
   if(btn){btn.textContent='✓ DOSYA KAYDEDİLDİ';btn.disabled=true;btn.classList.add('saved');}
   if(!silent)alert('İşlem dosyan Supabase hesabına kaydedildi. ✓\n\nDosya No: '+H.caseId);
 }catch(e){
   console.error('Hallet dosya kayıt hatası:',e);
   if(btn){btn.disabled=false;btn.textContent='DOSYAYI KAYDET';}
   alert('Dosya kaydedilemedi.\n\n'+(e.message||'Bilinmeyen hata'));
 }
}

async function savePropCase(silent){
 const f=getPropFlow(H.propFlowId); if(!f){alert('Akış yok');return;}
 const session=getAuthSession();
 if(!session?.access_token||!session?.user?.id){openAuthModal('login');return;}
 if(!H.caseId)H.caseId='IH-'+new Date().toISOString().replace(/\D/g,'').slice(0,14)+'-'+Math.random().toString(36).slice(2,7).toUpperCase();
 const docs=getPropDocumentChecklist(H.answers);
 const ready=docs.filter(d=>H.documents[d.key]).length;
 const payload={
  case_type:f.case_type,
  user_id:session.user.id,
  customer_id:session.user.id,
  status:(H.status==='completed'?'completed':(H.status||'draft')),
  title:f.title,
  summary:'Hazırlık dosyası — resmî işlem yerine geçmez',
  city:'İzmir',
  district:null,
  metadata:{
   module:'prop',
   prop_flow:f.id,
   transaction_type:f.case_type,
   case_no:H.caseId,
   answers:H.answers||{},
   documents:H.documents||{},
   document_summary:{total:docs.length,ready,percent:docs.length?Math.round(ready/docs.length*100):0,missing:docs.filter(d=>!H.documents[d.key]).map(d=>({key:d.key,title:d.title}))},
   disclaimer:f.disclaimer
  }
 };
 try{
  let rows;
  if(H.dbId)rows=await supabaseAuthRequest('PATCH','hallet_cases?id=eq.'+encodeURIComponent(H.dbId),payload);
  else rows=await supabaseAuthRequest('POST','hallet_cases',payload);
  const row=Array.isArray(rows)?rows[0]:rows;
  H.dbId=row?.id||H.dbId;
  H.createdAt=row?.created_at||H.createdAt||new Date().toISOString();
  await ensureCaseSteps();
  if(!silent)alert('Dosya kaydedildi.\n\n'+f.title+'\nNo: '+H.caseId);
  propResult(false);
 }catch(e){
  console.error(e);
  alert('Kayıt başarısız. case_type için DB constraint güncel mi kontrol edin.\n\n'+((e&&e.message)||e));
 }
}

async function storageUpload(path,file,token){
  // POST /object/{bucket}/{path} — authenticated path is only for GET download
  if(!token)throw new Error('Belge yüklemek için giriş yapmalısınız.');
  const safePath=path.split('/').filter(Boolean).map(encodeURIComponent).join('/');
  const url=SUPABASE_URL+'/storage/v1/object/hallet-documents/'+safePath;
  console.log('[DOCUMENT_LAYER] upload', {path,url,size:file&&file.size,type:file&&file.type});
  const headers={
    'Authorization':'Bearer '+token,
    'apikey':SUPABASE_KEY,
    'Content-Type':file.type||'application/octet-stream',
    'x-upsert':'false'
  };
  const res=await fetch(url,{method:'POST',headers,body:file});
  const text=await res.text();
  if(!res.ok){
    let d=null;try{d=text?JSON.parse(text):null}catch(e){}
    console.error('[DOCUMENT_LAYER] upload fail', {status:res.status,message:d&&d.message,details:d&&d.details,text:text&&text.slice(0,300)});
    throw new Error((d&&(d.message||d.error))||text||('Belge yüklenemedi (HTTP '+res.status+').'));
  }
  return true;
}
async function storageDelete(path,token){
  if(!token)throw new Error('Silmek için giriş yapmalısınız.');
  if(!path)throw new Error('Silinecek dosya yolu yok.');
  const safePath=String(path).split('/').filter(Boolean).map(encodeURIComponent).join('/');
  const url=SUPABASE_URL+'/storage/v1/object/hallet-documents/'+safePath;
  console.log('[DOCUMENT_LAYER] delete storage', {path,url});
  const res=await fetch(url,{method:'DELETE',headers:{'Authorization':'Bearer '+token,'apikey':SUPABASE_KEY}});
  const text=await res.text().catch(function(){return '';});
  if(!res.ok && res.status!==404){
    let d=null;try{d=text?JSON.parse(text):null}catch(e){}
    console.error('[DOCUMENT_LAYER] delete storage fail', {status:res.status,message:d&&d.message,text:text&&text.slice(0,300)});
    throw new Error((d&&(d.message||d.error))||text||('Storage silinemedi (HTTP '+res.status+').'));
  }
  return true;
}

async function saveDocumentRow(docKey,file,path){
  const session=getAuthSession();
  if(!session||!session.access_token||!session.user||!session.user.id||!H.dbId)throw new Error('Belgeyi kaydetmek için önce işlem dosyasını kaydetmelisiniz.');
  let docs=[];
  try{
    if(typeof activeDocumentChecklist==='function')docs=activeDocumentChecklist(H.answers||{})||[];
    else if(H.module==='prop'&&typeof getPropDocumentChecklist==='function')docs=getPropDocumentChecklist(H.answers||{})||[];
    else if(typeof getDocumentChecklist==='function')docs=getDocumentChecklist(H.answers||{})||[];
  }catch(e){docs=[];}
  const meta=(docs||[]).find(function(d){return d.key===docKey;});
  const body={
    case_id:H.dbId,
    doc_key:docKey,
    title:(meta&&meta.title)||docKey,
    is_required:!!(meta&&meta.required===true),
    is_conditional:false,
    condition_note:null,
    status:'uploaded',
    storage_path:path,
    mime_type:file.type||null,
    file_size_bytes:file.size||0,
    metadata:{original_name:file.name||null},
    user_id:session.user.id,
    updated_at:new Date().toISOString()
  };
  console.log('[DOCUMENT_LAYER] db insert', {case_id:H.dbId,doc_key:docKey,storage_path:path});
  const rows=await supabaseAuthRequest('POST','hallet_documents',body);
  return Array.isArray(rows)?rows[0]:rows;
}
async function ensureCaseSaved(){
  if(H.dbId)return true;
  if(H.module==='prop')await savePropCase(true);
  else if(H.module==='kurum_basvurusu')await saveKurumCase(true);
  else if(H.module==='arac_flow')await saveVehicleFlowCase(true);
  else if(H.module==='arac'||H.module==='arac_satisi')await saveAracCase(true);
  else await saveCase(true);
  return !!H.dbId;
}
async function uploadDocument(docKey,file){
  if(!file)return;
  const session=getAuthSession();
  if(!session||!session.access_token||!session.user||!session.user.id){openAuthModal('login');return;}
  if(file.size>10*1024*1024){alert('Dosya en fazla 10 MB olabilir.');return;}
  if(!(file.type==='application/pdf'||(file.type&&file.type.indexOf('image/')===0))){alert('Sadece PDF veya görsel dosyaları yükleyebilirsiniz.');return;}
  let uploadedPath=null;
  try{
    const saved=await ensureCaseSaved();
    if(!saved||!H.dbId)throw new Error('İşlem dosyası kaydedilemedi.');
    const safeName=(file.name||'belge').replace(/[^a-zA-Z0-9._-]/g,'_');
    const path=session.user.id+'/'+H.dbId+'/'+docKey+'/'+Date.now()+'-'+safeName;
    await storageUpload(path,file,session.access_token);
    uploadedPath=path;
    let row=null;
    try{
      row=await saveDocumentRow(docKey,file,path);
    }catch(dbErr){
      console.error('[DOCUMENT_LAYER] db after upload failed, rolling back storage', dbErr);
      try{await storageDelete(path,session.access_token);}catch(rb){console.error('[DOCUMENT_LAYER] rollback failed', rb);}
      throw dbErr;
    }
    H.documents[docKey]=true;
    const uploadedFile={id:row&&row.id||null,path:path,name:file.name||safeName,type:file.type||null,size:file.size||0};
    const existingFiles=getDocumentFiles(docKey);
    H.documentFiles[docKey]=existingFiles.concat([uploadedFile]);
    if(H.module==='kurum_basvurusu'){await saveKurumCase(true);kurumResult(false);}
    else if(H.module==='prop'){propResult(false);}
    else if(H.module==='arac_flow'){await saveVehicleFlowCase(true);vehicleFlowResult(false);}
    else if(H.module==='arac'||H.module==='arac_satisi'){await saveAracCase(true);aracResult(false);}
    else{await saveCase(true);result(false);}
    alert('Belge başarıyla yüklendi. ✓\n\n'+(file.name||'Belge'));
  }catch(e){
    console.error('[DOCUMENT_LAYER] upload error', e);
    alert('Belge yüklenemedi.\n\n'+(e&&e.message?e.message:'Bilinmeyen hata'));
  }
}
async function deleteDocument(docKey,index){
  const session=getAuthSession();
  if(!session||!session.access_token){openAuthModal('login');return;}
  const files=getDocumentFiles(docKey);
  const f=files[Number(index)||0];
  if(!f||!f.path){alert('Silinecek belge bulunamadı.');return;}
  if(!confirm('Bu belgeyi silmek istiyor musunuz?\n\n'+(f.name||f.path)))return;
  try{
    console.log('[DOCUMENT_LAYER] delete', {docKey,index,path:f.path,id:f.id});
    await storageDelete(f.path,session.access_token);
    if(f.id){
      await supabaseAuthRequest('DELETE','hallet_documents?id=eq.'+encodeURIComponent(f.id));
    }else if(H.dbId){
      // id yoksa path + case ile sil
      await supabaseAuthRequest('DELETE','hallet_documents?case_id=eq.'+encodeURIComponent(H.dbId)+'&storage_path=eq.'+encodeURIComponent(f.path));
    }
    const next=files.slice();
    next.splice(Number(index)||0,1);
    H.documentFiles[docKey]=next;
    if(!next.length)H.documents[docKey]=false;
    if(H.module==='kurum_basvurusu')kurumResult(false);
    else if(H.module==='prop')propResult(false);
    else if(H.module==='arac_flow')vehicleFlowResult(false);
    else if(H.module==='arac'||H.module==='arac_satisi')aracResult(false);
    else result(false);
    alert('Belge silindi.');
  }catch(e){
    console.error('[DOCUMENT_LAYER] delete error', e);
    alert('Belge silinemedi.\n\n'+(e&&e.message?e.message:'Bilinmeyen hata'));
  }
}

async function saveKurumCase(silent){

  }
 };

 try{

  if(H.dbId)rows=await supabaseAuthRequest('PATCH','hallet_cases?id=eq.'+encodeURIComponent(H.dbId)+'&select=id,status,created_at',payload);
  else rows=await supabaseAuthRequest('POST','hallet_cases?select=id,status,created_at',payload);

  await ensureCaseSteps();

  if(!silent)kurumResult(true);

 }

async function markCaseCompleted(){

     const stepState=stepSummary();
     const docs=activeDocumentChecklist(H.answers||{});
     const docState=documentSummary(docs);
     const canComplete=docState.complete&&stepState.done>=stepState.total&&stepState.total>0;
     if(!canComplete){alert('Önce tüm hazırlık adımlarını ve gerekli belgeleri tamamla.');return;}

    }

document.addEventListener('click',function(e){
  var node=e.target;
  if(node&&node.nodeType===3)node=node.parentElement;
  if(!node||!node.closest)return;
  var openBtn=node.closest('#hallet-root [data-a="openDoc"]');
  if(openBtn){
    e.preventDefault();
    e.stopPropagation();
    if(e.stopImmediatePropagation)e.stopImmediatePropagation();
    openDocument(openBtn.getAttribute('data-k')||'',Number(openBtn.getAttribute('data-i')||0)||0);
    return;
  }
  var delBtn=node.closest('#hallet-root [data-a="deleteDoc"]');
  if(delBtn){
    e.preventDefault();
    e.stopPropagation();
    if(e.stopImmediatePropagation)e.stopImmediatePropagation();
    if(typeof deleteDocument==='function')deleteDocument(delBtn.getAttribute('data-k')||'',Number(delBtn.getAttribute('data-i')||0)||0);
    return;
  }
  var el=node.closest('#hallet-root [data-a]');
  if(!el)return;
  e.preventDefault();
  e.stopPropagation();
  dispatch(el.getAttribute('data-a')||el.dataset.a,el);
},true);
