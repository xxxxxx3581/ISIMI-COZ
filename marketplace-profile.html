<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>İşimi Çöz · Satıcı Profili</title>
<style>
:root{--bg:#07111f;--card:#0d1a2b;--line:#20344d;--text:#eef4fb;--muted:#9eb0c5;--primary:#19c37d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}.wrap{max-width:620px;margin:auto;padding:18px 14px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-weight:900;font-size:18px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input,select,textarea{width:100%;background:#081523;color:var(--text);border:1px solid #29415d;border-radius:12px;padding:13px;outline:none}textarea{min-height:120px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--primary)}button{width:100%;border:0;border-radius:13px;padding:13px 15px;font-weight:800;cursor:pointer}.primary{background:var(--primary);color:#03130d}.secondary{background:#14263b;color:var(--text);border:1px solid var(--line);margin-top:9px}.notice,.success,.error{padding:12px;border-radius:12px;font-size:13px;line-height:1.5;margin:12px 0}.notice{background:#0b2030;border:1px solid #1e4c66}.success{background:#0b2b20;border:1px solid #185d43;color:#8bf1c4}.error{background:#35181b;border:1px solid #70272d;color:#ffb6b8}.hidden{display:none}.avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;background:#17334d;display:grid;place-items:center;font-weight:900;font-size:24px;margin-bottom:8px}.small{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><div class="brand">İŞİMİ ÇÖZ</div><div class="muted">Marketplace · Satıcı Profili</div></div></div>
<div id="status" class="notice">Supabase bağlanıyor…</div>
<div id="loginCard" class="card hidden"><h2>Giriş gerekli</h2><p class="muted">Satıcı profilini oluşturmak veya düzenlemek için mevcut İşimi Çöz hesabınla giriş yapmalısın.</p><button class="primary" onclick="location.href='/'">Ana uygulamaya dön</button></div>
<div id="profileCard" class="card hidden">
<h2>Satıcı profilin</h2>
<p class="muted">Bu bilgiler yayınlanmış ilanlarının “İlan sahibi” bölümünde gösterilebilir.</p>
<div id="avatarPreview" class="avatar">?</div>
<label>Görünen ad</label><input id="displayName" maxlength="100" placeholder="Örn: Ferhat Erkan">
<label>Satıcı tipi</label><select id="sellerType"><option value="individual">Bireysel</option><option value="professional">Profesyonel</option></select>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>Ülke</label><input value="TR" disabled></div><div><label>Dil</label><input value="tr-TR" disabled></div></div>
<label>İl</label><input id="city" maxlength="80" placeholder="İzmir">
<label>İlçe</label><input id="district" maxlength="80" placeholder="Karabağlar">
<label>Kısa biyografi</label><textarea id="bio" maxlength="500" placeholder="Kısaca kendini veya işletmeni tanıt…"></textarea>
<label>Profil fotoğrafı URL'si <span class="small">(şimdilik isteğe bağlı)</span></label><input id="avatarUrl" maxlength="500" placeholder="https://…">
<div id="saveMessage"></div>
<button id="saveBtn" class="primary" onclick="saveProfile()">Profili kaydet</button>
<button class="secondary" onclick="location.href='/'">← İşimi Çöz'e dön</button>
</div>
</div>
<script>
const SUPABASE_URL='https://zvffspbowdzvrrzefhkr.supabase.co';
const SUPABASE_KEY='sb_publishable_L_qb9Q4fHktE51PEqEhTAg_O4R0eDiW';
const statusEl=document.getElementById('status');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function setStatus(t,c){statusEl.textContent=t;statusEl.className=c||'notice'}
function getSession(){try{const raw=localStorage.getItem('isimi_coz_auth_session');return raw?JSON.parse(raw):null}catch(e){return null}}
async function api(method,path,body,prefer){const s=getSession();const token=s&&s.access_token;if(!token)throw new Error('Oturum bulunamadı.');const headers={apikey:SUPABASE_KEY,Authorization:'Bearer '+token,Accept:'application/json','Content-Type':'application/json',Prefer:prefer||'return=representation'};const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){d=t}if(!r.ok)throw new Error(d?.message||d?.details||d?.hint||('Supabase '+r.status));return d}
function fill(p){document.getElementById('displayName').value=p?.display_name||'';document.getElementById('sellerType').value=p?.seller_type||'individual';document.getElementById('city').value=p?.city||'';document.getElementById('district').value=p?.district||'';document.getElementById('bio').value=p?.bio||'';document.getElementById('avatarUrl').value=p?.avatar_url||'';updateAvatar(p?.avatar_url,p?.display_name)}
function updateAvatar(url,name){const e=document.getElementById('avatarPreview');if(url){e.innerHTML='<img src="'+esc(url)+'" alt="Profil" style="width:76px;height:76px;border-radius:50%;object-fit:cover">'}else{e.textContent=(name||'?').trim().charAt(0).toUpperCase()||'?'}}
async function load(){const s=getSession();if(!s?.user?.id){document.getElementById('loginCard').classList.remove('hidden');setStatus('Giriş gerekli.','error');return}try{const rows=await api('GET','marketplace_profiles?select=*&user_id=eq.'+encodeURIComponent(s.user.id)+'&limit=1');fill(rows?.[0]||{});document.getElementById('profileCard').classList.remove('hidden');setStatus('Profil hazır.','success')}catch(e){setStatus('Profil okunamadı: '+e.message,'error')}}
async function saveProfile(){const s=getSession();if(!s?.user?.id)return;const uid=s.user.id;const body={user_id:uid,display_name:document.getElementById('displayName').value.trim()||null,seller_type:document.getElementById('sellerType').value,country_code:'TR',locale:'tr-TR',city:document.getElementById('city').value.trim()||null,district:document.getElementById('district').value.trim()||null,bio:document.getElementById('bio').value.trim()||null,avatar_url:document.getElementById('avatarUrl').value.trim()||null,is_public:true};const b=document.getElementById('saveBtn');b.disabled=true;b.textContent='Kaydediliyor…';try{const rows=await api('POST','marketplace_profiles',body,'return=representation,resolution=merge-duplicates');if(!Array.isArray(rows)||!rows.length)throw new Error('Profil kaydedilemedi.');updateAvatar(body.avatar_url,body.display_name);document.getElementById('saveMessage').innerHTML='<div class="success">✓ Profil kaydedildi/güncellendi. İlanına dönüp satıcı kartını kontrol edebilirsin.</div>'}catch(e){document.getElementById('saveMessage').innerHTML='<div class="error">'+esc(e.message)+'</div>'}finally{b.disabled=false;b.textContent='Profili kaydet'}}
load();
</script>
</body></html>
